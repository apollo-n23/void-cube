    function getAudioCtx() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) { /* silent fail on old browsers */ }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(freq, durationMs, type = 'sine', vol = 0.2, attackMs = 8, decayMs = 80) {
      const ctx = getAudioCtx();
      if (!ctx || muted) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = type;
      osc.frequency.value = freq;

      filter.type = 'lowpass';
      filter.frequency.value = Math.min(2800, freq * 3.5 + 400);

      const now = ctx.currentTime;
      const dur = durationMs / 1000;

      gain.gain.value = 0;
      gain.gain.linearRampToValueAtTime(vol * masterVol, now + (attackMs / 1000));
      gain.gain.linearRampToValueAtTime(0.0001, now + dur + 0.08);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + dur + 0.15);
    }

    function playNoise(durationMs, vol = 0.15, filterHz = 1200, type = 'lowpass') {
      const ctx = getAudioCtx();
      if (!ctx || muted) return;
      const bufferSize = Math.floor(ctx.sampleRate * (durationMs / 1000));
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = type;
      filter.frequency.value = filterHz;

      const now = ctx.currentTime;
      const dur = durationMs / 1000;
      gain.gain.value = vol * masterVol;
      gain.gain.linearRampToValueAtTime(0.0001, now + dur + 0.06);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + dur + 0.1);
    }

    function checkCollision(p, o) {
      const ox = o.wx;
      const oh = o.h;
      const triLeft = ox - 14;
      const triRight = ox + 14;
      const triTop = GROUND_Y - oh;

      const pLeft = p.wx;
      const pRight = p.wx + p.w;
      const pTop = p.y;
      const pBottom = p.y + p.h;

      // x overlap
      if (pRight < triLeft || pLeft > triRight) return false;

      // if cube bottom is low enough to hit the triangle body
      if (pBottom > triTop + 3) {
        // rough center check for the slope area
        const mid = (triLeft + triRight) / 2;
        const dx = Math.abs((pLeft + pRight) / 2 - mid);
        const allowedExtra = (oh / 2.4);
        if (dx < 11 + allowedExtra) return true;
      }
      return false;
    }

    // Ensures lava traps (waterGaps), triangle obstacles, lowWalls and trampolines
    // never spawn on top of (overlapping x-ranges) or directly beside each other.
    // Edge-to-edge min distance enforced (60px: player w~26 + margin).
    // Used before any obs or waterGap push (and for consistency in low/tramp).
    // Checks against ALL of the relevant existing arrays; bidirectional.
    function wouldBeTooCloseToHazards(newLeft, newRight, minSep) {
      // vs waterGaps (water gaps / acid vats)
      for (let g of waterGaps) {
        const gLeft = g.wx;
        const gRight = g.wx + g.width;
        const dist = Math.max(0, Math.max(newLeft - gRight, gLeft - newRight));
        if (dist < minSep) return true;
      }
      // vs obstacles (ground triangles) - use accurate collision width
      for (let o of obstacles) {
        const oLeft = o.wx - 14;
        const oRight = o.wx + 14;
        const dist = Math.max(0, Math.max(newLeft - oRight, oLeft - newRight));
        if (dist < minSep) return true;
      }
      // vs lowWalls (for consistency)
      for (let w of lowWalls) {
        const wLeft = w.wx;
        const wRight = w.wx + (w.width || 20);
        const dist = Math.max(0, Math.max(newLeft - wRight, wLeft - newRight));
        if (dist < minSep) return true;
      }
      // vs trampolines (prevent new hazards directly under/beside)
      for (let t of trampolines) {
        const tLeft = t.wx;
        const tRight = t.wx + (t.width || 40);
        const dist = Math.max(0, Math.max(newLeft - tRight, tLeft - newRight));
        if (dist < minSep) return true;
      }
      return false;
    }

    // Ground spikes (obstacles) must never sit on trampolines (x overlap + small visual pad).
    function spikeOverlapsAnyTrampoline(spikeWX, patrolAmp) {
      const amp = patrolAmp || 0;
      const pad = 10;
      const sLeft = spikeWX - 14 - amp - pad;
      const sRight = spikeWX + 14 + amp + pad;
      for (let t of trampolines) {
        const tLeft = t.wx;
        const tRight = t.wx + (t.width || 40);
        if (sRight > tLeft && sLeft < tRight) return true;
      }
      return false;
    }
    function trampolineOverlapsAnySpike(tWX, tW) {
      const pad = 10;
      const tLeft = tWX - pad;
      const tRight = tWX + tW + pad;
      for (let o of obstacles) {
        const amp = o.patrolAmp || 0;
        const oLeft = o.wx - 14 - amp;
        const oRight = o.wx + 14 + amp;
        if (tRight > oLeft && tLeft < oRight) return true;
      }
      return false;
    }

    function update() {
      if (gameState !== 'playing') return;

      frame++;

      // movement input with smoothing + slight auto-advance bias
      let ax = 0;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) ax -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) ax += 1;

      player.vx = player.vx * 0.78 + ax * 5.4 * 0.22;

      // gentle forward bias so the run keeps going
      if (ax >= 0) player.vx += 0.055;

      player.vx = Math.max(-3.2, Math.min(5.4, player.vx));
      player.wx += player.vx;

      // clamp left bound
      if (player.wx < 40) {
        player.wx = 40;
        player.vx = Math.max(0, player.vx);
      }

      // === LOW WALL / BARRIER COLLISION (blocks movement but does not kill - must jump over) ===
      for (let wall of lowWalls) {
        const wallLeft = wall.wx;
        const wallRight = wall.wx + wall.width;
        const wallTop = GROUND_Y - wall.height;

        if (player.wx + player.w > wallLeft && player.wx < wallRight) {
          if (player.y + player.h > wallTop) {
            // Player is too low - block horizontally
            if (player.vx > 0) {
              player.wx = wallLeft - player.w - 0.5;
            } else if (player.vx < 0) {
              player.wx = wallRight + 0.5;
            }
            player.vx = 0;
          }
        }
      }

      // Compute if currently over a water gap (for physics, landing, etc.)
      let overWaterGap = false;
      for (let gap of waterGaps) {
        if (player.wx + player.w > gap.wx && player.wx < gap.wx + gap.width) {
          overWaterGap = true;
          break;
        }
      }

      // Auto-dismiss first water gap tutorial once player has passed it
      if (firstWaterGap && !firstWaterTutorialShown) {
        if (player.wx > firstWaterGap.wx + firstWaterGap.width + 60) {
          firstWaterTutorialShown = true;
        }
      }

      // Reset drowning state if player is no longer over water
      if (!overWaterGap) {
        player.drowningStart = 0;
      }

      // === VERTICAL ENEMY COLLISION (deadly up/down aliens) ===
      for (let e of verticalEnemies) {
        const ex = e.wx;
        const ey = e.y;
        // Simple AABB for the creature body
        if (player.wx + player.w > ex - 14 && player.wx < ex + 14 &&
            player.y + player.h > ey - 18 && player.y < ey + 18) {
          gameState = 'over';
          playDeath('hazard');
          spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
          break;
        }
      }

      // Poison dart collision (deadly pink darts from clouds)
      for (let i = poisonDarts.length - 1; i >= 0; i--) {
        const dart = poisonDarts[i];
        if (player.wx + player.w > dart.wx - 3 && player.wx < dart.wx + 3 &&
            player.y + player.h > dart.y - 2 && player.y < dart.y + 8) {
          gameState = 'over';
          playDeath('projectile');
          spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
          poisonDarts.splice(i, 1);
          break;
        }
      }

      // Mr Octopoop update for bounce (happy idle) + approach detection (duplicated for start/end)
      if (mrOctopoopStart) {
        mrOctopoopStart.bouncePhase = frame * 0.15;
        const dx = Math.abs((player.wx + player.w * 0.5) - mrOctopoopStart.wx);
        const dy = Math.abs((player.y + player.h * 0.5) - (mrOctopoopStart.y - 17));
        if (dx < 80 && dy < 60) {
          mrOctopoopStart.approached = true;
        }
      }
      if (mrOctopoopEnd) {
        mrOctopoopEnd.bouncePhase = frame * 0.15;
        const dx = Math.abs((player.wx + player.w * 0.5) - mrOctopoopEnd.wx);
        const dy = Math.abs((player.y + player.h * 0.5) - (mrOctopoopEnd.y - 17));
        if (dx < 80 && dy < 60) {
          mrOctopoopEnd.approached = true;
        }
      }

      // === INVISIBLE BARRIER AT LEVEL END (prevents running past the ladder) ===
      if (levelExit) {
        const maxWX = levelExit.wx + 14;
        if (player.wx > maxWX) {
          player.wx = maxWX;
          player.vx = 0;
        }
      }

      // === VISIBLE LADDER CLIMB (executes only when triggered; ends level at portal) ===
      if (player.isClimbing && gameState === 'playing') {
        player.climbProgress = (player.climbProgress || 0) + 0.0198;
        if ((frame % 7) === 0) playLadderStep();
        const t = Math.min(1, player.climbProgress);

        if (levelExit) {
          if (player.climbStartY === undefined) player.climbStartY = player.y;
          if (player.climbTargetY === undefined) player.climbTargetY = levelExit.baseY - 305; // tall portal (60%+ of level height)

          player.y = player.climbStartY + (player.climbTargetY - player.climbStartY) * t;
          player.wx = levelExit.wx - 4; // stick to ladder center for nice visual climb
        }

        player.vx = 0;
        player.vy = 0;

        // Keep camera smoothly following the player as they climb
        const ctarget = player.wx - 275;
        scrollX += (ctarget - scrollX) * 0.085;

        if (t >= 1) {
          player.isClimbing = false;
          gameState = 'complete';
          playPortal();

          // Final portal touch burst (only ends when player reaches top)
          const ex = player.wx + 13;
          const ey = player.y + 8;
          for (let i = 0; i < 24; i++) {
            const ang = Math.random() * Math.PI * 2;
            const sp = 0.85 + Math.random() * 2.35;
            particles.push({
              x: ex,
              y: ey,
              vx: Math.cos(ang) * sp,
              vy: Math.sin(ang) * sp - 0.95,
              life: 30 + Math.random() * 24,
              c: '#66ddff',
              size: 2.1
            });
          }
        }
        return; // skip normal gameplay (spawns, collisions, etc.) during climb sequence
      }

      // vertical physics
      let gravity = 0.47;
      if (overWaterGap) {
        gravity = 0.22; // slightly slower fall through water gap than through sky
      }
      player.vy += gravity;
      player.y += player.vy;

      // === Robust landing resolution (fixes invisible platform floating bug) ===
      // Every frame we explicitly test "is the player currently standing on ground or any platform?"
      let landed = false;
      let targetY = player.y;

      let platDeltaX = 0;

      // Ground support - do not land if over water gap (must fall down the gap)
      if (!overWaterGap && player.y + player.h >= GROUND_Y - 0.5) {
        targetY = GROUND_Y - player.h;
        landed = true;
      }

      // Platform support - find the highest (lowest y) surface we are on top of
      for (let p of platforms) {
        const platSurface = p.y - player.h;
        const platLeft = p.wx;
        const platRight = p.wx + p.width;
        const pLeft = player.wx;
        const pRight = player.wx + player.w;

        // Proper x overlap + feet near or on the platform top
        if (pRight > platLeft && pLeft < platRight) {
          const feet = player.y + player.h;
          if (feet >= p.y - 2 && player.y <= p.y + 5) {
            if (platSurface < targetY) { // higher platform wins
              targetY = platSurface;
              landed = true;
              const amp = (p.swayAmp || 0);
              const phase = (p.swayPhase || 0);
              const omega = 0.021;
              const currSway = amp * Math.sin((frame * omega) + phase);
              const prevSway = amp * Math.sin(((frame - 1) * omega) + phase);
              platDeltaX = currSway - prevSway;
            }
          }
        }
      }

      if (landed) {
        player.y = targetY;
        player.vy = 0;
        player.wx += platDeltaX;
        if (Math.abs(platDeltaX) > 0.0001) {
          player.vx *= 0.8;
        }
      }

      // === OVAL TRAMPOLINE BOOST (gives super jump just before tall walls) ===
      for (let t of trampolines) {
        const tLeft = t.wx;
        const tRight = t.wx + t.width;
        const tTop = GROUND_Y - 6;

        if (player.wx + player.w > tLeft && player.wx < tRight) {
          const feet = player.y + player.h;
          // Only boost when landing on or crossing the trampoline from above
          if (feet >= tTop - 2 && player.vy >= 0) {
            player.vy = -19.5;   // Much stronger upward boost than normal jump
            landed = true;
            player.y = tTop - player.h - 1;
            playTrampoline();
            // Fun bounce particles
            for (let i = 0; i < 7; i++) {
              particles.push({
                x: player.wx + 8 + (Math.random() - 0.5) * 18,
                y: tTop,
                vx: (Math.random() - 0.5) * 2.8,
                vy: -1.8 - Math.random() * 1.4,
                life: 18 + Math.random() * 12,
                c: '#66ffdd',
                size: 2.2
              });
            }
          }
        }
      }

      // Land sound after full landing resolution (ground + platforms + trampoline)
      if (landed && wasAirborne) {
        playLand();
      }
      wasAirborne = !landed;

      // jump (only when on ground or a platform)
      if ((keys[' '] || keys['Spacebar']) && landed && player.vy >= -0.1) {
        player.vy = -11.8;
        jumpCount++;
        spawnDust(player.wx + 8, player.y + player.h + 1, 7, true);
        playJump();
        wasAirborne = true;
        keys[' '] = false; // one-shot
      }

      // Slow fall and eventual death when falling through water gaps (not solid)
      // Player must fall down the gap; falls slightly slower than sky
      if (overWaterGap && player.y + player.h > GROUND_Y - 2) {
        // already handled slower gravity in vertical physics
        player.vx *= 0.6;

        if (!player.drowningStart) {
          player.drowningStart = frame;
        }

        // Die only after falling down into the gap for a while (sinking)
        if (frame - player.drowningStart > 65) {
          gameState = 'over';
          playDeath('lava');
          spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
        }
      }

      // camera follow (smooth, with forward lead)
      const target = player.wx - 275;
      scrollX += (target - scrollX) * 0.085;

      // Spawn Mr Octopoop at the VERY START of level 1 (early, fixed position ahead of player, bob idle)
      if (!mrOctopoopStart && player.wx > 100) {
        mrOctopoopStart = {
          wx: 175,
          y: GROUND_Y - 50,
          bouncePhase: 0,
          approached: false
        };
      }

      // === SPAWN: triangular ground hazards (spaced out more for longer level) ===
      if (player.wx > lastSpawnWX - 280) {
        const gap = 285 + Math.random() * 195;
        const nextWX = lastSpawnWX + gap;
        const oh = 20 + Math.random() * 29;
        const triW = 28; // accurate to collision/draw (centered -14/+14)
        const triLeft = nextWX - triW / 2;
        const triRight = nextWX + triW / 2;
        // Strict pre-push check using unified helper: against ALL waterGaps, obstacles, lowWalls, trampolines.
        // Enforces edge-to-edge >=60px separation (player ~26 + margin). Prevents "on top" (significant x-overlap considering widths)
        // or "directly beside" (edge dist < minSep). Also covers same-type (tri vs tri) + bidirectional.
        // (Replaces prior weak +/-10 overlap; now robust + also vs other triangles/lowWalls for full consistency.)
        let safe = !wouldBeTooCloseToHazards(triLeft, triRight, 60) && !spikeOverlapsAnyTrampoline(nextWX, 0);
        if (safe) {
          obstacles.push({ wx: nextWX, h: oh });
          lastSpawnWX = nextWX;
        } else {
          // advance anyway to not get stuck
          lastSpawnWX = nextWX;
        }
      }

      // === SPAWN: floating platforms (optional safe landings) - much more frequent now ===
      if (player.wx > lastPlatWX - 260) {
        if (Math.random() < 0.78) {
          const platWX = lastPlatWX + 38 + Math.random() * 95;
          const platY = GROUND_Y - (58 + Math.random() * 105);
          // Varied lengths: mostly short/medium, occasional long ones
          let platW = 38 + Math.random() * 48;
          if (Math.random() < 0.22) platW = 95 + Math.random() * 85; // longer platforms sometimes

          // Prevent new platforms from spawning on top of or touching the ending ladder
          let canSpawn = true;
          if (levelExit) {
            const ladderCenter = levelExit.wx;
            const platCenter = platWX + platW / 2;
            if (Math.abs(platCenter - ladderCenter) < 100 && platY > GROUND_Y - 420) {
              canSpawn = false;
            }
          }

          // New rule: Trampolines must never have a platform directly above them
          if (canSpawn) {
            for (let t of trampolines) {
              const tCenter = t.wx + (t.width || 40) / 2;
              const pCenter = platWX + platW / 2;
              if (Math.abs(pCenter - tCenter) < 42) {
                canSpawn = false;
                break;
              }
            }
          }

          // Also avoid spawning platforms on water gaps
          if (canSpawn) {
            for (let g of waterGaps) {
              const pCenter = platWX + platW / 2;
              const gCenter = g.wx + g.width / 2;
              if (Math.abs(pCenter - gCenter) < (platW / 2 + g.width / 2 + 5)) {
                canSpawn = false;
                break;
              }
            }
          }

          if (canSpawn) {
            platforms.push({ wx: platWX, y: platY, width: platW, height: 8 });
          }
        }
        lastPlatWX = lastPlatWX + 145 + Math.random() * 70;
      }

      // === SPAWN: low walls / barriers (occasional - player must jump over) + trampolines ===
      if (player.wx > lastWallWX - 420) {
        if (Math.random() < 0.48) {
          const wallWX = lastWallWX + 55 + Math.random() * 95;
          const wallW = 16 + Math.random() * 8;
          // Ensure walls never spawn directly beside water gaps (min 1 player length = 26px gap)
          let wallCanSpawn = true;
          for (let g of waterGaps) {
            const wallLeft = wallWX;
            const wallRight = wallWX + wallW;
            const gapLeft = g.wx;
            const gapRight = g.wx + g.width;
            // distance between intervals
            const dist = Math.max(0, Math.max(wallLeft - gapRight, gapLeft - wallRight));
            if (dist < 26) {
              wallCanSpawn = false;
              break;
            }
          }
          if (wallCanSpawn) {
            // Walls are now 5x taller to be a real challenge
            const wallH = 85 + Math.random() * 60;
            lowWalls.push({ wx: wallWX, height: wallH, width: wallW });

            // Spawn oval trampoline just before the wall to give a big boost
            // Ensure trampolines never spawn on top of water gaps
            let trampCanSpawn = true;
            const tWX = wallWX - 72 - Math.random() * 18;
            const tW = 36 + Math.random() * 8;
            for (let g of waterGaps) {
              if (tWX + tW > g.wx && tWX < g.wx + g.width) {
                trampCanSpawn = false;
                break;
              }
            }
            if (trampCanSpawn && !trampolineOverlapsAnySpike(tWX, tW)) {
              trampolines.push({
                wx: tWX,
                width: tW
              });
            }
          }
        }
        // Always advance the spawn timer every time we enter the "consider spawning" block (original behavior)
        lastWallWX = lastWallWX + 320 + Math.random() * 140;
      }

      // === SPAWN: water gaps (Super Mario style - deadly if fallen into) ===
      if (!levelExit && player.wx > 600 && Math.random() < 0.012) {
        const gapW = 60 + Math.random() * 52.5; // ~25% larger, still jumpable
        const gapWX = player.wx + 320 + Math.random() * 180;

        const gapLeft = gapWX;
        const gapRight = gapWX + gapW;
        // Unified/strengthened pre-push separation (replaces scattered tooClose blocks): Use robust helper
        // for checks vs ALL existing waterGaps + obstacles + lowWalls + tramps at 60px min edge-to-edge.
        // This covers triangles vs lava/acid (both directions), same-type, on-top (overlap) or directly beside.
        // Then ADDITIONAL stricter gap-vs-gap at original 78px (to preserve exact difficulty curve / spacing).
        let tooClose = wouldBeTooCloseToHazards(gapLeft, gapRight, 60);
        if (!tooClose) {
          // Ensure minimum distance between gaps (edge to edge) is at least 3x player width = 78px (original behavior preserved exactly)
          for (let g of waterGaps) {
            const existingRight = g.wx + g.width;
            const newLeft = gapWX;
            const distBetween = newLeft - existingRight;
            if (distBetween < 78 && distBetween > - (gapW + 10)) { // allow some ordering
              tooClose = true;
              break;
            }
            // Check the other way too
            const distOther = g.wx - (gapWX + gapW);
            if (distOther < 78 && distOther > - (g.width + 10)) {
              tooClose = true;
              break;
            }
          }
        }

        // Ensure water gaps don't spawn under trampolines (nothing on top of trampolines)
        if (!tooClose) {
          for (let t of trampolines) {
            const tLeft = t.wx;
            const tRight = t.wx + (t.width || 40);
            const gapLeft = gapWX;
            const gapRight = gapWX + gapW;
            if (Math.max(gapLeft, tLeft) < Math.min(gapRight, tRight)) {
              tooClose = true;
              break;
            }
          }
        }

        // Ensure water gaps never spawn on triangles / obstacles (prevents triangles appearing on gaps)
        if (!tooClose) {
          for (let o of obstacles) {
            const oLeft = o.wx;
            const oRight = o.wx + 28;  // approx triangle base width
            const gapLeft = gapWX;
            const gapRight = gapWX + gapW;
            if (Math.max(gapLeft, oLeft) < Math.min(gapRight, oRight)) {
              tooClose = true;
              break;
            }
          }
        }

        if (!tooClose) {
          waterGaps.push({ wx: gapWX, width: gapW });

          // Record the very first water gap for tutorial
          if (!firstWaterGap) {
            firstWaterGap = { wx: gapWX, width: gapW };
          }

          // Spawn a light yellow poison cloud above it
          poisonClouds.push({
            wx: gapWX + gapW / 2,
            y: 55 + Math.random() * 35, // high in the green sky
            width: 38 + Math.random() * 12,
            lastDart: frame,
            gapWX: gapWX,
            gapWidth: gapW
          });
        }
      }

      // === SPAWN: purple alien trees in background (desert island) ===
      if (player.wx > 400 && Math.random() < 0.009) {
        const treeWX = player.wx + 350 + Math.random() * 300;
        alienTrees.push({
          wx: treeWX,
          y: GROUND_Y - 35 - Math.random() * 25,
          scale: 0.7 + Math.random() * 0.6,
          parallax: 0.07 + Math.random() * 0.03
        });
      }

      // === SPAWN: special chasing red monster (slightly increased frequency) ===
      if (frame - lastSpecialFrame > 1380 && Math.random() < 0.039) {
        const spawnWX = Math.max(player.wx + 360, scrollX + W + 40) + Math.random() * 160;
        // Ensure specials do not spawn on water gaps or on trampolines
        let safe = true;
        for (let g of waterGaps) {
          if (spawnWX + 30 > g.wx && spawnWX < g.wx + g.width) {
            safe = false;
            break;
          }
        }
        if (safe) {
          for (let t of trampolines) {
            if (spawnWX + 30 > t.wx && spawnWX < t.wx + (t.width || 40)) {
              safe = false;
              break;
            }
          }
        }
        if (safe) {
          specials.push({
            wx: spawnWX,
            y: GROUND_Y - 32,
            w: 30,
            h: 32,
            nextShot: frame + 70 + Math.random() * 70   // first shot after a short delay
          });
          lastSpecialFrame = frame;
        }
      }

      // === SPAWN: vertical moving aliens (less frequent, up/down patrollers with long tails) ===
      if (!levelExit && frame - (window.lastVertEnemySpawn || 0) > 2100 && Math.random() < 0.028) {
        const vwx = player.wx + 420 + Math.random() * 160;
        const baseY = GROUND_Y - 55;
        // Ensure vertical enemies do not spawn on water gaps or on trampolines
        let safe = true;
        for (let g of waterGaps) {
          if (vwx + 14 > g.wx && vwx - 14 < g.wx + g.width) {
            safe = false;
            break;
          }
        }
        if (safe) {
          for (let t of trampolines) {
            if (vwx + 14 > t.wx && vwx - 14 < t.wx + (t.width || 40)) {
              safe = false;
              break;
            }
          }
        }
        if (safe) {
          verticalEnemies.push({
            wx: vwx,
            y: baseY,
            baseY: baseY,
            amplitude: 38 + Math.random() * 18,
            speed: 0.045 + Math.random() * 0.025,
            phase: Math.random() * Math.PI * 2
          });
        }
        window.lastVertEnemySpawn = frame;
      }

      // move specials toward player with lag (slow, jumpable)
      // They change direction instead of walking over water gaps
      for (let s of specials) {
        const desired = player.wx - 6;
        const diff = desired - s.wx;
        if (Math.abs(diff) > 0.8) {
          let move = Math.sign(diff) * 1.28;
          let tentative = s.wx + move;
          let onGap = false;
          for (let g of waterGaps) {
            if (tentative + s.w > g.wx && tentative < g.wx + g.width) {
              onGap = true;
              break;
            }
          }
          if (onGap) {
            // merely change direction
            s.wx -= move * 2;
          } else {
            s.wx = tentative;
          }
        }
        // keep them from going below ground visually
        if (s.y < GROUND_Y - s.h) s.y = GROUND_Y - s.h;
      }

      // === MONSTER GUNFIRE: aimed shots at randomised slow intervals ===
      // Monsters now fire directly toward the player's position at the moment of shooting (non-homing after fired)
      for (let s of specials) {
        if (typeof s.nextShot !== 'number') s.nextShot = frame + 60;

        if (frame >= s.nextShot) {
          const onScreen = (s.wx - scrollX > -60 && s.wx - scrollX < W + 60);
          if (onScreen) {
            // Aim directly at player center at time of firing
            const targetX = player.wx + player.w * 0.5;
            const targetY = player.y + player.h * 0.5;

            const dx = targetX - (s.wx + 8);
            const dy = targetY - (s.y + 13);
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;

            const speed = 2.35 + Math.random() * 0.55; // fairly slow projectiles

            projectiles.push({
              wx: s.wx + 8,
              y: s.y + 13,
              vx: (dx / dist) * speed,
              vy: (dy / dist) * speed,
              life: 105 + Math.random() * 18
            });
            playLaser();
          }
          // Randomised fairly slow interval between shots (roughly 1.6s – 3.2s)
          s.nextShot = frame + 95 + Math.random() * 95;
        }
      }

      // Ambient glowing neon blue smoke / vapor (atmospheric)
      if (frame % 26 === 0 && Math.random() < 0.75) {
        const smokeBaseX = scrollX + 140 + Math.random() * (W * 0.75);
        const smokeY = GROUND_Y - 25 - Math.random() * 155;
        spawnNeonSmoke(smokeBaseX, smokeY, 1 + Math.random() * 2.2);
      }

      // prune old objects
      obstacles = obstacles.filter(o => o.wx > scrollX - 90);
      platforms = platforms.filter(p => p.wx > scrollX - 130);
      specials = specials.filter(s => s.wx > scrollX - 140);
      lowWalls = lowWalls.filter(w => w.wx > scrollX - 110);
      trampolines = trampolines.filter(t => t.wx > scrollX - 140);
      endFireballs = endFireballs.filter(f => f.wx > scrollX - 80);
      neonOrbs = neonOrbs.filter(o => o.wx > scrollX - 90);
      waterGaps = waterGaps.filter(g => g.wx > scrollX - 150);
      alienTrees = alienTrees.filter(t => t.wx > scrollX - 200);
      verticalEnemies = verticalEnemies.filter(e => e.wx > scrollX - 120);
      poisonClouds = poisonClouds.filter(c => c.wx > scrollX - 100);
      poisonDarts = poisonDarts.filter(d => d.y < GROUND_Y + 50); // they fall down, prune when past ground

      // Move boss fireballs (they have slight gravity feel)
      for (let i = endFireballs.length - 1; i >= 0; i--) {
        const fb = endFireballs[i];
        fb.wx += fb.vx;
        fb.y += fb.vy;
        fb.vy += 0.035;   // gentle arc downward
        if (fb.y > GROUND_Y - 10) endFireballs.splice(i, 1);
      }

      // Move vertical enemies (up and down in place)
      for (let e of verticalEnemies) {
        e.y = e.baseY + Math.sin(frame * e.speed + e.phase) * e.amplitude;
      }

      // Poison cloud rain logic - pink darts fall slowly into water gaps every ~5 seconds
      const rainInterval = 300; // ~5 seconds at 60fps
      for (let cloud of poisonClouds) {
        if (frame - cloud.lastDart > rainInterval) {
          poisonDarts.push({
            wx: cloud.wx + (Math.random() - 0.5) * (cloud.width * 0.6),
            y: cloud.y + 8,
            vy: 1.8 + Math.random() * 0.6 // slow fall
          });
          cloud.lastDart = frame;
        }
      }

      // Move poison darts
      for (let i = poisonDarts.length - 1; i >= 0; i--) {
        const dart = poisonDarts[i];
        dart.y += dart.vy;
        if (dart.y > GROUND_Y + 10) {
          poisonDarts.splice(i, 1);
        }
      }

      // Move and collect neon orbs
      for (let i = neonOrbs.length - 1; i >= 0; i--) {
        const orb = neonOrbs[i];
        orb.wx += orb.vx;
        // Gentle floating motion
        orb.y += Math.sin(frame * 0.045 + orb.phase) * 0.35;

        // Collection
        const dx = Math.abs(player.wx + 13 - orb.wx);
        const dy = Math.abs(player.y + 13 - orb.y);
        if (dx < 22 && dy < 22) {
          const value = orb.value || 1;
          neonScore += value;
          playCollect(value === 5);

          // Collect particles - different color for green orbs
          const particleColor = (value === 5) ? '#33ff88' : '#3355aa';
          if (value === 5 && secondGreenTutorialActive) {
            secondGreenTutorialActive = false;
          }
          for (let k = 0; k < (value === 5 ? 12 : 8); k++) {
            particles.push({
              x: orb.wx,
              y: orb.y,
              vx: (Math.random() - 0.5) * 2.4,
              vy: (Math.random() - 0.5) * 2.2 - 0.6,
              life: 20 + Math.random() * 12,
              c: particleColor,
              size: 1.8
            });
          }
          neonOrbs.splice(i, 1);
          continue;
        }

        // Prune far behind
        if (orb.wx < scrollX - 60) {
          neonOrbs.splice(i, 1);
        }
      }

      // Move & recycle flying background rocketships (space traffic)
      for (let ship of flyingShips) {
        ship.wx += ship.vx;
        // Recycle far off left → bring new one from far right
        if (ship.wx < scrollX - 420) {
          ship.wx = scrollX + W + 180 + Math.random() * 620;
          ship.y = 42 + Math.random() * 172;
          ship.vx = -0.55 - Math.random() * 0.95;
          ship.scale = 0.55 + Math.random() * 0.9;
        }
      }

      // Move projectiles (slow enemy fire)
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        pr.wx += pr.vx;
        pr.y += pr.vy;
        pr.life--;
        if (pr.life <= 0) projectiles.splice(i, 1);
      }

      // particles (with special slow drift for neon smoke)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.c === '#66ddff') {
          // Neon blue atmospheric smoke rises slower and fades gently
          p.vy += 0.012;
          p.vx *= 0.995;
        } else {
          p.vy += 0.22;
          p.vx *= 0.985;
        }
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // collisions with triangles
      for (let o of obstacles) {
        if (checkCollision(player, o)) {
          const now = frame;
          if (now < player.invulnUntil) {
            // Fully protected during 5-second post-shield grace period
          } else if (player.hasShield) {
            // Shield absorbs exactly one hit, then pops and grants 5 seconds invulnerability
            player.hasShield = false;
            playShieldPop();
            player.invulnUntil = now + 300; // 5 seconds at ~60fps
            // Shield pop effect (neon blue)
            for (let k = 0; k < 22; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1.8 + Math.random() * 3.2;
              particles.push({
                x: player.wx + 13, y: player.y + 13,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.7,
                life: 28 + Math.random() * 18, c: '#66ddff', size: 2.0
              });
            }
          } else {
            gameState = 'over';
            playDeath('hazard');
            spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
            // small floor hit dust
            spawnDust(player.wx + player.w / 2, GROUND_Y, 5, false);
            if (baseScore + score > best) {
              best = baseScore + score;
              saveBest();
            }
            break;
          }
        }
      }

      // collisions with special red monsters (AABB + height check)
      for (let s of specials) {
        const sLeft = s.wx + 2;
        const sRight = s.wx + s.w - 2;
        const sTop = s.y;
        const pLeft = player.wx;
        const pRight = player.wx + player.w;
        const pBottom = player.y + player.h;
        if (pRight > sLeft && pLeft < sRight) {
          if (pBottom > sTop + 7) {
            const now = frame;
            if (now < player.invulnUntil) {
              // Fully protected during 5-second post-shield grace period
            } else if (player.hasShield) {
              player.hasShield = false;
              playShieldPop();
              player.invulnUntil = now + 300; // 5 seconds invulnerability after shield pops
              for (let k = 0; k < 22; k++) {
                const ang = Math.random() * Math.PI * 2;
                const sp = 1.8 + Math.random() * 3.2;
                particles.push({
                  x: player.wx + 13, y: player.y + 13,
                  vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.7,
                  life: 28 + Math.random() * 18, c: '#66ddff', size: 2.0
                });
              }
            } else {
              gameState = 'over';
              playDeath('hazard');
              spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
              spawnDust(player.wx + player.w / 2, GROUND_Y, 4, false);
              if (score > best) {
                best = score;
                saveBest();
              }
              break;
            }
          }
        }
      }

      // collisions with monster projectiles (slow energy bolts)
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        const prLeft = pr.wx;
        const prRight = pr.wx + 6;
        const prTop = pr.y - 1;
        const prBottom = pr.y + 4;

        const pLeft = player.wx;
        const pRight = player.wx + player.w;
        const pTop = player.y;
        const pBottom = player.y + player.h;

        if (pRight > prLeft && pLeft < prRight && pBottom > prTop && pTop < prBottom) {
          const now = frame;
          if (now < player.invulnUntil) {
            // Fully protected during 5-second post-shield grace period
            projectiles.splice(i, 1);
          } else if (player.hasShield) {
            player.hasShield = false;
            playShieldPop();
            player.invulnUntil = now + 300; // 5 seconds invulnerability after shield pops
            for (let k = 0; k < 22; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1.8 + Math.random() * 3.2;
              particles.push({
                x: player.wx + 13, y: player.y + 13,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.7,
                life: 28 + Math.random() * 18, c: '#66ddff', size: 2.0
              });
            }
            projectiles.splice(i, 1);
          } else {
            gameState = 'over';
            playDeath('projectile');
            spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
            // Remove the projectile that hit
            projectiles.splice(i, 1);
            if (baseScore + score > best) {
              best = baseScore + score;
              saveBest();
            }
            break;
          }
        }
      }

      // Collisions with boss fireballs (must avoid while climbing the ladder to escape)
      for (let i = endFireballs.length - 1; i >= 0; i--) {
        const fb = endFireballs[i];
        const fbLeft = fb.wx;
        const fbRight = fb.wx + 9;
        const fbTop = fb.y - 2;
        const fbBottom = fb.y + 6;

        const pLeft = player.wx;
        const pRight = player.wx + player.w;
        const pTop = player.y;
        const pBottom = player.y + player.h;

        if (pRight > fbLeft && pLeft < fbRight && pBottom > fbTop && pTop < fbBottom) {
          const now = frame;
          if (now < player.invulnUntil) {
            // Fully protected during 5-second post-shield grace period
            endFireballs.splice(i, 1);
          } else if (player.hasShield) {
            player.hasShield = false;
            playShieldPop();
            player.invulnUntil = now + 300; // 5 seconds invulnerability after shield pops
            for (let k = 0; k < 22; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1.8 + Math.random() * 3.2;
              particles.push({
                x: player.wx + 13, y: player.y + 13,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.7,
                life: 28 + Math.random() * 18, c: '#66ddff', size: 2.0
              });
            }
            endFireballs.splice(i, 1);
          } else {
            gameState = 'over';
            playDeath('projectile');
            spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
            endFireballs.splice(i, 1);
            if (baseScore + score > best) {
              best = baseScore + score;
              saveBest();
            }
            break;
          }
        }
      }

      // distance score
      const dist = Math.floor((player.wx - 80) / 5.8);
      if (dist > score) score = dist;

      // Collect halfway power-up (energy shield)
      if (powerUp) {
        const dx = Math.abs(player.wx + 13 - powerUp.wx);
        const dy = Math.abs(player.y + 13 - powerUp.y);
        if (dx < 26 && dy < 26) {
          player.hasShield = true;
          playPowerup('shield');
          player.invulnUntil = 0; // Fresh shield replaces any grace period

          // Nice cyan pickup burst
          for (let i = 0; i < 14; i++) {
            const ang = Math.random() * Math.PI * 2;
            const sp = 1.1 + Math.random() * 1.9;
            particles.push({
              x: powerUp.wx,
              y: powerUp.y,
              vx: Math.cos(ang) * sp,
              vy: Math.sin(ang) * sp - 0.7,
              life: 26 + Math.random() * 18,
              c: '#66ddff',
              size: 1.9
            });
          }
          powerUp = null;
        }
      }

      // === BOSS FIREBALLS (large polygonal monster beyond the invisible barrier spits these)
      // Speed reduced 15%, boss is positioned further back
      if (levelExit && gameState === 'playing') {
        const bossWX = levelExit.wx + 225;
        // Fairly slow fireballs that are dangerous while the player is climbing the ladder
        if (frame % 74 === 0 && Math.random() < 0.78) {
          endFireballs.push({
            wx: bossWX + 8,
            y: GROUND_Y - 88 + Math.random() * 22,
            vx: -3.02 - Math.random() * 0.55,   // 15% slower
            vy: 0.55 + Math.random() * 0.85
          });
        }
      }

      // === NEON ORBS (floating collectibles - dark blue neon) ===
      if (gameState === 'playing' && frame - lastOrbSpawn > 195) {
        if (Math.random() < 0.58) {
          const orbWX = player.wx + 280 + Math.random() * 220;
          const orbY = GROUND_Y - 65 - Math.random() * 195; // floating in air
          // Guard: prevent orbs spawning directly touching/overlapping end ladder (plus levelExit cleanup)
          if (!levelExit || Math.abs(orbWX - levelExit.wx) > 100) {
            neonOrbs.push({
              wx: orbWX,
              y: orbY,
              vx: -0.45 - Math.random() * 0.35,
              phase: Math.random() * Math.PI * 2,
              value: 1
            });
          }
        }
        lastOrbSpawn = frame;
      }

      // === GREEN NEON ORBS (faster, higher value collectibles - worth 5 Neon) ===
      // Spawn less frequently than blue orbs
      if (gameState === 'playing' && frame - lastGreenOrbSpawn > 280) {
        if (Math.random() < 0.45) {
          const orbWX = player.wx + 260 + Math.random() * 240;
          const orbY = GROUND_Y - 55 - Math.random() * 210;
          neonOrbs.push({
            wx: orbWX,
            y: orbY,
            vx: -1.15 - Math.random() * 0.55,   // noticeably faster
            phase: Math.random() * Math.PI * 2,
            value: 5
          });

          greenOrbCount++;
          if (greenOrbCount === 2 && !secondGreenTutorialActive) {
            secondGreenTutorialActive = true;
          }
        }
        lastGreenOrbSpawn = frame;
      }

      // === LEVEL EXIT: ladder + portal (~20% longer than L1; threshold 5106, same as L2) ===
      if (!levelExit && player.wx > 5106) {
        levelExit = {
          wx: player.wx + 110 + Math.random() * 70,
          baseY: GROUND_Y
        };

        // Ensure no floating platforms or ANY other objects are touching or overlapping the ending ladder (prevent spawns touching ladder)
        const ladderCenter = levelExit.wx;
        const safeMargin = 100; // generous padding so nothing visually or physically overlaps the ladder or top platform; covers triangles/obstacles, enemies/specials/verticals/pteros, waterGaps, neonOrbs, powerUps, lowWalls, trampolines, poison*, bg elems, flyingShips, alienTrees
        platforms = platforms.filter(p => {
          const platCenter = p.wx + p.width / 2;
          const xDist = Math.abs(platCenter - ladderCenter);
          // Remove any platform that is horizontally close AND vertically in the ladder's tall range
          if (xDist < safeMargin && p.y > GROUND_Y - 420) {
            return false;
          }
          return true;
        });
        // Extended filters for all other spawn types to prevent any overlap with ladder (use x dist + y tall check for high objects; ground objs by x only)
        obstacles = obstacles.filter(o => Math.abs(o.wx - ladderCenter) >= safeMargin);
        specials = specials.filter(s => Math.abs(s.wx - ladderCenter) >= safeMargin || (s.y && s.y <= GROUND_Y - 420));
        waterGaps = waterGaps.filter(g => Math.abs(g.wx - ladderCenter) >= safeMargin);
        verticalEnemies = verticalEnemies.filter(e => !(Math.abs(e.wx - ladderCenter) < safeMargin && e.y > GROUND_Y - 420));
        neonOrbs = neonOrbs.filter(o => !(Math.abs(o.wx - ladderCenter) < safeMargin && o.y > GROUND_Y - 420));
        lowWalls = lowWalls.filter(w => Math.abs(w.wx - ladderCenter) >= safeMargin);
        trampolines = trampolines.filter(t => Math.abs(t.wx - ladderCenter) >= safeMargin);
        poisonClouds = poisonClouds.filter(c => !(Math.abs(c.wx - ladderCenter) < safeMargin && c.y > GROUND_Y - 420));
        poisonDarts = poisonDarts.filter(d => !(Math.abs(d.wx - ladderCenter) < safeMargin && d.y > GROUND_Y - 420));
        if (powerUp && Math.abs(powerUp.wx - ladderCenter) < safeMargin && powerUp.y > GROUND_Y - 420) {
          powerUp = null;
        }

        // Invisible barrier + large polygonal boss beyond it
        // (boss will be drawn and will start spitting fireballs)
      }

      // Spawn Mr Octopoop at the END of level 1, just after the ladder (positioned visible before/around ladder on approach)
      if (levelExit && !mrOctopoopEnd) {
        mrOctopoopEnd = {
          wx: levelExit.wx - 82,
          y: GROUND_Y - 50,
          bouncePhase: 0,
          approached: false
        };
      }

      // Climb the exit ladder with UP key (starts visible climb - level ends only at portal)
      if (levelExit && gameState === 'playing' && !player.isClimbing) {
        const ex = levelExit.wx;
        const distX = Math.abs(player.wx + player.w * 0.5 - ex);
        const nearBase = distX < 32 && (player.y + player.h) >= GROUND_Y - 18;

        if (nearBase && (keys['ArrowUp'] || keys['w'] || keys['W'])) {
          // Begin visible climb animation
          player.isClimbing = true;
          player.climbProgress = 0;
          player.climbStartY = player.y;
          playLadderGrab();
          player.climbTargetY = levelExit.baseY - 305; // tall portal (60%+ of level height)
          keys['ArrowUp'] = false;
          keys['w'] = false;
          keys['W'] = false;
        }
      }

      // Shield power-up: 3 evenly spaced spawns across the (longer) level
      const endDist = 5106;
      const shieldTargets = [endDist * 0.22, endDist * 0.48, endDist * 0.74];
      if (shieldSpawnIndex < shieldTargets.length && !powerUp && !player.hasShield && player.wx > shieldTargets[shieldSpawnIndex]) {
        // Random height, never higher than 50% level height (y never too close to top)
        const minY = GROUND_Y - 260;
        const maxY = GROUND_Y - 80;
        powerUp = {
          wx: player.wx + 155 + Math.random() * 70,
          y: minY + Math.random() * (maxY - minY)
        };
        shieldSpawnIndex++;
      }
    }

    function draw() {
      // Deep green desert sky
      ctx.fillStyle = '#0d2218';
      ctx.fillRect(0, 0, W, H);
      if (window.NeonDashSprites) NeonDashSprites.drawSky(ctx, W, H, GROUND_Y, scrollX, frame);

      // Occasional lightning flashes (silver and gold) in the green sky
      const lightningPhase = frame % 240;
      if (lightningPhase < 6 && Math.random() < 0.65) {
        ctx.strokeStyle = (Math.random() < 0.5) ? 'rgba(220, 230, 255, 0.6)' : 'rgba(255, 220, 140, 0.55)';
        ctx.lineWidth = 1.5 + Math.random();
        ctx.beginPath();
        let lx = 100 + Math.random() * (W - 200);
        let ly = 20;
        ctx.moveTo(lx, ly);
        for (let i = 0; i < 5; i++) {
          lx += (Math.random() - 0.5) * 80;
          ly += 40 + Math.random() * 30;
          ctx.lineTo(lx, ly);
        }
        ctx.stroke();
      }

      // Light yellow poison clouds above water gaps (with slow rain)
      for (let cloud of poisonClouds) {
        const csx = cloud.wx - scrollX * 0.04; // very slow parallax, high in sky
        if (csx < -50 || csx > W + 50) continue;

        const cy = cloud.y;

        // Light yellow cloud body
        ctx.fillStyle = 'rgba(255, 235, 150, 0.65)';
        ctx.beginPath();
        ctx.ellipse(csx, cy, cloud.width / 2, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Fluffier top
        ctx.fillStyle = 'rgba(255, 245, 180, 0.5)';
        ctx.beginPath();
        ctx.ellipse(csx - 4, cy - 3, cloud.width / 2.2, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // faint stars (very subtle as requested)
      ctx.fillStyle = '#fff';
      for (let s of stars) {
        const sx = s.x - scrollX * 0.11;
        if (sx < -4 || sx > W + 4) continue;
        ctx.globalAlpha = s.a;
        ctx.fillRect(sx, s.y, s.s, s.s);
        if (s.s > 1.3) {
          // tiny twinkle
          ctx.globalAlpha = s.a * 0.35;
          ctx.fillRect(sx - 1, s.y, 1, s.s);
        }
      }
      ctx.globalAlpha = 1;

      // === DISTANT BACKGROUND SCENERY (rocket pads, labs, planets) ===
      // Drawn with strong parallax so they feel very far away in the void
      for (let b of backgroundElements) {
        const sx = b.wx - scrollX * b.parallax;
        if (sx < -120 || sx > W + 140) continue;

        const alpha = b.type === 'planet' ? 0.09 : 0.13;
        ctx.globalAlpha = alpha;

        if (b.type === 'rocket') {
          // Distant rocket launch complex
          const s = b.scale;
          const baseY = b.y;
          // Launch pad
          ctx.fillStyle = '#1a2f44';
          ctx.fillRect(sx, baseY, 38 * s, 5 * s);
          // Tower
          ctx.fillRect(sx + 14 * s, baseY - 52 * s, 6 * s, 52 * s);
          // Top structure
          ctx.fillRect(sx + 10 * s, baseY - 58 * s, 14 * s, 7 * s);
          // Very faint vertical "light" lines
          ctx.fillStyle = 'rgba(120,160,210,0.35)';
          ctx.fillRect(sx + 16 * s, baseY - 48 * s, 1.5 * s, 44 * s);
        } else if (b.type === 'lab') {
          // Distant research lab / dome facility
          const s = b.scale;
          const baseY = b.y;
          ctx.fillStyle = '#162a3f';
          // Main building
          ctx.fillRect(sx, baseY, 52 * s, 11 * s);
          // Low annex
          ctx.fillRect(sx + 38 * s, baseY + 2 * s, 19 * s, 9 * s);
          // Dome / observatory
          ctx.beginPath();
          ctx.arc(sx + 26 * s, baseY - 1, 13 * s, Math.PI, 0, false);
          ctx.fill();
          // Tiny glowing windows (very dim)
          ctx.fillStyle = 'rgba(90,170,220,0.28)';
          ctx.fillRect(sx + 8 * s, baseY + 3 * s, 3 * s, 2 * s);
          ctx.fillRect(sx + 19 * s, baseY + 3.5 * s, 2.5 * s, 2 * s);
          ctx.fillRect(sx + 46 * s, baseY + 5 * s, 2 * s, 1.5 * s);
        } else if (b.type === 'planet') {
          // Distant planet or gas giant
          const s = b.scale;
          const py = b.y;
          const rad = 17 * s;

          if (b.hue === 'blue') {
            ctx.fillStyle = 'rgba(70,115,175,0.22)';
          } else if (b.hue === 'orange') {
            ctx.fillStyle = 'rgba(155,105,55,0.20)';
          } else {
            ctx.fillStyle = 'rgba(105,70,155,0.22)';
          }
          ctx.beginPath();
          ctx.arc(sx, py, rad, 0, Math.PI * 2);
          ctx.fill();

          // Subtle rim light / atmosphere
          ctx.strokeStyle = 'rgba(200,220,255,0.12)';
          ctx.lineWidth = 1.5 * s;
          ctx.beginPath();
          ctx.arc(sx - 3 * s, py - 2 * s, rad * 0.92, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;

      // === FLYING ROCKETSHIPS (background space traffic) ===
      ctx.globalAlpha = 0.18;
      for (let ship of flyingShips) {
        const sx = ship.wx - scrollX * ship.parallax;
        if (sx < -90 || sx > W + 110) continue;

        const s = ship.scale;
        const sy = ship.y;

        // Fuselage
        ctx.fillStyle = '#223a55';
        ctx.fillRect(sx, sy, 42 * s, 5.5 * s);

        // Nose cone
        ctx.fillStyle = '#2f4a66';
        ctx.beginPath();
        ctx.moveTo(sx + 42 * s, sy + 2.5 * s);
        ctx.lineTo(sx + 52 * s, sy + 2.7 * s);
        ctx.lineTo(sx + 42 * s, sy + 5.2 * s);
        ctx.closePath();
        ctx.fill();

        // Engine glow (neon)
        ctx.fillStyle = '#55bbff';
        ctx.fillRect(sx - 3 * s, sy + 1.2 * s, 5 * s, 3 * s);

        // Tiny cabin windows
        ctx.fillStyle = 'rgba(140,200,255,0.45)';
        ctx.fillRect(sx + 12 * s, sy + 1.3 * s, 2.5 * s, 1.4 * s);
        ctx.fillRect(sx + 20 * s, sy + 1.3 * s, 2.5 * s, 1.4 * s);

        // Very faint engine trail
        ctx.fillStyle = 'rgba(100,180,255,0.12)';
        ctx.fillRect(sx - 14 * s, sy + 1.8 * s, 11 * s, 1.8 * s);
      }
      ctx.globalAlpha = 1;

      // === FLOATING "NEON DASH" NEON SIGN AT START ===
      if (player.wx < 680 && gameState === 'playing') {
        const signX = 260 - scrollX * 0.08;
        const signY = 92;
        const signW = 280;
        const signH = 118;
        if (!(window.NeonDashSprites && NeonDashSprites.drawWorldSign(ctx, signX - signW / 2, signY - 44, signW, signH))) {
          ctx.fillStyle = '#2a0a3a';
          ctx.fillRect(signX - 92, signY - 18, 185, 36);
        }
        ctx.fillStyle = '#e8fbff';
        ctx.font = '700 22px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillText('NEON DASH', signX, signY + 2);
        ctx.strokeStyle = '#66e8ff';
        ctx.lineWidth = 1.1;
        ctx.strokeText('NEON DASH', signX, signY + 2);
      }

      // === DESERT ISLAND FLOOR (yellow and dusty grey glowing) ===
      const floorTop = GROUND_Y - 2;

      // warm sandy outer glow
      ctx.save();
      ctx.shadowColor = '#d4b070';
      ctx.shadowBlur = 32;
      ctx.fillStyle = 'rgba(180, 140, 70, 0.18)';
      ctx.fillRect(0, floorTop - 9, W, 48);

      ctx.shadowBlur = 16;
      ctx.fillStyle = 'rgba(210, 175, 95, 0.22)';
      ctx.fillRect(0, floorTop - 2, W, 20);
      ctx.restore();

      // base dusty yellow-grey floor
      ctx.fillStyle = '#c5b38a';
      ctx.fillRect(0, floorTop, W, H - floorTop);
      if (window.NeonDashSprites) NeonDashSprites.drawGround(ctx, W, GROUND_Y, H, scrollX);

      // top edge highlight (warm glow)
      ctx.fillStyle = '#e8d8a8';
      ctx.fillRect(0, floorTop, W, 2.5);

      // inner dusty seam
      ctx.fillStyle = '#a89870';
      ctx.fillRect(0, floorTop + 1, W, 1);

      // moving dusty floor markers for sense of speed (parallax)
      ctx.fillStyle = 'rgba(120, 100, 60, 0.28)';
      const mOffset = (scrollX * 1.35) % 68;
      for (let i = -1; i < 17; i++) {
        const mx = i * 68 - mOffset + 18;
        ctx.fillRect(mx, floorTop + 7, 15, 2);
      }
      // secondary slower markers
      ctx.fillStyle = 'rgba(140, 115, 70, 0.16)';
      const mOffset2 = (scrollX * 0.6) % 110;
      for (let i = -1; i < 11; i++) {
        const mx = i * 110 - mOffset2 + 40;
        ctx.fillRect(mx, floorTop + 14, 28, 1.5);
      }

      // === LOW WALLS / BARRIERS (must jump over - solid but non-lethal) ===
      for (let wall of lowWalls) {
        const sx = wall.wx - scrollX;
        if (sx < -30 || sx > W + 30) continue;

        const wh = wall.height;
        const ww = wall.width;

        // Base stone-like block (dark void blue)
        ctx.fillStyle = '#0f243a';
        ctx.fillRect(sx, GROUND_Y - wh, ww, wh);

        // Top edge (slightly lighter, looks like a lip)
        ctx.fillStyle = '#1a3a55';
        ctx.fillRect(sx, GROUND_Y - wh, ww, 4);

        // Subtle top highlight line
        ctx.fillStyle = '#2a5a7a';
        ctx.fillRect(sx, GROUND_Y - wh, ww, 1.5);

        // Small vertical "support" lines for texture
        ctx.fillStyle = 'rgba(40, 80, 110, 0.5)';
        ctx.fillRect(sx + 3, GROUND_Y - wh + 3, 1.5, wh - 5);
        ctx.fillRect(sx + ww - 5, GROUND_Y - wh + 3, 1.5, wh - 5);
      }

      // === WATER GAPS (deadly if fallen into - desert island style) ===
      for (let gap of waterGaps) {
        const sx = gap.wx - scrollX;
        const gw = gap.width;
        if (sx + gw < -20 || sx > W + 20) continue;

        if (window.NeonDashSprites && NeonDashSprites.drawFluid(ctx, sx, floorTop, gw, H - floorTop + 10, frame)) {
          continue;
        }
        // Lighter, more solid blue water that fully replaces the yellow land
        ctx.fillStyle = 'rgba(115, 175, 225, 0.92)';
        ctx.fillRect(sx, floorTop, gw, H - floorTop + 10);

        // Water surface base (clean edge)
        ctx.fillStyle = 'rgba(135, 195, 240, 0.85)';
        ctx.fillRect(sx, floorTop, gw, 5);

        // Subtle right-to-left moving wave animation on surface
        const waveSpeed = 0.8; // slow right-to-left (negative direction)
        const wavePhase = (frame * waveSpeed * 0.03) % (Math.PI * 2);
        ctx.strokeStyle = 'rgba(200, 230, 255, 0.65)';
        ctx.lineWidth = 1.2;

        for (let w = 0; w < 4; w++) {
          const wy = floorTop + 1 + w * 1.2;
          ctx.beginPath();
          for (let x = 0; x <= gw; x += 6) {
            const wave = Math.sin((x * 0.08) + wavePhase + w) * 1.8;
            const px = sx + x;
            const py = wy + wave;
            if (x === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }

        // Very subtle deeper water tint at bottom
        ctx.fillStyle = 'rgba(90, 150, 200, 0.15)';
        ctx.fillRect(sx + 2, floorTop + 12, gw - 4, 18);
      }

      // Pink poison darts falling from clouds
      ctx.fillStyle = '#ff99cc';
      for (let dart of poisonDarts) {
        const dsx = dart.wx - scrollX;
        const dsy = dart.y;
        if (dsx < -10 || dsx > W + 10) continue;
        if (window.NeonDashSprites && NeonDashSprites.drawShot(ctx, 'slime', dsx, dsy + 3, frame, 14, 18, 0, 2)) continue;

        // Small pink dart / drop
        ctx.fillRect(dsx - 1.5, dsy, 3, 6);

        // Tiny highlight
        ctx.fillStyle = '#ffccdd';
        ctx.fillRect(dsx - 0.5, dsy + 1, 1, 2);
        ctx.fillStyle = '#ff99cc';
      }

      // === PURPLE ALIEN TREES (background desert island foliage) ===
      for (let tree of alienTrees) {
        const sx = tree.wx - scrollX * tree.parallax;
        if (sx < -60 || sx > W + 60) continue;

        const s = tree.scale;
        const ty = tree.y;

        // Trunk
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(sx, ty, 5 * s, 38 * s);

        // Purple alien fronds / canopy
        ctx.fillStyle = '#662266';
        ctx.beginPath();
        ctx.moveTo(sx - 18 * s, ty + 5);
        ctx.lineTo(sx + 2.5 * s, ty - 32 * s);
        ctx.lineTo(sx + 23 * s, ty + 5);
        ctx.fill();

        ctx.fillStyle = '#883388';
        ctx.beginPath();
        ctx.moveTo(sx - 12 * s, ty + 2);
        ctx.lineTo(sx + 2.5 * s, ty - 22 * s);
        ctx.lineTo(sx + 17 * s, ty + 2);
        ctx.fill();
      }

      // === VERTICAL PATROLLING ALIENS (long tail, up/down movement) ===
      for (let e of verticalEnemies) {
        const sx = e.wx - scrollX;
        const sy = e.y;
        if (sx < -40 || sx > W + 40) continue;

        // Body (purple alien)
        ctx.fillStyle = '#5a2a7a';
        ctx.beginPath();
        ctx.ellipse(sx, sy, 13, 11, 0, 0, Math.PI * 2);
        ctx.fill();

        // Head
        ctx.fillStyle = '#7a3a9a';
        ctx.beginPath();
        ctx.arc(sx + 5, sy - 6, 7, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#ffdd66';
        ctx.fillRect(sx + 7, sy - 8, 2, 2);
        ctx.fillRect(sx + 11, sy - 7, 2, 2);

        // Long tail (waving)
        ctx.strokeStyle = '#4a1a5a';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(sx - 8, sy + 4);
        const tailWave = Math.sin(frame * 0.09 + e.phase) * 6;
        ctx.quadraticCurveTo(sx - 22, sy + 12 + tailWave * 0.5, sx - 32, sy + 18 + tailWave);
        ctx.stroke();

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#6a3a7a';
        ctx.beginPath();
        ctx.moveTo(sx - 8, sy + 4);
        ctx.quadraticCurveTo(sx - 20, sy + 10 + tailWave * 0.3, sx - 30, sy + 16 + tailWave * 0.8);
        ctx.stroke();
      }

      // === OVAL TRAMPOLINES (neon bounce pads before tall walls) ===
      for (let t of trampolines) {
        const sx = t.wx - scrollX;
        if (sx < -50 || sx > W + 50) continue;

        const tw = t.width;
        const ty = GROUND_Y - 3;

        // Soft neon glow under the trampoline
        ctx.fillStyle = 'rgba(80, 255, 200, 0.18)';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty + 4, tw / 2 + 8, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Main oval trampoline surface (bright cyan/mint)
        ctx.fillStyle = '#33ffcc';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty, tw / 2, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Inner highlight
        ctx.fillStyle = '#aaffee';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2 - 2, ty - 1, tw / 2 - 4, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Subtle edge ring
        ctx.strokeStyle = '#119977';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty, tw / 2, 5, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // === FLOATING PLATFORMS (glowing blue sci-fi pads) ===
      for (let p of platforms) {
        const sx = p.wx - scrollX;
        if (sx < -90 || sx > W + 90) continue;
        const py = p.y;

        // soft shadow
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fillRect(sx + 4, py + p.height + 3, p.width - 6, 5);

        if (window.NeonDashSprites && NeonDashSprites.drawPlatform(ctx, sx, py, p.width, p.height)) {
          continue;
        }

        // main platform body
        ctx.fillStyle = '#0e2744';
        ctx.fillRect(sx, py, p.width, p.height);

        // bright cyan top edge (glow)
        ctx.fillStyle = '#4fa8d8';
        ctx.fillRect(sx, py, p.width, 2);

        // inner highlight
        ctx.fillStyle = '#6bc4f0';
        ctx.fillRect(sx + 3, py + 2, p.width - 6, 1);

        // underside detail
        ctx.fillStyle = '#1e3a58';
        ctx.fillRect(sx + 2, py + p.height - 3, p.width - 4, 2);

        // corner marker lights
        ctx.fillStyle = '#88ddff';
        ctx.fillRect(sx + 5, py + 2.5, 2, 1);
        ctx.fillRect(sx + p.width - 8, py + 2.5, 2, 1);
      }

      // draw obstacles (triangles)
      for (let o of obstacles) {
        const sx = o.wx - scrollX;
        if (sx < -30 || sx > W + 30) continue;

        const th = o.h;
        const tw = 27;

        // shadow under triangle
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.moveTo(sx - tw/2 - 1, GROUND_Y + 3);
        ctx.lineTo(sx + tw/2 + 1, GROUND_Y + 3);
        ctx.lineTo(sx, GROUND_Y - th * 0.35);
        ctx.closePath();
        ctx.fill();

        if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'hazard', sx - tw / 2, GROUND_Y - th, tw, th))) {
          // main triangle (hazard)
          ctx.fillStyle = '#e8553a';
          ctx.beginPath();
          ctx.moveTo(sx, GROUND_Y - th);
          ctx.lineTo(sx - tw / 2, GROUND_Y + 0.5);
          ctx.lineTo(sx + tw / 2, GROUND_Y + 0.5);
          ctx.closePath();
          ctx.fill();

          // bright top edge
          ctx.strokeStyle = '#ffaa77';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(sx, GROUND_Y - th);
          ctx.lineTo(sx - tw / 2 + 2, GROUND_Y - 0.5);
          ctx.stroke();

          // small danger accent
          ctx.fillStyle = '#ffdd99';
          ctx.fillRect(sx - 1.5, GROUND_Y - th + 5, 3, 1.5);
        }
      }

      // === SPECIAL RED MONSTERS (slow chasers) ===
      for (let s of specials) {
        const sx = s.wx - scrollX;
        const sy = s.y;
        if (sx < -60 || sx > W + 60) continue;

        // soft shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(sx + 4, GROUND_Y - 1, s.w - 5, 4);

        if (window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'enemy', sx, sy, s.w, s.h)) {
          continue;
        }

        // body (deep red)
        ctx.fillStyle = '#c83322';
        ctx.fillRect(sx + 3, sy + 5, s.w - 5, s.h - 7);

        // head / carapace
        ctx.fillStyle = '#a62618';
        ctx.fillRect(sx + 5, sy + 1, s.w - 9, 8);

        // small back spikes/horns
        ctx.fillStyle = '#7a1a12';
        ctx.fillRect(sx + 6, sy, 4, 5);
        ctx.fillRect(sx + s.w - 11, sy + 2, 5, 4);

        // evil glowing eyes
        ctx.fillStyle = '#ffdd55';
        ctx.fillRect(sx + 8, sy + 9, 3, 3);
        ctx.fillRect(sx + s.w - 12, sy + 9, 3, 3);
        // pupils
        ctx.fillStyle = '#220000';
        ctx.fillRect(sx + 9, sy + 10, 1, 1);
        ctx.fillRect(sx + s.w - 11, sy + 10, 1, 1);

        // darker lower body + tiny legs
        ctx.fillStyle = '#7a1a12';
        ctx.fillRect(sx + 4, sy + s.h - 6, s.w - 7, 5);
        ctx.fillStyle = '#aa2a1f';
        ctx.fillRect(sx + 6, sy + s.h - 2, 4, 2);
        ctx.fillRect(sx + s.w - 11, sy + s.h - 2, 4, 2);

        // thin outline
        ctx.strokeStyle = '#551100';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx + 2.5, sy + 1.5, s.w - 5, s.h - 3);
      }

      // === MONSTER PROJECTILES (slow glowing enemy fire) ===
      for (let pr of projectiles) {
        const sx = pr.wx - scrollX;
        const sy = pr.y;
        if (sx < -20 || sx > W + 20) continue;
        if (window.NeonDashSprites && NeonDashSprites.drawShot(ctx, 'bolt', sx + 3, sy, frame, 34, 16, pr.vx, pr.vy)) continue;

        // Main bolt (glowing red-orange energy)
        ctx.fillStyle = '#ff6644';
        ctx.fillRect(sx, sy - 1, 7, 3);

        // Bright core
        ctx.fillStyle = '#ffaa66';
        ctx.fillRect(sx + 1, sy, 4, 1);

        // Soft outer glow
        ctx.fillStyle = 'rgba(255,120,60,0.35)';
        ctx.fillRect(sx - 2, sy - 2.5, 11, 6);
      }

      // === MR OCTOPOOP NPCs (pink octagon with blue eyes; duplicated logic from L4 friendlyNPC for start/end dialogues; on-screen + approached guards)
      // Start NPC (very beginning of level 1)
      if (mrOctopoopStart) {
        const bob = Math.sin(mrOctopoopStart.bouncePhase || 0) * 5;
        const npcX = mrOctopoopStart.wx - scrollX;
        const npcBaseY = mrOctopoopStart.y;
        const drawY = npcBaseY - bob;
        const size = 44;
        const r = size / 2;
        const isOnScreen = npcX >= -50 && npcX <= W + 50;
        if (isOnScreen) {
          if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'npc', npcX - r, drawY - r, size, size))) {
            // Pink octagon
            ctx.fillStyle = '#ff88dd';
            ctx.strokeStyle = '#cc5599';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
              const ang = (i * Math.PI * 2 / 8) - Math.PI / 8;
              const x = npcX + Math.cos(ang) * r;
              const y = drawY + Math.sin(ang) * r;
              if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // Blue eyes
            ctx.fillStyle = '#4488ff';
            ctx.beginPath();
            ctx.arc(npcX - 5, drawY - 3, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(npcX + 5, drawY - 3, 3.5, 0, Math.PI * 2);
            ctx.fill();
          }
          // Speech bubble if approached (exact text)
          // Disappears when NPC off screen (npcX check)
          if (mrOctopoopStart.approached && npcX > -50 && npcX < W + 50) {
            const boxW = 210;
            const boxH = 38;
            const boxX = Math.max(20, Math.min(W - boxW - 20, npcX - boxW / 2));
            const boxY = Math.max(12, drawY - 55);
            if (!(window.NeonDashSprites && NeonDashSprites.drawSpeechBubble(ctx, boxX, boxY, boxW, boxH, npcX, drawY - 2, ['Hi! I\'m Mr Octopoop!', 'Welcome to Neon Dash.']))) {
              ctx.fillStyle = 'rgba(52, 8, 38, 0.94)';
              ctx.fillRect(boxX, boxY, boxW, boxH);
              ctx.strokeStyle = '#ff79d0';
              ctx.strokeRect(boxX, boxY, boxW, boxH);
              ctx.fillStyle = '#ffe6f5';
              ctx.font = '11px Segoe UI, Arial';
              ctx.textAlign = 'center';
              ctx.fillText('Hi! I\'m Mr Octopoop!', boxX + boxW / 2, boxY + 14);
              ctx.fillText('Welcome to Neon Dash.', boxX + boxW / 2, boxY + 28);
            }
          }
        }
      }
      // End NPC (just after ladder)
      if (mrOctopoopEnd) {
        const bob = Math.sin(mrOctopoopEnd.bouncePhase || 0) * 5;
        const npcX = mrOctopoopEnd.wx - scrollX;
        const npcBaseY = mrOctopoopEnd.y;
        const drawY = npcBaseY - bob;
        const size = 44;
        const r = size / 2;
        const isOnScreen = npcX >= -50 && npcX <= W + 50;
        if (isOnScreen) {
          if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'npc', npcX - r, drawY - r, size, size))) {
            // Pink octagon
            ctx.fillStyle = '#ff88dd';
            ctx.strokeStyle = '#cc5599';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
              const ang = (i * Math.PI * 2 / 8) - Math.PI / 8;
              const x = npcX + Math.cos(ang) * r;
              const y = drawY + Math.sin(ang) * r;
              if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // Blue eyes
            ctx.fillStyle = '#4488ff';
            ctx.beginPath();
            ctx.arc(npcX - 5, drawY - 3, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(npcX + 5, drawY - 3, 3.5, 0, Math.PI * 2);
            ctx.fill();
          }
          // Speech bubble if approached (exact text)
          // Disappears when NPC off screen (npcX check)
          if (mrOctopoopEnd.approached && npcX > -50 && npcX < W + 50) {
            const boxW = 240;
            const boxH = 42;
            const boxX = Math.max(20, Math.min(W - boxW - 20, npcX - boxW / 2));
            const boxY = Math.max(12, drawY - 58);
            if (!(window.NeonDashSprites && NeonDashSprites.drawSpeechBubble(ctx, boxX, boxY, boxW, boxH, npcX, drawY - 2, ['Well done! Good luck savung the cubes!', 'Press Up to climb the ladder to the portal!']))) {
              ctx.fillStyle = 'rgba(52, 8, 38, 0.94)';
              ctx.fillRect(boxX, boxY, boxW, boxH);
              ctx.strokeStyle = '#ff79d0';
              ctx.strokeRect(boxX, boxY, boxW, boxH);
              ctx.fillStyle = '#ffe6f5';
              ctx.font = '11px Segoe UI, Arial';
              ctx.textAlign = 'center';
              ctx.fillText('Well done! Good luck savung the cubes!', boxX + boxW / 2, boxY + 14);
              ctx.fillText('Press Up to climb the ladder to the portal!', boxX + boxW / 2, boxY + 30);
            }
          }
        }
      }

      // === LEVEL EXIT LADDER + PORTAL (appears after ~1000 distance) ===
      if (levelExit) {
        const lx = levelExit.wx - scrollX;
        const baseY = levelExit.baseY;

        // Tall ladder structure (at least 60% of level height when end spawns)
        ctx.strokeStyle = '#334c66';
        ctx.lineWidth = 3;
        // Left rail
        ctx.beginPath();
        ctx.moveTo(lx - 9, baseY);
        ctx.lineTo(lx - 9, baseY - 320);
        ctx.stroke();
        // Right rail
        ctx.beginPath();
        ctx.moveTo(lx + 9, baseY);
        ctx.lineTo(lx + 9, baseY - 320);
        ctx.stroke();

        // Rungs (more rungs for taller ladder)
        ctx.strokeStyle = '#2a4157';
        ctx.lineWidth = 2;
        for (let r = 0; r < 19; r++) {
          const ry = baseY - 12 - r * 16;
          ctx.beginPath();
          ctx.moveTo(lx - 8, ry);
          ctx.lineTo(lx + 8, ry);
          ctx.stroke();
        }

        // Top platform / arch (higher)
        ctx.fillStyle = '#1f3347';
        ctx.fillRect(lx - 16, baseY - 323, 32, 7);

        // Glowing cyan portal / rift at the top - now BADASS enhanced: larger concentric swirling glowing segments, lightning bolts (harmless, frame-timed). Adapted for level2 simpler style (no templates).
        const portalY = baseY - 305;
        if (!(window.NeonDashSprites && NeonDashSprites.drawPortal(ctx, lx, portalY, frame))) {
        const px = lx;
        const py = portalY;
        const baseRx = 50;
        const baseRy = 72;
        const pulse = Math.sin(frame * 0.27) * 2 + 3;
        // Outer pulsing fill glow (larger)
        ctx.save();
        ctx.shadowColor = '#66ddff';
        ctx.shadowBlur = 28;
        ctx.fillStyle = '#4fb8ff';
        ctx.beginPath();
        ctx.ellipse(px, py, baseRx + pulse, baseRy + pulse * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // Inner core rift (brighter, larger)
        ctx.fillStyle = '#aaddff';
        ctx.beginPath();
        ctx.ellipse(px, py - 1, baseRx * 0.55, baseRy * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#eeffff';
        ctx.beginPath();
        ctx.ellipse(px, py - 2, baseRx * 0.28, baseRy * 0.38, 0, 0, Math.PI * 2);
        ctx.fill();
        // Concentric swirling glowing segments (5 layers, different speeds/dirs, dashed for rift effect)
        for (let i = 0; i < 5; i++) {
          const rot = (frame * (0.013 + i * 0.0075) * ((i % 2) ? 1 : -1)) % (Math.PI * 2);
          const rx = baseRx + i * 3.5 + Math.sin(frame * 0.11 + i) * 1.2;
          const ry = baseRy + i * 2.8 + Math.cos(frame * 0.09 + i) * 0.9;
          const alpha = 0.28 + 0.12 * (1 - i / 5) + Math.sin(frame * 0.2 + i) * 0.08;
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(rot);
          ctx.strokeStyle = 'rgba(120, 200, 255, ' + alpha + ')';
          ctx.lineWidth = 1.8 + (4 - i) * 0.4;
          ctx.beginPath();
          ctx.ellipse(0, i * 1.2, rx, ry, 0, 0, Math.PI * 2);
          ctx.stroke();
          // Animated dashed swirl segments on odd layers
          if (i % 2 === 1) {
            ctx.setLineDash([3, 5]);
            ctx.lineDashOffset = -frame * (1.2 + i * 0.6) * ((i % 4 < 2) ? 1 : -1);
            ctx.strokeStyle = 'rgba(180, 230, 255, ' + (alpha * 0.7) + ')';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.ellipse(0, i * 1.2, rx * 0.98, ry * 0.98, 0, 0, Math.PI * 1.1);
            ctx.stroke();
            ctx.setLineDash([]);
          }
          ctx.restore();
        }
        // Subtle rim
        ctx.strokeStyle = '#88eeff';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.ellipse(px, py, baseRx + 1, baseRy + 1, 0, 0, Math.PI * 2);
        ctx.stroke();
        // Harmless lightning bolts (occasional, jagged, 3-pass glow; timed ~every 47 frames, duration ~8; biased upward/outward)
        const boltCycle = 47;
        const boltDur = 8;
        const phase = frame % boltCycle;
        if (phase < boltDur) {
          const numBolts = 1 + ((frame / 23) | 0) % 3;
          for (let b = 0; b < numBolts; b++) {
            const spread = (b - (numBolts - 1) / 2) * 0.55;
            const ang = -1.65 + spread;
            const tPhase = frame * 0.9 + b * 2.3;
            ctx.strokeStyle = 'rgba(180, 230, 255, 0.45)';
            ctx.lineWidth = 3.8;
            ctx.beginPath();
            let cx = px + Math.cos(ang) * 8;
            let cy = py - 4;
            ctx.moveTo(cx, cy);
            for (let k = 1; k <= 5; k++) {
              const j = Math.sin(tPhase + k * 1.7) * (7 + b);
              const len = 42 + k * 2;
              cx += Math.cos(ang) * len + j * Math.cos(ang + 1.57) * 0.6;
              cy += Math.sin(ang) * len + j * Math.sin(ang + 1.57) * 0.6;
              ctx.lineTo(cx, cy);
            }
            ctx.stroke();
            ctx.strokeStyle = '#aaddff';
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.strokeStyle = '#eeffff';
            ctx.lineWidth = 0.9;
            ctx.stroke();
          }
        }
        }
      }

      // === LARGE POLYGONAL BOSS MONSTER (beyond the invisible barrier - stomps & spits fireballs) ===
      if (levelExit) {
        // Boss spawns further away and slowly retreats as player approaches the ladder
        const baseBossOffset = 225;
        const progressToEnd = Math.min(1, Math.max(0, (player.wx - (levelExit.wx - 280)) / 420));
        const retreat = progressToEnd * 95;   // moves further away as player nears exit
        const bossWX = levelExit.wx + baseBossOffset + retreat;
        const bx = bossWX - scrollX;
        const by = GROUND_Y - 18;   // base on ground

        const stomp = Math.sin(frame * 0.065) * 5;     // stomping legs
        const stomp2 = Math.sin(frame * 0.065 + 1.8) * 4.5;

        ctx.save();

        // Body (large irregular polygonal mass)
        ctx.fillStyle = '#2a0f0f';
        ctx.beginPath();
        ctx.moveTo(bx - 8, by - 72);
        ctx.lineTo(bx + 52, by - 68);
        ctx.lineTo(bx + 58, by - 38);
        ctx.lineTo(bx + 48, by - 12);
        ctx.lineTo(bx - 14, by - 18);
        ctx.lineTo(bx - 22, by - 48);
        ctx.closePath();
        ctx.fill();

        // Darker lower body mass
        ctx.fillStyle = '#1a0808';
        ctx.beginPath();
        ctx.moveTo(bx - 14, by - 18);
        ctx.lineTo(bx + 48, by - 12);
        ctx.lineTo(bx + 42, by + 2);
        ctx.lineTo(bx - 18, by - 2);
        ctx.closePath();
        ctx.fill();

        // Spiky back ridge (polygonal)
        ctx.fillStyle = '#3a1515';
        ctx.beginPath();
        ctx.moveTo(bx + 2, by - 72);
        ctx.lineTo(bx + 18, by - 92);
        ctx.lineTo(bx + 32, by - 70);
        ctx.lineTo(bx + 44, by - 88);
        ctx.lineTo(bx + 52, by - 68);
        ctx.closePath();
        ctx.fill();

        // Head / upper mass
        ctx.fillStyle = '#3f1a1a';
        ctx.beginPath();
        ctx.moveTo(bx - 4, by - 68);
        ctx.lineTo(bx + 38, by - 64);
        ctx.lineTo(bx + 34, by - 42);
        ctx.lineTo(bx - 8, by - 46);
        ctx.closePath();
        ctx.fill();

        // Glowing red eye / vent
        ctx.fillStyle = '#ff5533';
        ctx.beginPath();
        ctx.arc(bx + 18, by - 56, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffaa44';
        ctx.beginPath();
        ctx.arc(bx + 19, by - 56, 2.2, 0, Math.PI * 2);
        ctx.fill();

        // Left leg (stomping)
        ctx.fillStyle = '#220a0a';
        ctx.fillRect(bx + 4, by - 18 + stomp, 11, 20 - stomp * 0.6);
        // Right leg (stomping opposite phase)
        ctx.fillRect(bx + 26, by - 18 + stomp2, 11, 20 - stomp2 * 0.6);

        // Foot details
        ctx.fillStyle = '#150505';
        ctx.fillRect(bx + 2, by - 2 + stomp * 0.4, 15, 5);
        ctx.fillRect(bx + 24, by - 2 + stomp2 * 0.4, 15, 5);

        // Arm / claw (polygonal)
