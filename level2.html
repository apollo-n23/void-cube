        ctx.fillStyle = '#2f1212';
        ctx.beginPath();
        ctx.moveTo(bx + 48, by - 38);
        ctx.lineTo(bx + 68, by - 52);
        ctx.lineTo(bx + 72, by - 44);
        ctx.lineTo(bx + 52, by - 32);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        // === ALIEN TREES surrounding the boss (background at level end) ===
        const treeBaseY = GROUND_Y - 5;
        // Left trees
        for (let i = -1; i <= 1; i++) {
          const tx = bx - 95 + i * 38;
          // Trunk
          ctx.fillStyle = '#0a2a22';
          ctx.fillRect(tx, treeBaseY - 48, 6, 50);
          // Alien glowing fronds / spikes (triangular)
          ctx.fillStyle = '#114433';
          ctx.beginPath();
          ctx.moveTo(tx - 14, treeBaseY - 48);
          ctx.lineTo(tx + 3, treeBaseY - 78);
          ctx.lineTo(tx + 20, treeBaseY - 48);
          ctx.fill();
          ctx.fillStyle = '#226655';
          ctx.beginPath();
          ctx.moveTo(tx - 10, treeBaseY - 42);
          ctx.lineTo(tx + 3, treeBaseY - 62);
          ctx.lineTo(tx + 16, treeBaseY - 42);
          ctx.fill();
        }
        // Right trees
        for (let i = -1; i <= 1; i++) {
          const tx = bx + 95 + i * 38;
          ctx.fillStyle = '#0a2a22';
          ctx.fillRect(tx, treeBaseY - 48, 6, 50);
          ctx.fillStyle = '#114433';
          ctx.beginPath();
          ctx.moveTo(tx - 14, treeBaseY - 48);
          ctx.lineTo(tx + 3, treeBaseY - 78);
          ctx.lineTo(tx + 20, treeBaseY - 48);
          ctx.fill();
          ctx.fillStyle = '#226655';
          ctx.beginPath();
          ctx.moveTo(tx - 10, treeBaseY - 42);
          ctx.lineTo(tx + 3, treeBaseY - 62);
          ctx.lineTo(tx + 16, treeBaseY - 42);
          ctx.fill();
        }

        // === RINGED PLANET in the sky directly over the boss ===
        const planetX = bx + 25;
        const planetY = 78;
        const pRadius = 28;

        // Planet body (dark purple-blue)
        ctx.fillStyle = '#2a1a4a';
        ctx.beginPath();
        ctx.arc(planetX, planetY, pRadius, 0, Math.PI * 2);
        ctx.fill();

        // Subtle surface detail
        ctx.fillStyle = '#3a2a5a';
        ctx.beginPath();
        ctx.arc(planetX - 6, planetY + 4, 11, 0, Math.PI * 2);
        ctx.fill();

        // Glowing rings (ellipse)
        ctx.strokeStyle = 'rgba(180, 140, 255, 0.65)';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.ellipse(planetX, planetY + 3, pRadius * 1.75, 7, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Inner ring highlight
        ctx.strokeStyle = 'rgba(220, 190, 255, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(planetX, planetY + 3, pRadius * 1.75, 7, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Very faint outer ring
        ctx.strokeStyle = 'rgba(140, 100, 200, 0.3)';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.ellipse(planetX, planetY + 4, pRadius * 2.1, 9, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // === BOSS FIREBALLS (dangerous while climbing the ladder) ===
      for (let fb of endFireballs) {
        const sx = fb.wx - scrollX;
        const sy = fb.y;
        if (sx < -20 || sx > W + 40) continue;
        if (window.NeonDashSprites && NeonDashSprites.drawShot(ctx, 'fire', sx + 4, sy + 2, frame, 26, 26, fb.vx, fb.vy)) continue;

        // Outer flame glow
        ctx.fillStyle = 'rgba(255, 100, 30, 0.35)';
        ctx.beginPath();
        ctx.arc(sx + 4, sy + 1.5, 8, 0, Math.PI * 2);
        ctx.fill();

        // Core fireball
        ctx.fillStyle = '#ff6622';
        ctx.beginPath();
        ctx.arc(sx + 4, sy + 2, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // Hot inner
        ctx.fillStyle = '#ffdd66';
        ctx.beginPath();
        ctx.arc(sx + 5, sy + 1, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // === NEON ORBS (dark blue + green glowing collectibles) ===
      for (let orb of neonOrbs) {
        const sx = orb.wx - scrollX;
        const sy = orb.y;
        if (sx < -25 || sx > W + 25) continue;

        const isGreen = (orb.value === 5);
        const pulse = Math.sin(frame * 0.12 + orb.phase) * (isGreen ? 1.5 : 1.2);
        const orbR = isGreen ? 12 : 11;
        if (window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, isGreen ? 'orbGreen' : 'orb', sx + 3 - orbR, sy - orbR, orbR * 2, orbR * 2)) { continue; }

        if (isGreen) {
          // Green glowing orb (faster, worth 5)
          ctx.fillStyle = 'rgba(60, 220, 120, 0.35)';
          ctx.beginPath();
          ctx.arc(sx + 3, sy, 10 + pulse * 0.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#33dd88';
          ctx.beginPath();
          ctx.arc(sx + 3, sy, 6, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#aaffcc';
          ctx.beginPath();
          ctx.arc(sx + 1.5, sy - 1.5, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Standard dark blue orb (worth 1)
          ctx.fillStyle = 'rgba(40, 70, 160, 0.32)';
          ctx.beginPath();
          ctx.arc(sx + 3, sy, 9 + pulse * 0.4, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#2244aa';
          ctx.beginPath();
          ctx.arc(sx + 3, sy, 5.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#5588ff';
          ctx.beginPath();
          ctx.arc(sx + 1.5, sy - 1.5, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // === SHIELD POWERUP (diamond core + glowing bubble shield) ===
      if (powerUp) {
        const pux = powerUp.wx - scrollX;
        const puy = powerUp.y;
        if (window.NeonDashSprites && NeonDashSprites.drawPickup(ctx, pux, puy, 38, frame)) {
        } else {
        const pulse = Math.sin(frame * 0.18) * 2.2;

        ctx.save();

        // Soft cyan bubble shield around diamond (reads as "shield" at game scale)
        const bubbleR = 14 + pulse * 0.35;
        ctx.shadowColor = '#44ccff';
        ctx.shadowBlur = 12 + pulse * 0.8;
        const bubbleGrad = ctx.createRadialGradient(pux - 2, puy - 3, 1, pux, puy, bubbleR);
        bubbleGrad.addColorStop(0, 'rgba(120, 230, 255, 0.28)');
        bubbleGrad.addColorStop(0.55, 'rgba(60, 180, 255, 0.12)');
        bubbleGrad.addColorStop(1, 'rgba(40, 150, 255, 0.03)');
        ctx.fillStyle = bubbleGrad;
        ctx.beginPath();
        ctx.arc(pux, puy, bubbleR, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(130, 230, 255, 0.8)';
        ctx.lineWidth = 1.7;
        ctx.beginPath();
        ctx.arc(pux, puy, bubbleR, 0, Math.PI * 2);
        ctx.stroke();
        // Glass highlight arc
        ctx.strokeStyle = 'rgba(210, 250, 255, 0.55)';
        ctx.lineWidth = 1.15;
        ctx.shadowBlur = 3;
        ctx.beginPath();
        ctx.arc(pux - 1.5, puy - 2, bubbleR * 0.7, -Math.PI * 0.9, -Math.PI * 0.2);
        ctx.stroke();

        // Diamond core (glowing orange shield emblem)
        ctx.shadowColor = '#ffaa44';
        ctx.shadowBlur = 14 + pulse * 0.7;
        const s = 9 + pulse * 0.25;

        ctx.fillStyle = '#ff8833';
        ctx.beginPath();
        ctx.moveTo(pux, puy - s * 1.1);           // top center
        ctx.lineTo(pux + s * 0.85, puy - s * 0.35);
        ctx.lineTo(pux + s * 0.75, puy + s * 0.65);
        ctx.lineTo(pux, puy + s * 1.15);          // bottom point
        ctx.lineTo(pux - s * 0.75, puy + s * 0.65);
        ctx.lineTo(pux - s * 0.85, puy - s * 0.35);
        ctx.closePath();
        ctx.fill();

        // Brighter edge highlight
        ctx.strokeStyle = '#ffcc88';
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // Inner detail (small cross / emblem)
        ctx.fillStyle = '#ffddaa';
        ctx.fillRect(pux - 1.5, puy - 4, 3, 1.2);
        ctx.fillRect(pux - 1, puy - 6, 2, 5);

        ctx.restore();
        }
      }

      // draw player cube
      const px = player.wx - scrollX;
      const py = player.y;

      // soft drop shadow
      ctx.fillStyle = 'rgba(0, 20, 40, 0.45)';
      ctx.fillRect(px + 5, GROUND_Y - 1, player.w - 3, 5);

      if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'player', px, py, player.w, player.h))) {
        // main cube body (bright cyan)
        ctx.fillStyle = '#5fd0ff';
        ctx.fillRect(px, py, player.w, player.h);

        // top face highlight (cube shading)
        ctx.fillStyle = '#a8e8ff';
        ctx.fillRect(px + 2, py + 2, player.w - 4, 5);

        // left face highlight
        ctx.fillRect(px + 2, py + 2, 4, player.h - 4);

        // bottom-right bevel (shadow)
        ctx.fillStyle = '#1a8fb8';
        ctx.fillRect(px + player.w - 5, py + 5, 3, player.h - 6);
        ctx.fillRect(px + 5, py + player.h - 5, player.w - 8, 3);

        // crisp outline
        ctx.strokeStyle = '#0c3a4f';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(px + 0.75, py + 0.75, player.w - 1.5, player.h - 1.5);

        // small "light" dot on cube
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(px + 6, py + 5, 2, 2);
      }

      // === VISIBLE ENERGY SHIELD (mario-style power-up - absorbs 1 hit, then grants 5s invulnerability) ===
      if (player.hasShield) {
        const cx = px + player.w / 2;
        const cy = py + player.h / 2 + 1;
        if (!(window.NeonDashSprites && NeonDashSprites.drawShield(ctx, cx, cy, player.w, player.h, frame))) {
          const pulse = Math.sin(frame * 0.21) * 1.8;
          ctx.save();
          ctx.strokeStyle = '#66ddff';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.ellipse(cx, cy, player.w / 2 + 10 + pulse * 0.4, player.h / 2 + 13 + pulse * 0.5, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      // Subtle invulnerability afterglow (5 seconds after shield pops - no bubble, just faint protection indicator)
      if (!player.hasShield && frame < player.invulnUntil) {
        const cx = px + player.w / 2;
        const cy = py + player.h / 2 + 1;
        const remaining = (player.invulnUntil - frame) / 300;
        const pulse = Math.sin(frame * 0.18) * (1.5 + remaining * 2);

        ctx.save();
        ctx.strokeStyle = 'rgba(140, 200, 255, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 3;
        ctx.beginPath();
        ctx.ellipse(cx, cy, player.w / 2 + 6 + pulse, player.h / 2 + 8 + pulse, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // particles
      for (let p of particles) {
        const baseAlpha = (p.c === '#66ddff') ? 0.22 : 0.15;
        const alpha = Math.max(baseAlpha, p.life / (p.c === '#66ddff' ? 85 : 42));
        ctx.fillStyle = p.c || '#88ccdd';
        ctx.globalAlpha = alpha;

        const psize = p.size || 1.8;
        ctx.fillRect(p.x - scrollX, p.y, psize, psize);
      }
      ctx.globalAlpha = 1;

      // === UI OVERLAYS ===
      if (gameState === 'playing') {
        // First water gap tutorial (only once, for the very first gap)
        if (firstWaterGap && !firstWaterTutorialShown && player.wx < firstWaterGap.wx + firstWaterGap.width + 80) {
          const wgx = firstWaterGap.wx - scrollX + firstWaterGap.width / 2;
          const wgy = GROUND_Y - 20;

          const boxX = W / 2 - 130;
          const boxY = 38;
          const boxW = 260;
          const boxH = 36;

          ctx.fillStyle = 'rgba(10, 25, 45, 0.88)';
          ctx.fillRect(boxX, boxY, boxW, boxH);
          ctx.strokeStyle = '#5599dd';
          ctx.lineWidth = 1.8;
          ctx.strokeRect(boxX, boxY, boxW, boxH);

          ctx.fillStyle = '#aaddff';
          ctx.font = '13px Segoe UI, Arial';
          ctx.textAlign = 'center';
          ctx.fillText("Don't fall in the water!", W / 2, boxY + 23);

          // Blue pointing line
          ctx.strokeStyle = '#66bbff';
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(W / 2, boxY + boxH);
          ctx.lineTo(wgx, wgy);
          ctx.stroke();
        }

        // Second green Neon tutorial (only for the second green orb)
        if (secondGreenTutorialActive) {
          // Find the most recent green orb on screen for pointing
          let targetOrb = null;
          for (let o of neonOrbs) {
            if (o.value === 5) {
              const osx = o.wx - scrollX;
              if (osx > 50 && osx < W - 50) {
                targetOrb = o;
                break;
              }
            }
          }

          if (targetOrb) {
            const gox = targetOrb.wx - scrollX;
            const goy = targetOrb.y;

            const boxX = W / 2 - 145;
            const boxY = 38;
            const boxW = 290;
            const boxH = 36;

            ctx.fillStyle = 'rgba(15, 40, 25, 0.88)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#55cc88';
            ctx.lineWidth = 1.8;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            ctx.fillStyle = '#99ffbb';
            ctx.font = '13px Segoe UI, Arial';
            ctx.textAlign = 'center';
            ctx.fillText('The green Neon Tokes are worth Extra Points!', W / 2, boxY + 23);

            // Green pointing line
            ctx.strokeStyle = '#66dd99';
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.moveTo(W / 2, boxY + boxH);
            ctx.lineTo(gox, goy - 8);
            ctx.stroke();
          } else {
            // If no green orb visible, dismiss the tutorial
            secondGreenTutorialActive = false;
          }
        }

        // distance readout (top right)
        ctx.font = '700 13px Segoe UI, Arial';
        ctx.textAlign = 'right';
        ctx.fillStyle = '#77bbdd';
        ctx.fillText('DISTANCE', W - 18, 24);
        ctx.font = '700 22px Consolas, monospace';
        ctx.fillStyle = '#aaddff';
        ctx.fillText(String(baseScore + score).padStart(5, '0'), W - 18, 48);

        // small jump counter
        ctx.font = '11px Consolas, monospace';
        ctx.fillStyle = '#5588aa';
        ctx.fillText('JUMPS ' + jumpCount, W - 18, 66);

        // Neon Score (blue + green orbs collected)
        ctx.font = '700 13px Segoe UI, Arial';
        ctx.fillStyle = '#4466cc';
        ctx.fillText('NEON', W - 18, 84);
        ctx.font = '700 20px Consolas, monospace';
        ctx.fillStyle = '#6688ff';
        ctx.fillText(String(neonScore).padStart(3, '0'), W - 18, 104);

        // Level Progress bar (fills as player approaches the ending)
        const progress = Math.min(1, Math.max(0, player.wx / 5106));
        const barY = 8;
        const barW = 180;
        const barH = 5;

        // Background track
        ctx.fillStyle = 'rgba(30, 50, 90, 0.6)';
        ctx.fillRect(W / 2 - barW / 2, barY, barW, barH);

        // Neon fill
        ctx.fillStyle = '#66aaff';
        ctx.fillRect(W / 2 - barW / 2, barY, barW * progress, barH);

        // Subtle glow outline
        ctx.strokeStyle = 'rgba(120, 180, 255, 0.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(W / 2 - barW / 2 - 1, barY - 1, barW + 2, barH + 2);
      }

      if (gameState === 'start') {
        if (!(window.NeonDashSprites && NeonDashSprites.drawHudPlate(ctx, W, H))) {
          ctx.fillStyle = 'rgba(2, 7, 15, 0.48)';
          ctx.fillRect(W / 2 - 320, H / 2 - 150, 640, 300);
        }

        ctx.font = '700 36px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#88d4ff';
        ctx.fillText('NEON DASH', W / 2, H / 2 - 52);

        ctx.font = '13px Consolas, monospace';
        ctx.fillStyle = '#5a8fb8';
        ctx.fillText('SIDE-SCROLL HAZARD PROTOCOL', W / 2, H / 2 - 26);

        ctx.font = '13px Segoe UI, Arial';
        ctx.fillStyle = '#6699bb';
        ctx.fillText('ARROW KEYS OR A/D  —  MOVE', W / 2, H / 2 + 18);
        ctx.fillText('SPACE  —  JUMP TRIANGLES + MONSTERS', W / 2, H / 2 + 36);

        ctx.font = '12px Consolas, monospace';
        ctx.fillStyle = '#447799';
        ctx.fillText('PRESS SPACE OR CLICK TO START', W / 2, H / 2 + 72);
      }

      if (gameState === 'over') {
        if (!(window.NeonDashSprites && NeonDashSprites.drawHudPlate(ctx, W, H))) {
          ctx.fillStyle = 'rgba(3, 6, 12, 0.48)';
          ctx.fillRect(W / 2 - 320, H / 2 - 150, 640, 300);
        }

        ctx.font = '700 28px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ff8866';
        ctx.fillText('COLLISION DETECTED', W / 2, H / 2 - 38);

        ctx.font = '15px Consolas, monospace';
        ctx.fillStyle = '#aaddff';
        ctx.fillText('DISTANCE TRAVELED: ' + String(baseScore + score).padStart(5, '0'), W / 2, H / 2 + 4);

        if (baseScore + score === best && baseScore + score > 0) {
          ctx.fillStyle = '#ffcc66';
          ctx.fillText('NEW PERSONAL BEST', W / 2, H / 2 + 24);
        } else if (best > 0) {
          ctx.fillStyle = '#6688aa';
          ctx.fillText('BEST: ' + String(best).padStart(5, '0'), W / 2, H / 2 + 24);
        }

        ctx.font = '12px Segoe UI, Arial';
        ctx.fillStyle = '#5588aa';
        ctx.fillText('PRESS R  OR  CLICK TO RESTART', W / 2, H / 2 + 58);
      }

      if (gameState === 'complete') {
        if (!(window.NeonDashSprites && NeonDashSprites.drawHudPlate(ctx, W, H))) {
          ctx.fillStyle = 'rgba(2, 6, 14, 0.48)';
          ctx.fillRect(W / 2 - 320, H / 2 - 150, 640, 300);
        }

        ctx.font = '700 32px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#66ddff';
        ctx.fillText('LEVEL COMPLETE', W / 2, H / 2 - 52);

        ctx.font = '15px Consolas, monospace';
        ctx.fillStyle = '#aaddff';
        ctx.fillText('DISTANCE TRAVELED: ' + String(baseScore + score).padStart(5, '0'), W / 2, H / 2 + 2);

        ctx.font = '13px Segoe UI, Arial';
        ctx.fillStyle = '#88bbdd';
        ctx.fillText('JUMPS: ' + jumpCount, W / 2, H / 2 + 24);

        ctx.font = '15px Consolas, monospace';
        ctx.fillStyle = '#88ffbb';
        ctx.fillText('NEON COLLECTED: ' + neonScore, W / 2, H / 2 + 48);

        if (baseScore + score === best) {
          ctx.fillStyle = '#ffcc66';
          ctx.fillText('NEW PERSONAL BEST!', W / 2, H / 2 + 72);
        }

        ctx.font = '12px Segoe UI, Arial';
        ctx.fillStyle = '#5588aa';
        ctx.fillText('PRESS R  OR  CLICK TO PLAY AGAIN', W / 2, H / 2 + 96);
      }
    }

    // Show/hide Next Level (L3) link based on game state
    function updateNextLevelLinkVisibility() {
      const container = document.getElementById('next-level-link-container');
      if (container) {
        container.style.display = (gameState === 'complete') ? 'block' : 'none';
      }
    }

    function gameLoop() {
      try {
        update();
        draw();
        updateNextLevelLinkVisibility();
      } catch (err) {
        console.error('[Neon Dash] gameLoop error:', err);
      } finally {
        requestAnimationFrame(gameLoop);
      }
    }

    function startPlaying() {
      getAudioCtx();
      if (gameState === 'start') {
        gameState = 'playing';
      } else if (gameState === 'over' || gameState === 'complete') {
        resetGame();
        gameState = 'playing';
      }
      updateNextLevelLinkVisibility();
    }

    // Save cumulative score when proceeding to next level (so it carries over)
    // This is called on link click so replays don't double-count unless the player chooses the better run
    function saveCumulativeForNextLevel() {
      try {
        const finalForThisLevel = baseScore + score;
        localStorage.setItem('neonDashCumulativeScore', String(finalForThisLevel));
        localStorage.setItem('neonDashCumulativeNeon', String(neonScore));
      } catch(e){}
    }

    function init() {
      loadBest();
      try {
        baseScore = parseInt(localStorage.getItem('neonDashCumulativeScore') || '0', 10) || 0;
        neonAtLevelStart = parseInt(localStorage.getItem('neonDashCumulativeNeon') || '0', 10) || 0;
      } catch(e) { baseScore = 0; neonAtLevelStart = 0; }
      initStars();
      resetGame();
      updateNextLevelLinkVisibility();

      // keyboard
      window.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        getAudioCtx();

        if (e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          if (gameState !== 'playing') {
            startPlaying();
          }
        }
        if (e.key === 'm' || e.key === 'M') {
          toggleMute();
        }
        if ((e.key === 'r' || e.key === 'R') && (gameState === 'over' || gameState === 'complete')) {
          resetGame();
          gameState = 'playing';
        }
      });

      window.addEventListener('keyup', (e) => {
        keys[e.key] = false;
      });

      // mouse / touch start
      canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        startPlaying();
      });
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startPlaying();
      }, { passive: false });

      // prevent space from scrolling page
      window.addEventListener('keydown', (e) => {
        if (e.key === ' ' && document.activeElement === document.body) {
          e.preventDefault();
        }
      });

      // initial draw
      draw();

      // kick off loop
      gameLoop();

      // Attach handler to next-level link to persist cumulative score
      const nextLinkEl = document.getElementById('next-level-link');
      if (nextLinkEl) {
        nextLinkEl.addEventListener('click', saveCumulativeForNextLevel);
      }

      // subtle console note
      console.log('%c[NEON DASH LEVEL 2] Arrow keys / A D to move, Space to jump. Avoid the red triangles.', 'color:#334455');
    }

    // boot
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
