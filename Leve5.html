      let hasVisibleLava = false;
      for (let gap of waterGaps) {
        const sx = gap.wx - scrollX;
        const gw = gap.width;
        if (sx + gw >= -20 && sx <= W + 20) { hasVisibleLava = true; break; }
      }

      // Subtle heat/pink glow from slime pits / ground (conditional to avoid save/shadow thrash every frame)
      if (hasVisibleLava) {
        ctx.save();
        ctx.shadowColor = '#3a1a2a';
        ctx.shadowBlur = 22;
        ctx.fillStyle = 'rgba(74, 34, 51, 0.18)';
        ctx.fillRect(0, floorTop - 7, W, 38);
        ctx.shadowBlur = 10;
        ctx.fillStyle = 'rgba(90, 45, 80, 0.12)';
        ctx.fillRect(0, floorTop - 1, W, 16);
        ctx.restore();
      }

      // Base charred rocky floor (dark slate / basalt, pink biosphere influence)
      ctx.fillStyle = '#2f2a26';
      ctx.fillRect(0, floorTop, W, H - floorTop);
      if (window.NeonDashSprites) NeonDashSprites.drawGround(ctx, W, GROUND_Y, H, scrollX);

      // Rough top edge / lip
      ctx.fillStyle = '#3a3430';
      ctx.fillRect(0, floorTop, W, 3.2);

      // Cracked stone texture / seams (parallax scroll; reduced iters)
      ctx.fillStyle = 'rgba(22, 19, 17, 0.55)';
      const mOffset = (scrollX * 1.25) % 62;
      for (let i = -1; i < 11; i++) {
        const mx = i * 62 - mOffset + 12;
        ctx.fillRect(mx, floorTop + 6, 18, 1.6);
      }
      // Secondary cracks
      ctx.fillStyle = 'rgba(40, 36, 33, 0.35)';
      const mOffset2 = (scrollX * 0.55) % 104;
      for (let i = -1; i < 7; i++) {
        const mx = i * 104 - mOffset2 + 28;
        ctx.fillRect(mx, floorTop + 13, 32, 1.2);
      }
      // Occasional glowing pink slime seams in floor cracks (subtle, no lava orange)
      ctx.fillStyle = 'rgba(255, 136, 204, 0.18)';
      const seamOffset = (scrollX * 0.85) % 240;
      for (let i = -1; i < 2; i++) {
        const sx = i * 240 - seamOffset + 55;
        ctx.fillRect(sx, floorTop + 5, 7, 1.5);
      }

      // === LOW WALLS / BARRIERS (must jump over - solid but non-lethal) ===
      for (let wall of lowWalls) {
        const sx = wall.wx - scrollX;
        if (sx < -30 || sx > W + 30) continue;

        const wh = wall.height;
        const ww = wall.width;

        // Base stone-like block (dark volcanic rock)
        ctx.fillStyle = '#25211d';
        ctx.fillRect(sx, GROUND_Y - wh, ww, wh);

        // Top edge (slightly lighter, looks like a lip)
        ctx.fillStyle = '#322c27';
        ctx.fillRect(sx, GROUND_Y - wh, ww, 4);

        // Subtle top highlight line
        ctx.fillStyle = '#413831';
        ctx.fillRect(sx, GROUND_Y - wh, ww, 1.5);

        // Small vertical "support" lines for texture
        ctx.fillStyle = 'rgba(30, 26, 23, 0.6)';
        ctx.fillRect(sx + 3, GROUND_Y - wh + 3, 1.5, wh - 5);
        ctx.fillRect(sx + ww - 5, GROUND_Y - wh + 3, 1.5, wh - 5);
      }

      // === PINK SLIME PITS (oozing flowing goo pools - deadly if fallen into; reskinned from lava) ===
      for (let gap of waterGaps) {
        const sx = gap.wx - scrollX;
        const gw = gap.width;
        if (sx + gw < -20 || sx > W + 20) continue;

        const pitDepth = 135; // deep slime pool visually

        ctx.fillStyle = '#2c1f2b';
        ctx.fillRect(sx - 1, floorTop - 1, gw + 2, 7);
        if (window.NeonDashSprites && NeonDashSprites.drawFluid(ctx, sx + 1, floorTop + 5, gw - 2, pitDepth, frame)) {
          continue;
        }
        // Cracked rim texture
        ctx.fillStyle = '#1f1420';
        ctx.fillRect(sx + 3, floorTop, 2, 4);
        ctx.fillRect(sx + gw - 7, floorTop + 1, 3, 3);

        // Subtle pink glow on upper pit walls (rock lit by slime)
        ctx.fillStyle = 'rgba(90, 45, 80, 0.45)';
        ctx.fillRect(sx, floorTop + 5, 3, 22);
        ctx.fillRect(sx + gw - 3, floorTop + 5, 3, 22);

        // === FULL DEPTH OOZING PINK SLIME (animated downward flow + drips + bubbles; no orange/lava) ===
        // Deep base slime (dark pink fill #3a1a2a theme)
        ctx.fillStyle = '#3a1a2a';
        ctx.fillRect(sx + 1, floorTop + 5, gw - 2, pitDepth);

        // Mid slime layer (richer dark pink #4a2233)
        ctx.fillStyle = '#4a2233';
        ctx.fillRect(sx + 2, floorTop + 8, gw - 4, pitDepth - 12);

        // Side wall slime glow / ooze (grouped, deep to bright pink)
        ctx.fillStyle = 'rgba(100, 50, 90, 0.32)';
        ctx.fillRect(sx + 1, floorTop + 18, 2, pitDepth - 10);
        ctx.fillRect(sx + gw - 3, floorTop + 18, 2, pitDepth - 10);

        // Upper brighter slime surface (grouped)
        ctx.fillStyle = 'rgba(85, 40, 75, 0.92)';
        ctx.fillRect(sx + 1, floorTop + 5, gw - 2, 28);
        ctx.fillStyle = 'rgba(120, 55, 95, 0.82)';
        ctx.fillRect(sx + 1, floorTop + 6, gw - 2, 11);

        // Animated vertical flow / ooze streaks (downward slow, use sin(frame*rate + phase + gap.wx) for offset)
        const flowT = (frame * 0.035) % (gw + 50);
        const flowPhase = gap.wx * 0.013; // seeded by position for variation
        ctx.fillStyle = 'rgba(255, 119, 204, 0.26)';
        for (let f = 0; f < 3; f++) {
          const phaseOff = (f * 1.3 + flowPhase);
          const dripOff = Math.sin(frame * 0.022 + phaseOff) * 4.5; // vertical flow/drip offset
          const fx = sx + 5 + ((f * 19 + flowT * 0.55) % (gw - 10));
          const fy = floorTop + 10 + dripOff * 0.6;
          ctx.fillRect(fx, fy, 2.2, pitDepth - 20 - (f % 2));
        }
        ctx.fillStyle = 'rgba(255, 136, 204, 0.15)';
        for (let f = 0; f < 2; f++) {
          const phaseOff = (f * 2.1 + flowPhase + 1.7);
          const dripOff = Math.sin(frame * 0.018 + phaseOff) * 6.2;
          const fx = sx + 9 + ((f * 27 + flowT * 0.8) % (gw - 14));
          const fy = floorTop + 13 + dripOff * 0.5;
          ctx.fillRect(fx, fy, 1.6, pitDepth - 28);
        }

        // Animated goo drips / blobs from edges and bottom (ellipses/rects with vertical sin offset, slow ooze)
        const dripBase = frame * 0.014 + flowPhase;
        ctx.fillStyle = 'rgba(255, 102, 187, 0.75)';
        for (let d = 0; d < 5; d++) {
          const dPhase = dripBase + d * 0.9 + (d % 3) * 1.6;
          const vy = Math.sin(dPhase) * 7.5 + Math.sin(dPhase * 1.6) * 3.2; // downward ooze/drip offset
          const dx = sx + 3 + ((d * 13 + (gap.wx % 17)) % (gw - 8));
          const dy = floorTop + 9 + vy + (d % 2) * 1.5;
          const dw = 2.8 + Math.sin(dPhase * 0.7) * 0.7;
          const dh = 3.5 + Math.cos(dPhase) * 1.8;
          ctx.beginPath();
          ctx.ellipse(dx, dy, dw, Math.max(1.5, dh), 0, 0, Math.PI * 2);
          ctx.fill();
        }
        // Extra bottom-hanging drips / blobs (from pit bottom edges)
        ctx.fillStyle = 'rgba(255, 136, 204, 0.55)';
        for (let d = 0; d < 3; d++) {
          const dPhase = dripBase * 0.8 + d * 1.4;
          const vy = Math.sin(dPhase + 0.8) * 5.0 + 2;
          const dx = sx + 4 + ((d * 22 + 7) % (gw - 10));
          const dy = floorTop + pitDepth - 18 + vy;
          ctx.beginPath();
          ctx.ellipse(dx, dy, 2.1 + Math.sin(dPhase) * 0.5, 4.5 + Math.cos(dPhase * 1.1) * 1.5, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Bubbles / highlights in brighter pink (pulsing size/alpha with sin(frame); seeded stable positions)
        const bubblePhase = (frame * 0.065) % (Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 136, 204, 0.8)';
        const numBubs = Math.max(4, Math.floor(gw / 22));
        for (let b = 0; b < numBubs && b < 8; b++) {
          const seed = (gap.wx * 0.77 + b * 19.3) % 83;
          const bx = sx + 2 + ((b * 21 + seed) % (gw - 6));
          const by = floorTop + 8 + ((Math.sin(bubblePhase + b * 1.9) + 1) * 4.5) + (b % 3) * 0.6;
          const pulse = 0.65 + 0.45 * Math.sin(bubblePhase * 1.15 + b);
          const br = (1.5 + Math.sin(bubblePhase + b * 0.7) * 0.7) * pulse;
          ctx.globalAlpha = 0.55 + 0.35 * Math.sin(bubblePhase * 0.9 + b * 1.3 + seed);
          ctx.beginPath();
          ctx.arc(bx, by, Math.max(1, br), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // Flowing highlights / subtle pulsing surface sheen (brighter pink accents, downward bias)
        ctx.fillStyle = 'rgba(255, 170, 220, 0.35)';
        const sheenT = frame * 0.026 + gap.wx * 0.009;
        for (let f = 0; f < 2; f++) {
          const fx = sx + 6 + (((f * 31 + sheenT * 0.7) % (gw - 12)));
          const fy = floorTop + 7 + Math.sin(sheenT * 0.8 + f) * 2.5;
          ctx.fillRect(fx, fy, 3.5, 2.2);
        }
      }

      // Slime puddles (splats from purple slimeballs; short lived ~5s, bubble, deadly to touch)
      for (let pud of slimePuddles) {
        const sx = pud.wx - scrollX;
        if (sx < -40 || sx > W + 40) continue;
        const alpha = Math.max(0.05, pud.life / 300);
        const pw = (pud.size || 18) * 1.1;
        ctx.globalAlpha = alpha;
        // main splat puddle (bubbling purple goo on floor)
        ctx.fillStyle = '#6622aa';
        ctx.beginPath();
        ctx.ellipse(sx, GROUND_Y - 1, pw, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        // lighter edge
        ctx.fillStyle = 'rgba(170, 100, 220, 0.6)';
        ctx.beginPath();
        ctx.ellipse(sx, GROUND_Y - 1, pw * 0.7, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        // small bubbles in puddle (fading)
        ctx.fillStyle = '#ff88cc';
        for (let b = 0; b < 4; b++) {
          const bp = frame * 0.07 + b * 1.3 + (pud.wx * 0.1);
          const bx = sx - pw * 0.4 + (b % 3) * (pw * 0.35);
          const by = GROUND_Y - 2 + Math.sin(bp) * 1.5;
          ctx.beginPath();
          ctx.arc(bx, by, 1.2 + Math.sin(bp * 1.5) * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;
      }

      // Erupting purple slimeballs (from slime pits; twice size, bubbling)
      for (let dart of poisonDarts) {
        const dsx = dart.wx - scrollX;
        const dsy = dart.y;
        if (dsx < -14 || dsx > W + 14) continue;
        if (window.NeonDashSprites && NeonDashSprites.drawShot(ctx, 'slime', dsx, dsy, frame, 22, 22, dart.vx, dart.vy)) continue;

        const r = 9 + Math.sin(frame * 0.18 + dsx) * 1.2; // twice size, pulsing

        // Outer purple/magenta glow (bubbling slime)
        ctx.fillStyle = 'rgba(170, 80, 220, 0.35)';
        ctx.beginPath();
        ctx.arc(dsx, dsy, r + 5, 0, Math.PI * 2);
        ctx.fill();

        // Main slimeball body (deep purple-pink)
        ctx.fillStyle = '#9933cc';
        ctx.beginPath();
        ctx.arc(dsx, dsy, r, 0, Math.PI * 2);
        ctx.fill();

        // Bubbling highlights inside (lighter pink-purple bubbles, animated)
        ctx.fillStyle = '#ff88cc';
        for (let b = 0; b < 3; b++) {
          const bp = frame * 0.12 + b * 2.3 + dsx;
          const bx = dsx + Math.sin(bp) * (r * 0.4);
          const by = dsy + Math.cos(bp * 0.8) * (r * 0.3) - 1;
          ctx.beginPath();
          ctx.arc(bx, by, 1.8 + Math.sin(bp * 1.5) * 0.6, 0, Math.PI * 2);
          ctx.fill();
        }

        // Hot core (brighter)
        ctx.fillStyle = '#cc99ff';
        ctx.beginPath();
        ctx.arc(dsx - 1, dsy - 1, r * 0.35, 0, Math.PI * 2);
        ctx.fill();
      }

      // === ROCKY OUTCROPS & LAVA VENTS (midground pillars with flowing lava) ===
      // + burned trees mixed in for lava/volcano background (charred trunks, jagged branches, ember glows)
      for (let tree of alienTrees) {
        const sx = tree.wx - scrollX * tree.parallax;
        if (sx < -60 || sx > W + 60) continue;

        const s = tree.scale;
        const ty = tree.y;

        // Burned tree variant (roughly 1/3 of formations, pseudo-random per tree for variety)
        const isBurned = ((tree.wx * 31) | 0) % 3 === 0;
        if (isBurned) {
          // charred trunk (dark, fits lava world)
          ctx.fillStyle = '#1a140f';
          ctx.fillRect(sx - 2 * s, ty, 5 * s, 36 * s);

          // jagged burnt branches (no leaves, dark lines)
          ctx.strokeStyle = '#120d0a';
          ctx.lineWidth = 1.3 * s;
          ctx.beginPath();
          ctx.moveTo(sx + 0.5 * s, ty + 6 * s); ctx.lineTo(sx + 10 * s, ty + 1 * s);
          ctx.moveTo(sx - 0.5 * s, ty + 14 * s); ctx.lineTo(sx - 8 * s, ty + 7 * s);
          ctx.moveTo(sx + 1 * s, ty + 22 * s); ctx.lineTo(sx + 11 * s, ty + 17 * s);
          ctx.moveTo(sx, ty + 28 * s); ctx.lineTo(sx - 6 * s, ty + 24 * s);
          ctx.stroke();

          // glowing embers on branch tips (pulsing orange - lava/volcano theme)
          const eA = 0.35 + 0.45 * Math.sin(frame * 0.12 + tree.wx);
          ctx.fillStyle = `rgba(255, 110, 25, ${eA})`;
          ctx.fillRect(sx + 9 * s, ty, 2 * s, 1.5 * s);
          ctx.fillRect(sx - 7.5 * s, ty + 6 * s, 1.5 * s, 1 * s);
          ctx.fillRect(sx + 10 * s, ty + 16 * s, 1.8 * s, 1.2 * s);

          // wider charred base + faint rising ash
          ctx.fillStyle = '#0f0b08';
          ctx.fillRect(sx - 3.5 * s, ty + 32 * s, 8 * s, 6 * s);
          ctx.strokeStyle = 'rgba(55, 50, 45, 0.25)';
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          ctx.moveTo(sx - 0.5 * s, ty + 4 * s);
          ctx.lineTo(sx + 0.5 * s, ty - 3 * s);
          ctx.stroke();

          continue; // done, skip the rock pillar draw
        }

        // Main vertical rock pillar / jagged column (basalt)
        ctx.fillStyle = '#2f2925';
        ctx.fillRect(sx, ty, 5 * s, 38 * s);
        // Ledges / strata
        ctx.fillStyle = '#25201c';
        ctx.fillRect(sx - 4 * s, ty + 1 * s, 12 * s, 2.8 * s);
        ctx.fillRect(sx - 4 * s, ty + 24 * s, 12 * s, 2.8 * s);

        // Side rock spur
        ctx.fillStyle = '#26211d';
        ctx.fillRect(sx + 8 * s, ty + 3 * s, 4 * s, 30 * s);

        // Small outcrop / lava vent housing
        ctx.fillStyle = '#382f28';
        ctx.fillRect(sx - 7 * s, ty + 9 * s, 8 * s, 9 * s);
        // Vent / crack lines 
        ctx.fillStyle = '#201a16';
        ctx.fillRect(sx - 5.5 * s, ty + 11 * s, 6 * s, 1.2 * s);
        ctx.fillRect(sx - 5.5 * s, ty + 15 * s, 6 * s, 1.2 * s);

        // Lava glow from vent / crack (pulsing stronger)
        const ledPhase = (frame + Math.floor(Math.abs(tree.wx) % 53)) % 47;
        const lavaGlow = (ledPhase > 10 && ledPhase < 32) ? 0.75 : 0.18;
        ctx.fillStyle = `rgba(255, 105, 35, ${lavaGlow})`;
        ctx.fillRect(sx - 4 * s, ty + 12 * s, 2.2 * s, 2 * s);
        ctx.fillStyle = `rgba(255, 135, 50, ${lavaGlow * 0.7})`;
        ctx.fillRect(sx - 3.2 * s, ty + 17 * s, 1.4 * s, 1.3 * s);

        // Flowing lava streak down the rock face
        ctx.strokeStyle = `rgba(240, 100, 28, ${0.6 + 0.35 * Math.sin(frame * 0.09 + tree.wx)})`;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(sx + 2 * s, ty + 8 * s);
        ctx.lineTo(sx + 1.5 * s, ty + 20 * s);
        ctx.lineTo(sx + 3 * s, ty + 32 * s);
        ctx.stroke();
        ctx.strokeStyle = `rgba(255, 155, 55, ${0.35 + 0.25 * Math.sin(frame * 0.13 + tree.wx * 0.7)})`;
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(sx + 0.5 * s, ty + 10 * s);
        ctx.quadraticCurveTo(sx + 4 * s, ty + 18 * s, sx + 1 * s, ty + 29 * s);
        ctx.stroke();
        ctx.lineWidth = 1;

        // Lava pooling at base of rock
        ctx.fillStyle = 'rgba(155, 42, 14, 0.7)';
        ctx.beginPath();
        ctx.ellipse(sx + 2 * s, ty + 39 * s, 7 * s, 2.2 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(235, 95, 25, ${0.45 + 0.3 * Math.sin(frame * 0.1)})`;
        ctx.beginPath();
        ctx.ellipse(sx + 2 * s, ty + 38 * s, 4 * s, 1.1 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        // Very subtle rising volcanic gas wisps (grey, not neon)
        const steamT = frame * 0.021 + ((tree.wx * 5) % 21);
        ctx.strokeStyle = `rgba(85, 80, 75, ${0.09 + 0.06 * Math.sin(steamT)})`;
        ctx.lineWidth = 1.0;
        const steamX = sx - 1.5 * s;
        ctx.beginPath();
        ctx.moveTo(steamX, ty + 8 * s);
        ctx.lineTo(steamX + Math.sin(steamT * 0.65) * 1.4 * s, ty + 2 * s);
        ctx.stroke();
      }

      // === VERTICAL PATROLLING ALIENS (long tail, up/down movement) ===
      for (let e of verticalEnemies) {
        const sx = e.wx - scrollX;
        const sy = e.y;
        if (sx < -40 || sx > W + 40) continue;

        // Body (purple alien)
        ctx.fillStyle = '#5a2a7a';
        ctx.beginPath();
        ctx.ellipse(sx, sy, 13, 11, 0, 0, Math.PI * 2);
        ctx.fill();

        // Head
        ctx.fillStyle = '#7a3a9a';
        ctx.beginPath();
        ctx.arc(sx + 5, sy - 6, 7, 0, Math.PI * 2);
        ctx.fill();

        // Eyes (warning lights)
        ctx.fillStyle = '#88ddee';
        ctx.fillRect(sx + 7, sy - 8, 2, 2);
        ctx.fillRect(sx + 11, sy - 7, 2, 2);

        // Long tail (waving)
        ctx.strokeStyle = '#4a1a5a';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(sx - 8, sy + 4);
        const tailWave = Math.sin(frame * 0.09 + e.phase) * 6;
        ctx.quadraticCurveTo(sx - 22, sy + 12 + tailWave * 0.5, sx - 32, sy + 18 + tailWave);
        ctx.stroke();

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#6a3a7a';
        ctx.beginPath();
        ctx.moveTo(sx - 8, sy + 4);
        ctx.quadraticCurveTo(sx - 20, sy + 10 + tailWave * 0.3, sx - 30, sy + 16 + tailWave * 0.8);
        ctx.stroke();
      }

      // === OVAL TRAMPOLINES (scorched rock bounce pads before tall walls) ===
      for (let t of trampolines) {
        const sx = t.wx - scrollX;
        if (sx < -50 || sx > W + 50) continue;

        const tw = t.width;
        const ty = GROUND_Y - 3;

        // Soft heat glow under the rock pad
        ctx.fillStyle = 'rgba(210, 85, 30, 0.22)';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty + 4, tw / 2 + 8, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Main oval rock bounce pad (charred with lava rim)
        ctx.fillStyle = '#3a3129';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty, tw / 2, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        // Lava edge highlight
        ctx.fillStyle = 'rgba(220, 90, 25, 0.6)';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty - 1, tw / 2 - 1, 2.2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Inner highlight
        ctx.fillStyle = '#aaffee';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2 - 2, ty - 1, tw / 2 - 4, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Subtle edge ring
        ctx.strokeStyle = '#119977';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty, tw / 2, 5, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // === PINK SNAKE-LIKE FLOWER CEILING HAZARDS (L5 biosphere theme; draw after ground/high bg but before platforms/player for proper layering) ===
      // Stem #44aa66 or darker; flower petals #ff88cc / #ff77cc / #cc66ee bright dangerous pink. Snake curve via wiggle sin offset on segments.
      // From ceiling (small y) down as thick segmented vine; head flower (circle + 5 petals); subtle vein/glow + slight petal/head anim.
      // No parallax (or very light); animated with frame.
      for (let f of ceilingFlowers) {
        const sx = f.wx - scrollX;
        if (sx < -60 || sx > W + 60) continue; // offscreen cull
        const baseY = f.baseY;
        const curLen = f.length;
        if (curLen < 1) continue;

        const segments = 7;
        const points = [];
        for (let i = 0; i <= segments; i++) {
          const t = i / segments;
          const ly = baseY + t * curLen;
          // snake wiggle: amp grows with length down the vine, phase + t for curve
          const amp = Math.min(t * curLen * 0.085, 22);
          const woff = Math.sin(frame * 0.029 + f.wigglePhase + t * 2.1) * amp;
          points.push({ x: sx + woff, y: ly });
        }

        // Thick stem vine (dark green #44aa66 theme match to flora stems; use stroke for smooth curve)
        ctx.strokeStyle = '#2f7a4a'; // slightly darker stem
        ctx.lineWidth = 9.5;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();

        // Lighter inner stem highlight
        ctx.strokeStyle = '#4aa86b';
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();

        // Pink vein glow line (subtle dangerous highlight)
        ctx.strokeStyle = 'rgba(255, 136, 204, 0.45)';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(points[0].x + 1, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x + 1, points[i].y);
        }
        ctx.stroke();

        // Flower head at tip (glow + layered petals + center)
        const tip = points[points.length - 1];
        const headPhase = frame * 0.04 + f.wigglePhase;
        const petalPulse = 0.85 + 0.15 * Math.sin(headPhase * 1.6);
        const headRot = Math.sin(headPhase) * 0.25;

        // Outer soft glow (pink danger aura)
        ctx.fillStyle = 'rgba(255, 136, 204, 0.22)';
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 13, 0, Math.PI * 2);
        ctx.fill();

        // Petals (5 main + smaller offsets; bright pink #ff88cc / #ff77cc)
        ctx.fillStyle = '#ff88cc';
        for (let p = 0; p < 5; p++) {
          const pa = (p * (Math.PI * 2 / 5)) + headRot + (p % 2 ? 0.15 : -0.1);
          const px = tip.x + Math.cos(pa) * (7.5 * petalPulse);
          const py = tip.y + Math.sin(pa) * (5.5 * petalPulse);
          ctx.beginPath();
          ctx.ellipse(px, py, 5.5 * petalPulse, 3.2 * petalPulse, pa + 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#ff77cc';
        for (let p = 0; p < 5; p++) {
          const pa = (p * (Math.PI * 2 / 5)) + headRot + 0.6 + (p % 2 ? 0.1 : -0.15);
          const px = tip.x + Math.cos(pa) * (5 * petalPulse);
          const py = tip.y + Math.sin(pa) * (4 * petalPulse);
          ctx.beginPath();
          ctx.ellipse(px, py, 3.8 * petalPulse, 2.2 * petalPulse, pa, 0, Math.PI * 2);
          ctx.fill();
        }

        // Center bulb (dangerous purple-pink)
        ctx.fillStyle = '#cc66ee';
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 4.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 170, 220, 0.7)';
        ctx.beginPath();
        ctx.arc(tip.x - 1, tip.y - 1, 1.8, 0, Math.PI * 2);
        ctx.fill();

        // Ceiling attach nub (small stem from top)
        ctx.fillStyle = '#2f7a4a';
        ctx.fillRect(sx - 2, 0, 4, baseY + 2);
        ctx.fillStyle = '#4aa86b';
        ctx.fillRect(sx - 1, 0, 2, baseY + 1);
      }

      // === FLOATING PLATFORMS (bubblegum pink with bubble texture; thicker, L/R sway + up/down float) ===
      for (let p of platforms) {
        const sway = (p.swayAmp || 0) * Math.sin((frame * 0.021) + (p.swayPhase || 0));
        const floatY = (p.floatAmp || 0) * Math.sin((frame * 0.018) + (p.floatPhase || 0));
        const sx = p.wx - scrollX + sway;
        if (sx < -90 || sx > W + 90) continue;
        const py = p.y + floatY;

        // soft shadow (moves slightly with sway + floatY)
        ctx.fillStyle = 'rgba(0,0,0,0.32)';
        ctx.fillRect(sx + 3, py + p.height + 3, p.width - 6, 5);

        if (window.NeonDashSprites && NeonDashSprites.drawPlatform(ctx, sx, py, p.width, p.height)) {
          continue;
        }

        // main platform body (bubblegum pink; variation based on moving L/R sway)
        ctx.fillStyle = ((p.swayAmp || 0) > 0.04 ? '#ff77cc' : '#ff88cc');
        ctx.fillRect(sx, py, p.width, p.height);

        // lighter pink top highlight (bubblegum sheen, no lava)
        ctx.fillStyle = 'rgba(255, 187, 221, 0.65)';
        ctx.fillRect(sx, py, p.width, 2);

        // subtle inner top highlight
        ctx.fillStyle = 'rgba(255, 200, 230, 0.4)';
        ctx.fillRect(sx + 3, py + 2, p.width - 6, 1);

        // underside detail (deeper pink)
        ctx.fillStyle = '#552244';
        ctx.fillRect(sx + 2, py + p.height - 3, p.width - 4, 2);

        // Bubble texture: several small semi-transparent ellipses/circles scattered on surface
        // (random but seeded by wx/phase for stable positions per platform; pulsing size/alpha with sin(frame))
        ctx.fillStyle = '#ffbbdd';
        const numBubbles = 5;
        for (let i = 0; i < numBubbles; i++) {
          // seeded pseudo-random pos using wx + phase + i (stable, no rand in draw)
          const seed = (p.wx * 0.83 + (p.swayPhase || 0) * 0.4 + i * 31.7) % 97;
          const bx = sx + 4 + (seed % (p.width - 9));
          const by = py + 2.5 + ((i * 2.8 + (seed % 7)) % (p.height - 4));
          const pulse = 0.75 + 0.35 * Math.sin(frame * 0.065 + i * 1.1 + (p.floatPhase || 0) * 0.6);
          const brx = (1.7 + (i % 2) * 0.6) * pulse;
          const bry = (1.2 + (i % 3) * 0.4) * pulse;
          ctx.globalAlpha = 0.28 + 0.22 * Math.sin(frame * 0.09 + i * 0.8 + seed);
          ctx.beginPath();
          ctx.ellipse(bx, by, brx, bry, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // subtle bubble rim highlights (brighter pink accents)
        ctx.fillStyle = 'rgba(255, 200, 230, 0.5)';
        for (let i = 0; i < 2; i++) {
          const seed2 = (p.wx * 1.1 + i * 47) % 61;
          const bx2 = sx + 6 + (seed2 % (p.width - 12));
          const by2 = py + 3 + ((i * 3.5 + (seed2 % 5)) % (p.height - 6));
          const br2 = 1.1 + Math.sin(frame * 0.08 + i) * 0.3;
          ctx.beginPath();
          ctx.ellipse(bx2, by2, br2, br2 * 0.7, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // === FRIENDLY NPC (pink octagon with blue eyes, middle of level, bounces and speech bubble on approach) ===
      if (friendlyNPC) {
        const bob = Math.sin(friendlyNPC.bouncePhase || 0) * 5;
        const npcX = friendlyNPC.wx - scrollX;
        const npcBaseY = friendlyNPC.y;
        const drawY = npcBaseY - bob;
        const size = 44;
        const r = size / 2;

        if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'npc', npcX - r, drawY - r, size, size))) {
        ctx.fillStyle = '#ff88dd';
        ctx.strokeStyle = '#cc5599';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const ang = (i * Math.PI * 2 / 8) - Math.PI / 8;
          const x = npcX + Math.cos(ang) * r;
          const y = drawY + Math.sin(ang) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#4488ff';
        ctx.beginPath();
        ctx.arc(npcX - 5, drawY - 3, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(npcX + 5, drawY - 3, 3.5, 0, Math.PI * 2);
        ctx.fill();
        }

        // Speech bubble if approached
        // Disappears when NPC off screen (npcX check)
        if (friendlyNPC.approached && npcX > -50 && npcX < W + 50) {
          const boxW = 210;
          const boxH = 38;
          const boxX = Math.max(20, Math.min(W - boxW - 20, npcX - boxW / 2));
          const boxY = Math.max(12, drawY - 55);

          if (!(window.NeonDashSprites && NeonDashSprites.drawSpeechBubble(ctx, boxX, boxY, boxW, boxH, npcX, drawY - 2, ['Hey, are you here to solve the mystery?', 'The pink slime is dangerous!']))) {
            ctx.fillStyle = 'rgba(52, 8, 38, 0.94)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#ff79d0';
            ctx.strokeRect(boxX, boxY, boxW, boxH);
            ctx.fillStyle = '#ffe6f5';
            ctx.font = '11px Segoe UI, Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Hey, are you here to solve the mystery?', boxX + boxW / 2, boxY + 14);
            ctx.fillText('The pink slime is dangerous!', boxX + boxW / 2, boxY + 28);
          }
        }
      }

      // === OCTOPOPP NPCs (pink octagon with blue eyes; start + halfway dialogues; same bubble mechanic)
      // Start NPC (very beginning of level 5)
      if (octopoppStart) {
        const bob = Math.sin(octopoppStart.bouncePhase || 0) * 5;
        const npcX = octopoppStart.wx - scrollX;
        const npcBaseY = octopoppStart.y;
        const drawY = npcBaseY - bob;
        const size = 44;
        const r = size / 2;
        const isOnScreen = npcX >= -50 && npcX <= W + 50;
        if (isOnScreen) {
          if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'npc', npcX - r, drawY - r, size, size))) {
          ctx.fillStyle = '#ff88dd';
          ctx.strokeStyle = '#cc5599';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let i = 0; i < 8; i++) {
            const ang = (i * Math.PI * 2 / 8) - Math.PI / 8;
            const x = npcX + Math.cos(ang) * r;
            const y = drawY + Math.sin(ang) * r;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#4488ff';
          ctx.beginPath();
          ctx.arc(npcX - 5, drawY - 3, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(npcX + 5, drawY - 3, 3.5, 0, Math.PI * 2);
          ctx.fill();
          }
          if (octopoppStart.approached && npcX > -50 && npcX < W + 50) {
            const boxW = 240;
            const boxH = 42;
            const boxX = Math.max(20, Math.min(W - boxW - 20, npcX - boxW / 2));
            const boxY = Math.max(12, drawY - 58);
            if (!(window.NeonDashSprites && NeonDashSprites.drawSpeechBubble(ctx, boxX, boxY, boxW, boxH, npcX, drawY - 2, ['There\'s a great mystery.', 'Why is all the neon floating away?']))) {
              ctx.fillStyle = 'rgba(52, 8, 38, 0.94)';
              ctx.fillRect(boxX, boxY, boxW, boxH);
              ctx.strokeStyle = '#ff79d0';
              ctx.strokeRect(boxX, boxY, boxW, boxH);
              ctx.fillStyle = '#ffe6f5';
              ctx.font = '11px Segoe UI, Arial';
              ctx.textAlign = 'center';
              ctx.fillText('There\'s a great mystery.', boxX + boxW / 2, boxY + 14);
              ctx.fillText('Why is all the neon floating away?', boxX + boxW / 2, boxY + 30);
            }
          }
        }
      }
      // Mid NPC (halfway through level 5)
      if (octopoppMid) {
        const bob = Math.sin(octopoppMid.bouncePhase || 0) * 5;
        const npcX = octopoppMid.wx - scrollX;
        const npcBaseY = octopoppMid.y;
        const drawY = npcBaseY - bob;
        const size = 44;
        const r = size / 2;
        const isOnScreen = npcX >= -50 && npcX <= W + 50;
        if (isOnScreen) {
          if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'npc', npcX - r, drawY - r, size, size))) {
          ctx.fillStyle = '#ff88dd';
          ctx.strokeStyle = '#cc5599';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let i = 0; i < 8; i++) {
            const ang = (i * Math.PI * 2 / 8) - Math.PI / 8;
            const x = npcX + Math.cos(ang) * r;
            const y = drawY + Math.sin(ang) * r;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#4488ff';
          ctx.beginPath();
          ctx.arc(npcX - 5, drawY - 3, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(npcX + 5, drawY - 3, 3.5, 0, Math.PI * 2);
          ctx.fill();
          }
          // Speech bubble if approached (exact text)
          // Disappears when NPC off screen (npcX check)
          if (octopoppMid.approached && npcX > -50 && npcX < W + 50) {
            const boxW = 230;
            const boxH = 38;
            const boxX = Math.max(20, Math.min(W - boxW - 20, npcX - boxW / 2));
            const boxY = Math.max(12, drawY - 55);
            if (!(window.NeonDashSprites && NeonDashSprites.drawSpeechBubble(ctx, boxX, boxY, boxW, boxH, npcX, drawY - 2, ['The only way to save us is to stop the neon leak!']))) {
              ctx.fillStyle = 'rgba(52, 8, 38, 0.94)';
              ctx.fillRect(boxX, boxY, boxW, boxH);
              ctx.strokeStyle = '#ff79d0';
              ctx.strokeRect(boxX, boxY, boxW, boxH);
              ctx.fillStyle = '#ffe6f5';
              ctx.font = '11px Segoe UI, Arial';
              ctx.textAlign = 'center';
              ctx.fillText('The only way to save us is to stop the neon leak!', boxX + boxW / 2, boxY + 22);
            }
          }
        }
      }

      // draw obstacles (triangles) - pink biosphere living organic/crystal hazards that patrol + wiggle L/R as if alive (reskinned; no lava)
      for (let o of obstacles) {
        const currWX = getTriangleCurrentWX(o);
        const sx = currWX - scrollX;
        if (sx < -30 || sx > W + 30) continue;

        const th = o.h;
        const tw = 27;
        const wiggle = Math.sin(frame * 0.065 + (o.wx || 0) * 0.015) * 1.6; // left to right wiggle - "alive"
        const drawX = sx + wiggle;

        // shadow under triangle
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.moveTo(drawX - tw/2 - 1, GROUND_Y + 3);
        ctx.lineTo(drawX + tw/2 + 1, GROUND_Y + 3);
        ctx.lineTo(drawX, GROUND_Y - th * 0.35);
        ctx.closePath();
        ctx.fill();

        if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'hazard', drawX - tw / 2, GROUND_Y - th, tw, th))) {
        // main triangle (hazard) - pink biosphere organic/crystal (reskinned; no lava)
        ctx.fillStyle = '#2a1f2b';
        ctx.beginPath();
        ctx.moveTo(drawX, GROUND_Y - th);
        ctx.lineTo(drawX - tw / 2, GROUND_Y + 0.5);
        ctx.lineTo(drawX + tw / 2, GROUND_Y + 0.5);
        ctx.closePath();
        ctx.fill();

        // NEW vein (center pulsing pink/magenta living detail)
        ctx.fillStyle = `rgba(255,136,204, ${0.32 + 0.22*Math.sin(frame*0.09 + (o.wx||0))})`;
        ctx.fillRect(drawX-1.5, GROUND_Y - th*0.72 , 3, th*0.48);

        // pulsing bio glow top lip / edge (pink biosphere)
        const lipAlpha = 0.55 + 0.35 * Math.sin(frame * 0.1 + (o.wx || 0));
        ctx.fillStyle = `rgba(255, 119, 204, ${lipAlpha})`;
        ctx.beginPath();
        ctx.moveTo(drawX, GROUND_Y - th);
        ctx.lineTo(drawX - tw / 2 + 1, GROUND_Y - 1);
        ctx.lineTo(drawX + tw / 2 - 1, GROUND_Y - 1);
        ctx.closePath();
        ctx.fill();

        // NEW soft highlight (thin pink rim after lip for living organic detail)
        ctx.strokeStyle = 'rgba(255,136,204,0.28)';
        ctx.lineWidth=1.1;
        ctx.beginPath();
        ctx.moveTo(drawX, GROUND_Y - th + 2);
        ctx.lineTo(drawX - tw / 2 + 3, GROUND_Y - 2);
        ctx.lineTo(drawX + tw / 2 - 3, GROUND_Y - 2);
        ctx.closePath();
        ctx.stroke();

        // pink crystal cracks / small vents on the face (animated glow)
        ctx.fillStyle = `rgba(255, 136, 204, 0.6)`;
        const crackY = GROUND_Y - th * 0.55 + Math.sin(frame * 0.07 + o.wx) * 2;
        ctx.fillRect(drawX - 4, crackY, 8, 1.5);
        ctx.fillRect(drawX - 2, GROUND_Y - th * 0.3, 4, 1);

        // top edge (cracked rock)
        ctx.strokeStyle = '#552244';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(drawX, GROUND_Y - th);
        ctx.lineTo(drawX - tw / 2 + 2, GROUND_Y - 0.5);
        ctx.stroke();

        // small accent / ember line
        ctx.fillStyle = '#4a2233';
        ctx.fillRect(drawX - 1.5, GROUND_Y - th + 5, 3, 1.5);
        }
      }

      // === GLOWING PURPLE BLOBS (biosphere melting chasers - slow, squashable from above, shoot projectiles) ===
      for (let s of specials) {
        const sx = s.wx - scrollX;
        const sy = s.y;
        if (sx < -60 || sx > W + 60) continue;

        const cx = sx + s.w / 2;
        const cy = sy + s.h / 2 + 2;
        const radius = s.h / 2 - 2;

        // soft shadow
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath();
        ctx.ellipse(cx + 2, GROUND_Y + 2, radius * 0.9, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        if (window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'enemy', sx, sy, s.w, s.h)) {
          continue;
        }

        // Soft outer purple/magenta glow (pulsing - glowing alien biosphere effect)
        const pulse = 0.7 + Math.sin(frame * 0.12 + s.wx) * 0.35;
        ctx.fillStyle = `rgba(170, 80, 200, ${0.16 * pulse})`;
        ctx.beginPath();
        ctx.ellipse(cx, cy, radius + 9 + Math.sin(frame * 0.09) * 2.5, radius * 1.15 + 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Secondary inner glow layer (brighter pink-purple)
        ctx.fillStyle = `rgba(204, 102, 238, ${0.22 * pulse})`;
        ctx.beginPath();
        ctx.ellipse(cx, cy - 1, radius + 3 + Math.sin(frame * 0.11) * 1.5, radius * 1.05, 0, 0, Math.PI * 2);
        ctx.fill();

        // Main blob body - organic purple/pink with slight vertical melt squish (tall to respect original h)
        const meltPhase = s.wx * 0.015 + frame * 0.075;
        const melt = Math.sin(meltPhase) * 2.8;
        const blobH = radius * 1.18 + melt * 0.4; // slight melt stretch on height
        ctx.fillStyle = '#3a1a2a';
        ctx.beginPath();
        ctx.ellipse(cx, cy + melt * 0.25, radius * 0.98, blobH, 0, 0, Math.PI * 2);
        ctx.fill();

        // Secondary blob lobe (left side, offset for blobby shape)
        ctx.fillStyle = '#4a2233';
        ctx.beginPath();
        ctx.ellipse(cx - 4.5, cy - 1 + melt * 0.6, radius * 0.72, radius * 0.92 + melt * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Right + lower drip lobe (melting organic feel)
        ctx.beginPath();
        ctx.ellipse(cx + 4, cy + 3 + melt * 0.8, radius * 0.65, radius * 0.78 + melt * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Bright glowing core (vibrant purple-pink, pulsing)
        ctx.fillStyle = '#cc66ee';
        ctx.beginPath();
        ctx.ellipse(cx - 1, cy - 2 + melt * 0.15, radius * 0.42, radius * 0.48, 0, 0, Math.PI * 2);
        ctx.fill();

        // Hotter inner core highlight
        ctx.fillStyle = '#ff88cc';
        ctx.beginPath();
        ctx.arc(cx - 2, cy - 3, radius * 0.22, 0, Math.PI * 2);
        ctx.fill();

        // Melting surface drips / vents (animated pink goo-like drips that bob downward)
        ctx.fillStyle = 'rgba(255, 136, 204, 0.75)';
        for (let d = 0; d < 2; d++) {
          const dPhase = frame * 0.09 + s.wx * 0.02 + d * 2.1;
          const dripY = cy + radius * 0.55 + Math.sin(dPhase) * 3.5 + d * 3;
          const dripW = 2.8 + (d % 2);
          ctx.beginPath();
          ctx.ellipse(cx - 5 + d * 9, dripY, dripW, 4.5 + Math.sin(dPhase * 1.3) * 1.2, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Rising vapor / bubble accents (melting "bubbles" drifting upward, pink-purple)
        ctx.fillStyle = 'rgba(204, 102, 238, 0.65)';
        for (let e = 0; e < 3; e++) {
          const ePhase = frame * 0.065 + e * 1.7 + s.wx * 0.01;
          const ex = cx + Math.sin(ePhase) * (radius * 0.7 + 2);
          const ey = cy - 6 - ((ePhase * 1.8) % (radius * 1.1)); // slow rise with wrap for continuous melt vapor
          ctx.beginPath();
          ctx.arc(ex, ey, 1.1 + (e % 2) * 0.6, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // === MONSTER SLIMEBALLS (bubbling purple from glowing blobs/enemies; twice size)
      for (let pr of projectiles) {
        const sx = pr.wx - scrollX;
        const sy = pr.y;
        if (sx < -30 || sx > W + 30) continue;
        if (window.NeonDashSprites && NeonDashSprites.drawShot(ctx, 'slime', sx, sy, frame, 24, 24, pr.vx, pr.vy)) continue;

        const r = 8 + Math.sin(frame * 0.22 + sx) * 0.8; // twice size

        // Outer purple slime glow
        ctx.fillStyle = 'rgba(160, 70, 210, 0.3)';
        ctx.beginPath();
        ctx.arc(sx, sy, r + 4, 0, Math.PI * 2);
        ctx.fill();

        // Main bubbling slimeball body (purple-pink)
        ctx.fillStyle = '#aa66ff';
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();

        // Bubbles inside (pulsing lighter)
        ctx.fillStyle = '#ff77cc';
        for (let b = 0; b < 3; b++) {
          const bp = frame * 0.15 + b * 2.1 + sx;
          const bx = sx + Math.sin(bp) * r * 0.35;
          const by = sy + Math.cos(bp * 0.7) * r * 0.25;
          ctx.beginPath();
          ctx.arc(bx, by, 1.5 + Math.sin(bp) * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Core
        ctx.fillStyle = '#dd99ff';
        ctx.beginPath();
        ctx.arc(sx - 0.5, sy - 0.5, r * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }

      // === LEVEL EXIT LADDER + PORTAL (appears after ~1000 distance) ===
      if (levelExit) {
        const lx = levelExit.wx - scrollX;
        const baseY = levelExit.baseY;

        // Tall ladder structure (at least 60% of level height when end spawns)
        ctx.strokeStyle = '#334c66';
        ctx.lineWidth = 3;
        // Left rail
        ctx.beginPath();
        ctx.moveTo(lx - 9, baseY);
        ctx.lineTo(lx - 9, baseY - 320);
        ctx.stroke();
        // Right rail
        ctx.beginPath();
        ctx.moveTo(lx + 9, baseY);
        ctx.lineTo(lx + 9, baseY - 320);
        ctx.stroke();

        // Rungs (more rungs for taller ladder)
        ctx.strokeStyle = '#2a4157';
        ctx.lineWidth = 2;
        for (let r = 0; r < 19; r++) {
          const ry = baseY - 12 - r * 16;
          ctx.beginPath();
          ctx.moveTo(lx - 8, ry);
          ctx.lineTo(lx + 8, ry);
          ctx.stroke();
        }

        // Top platform / arch (higher)
        ctx.fillStyle = '#1f3347';
        ctx.fillRect(lx - 16, baseY - 323, 32, 7);

        // Glowing cyan portal / rift at the top - now BADASS enhanced: larger concentric swirling glowing segments, lightning bolts (harmless, frame-timed)
        const portalY = baseY - 305;
        if (!(window.NeonDashSprites && NeonDashSprites.drawPortal(ctx, lx, portalY, frame))) {
        const px = lx;
        const py = portalY;
        const baseRx = 50;
        const baseRy = 72;
        const pulse = Math.sin(frame * 0.27) * 2 + 3;
        // Outer pulsing fill glow (larger)
        ctx.save();
        ctx.shadowColor = '#66ddff';
        ctx.shadowBlur = 28;
        ctx.fillStyle = '#4fb8ff';
        ctx.beginPath();
        ctx.ellipse(px, py, baseRx + pulse, baseRy + pulse * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // Inner core rift (brighter, larger)
        ctx.fillStyle = '#aaddff';
        ctx.beginPath();
        ctx.ellipse(px, py - 1, baseRx * 0.55, baseRy * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#eeffff';
        ctx.beginPath();
        ctx.ellipse(px, py - 2, baseRx * 0.28, baseRy * 0.38, 0, 0, Math.PI * 2);
        ctx.fill();
        // Concentric swirling glowing segments (5 layers, different speeds/dirs, dashed for rift effect)
        for (let i = 0; i < 5; i++) {
          const rot = (frame * (0.013 + i * 0.0075) * ((i % 2) ? 1 : -1)) % (Math.PI * 2);
          const rx = baseRx + i * 3.5 + Math.sin(frame * 0.11 + i) * 1.2;
          const ry = baseRy + i * 2.8 + Math.cos(frame * 0.09 + i) * 0.9;
          const alpha = 0.28 + 0.12 * (1 - i / 5) + Math.sin(frame * 0.2 + i) * 0.08;
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(rot);
          ctx.strokeStyle = `rgba(120, 200, 255, ${alpha})`;
          ctx.lineWidth = 1.8 + (4 - i) * 0.4;
          ctx.beginPath();
          ctx.ellipse(0, i * 1.2, rx, ry, 0, 0, Math.PI * 2);
          ctx.stroke();
          // Animated dashed swirl segments on odd layers
          if (i % 2 === 1) {
            ctx.setLineDash([3, 5]);
            ctx.lineDashOffset = -frame * (1.2 + i * 0.6) * ((i % 4 < 2) ? 1 : -1);
            ctx.strokeStyle = `rgba(180, 230, 255, ${alpha * 0.7})`;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.ellipse(0, i * 1.2, rx * 0.98, ry * 0.98, 0, 0, Math.PI * 1.1);
            ctx.stroke();
            ctx.setLineDash([]);
          }
          ctx.restore();
        }
        // Subtle rim
        ctx.strokeStyle = '#88eeff';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.ellipse(px, py, baseRx + 1, baseRy + 1, 0, 0, Math.PI * 2);
        ctx.stroke();
        // Harmless lightning bolts (occasional, jagged, 3-pass glow; timed ~every 47 frames, duration ~8; biased upward/outward)
        const boltCycle = 47;
        const boltDur = 8;
        const phase = frame % boltCycle;
        if (phase < boltDur) {
          const numBolts = 1 + ((frame / 23) | 0) % 3;
          for (let b = 0; b < numBolts; b++) {
            const spread = (b - (numBolts - 1) / 2) * 0.55;
            const ang = -1.65 + spread;
            const tPhase = frame * 0.9 + b * 2.3;
            ctx.strokeStyle = 'rgba(180, 230, 255, 0.45)';
            ctx.lineWidth = 3.8;
            ctx.beginPath();
            let cx = px + Math.cos(ang) * 8;
            let cy = py - 4;
            ctx.moveTo(cx, cy);
            for (let k = 1; k <= 5; k++) {
              const j = Math.sin(tPhase + k * 1.7) * (7 + b);
              const len = 42 + k * 2;
              cx += Math.cos(ang) * len + j * Math.cos(ang + 1.57) * 0.6;
              cy += Math.sin(ang) * len + j * Math.sin(ang + 1.57) * 0.6;
              ctx.lineTo(cx, cy);
            }
            ctx.stroke();
            ctx.strokeStyle = '#aaddff';
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.strokeStyle = '#eeffff';
            ctx.lineWidth = 0.9;
            ctx.stroke();
          }
        }
        }

        // Alien Neon Control Zone (Imagine sprite; door block still uses world coords)
        const bx = lx + 48;
        const by = baseY;
        if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'build', bx - 28, by - 210, 100, 210))) {
          ctx.fillStyle = '#0f1a2a';
          ctx.fillRect(bx, by - 170, 42, 145);
          ctx.strokeStyle = '#ffcc66';
          ctx.strokeRect(bx, by - 170, 42, 145);
        }
        ctx.fillStyle = '#ffdd88';
        ctx.font = 'bold 10px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Neon Control Zone', bx + 21, by - 214);

        // Golden floating pyramid NPC emerges from door if approached (blocks further progress)
        if (endPyramid) {
          const bob = Math.sin(endPyramid.phase || 0) * 5;
          const npcX = endPyramid.wx - scrollX;
          const drawY = endPyramid.y - bob;
          if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'pyramid', npcX - 26, drawY - 30, 52, 52))) {
          ctx.fillStyle = '#ffcc55';
          ctx.strokeStyle = '#ddaa33';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(npcX - 20, drawY + 14);
          ctx.lineTo(npcX + 20, drawY + 14);
          ctx.lineTo(npcX, drawY - 26);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(npcX - 7, drawY - 6, 6, 4.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(npcX + 7, drawY - 6, 6, 4.5, 0, 0, Math.PI * 2);
          ctx.fill();
          }
          // Speech bubble (same mechanic, emerges when player approaches door)
          const onScreen = npcX > -50 && npcX < W + 50;
          if (endPyramid.approached && onScreen) {
            const boxW = 265;
            const boxH = 48;
            const boxX = Math.max(20, Math.min(W - boxW - 20, npcX - boxW / 2));
            const boxY = Math.max(12, drawY - 72);
            ctx.fillStyle = 'rgba(18, 25, 38, 0.92)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#aaddff';
            ctx.lineWidth = 1.6;
            ctx.strokeRect(boxX, boxY, boxW, boxH);
            ctx.fillStyle = '#ccddff';
            ctx.font = '11px Segoe UI, Arial';
            ctx.textAlign = 'center';
            ctx.fillText('There\'s so much chaos in here!', boxX + boxW / 2, boxY + 14);
            ctx.fillText('I cant let you in right now, get to the next level!', boxX + boxW / 2, boxY + 30);
            ctx.strokeStyle = '#88bbdd';
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.moveTo(boxX + boxW / 2, boxY + boxH);
            ctx.lineTo(npcX, drawY - 5);
            ctx.stroke();
          }
        }
      }

      // === END SLIMEBALLS (near-exit hazard; bubbling purple, twice size; repurposed visuals)
      for (let fb of endFireballs) {
        const sx = fb.wx - scrollX;
        const sy = fb.y;
        if (sx < -20 || sx > W + 40) continue;
        if (window.NeonDashSprites && NeonDashSprites.drawShot(ctx, 'slime', sx + 4, sy + 2, frame, 24, 24, fb.vx, fb.vy)) continue;

        const r = 9; // twice size base

        // Outer purple glow
        ctx.fillStyle = 'rgba(170, 80, 220, 0.3)';
        ctx.beginPath();
        ctx.arc(sx + 4, sy + 1.5, r + 4, 0, Math.PI * 2);
        ctx.fill();

        // Main slimeball
        ctx.fillStyle = '#aa66ff';
        ctx.beginPath();
        ctx.arc(sx + 4, sy + 2, r, 0, Math.PI * 2);
        ctx.fill();

        // Bubbles
        ctx.fillStyle = '#ff88cc';
        for (let b = 0; b < 2; b++) {
          const bp = frame * 0.1 + b * 3 + sx;
          const bx = sx + 4 + Math.sin(bp) * 3;
          const by = sy + 1 + Math.cos(bp) * 2;
          ctx.beginPath();
          ctx.arc(bx, by, 1.8 + Math.sin(bp) * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }

        // Core
        ctx.fillStyle = '#cc99ff';
        ctx.beginPath();
        ctx.arc(sx + 5, sy + 1, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // === NEON ORBS (dark blue + green glowing collectibles) ===
      for (let orb of neonOrbs) {
        const sx = orb.wx - scrollX;
        const sy = orb.y;
        if (sx < -25 || sx > W + 25) continue;

        const isGreen = (orb.value === 5);
        const pulse = Math.sin(frame * 0.12 + orb.phase) * (isGreen ? 1.5 : 1.2);
        const orbR = isGreen ? 12 : 11;
        if (window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, isGreen ? 'orbGreen' : 'orb', sx + 3 - orbR, sy - orbR, orbR * 2, orbR * 2)) { continue; }

        if (isGreen) {
          // Green glowing tall neon bar (faster, worth 5; thin vertical rect + inner glow + top highlight; pulse on height)
          const barW = 3.2;
          const baseH = 15;
          const barH = baseH + pulse * 0.7;
          const bx = sx + 1.5;
          const by = sy - barH / 2;
          // Soft outer glow (wider low-alpha rect for neon effect)
          ctx.fillStyle = 'rgba(60, 220, 120, 0.30)';
          ctx.fillRect(bx - 2.5, by - 1, barW + 5, barH + 2);
          // Main tall vertical bar
          ctx.fillStyle = '#33dd88';
          ctx.fillRect(bx, by, barW, barH);
          // Inner bright core highlight (thinner vertical)
          ctx.fillStyle = '#aaffcc';
          ctx.fillRect(bx + 0.6, by + 1, barW * 0.35, barH - 3);
          // Small top cap highlight for glow
          ctx.fillStyle = 'rgba(220, 255, 235, 0.95)';
          ctx.fillRect(bx, by - 1.2, barW, 2.8);
        } else {
          // Standard dark blue tall neon bar (worth 1; thin vertical rect + inner glow + top highlight; pulse on height)
          const barW = 3.0;
          const baseH = 14;
          const barH = baseH + pulse * 0.55;
          const bx = sx + 1.5;
          const by = sy - barH / 2;
          // Soft outer glow (wider low-alpha rect for neon effect)
          ctx.fillStyle = 'rgba(40, 70, 160, 0.28)';
          ctx.fillRect(bx - 2.2, by - 1, barW + 4.4, barH + 2);
          // Main tall vertical bar
          ctx.fillStyle = '#2244aa';
          ctx.fillRect(bx, by, barW, barH);
          // Inner bright core highlight (thinner vertical)
          ctx.fillStyle = '#5588ff';
          ctx.fillRect(bx + 0.5, by + 1, barW * 0.35, barH - 3);
          // Small top cap highlight for glow
          ctx.fillStyle = 'rgba(180, 210, 255, 0.95)';
          ctx.fillRect(bx, by - 1.2, barW, 2.6);
        }
      }

      // === SHIELD POWERUP (diamond core + glowing bubble shield) ===
      if (powerUp) {
        const pux = powerUp.wx - scrollX;
        const puy = powerUp.y;
        if (window.NeonDashSprites && NeonDashSprites.drawPickup(ctx, pux, puy, 38, frame)) {
        } else {
        const pulse = Math.sin(frame * 0.18) * 2.2;

        ctx.save();

        // Soft cyan bubble shield around diamond (reads as "shield" at game scale)
        const bubbleR = 14 + pulse * 0.35;
        ctx.shadowColor = '#44ccff';
        ctx.shadowBlur = 12 + pulse * 0.8;
        const bubbleGrad = ctx.createRadialGradient(pux - 2, puy - 3, 1, pux, puy, bubbleR);
        bubbleGrad.addColorStop(0, 'rgba(120, 230, 255, 0.28)');
        bubbleGrad.addColorStop(0.55, 'rgba(60, 180, 255, 0.12)');
        bubbleGrad.addColorStop(1, 'rgba(40, 150, 255, 0.03)');
        ctx.fillStyle = bubbleGrad;
        ctx.beginPath();
        ctx.arc(pux, puy, bubbleR, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(130, 230, 255, 0.8)';
        ctx.lineWidth = 1.7;
        ctx.beginPath();
        ctx.arc(pux, puy, bubbleR, 0, Math.PI * 2);
        ctx.stroke();
        // Glass highlight arc
        ctx.strokeStyle = 'rgba(210, 250, 255, 0.55)';
        ctx.lineWidth = 1.15;
        ctx.shadowBlur = 3;
        ctx.beginPath();
        ctx.arc(pux - 1.5, puy - 2, bubbleR * 0.7, -Math.PI * 0.9, -Math.PI * 0.2);
        ctx.stroke();

        // Diamond core (glowing cyan/chrome shield emblem)
        ctx.shadowColor = '#66bbdd';
        ctx.shadowBlur = 14 + pulse * 0.7;
        const s = 9 + pulse * 0.25;

        ctx.fillStyle = '#5599bb';
        ctx.beginPath();
        ctx.moveTo(pux, puy - s * 1.1);           // top center
        ctx.lineTo(pux + s * 0.85, puy - s * 0.35);
        ctx.lineTo(pux + s * 0.75, puy + s * 0.65);
        ctx.lineTo(pux, puy + s * 1.15);          // bottom point
        ctx.lineTo(pux - s * 0.75, puy + s * 0.65);
        ctx.lineTo(pux - s * 0.85, puy - s * 0.35);
        ctx.closePath();
        ctx.fill();

        // Brighter edge highlight
        ctx.strokeStyle = '#88ccee';
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // Inner detail (small cross / emblem)
        ctx.fillStyle = '#aaddff';
        ctx.fillRect(pux - 1.5, puy - 4, 3, 1.2);
        ctx.fillRect(pux - 1, puy - 6, 2, 5);

        ctx.restore();
        }
      }

      // === ICE POWERUP (snowflake icon, rapid white/blue glow — visual only) ===
      if (icePowerUp) {
        // Center on former 12×12 cube so hitbox stays aligned
        const icx = icePowerUp.wx - scrollX + 6;
        const icy = icePowerUp.y + 6;
        // Fast white ↔ blue oscillation (soft dreamy neon, not harsh)
        const t = frame * 0.48;
        const blend = 0.5 + 0.5 * Math.sin(t); // 0 = blue, 1 = white
        const r = Math.floor(140 + 115 * blend);
        const g = Math.floor(190 + 65 * blend);
        const b = 255;
        const glowColor = `rgb(${r},${g},${b})`;
        const pulse = 0.65 + 0.35 * Math.sin(t * 1.15);
        const size = 7.2;

        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Soft outer halo
        ctx.globalAlpha = 0.12 + 0.1 * pulse;
        ctx.fillStyle = glowColor;
        ctx.beginPath();
        ctx.arc(icx, icy, size + 5.5, 0, Math.PI * 2);
        ctx.fill();

        // Snowflake arms + glow
        ctx.globalAlpha = 0.78 + 0.22 * pulse;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 10 + pulse * 12;
        ctx.strokeStyle = glowColor;
        ctx.lineWidth = 1.35;
        ctx.beginPath();
        for (let a = 0; a < 6; a++) {
          const ang = a * Math.PI / 3;
          const cos = Math.cos(ang);
          const sin = Math.sin(ang);
          // main arm
          ctx.moveTo(icx, icy);
          ctx.lineTo(icx + cos * size, icy + sin * size);
          // mid branches
          const mx = icx + cos * size * 0.52;
          const my = icy + sin * size * 0.52;
          const br = size * 0.34;
          ctx.moveTo(mx, my);
          ctx.lineTo(mx + Math.cos(ang + 0.85) * br, my + Math.sin(ang + 0.85) * br);
          ctx.moveTo(mx, my);
          ctx.lineTo(mx + Math.cos(ang - 0.85) * br, my + Math.sin(ang - 0.85) * br);
          // tip V
          const tx = icx + cos * size * 0.78;
          const ty = icy + sin * size * 0.78;
          const tip = size * 0.22;
          ctx.moveTo(tx, ty);
          ctx.lineTo(tx + Math.cos(ang + 0.7) * tip, ty + Math.sin(ang + 0.7) * tip);
          ctx.moveTo(tx, ty);
          ctx.lineTo(tx + Math.cos(ang - 0.7) * tip, ty + Math.sin(ang - 0.7) * tip);
        }
        ctx.stroke();

        // Bright core (reads at small size)
        ctx.shadowBlur = 8 + pulse * 6;
        ctx.fillStyle = `rgba(255,255,255,${0.55 + 0.4 * blend})`;
        ctx.beginPath();
        ctx.arc(icx, icy, 1.7 + pulse * 0.35, 0, Math.PI * 2);
        ctx.fill();

        // Soft white rim pass for dreamy contrast on blue frames
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 0.35 + 0.45 * blend;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 0.85;
        ctx.beginPath();
        for (let a = 0; a < 6; a++) {
          const ang = a * Math.PI / 3;
          ctx.moveTo(icx, icy);
          ctx.lineTo(icx + Math.cos(ang) * size * 0.72, icy + Math.sin(ang) * size * 0.72);
        }
        ctx.stroke();

        ctx.restore();
      }

      // draw player cube
      const px = player.wx - scrollX;
      const py = player.y;

      // soft drop shadow
      ctx.fillStyle = 'rgba(0, 20, 40, 0.45)';
      ctx.fillRect(px + 5, GROUND_Y - 1, player.w - 3, 5);

      if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'player', px, py, player.w, player.h))) {
      // main cube body (bright cyan)
      ctx.fillStyle = '#5fd0ff';
      ctx.fillRect(px, py, player.w, player.h);

      // top face highlight (cube shading)
      ctx.fillStyle = '#a8e8ff';
      ctx.fillRect(px + 2, py + 2, player.w - 4, 5);

      // left face highlight
      ctx.fillRect(px + 2, py + 2, 4, player.h - 4);

      // bottom-right bevel (shadow)
      ctx.fillStyle = '#1a8fb8';
      ctx.fillRect(px + player.w - 5, py + 5, 3, player.h - 6);
      ctx.fillRect(px + 5, py + player.h - 5, player.w - 8, 3);

      // crisp outline
      ctx.strokeStyle = '#0c3a4f';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(px + 0.75, py + 0.75, player.w - 1.5, player.h - 1.5);

      // small "light" dot on cube
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(px + 6, py + 5, 2, 2);
      }

      // === VISIBLE ENERGY SHIELD (mario-style power-up - absorbs 1 hit, then grants 5s invulnerability) ===
      if (player.hasShield) {
        const cx = px + player.w / 2;
        const cy = py + player.h / 2 + 1;
        if (!(window.NeonDashSprites && NeonDashSprites.drawShield(ctx, cx, cy, player.w, player.h, frame))) {
          const pulse = Math.sin(frame * 0.21) * 1.8;
          ctx.save();
          ctx.strokeStyle = '#66ddff';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.ellipse(cx, cy, player.w / 2 + 10 + pulse * 0.4, player.h / 2 + 13 + pulse * 0.5, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      // Subtle invulnerability afterglow (5 seconds after shield pops - no bubble, just faint protection indicator)
      if (!player.hasShield && frame < player.invulnUntil) {
        const cx = px + player.w / 2;
        const cy = py + player.h / 2 + 1;
        const remaining = (player.invulnUntil - frame) / 300;
        const pulse = Math.sin(frame * 0.18) * (1.5 + remaining * 2);

        ctx.save();
        ctx.strokeStyle = 'rgba(140, 200, 255, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 3;
        ctx.beginPath();
        ctx.ellipse(cx, cy, player.w / 2 + 6 + pulse, player.h / 2 + 8 + pulse, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // particles
      for (let p of particles) {
        const baseAlpha = (p.c === '#66ddff') ? 0.22 : 0.15;
        const alpha = Math.max(baseAlpha, p.life / (p.c === '#66ddff' ? 85 : 42));
        ctx.fillStyle = p.c || '#88ccdd';
        ctx.globalAlpha = alpha;

        const psize = p.size || 1.8;
        ctx.fillRect(p.x - scrollX, p.y, psize, psize);
      }
      ctx.globalAlpha = 1;

      // === ICE BLAST INDICATOR (glowing white snowflake that follows player when collected; single use) ===
      if (hasIceBlast) {
        const px = player.wx - scrollX;
        const py = player.y;
        const indX = px + player.w + 14 + Math.sin(frame * 0.13) * 3.5;
        const indY = py - 8 + Math.sin(frame * 0.09) * 2.5;
        const ipulse = 0.75 + Math.sin(frame * 0.18) * 0.35;
        const isize = 7 + ipulse * 1.5;

        ctx.save();
        ctx.globalAlpha = 0.85 + ipulse * 0.15;
        ctx.shadowColor = '#88bbff';
        ctx.shadowBlur = 10 + ipulse * 4;
        ctx.strokeStyle = '#ffffff';
        ctx.fillStyle = '#ccffff';
        ctx.lineWidth = 1.2;

        // 6-pointed snowflake / crystal using lines (pulsing)
        ctx.beginPath();
        for (let a = 0; a < 6; a++) {
          const ang = (a * Math.PI / 3) + frame * 0.01;
          const bx = indX + Math.cos(ang) * (isize * 0.3);
          const by = indY + Math.sin(ang) * (isize * 0.3);
          ctx.moveTo(bx, by);
          ctx.lineTo(indX + Math.cos(ang) * isize, indY + Math.sin(ang) * isize);
          // small branch arms
          const ba = ang + 0.7;
          ctx.moveTo(indX + Math.cos(ang) * (isize * 0.55), indY + Math.sin(ang) * (isize * 0.55));
          ctx.lineTo(indX + Math.cos(ba) * (isize * 0.35), indY + Math.sin(ba) * (isize * 0.35));
          const bb = ang - 0.7;
          ctx.moveTo(indX + Math.cos(ang) * (isize * 0.55), indY + Math.sin(ang) * (isize * 0.55));
          ctx.lineTo(indX + Math.cos(bb) * (isize * 0.35), indY + Math.sin(bb) * (isize * 0.35));
        }
        ctx.stroke();

        // center dot
        ctx.beginPath();
        ctx.arc(indX, indY, 1.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // Simple FPS counter (bottom right, only while playing) - helps verify the perf fixes from the two agents
      if (gameState === 'playing') {
        ctx.fillStyle = 'rgba(136, 153, 170, 0.7)';
        ctx.font = '9px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(Math.round(fps) + ' fps', W - 8, H - 8);
        ctx.textAlign = 'left';
      }

      // === UI OVERLAYS ===
      if (gameState === 'playing') {
        // (Water/acid vat tutorial removed - players remember from Level 2)

        // (second green tutorial box removed - no tutorial instructions)

        // (ice blaster tutorial box removed - no tutorial instructions; ice powerups still spawn 3x)

        // (stomp tutorial box removed - no tutorial instructions)

        // distance readout (top right)
        ctx.font = '700 13px Segoe UI, Arial';
        ctx.textAlign = 'right';
        ctx.fillStyle = '#77bbdd';
        ctx.fillText('DISTANCE', W - 18, 24);
        ctx.font = '700 22px Consolas, monospace';
        ctx.fillStyle = '#aaddff';
        ctx.fillText(String(baseScore + score).padStart(5, '0'), W - 18, 48);

        // small jump counter
        ctx.font = '11px Consolas, monospace';
        ctx.fillStyle = '#5588aa';
        ctx.fillText('JUMPS ' + jumpCount, W - 18, 66);

        // Neon Score (blue + green orbs collected)
        ctx.font = '700 13px Segoe UI, Arial';
        ctx.fillStyle = '#4466cc';
        ctx.fillText('NEON', W - 18, 84);
        ctx.font = '700 20px Consolas, monospace';
        ctx.fillStyle = '#6688ff';
        ctx.fillText(String(neonScore).padStart(3, '0'), W - 18, 104);

        // Level Progress bar (fills as player approaches the ending)
        const progress = Math.min(1, Math.max(0, player.wx / 6740));
        const barY = 8;
        const barW = 180;
        const barH = 5;

        // Background track
        ctx.fillStyle = 'rgba(30, 50, 90, 0.6)';
        ctx.fillRect(W / 2 - barW / 2, barY, barW, barH);

        // Neon fill
        ctx.fillStyle = '#66aaff';
        ctx.fillRect(W / 2 - barW / 2, barY, barW * progress, barH);

        // Subtle glow outline
        ctx.strokeStyle = 'rgba(120, 180, 255, 0.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(W / 2 - barW / 2 - 1, barY - 1, barW + 2, barH + 2);
      }

      if (gameState === 'start') {
        if (!(window.NeonDashSprites && NeonDashSprites.drawHudPlate(ctx, W, H))) {
          ctx.fillStyle = 'rgba(2, 7, 15, 0.48)';
          ctx.fillRect(W / 2 - 320, H / 2 - 150, 640, 300);
        }

        ctx.font = '700 36px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#88d4ff';
        ctx.fillText('NEON DASH', W / 2, H / 2 - 52);

        ctx.font = '13px Consolas, monospace';
        ctx.fillStyle = '#5a8fb8';
        ctx.fillText('FLORA HAZARD PROTOCOL', W / 2, H / 2 - 26);

        ctx.font = '13px Segoe UI, Arial';
        ctx.fillStyle = '#6699bb';
        ctx.fillText('ARROW KEYS OR A/D  —  MOVE', W / 2, H / 2 + 18);
        ctx.fillText('SPACE  —  JUMP TRIANGLES + MONSTERS', W / 2, H / 2 + 36);

        ctx.font = '12px Consolas, monospace';
        ctx.fillStyle = '#447799';
        ctx.fillText('PRESS SPACE OR CLICK TO START', W / 2, H / 2 + 72);
      }

      if (gameState === 'over') {
        if (!(window.NeonDashSprites && NeonDashSprites.drawHudPlate(ctx, W, H))) {
          ctx.fillStyle = 'rgba(3, 6, 12, 0.48)';
          ctx.fillRect(W / 2 - 320, H / 2 - 150, 640, 300);
        }

        ctx.font = '700 28px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#cc7766';
        ctx.fillText('COLLISION DETECTED', W / 2, H / 2 - 38);

        ctx.font = '15px Consolas, monospace';
        ctx.fillStyle = '#aaddff';
        ctx.fillText('DISTANCE TRAVELED: ' + String(baseScore + score).padStart(5, '0'), W / 2, H / 2 + 4);

        if (baseScore + score === best && baseScore + score > 0) {
          ctx.fillStyle = '#aaccdd';
          ctx.fillText('NEW PERSONAL BEST', W / 2, H / 2 + 24);
        } else if (best > 0) {
          ctx.fillStyle = '#6688aa';
          ctx.fillText('BEST: ' + String(best).padStart(5, '0'), W / 2, H / 2 + 24);
        }

        ctx.font = '12px Segoe UI, Arial';
        ctx.fillStyle = '#5588aa';
        ctx.fillText('PRESS R  OR  CLICK TO RESTART', W / 2, H / 2 + 58);
      }

      if (gameState === 'complete') {
        if (!(window.NeonDashSprites && NeonDashSprites.drawHudPlate(ctx, W, H))) {
          ctx.fillStyle = 'rgba(2, 6, 14, 0.48)';
          ctx.fillRect(W / 2 - 320, H / 2 - 150, 640, 300);
        }

        ctx.font = '700 32px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#66ddff';
        ctx.fillText('LEVEL COMPLETE', W / 2, H / 2 - 52);

        ctx.font = '15px Consolas, monospace';
        ctx.fillStyle = '#aaddff';
        ctx.fillText('DISTANCE TRAVELED: ' + String(baseScore + score).padStart(5, '0'), W / 2, H / 2 + 2);

        ctx.font = '13px Segoe UI, Arial';
        ctx.fillStyle = '#88bbdd';
        ctx.fillText('JUMPS: ' + jumpCount, W / 2, H / 2 + 24);

        ctx.font = '15px Consolas, monospace';
        ctx.fillStyle = '#88ffbb';
        ctx.fillText('NEON COLLECTED: ' + neonScore, W / 2, H / 2 + 48);

        if (baseScore + score === best) {
          ctx.fillStyle = '#aaccdd';
          ctx.fillText('NEW PERSONAL BEST!', W / 2, H / 2 + 72);
        }

        ctx.font = '12px Segoe UI, Arial';
        ctx.fillStyle = '#5588aa';
        ctx.fillText('PRESS R  OR  CLICK TO PLAY AGAIN', W / 2, H / 2 + 96);
      }
    }

    // Show/hide Level 5 replay link based on game state
    // NOTE: intentionally not called every frame anymore (DOM getElement+style in rAF was contributing to micro-lag/jank).
    function updateLevel3LinkVisibility() {
      const container = document.getElementById('level3-link-container');
      if (container) {
        container.style.display = (gameState === 'complete') ? 'block' : 'none';
      }
    }

    // Show/hide Next Level (L6) link based on game state
    function updateNextLevelLinkVisibility() {
      const container = document.getElementById('next-level-link-container');
      if (container) {
        container.style.display = (gameState === 'complete') ? 'block' : 'none';
      }
    }

    function gameLoop() {
      try {
        update();
        draw();
        // updateLevel3LinkVisibility() REMOVED from per-frame (was causing subtle DOM/reflow cost in rAF hot path).
        // Now called explicitly only on gameState transitions to 'complete'/'over'/'playing'.
      } catch (err) {
        console.error('[Neon Dash] gameLoop error:', err);
      } finally {
        requestAnimationFrame(gameLoop);
      }
    }

    function startPlaying() {
      getAudioCtx();
      if (gameState === 'start') {
        gameState = 'playing';
      } else if (gameState === 'over' || gameState === 'complete') {
        resetGame();
        gameState = 'playing';
      }
      updateLevel3LinkVisibility();
      updateNextLevelLinkVisibility();
    }

    // Save cumulative score when proceeding to Level 6 (so it carries over)
    function saveCumulativeForNextLevel() {
      try {
        const finalForThisLevel = baseScore + score;
        localStorage.setItem('neonDashCumulativeScore', String(finalForThisLevel));
        localStorage.setItem('neonDashCumulativeNeon', String(neonScore));
      } catch(e){}
    }

    function init() {
      loadBest();
      try {
        baseScore = parseInt(localStorage.getItem('neonDashCumulativeScore') || '0', 10) || 0;
        neonAtLevelStart = parseInt(localStorage.getItem('neonDashCumulativeNeon') || '0', 10) || 0;
      } catch(e) { baseScore = 0; neonAtLevelStart = 0; }
      resetGame();
      updateLevel3LinkVisibility();
      updateNextLevelLinkVisibility();

      // keyboard
      window.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        getAudioCtx();

        if (e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          if (gameState !== 'playing') {
            startPlaying();
          }
        }
        if (e.key === 'ArrowDown') {
          e.preventDefault(); // for ice blast detonation
        }
        if (e.key === 'm' || e.key === 'M') {
          toggleMute();
        }
        if ((e.key === 'r' || e.key === 'R') && (gameState === 'over' || gameState === 'complete')) {
          resetGame();
          gameState = 'playing';
          updateLevel3LinkVisibility();
          updateNextLevelLinkVisibility();
        }
      });

      window.addEventListener('keyup', (e) => {
        keys[e.key] = false;
      });

      // mouse / touch start
      canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        startPlaying();
      });
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startPlaying();
      }, { passive: false });

      // prevent space from scrolling page
      window.addEventListener('keydown', (e) => {
        if (e.key === ' ' && document.activeElement === document.body) {
          e.preventDefault();
        }
      });

      // initial draw
      draw();

      // kick off loop
      gameLoop();

      // Attach handler to next-level link to persist cumulative score (like previous levels)
      const nextLinkEl = document.getElementById('next-level-link');
      if (nextLinkEl) {
        nextLinkEl.addEventListener('click', saveCumulativeForNextLevel);
      }

      // subtle console note
      console.log('%c[NEON DASH LEVEL 5] Arrow keys / A D to move, Space to jump. Complete to unlock Level 6 (Deep Water).', 'color:#ff88cc');
    }

    // boot
    window.addEventListener('DOMContentLoaded', init);
  </script>
