<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a game</title>
  <link rel="stylesheet" href="assets/neon/chrome.css">
  <style>
    body {
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(1, 4, 9, 0.22) 0%, rgba(1, 4, 9, 0.55) 48%, rgba(1, 4, 9, 0.88) 100%),
        url("assets/sigma-ninja/sky.jpg") center top / cover no-repeat fixed,
        #010409;
    }

    .hub-header.header {
      justify-content: center;
      margin-top: 28px;
    }

    .hub-header .page-title {
      font-size: 22px;
      letter-spacing: 8px;
    }

    .hub-lede {
      max-width: 960px;
      margin: 14px auto 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: #ff8ae8;
      text-shadow: 0 0 10px rgba(255, 106, 224, 0.4);
    }

    .game-picker {
      max-width: 960px;
      margin: 28px auto 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .game-card {
      display: block;
      overflow: hidden;
      text-decoration: none;
      color: #e8fbff;
      border: 1px solid rgba(92, 232, 255, 0.28);
      box-shadow: 0 0 0 1px rgba(4, 16, 24, 0.8), 0 0 18px rgba(0, 190, 255, 0.16);
      background: #041018;
    }

    .game-card img {
      display: block;
      width: 100%;
      height: 240px;
      object-fit: cover;
      object-position: center top;
      filter: saturate(1.05) contrast(1.05);
    }

    .game-card-plate {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 16px 16px;
      background-color: #041018;
      background-image: url("assets/neon/ui-btn.jpg");
      background-position: center;
      background-repeat: no-repeat;
      background-size: 140% 220%;
    }

    .game-card-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9be8ff;
      text-shadow: 0 0 8px rgba(92, 232, 255, 0.5);
    }

    .game-card-blurb {
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ffd6f5;
      text-shadow: 0 0 8px rgba(255, 106, 224, 0.45);
    }

    .game-card:hover {
      border-color: rgba(255, 106, 224, 0.55);
      box-shadow: 0 0 22px rgba(255, 106, 224, 0.22);
    }

    .game-card:hover img {
      filter: brightness(1.12) saturate(1.15);
    }

    @media (max-width: 720px) {
      .game-picker { grid-template-columns: 1fr; }
      .hub-header .page-title { font-size: 16px; letter-spacing: 4px; }
    }
  </style>
</head>
<body>
  <div class="header hub-header">
    <div class="page-title">ARCADE <span>TWO GAMES</span></div>
  </div>

  <p class="hub-lede">Pick a game. Void Cube is the neon run. Sigma Ninja is the village tale.</p>

  <nav class="game-picker" aria-label="Game select">
    <a class="game-card" href="neon-worlds.html">
      <img src="assets/neon/sky-void.jpg" alt="">
      <span class="game-card-plate">
        <span class="game-card-name">Void Cube</span>
        <span class="game-card-blurb">Neon Dash • six-level run</span>
      </span>
    </a>
    <a class="game-card" href="sigma-ninja.html">
      <img src="assets/sigma-ninja/concept/IMG-20260913-WA8944.jpg" alt="">
      <span class="game-card-plate">
        <span class="game-card-name">Sigma Ninja</span>
        <span class="game-card-blurb">Village CYOA • arrow-key walk</span>
      </span>
    </a>
  </nav>
</body>
</html>
