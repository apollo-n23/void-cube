    function getAudioCtx() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) { /* silent fail on old browsers */ }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(freq, durationMs, type = 'sine', vol = 0.2, attackMs = 8, decayMs = 80) {
      const ctx = getAudioCtx();
      if (!ctx || muted) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = type;
      osc.frequency.value = freq;

      filter.type = 'lowpass';
      filter.frequency.value = Math.min(2800, freq * 3.5 + 400);

      const now = ctx.currentTime;
      const dur = durationMs / 1000;

      gain.gain.value = 0;
      gain.gain.linearRampToValueAtTime(vol * masterVol, now + (attackMs / 1000));
      gain.gain.linearRampToValueAtTime(0.0001, now + dur + 0.08);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + dur + 0.15);
    }

    function playNoise(durationMs, vol = 0.15, filterHz = 1200, type = 'lowpass') {
      const ctx = getAudioCtx();
      if (!ctx || muted) return;
      const bufferSize = Math.floor(ctx.sampleRate * (durationMs / 1000));
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = type;
      filter.frequency.value = filterHz;

      const now = ctx.currentTime;
      const dur = durationMs / 1000;
      gain.gain.value = vol * masterVol;
      gain.gain.linearRampToValueAtTime(0.0001, now + dur + 0.06);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + dur + 0.1);
    }

            list.arr.splice(i, 1);
          }
        }
      }
    }

    function checkCollision(p, o) {
      const ox = o.wx;
      const oh = o.h;
      const triLeft = ox - 14;
      const triRight = ox + 14;
      const triTop = GROUND_Y - oh;

      const pLeft = p.wx;
      const pRight = p.wx + p.w;
      const pTop = p.y;
      const pBottom = p.y + p.h;

      // x overlap
      if (pRight < triLeft || pLeft > triRight) return false;

      // if cube bottom is low enough to hit the triangle body
      if (pBottom > triTop + 3) {
        // rough center check for the slope area
        const mid = (triLeft + triRight) / 2;
        const dx = Math.abs((pLeft + pRight) / 2 - mid);
        const allowedExtra = (oh / 2.4);
        if (dx < 11 + allowedExtra) return true;
      }
      return false;
    }

    // Ensures lava traps (waterGaps), triangle obstacles, lowWalls and trampolines
    // never spawn on top of (overlapping x-ranges) or directly beside each other.
    // Edge-to-edge min distance enforced (60px: player w~26 + margin).
    // Used before any obs or waterGap push (and for consistency in low/tramp).
    // Checks against ALL of the relevant existing arrays; bidirectional.
    function wouldBeTooCloseToHazards(newLeft, newRight, minSep) {
      // vs waterGaps (lava/acid pits)
      for (let g of waterGaps) {
        const gLeft = g.wx;
        const gRight = g.wx + g.width;
        const dist = Math.max(0, Math.max(newLeft - gRight, gLeft - newRight));
        if (dist < minSep) return true;
      }
      // vs obstacles (ground triangles) - use accurate collision width
      for (let o of obstacles) {
        const oLeft = o.wx - 14;
        const oRight = o.wx + 14;
        const dist = Math.max(0, Math.max(newLeft - oRight, oLeft - newRight));
        if (dist < minSep) return true;
      }
      // vs lowWalls (for consistency)
      for (let w of lowWalls) {
        const wLeft = w.wx;
        const wRight = w.wx + (w.width || 20);
        const dist = Math.max(0, Math.max(newLeft - wRight, wLeft - newRight));
        if (dist < minSep) return true;
      }
      // vs trampolines (prevent new hazards directly under/beside)
      for (let t of trampolines) {
        const tLeft = t.wx;
        const tRight = t.wx + (t.width || 40);
        const dist = Math.max(0, Math.max(newLeft - tRight, tLeft - newRight));
        if (dist < minSep) return true;
      }
      return false;
    }

    // Ground spikes (obstacles) must never sit on trampolines (x overlap + small visual pad).
    function spikeOverlapsAnyTrampoline(spikeWX, patrolAmp) {
      const amp = patrolAmp || 0;
      const pad = 10;
      const sLeft = spikeWX - 14 - amp - pad;
      const sRight = spikeWX + 14 + amp + pad;
      for (let t of trampolines) {
        const tLeft = t.wx;
        const tRight = t.wx + (t.width || 40);
        if (sRight > tLeft && sLeft < tRight) return true;
      }
      return false;
    }
    function trampolineOverlapsAnySpike(tWX, tW) {
      const pad = 10;
      const tLeft = tWX - pad;
      const tRight = tWX + tW + pad;
      for (let o of obstacles) {
        const amp = o.patrolAmp || 0;
        const oLeft = o.wx - 14 - amp;
        const oRight = o.wx + 14 + amp;
        if (tRight > oLeft && tLeft < oRight) return true;
      }
      return false;
    }

    function update() {
      if (gameState !== 'playing') return;

      frame++;

      // movement input with smoothing + slight auto-advance bias
      let ax = 0;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) ax -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) ax += 1;

      player.vx = player.vx * 0.78 + ax * 5.4 * 0.22;

      // gentle forward bias so the run keeps going
      if (ax >= 0) player.vx += 0.055;

      player.vx = Math.max(-3.2, Math.min(5.4, player.vx));
      player.wx += player.vx;

      // Ice blast detonation (down arrow) - single use, kills onscreen enemies/triangles/projectiles
      if (keys['ArrowDown'] && hasIceBlast && gameState === 'playing') {
        detonateIceBlast();
        keys['ArrowDown'] = false;
      }

      // === ACTIVE END BOSS PHYSICS + AI (bouncing foreground boss; only while active) ===
      // Simple platformer physics + chase player + ground bounce. Parallax 1.0 handled in draw (full scrollX).
      // Boss behaviors/AI/movement/sounds/particles 100% preserved. NEW RULE (boss fight only): the ONLY way to die while endBoss && !bossDefeated && gameState==='playing' (inBossFight) is if boss lands directly on top and crushes (see END BOSS COLLISIONS). All lava, darts, projectiles, enemy hits, boss side-taps suppressed (see guarded death paths).
      if (endBoss && !bossDefeated && gameState === 'playing') {
        const gravity = 0.52;
        endBoss.vy += gravity;
        endBoss.y += endBoss.vy;

        // Ground hit: bounce with random height variation (8-14), but only once per 3 seconds (180 frames) to give player time to evade/attack
        if (endBoss.y + 4 >= GROUND_Y - 16) {
          endBoss.y = GROUND_Y - 18;
          if (frame - (endBoss.lastBounce || 0) > 180) {
            endBoss.vy = - (8 + Math.random() * 6);  // variation for lively bounce
            endBoss.lastBounce = frame;
            // Red impact / ember particles on bounce (glow when hitting ground)
            for (let i = 0; i < 9; i++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 0.9 + Math.random() * 2.8;
              particles.push({
                x: endBoss.wx + 15 + Math.random() * 32,
                y: endBoss.y + 6,
                vx: (Math.random() - 0.5) * sp * 1.6,
                vy: -0.8 - Math.random() * 1.6,
                life: 16 + Math.random() * 14,
                c: (Math.random() < 0.55 ? '#ff5533' : '#cc3311'),
                size: 1.6 + Math.random() * 1.1
              });
            }
          } else {
            endBoss.vy = 0;  // stay grounded during cooldown
          }
        }

        // AI: try to land on player (vx toward player) + jitter/oscillation for "bounce around"
        const dir = Math.sign(player.wx - endBoss.wx) || 1;
        let targetSpeed = dir * (1.7 + Math.random() * 0.7);  // 1.5-2.5 range
        // slight oscillation/jitter
        targetSpeed += Math.sin(frame * 0.095 + (endBoss.wx * 0.02)) * 0.55;
        endBoss.vx = endBoss.vx * 0.65 + targetSpeed * 0.35;
        endBoss.wx += endBoss.vx;

        // keep roughly in view / reasonable chase range (avoid too far left of player during fight)
        if (endBoss.wx < player.wx - 280) endBoss.wx = player.wx - 280;
      }

      // clamp left bound
      if (player.wx < 40) {
        player.wx = 40;
        player.vx = Math.max(0, player.vx);
      }

      // === LOW WALL / BARRIER COLLISION (blocks movement but does not kill - must jump over) ===
      for (let wall of lowWalls) {
        const wallLeft = wall.wx;
        const wallRight = wall.wx + wall.width;
        const wallTop = GROUND_Y - wall.height;

        if (player.wx + player.w > wallLeft && player.wx < wallRight) {
          if (player.y + player.h > wallTop) {
            // Player is too low - block horizontally
            if (player.vx > 0) {
              player.wx = wallLeft - player.w - 0.5;
            } else if (player.vx < 0) {
              player.wx = wallRight + 0.5;
            }
            player.vx = 0;
          }
        }
      }

      // Compute if currently over a lava pit (for physics, landing, etc.)
      let overWaterGap = false;
      for (let gap of waterGaps) {
        if (player.wx + player.w > gap.wx && player.wx < gap.wx + gap.width) {
          overWaterGap = true;
          break;
        }
      }

      // Reset lava exposure state if player is no longer over a pit
      if (!overWaterGap) {
        player.drowningStart = 0;
      }

      // Clear "in boss fight" flag used to guard ALL non-crush deaths while boss active.
      // inBossFight === (endBoss exists && !bossDefeated && gameState==='playing')
      const inBossFight = endBoss && !bossDefeated && gameState === 'playing';

      // === VERTICAL ENEMY COLLISION (deadly up/down aliens) ===
      for (let e of verticalEnemies) {
        const ex = e.wx;
        const ey = e.y;
        // Simple AABB for the creature body
        if (player.wx + player.w > ex - 14 && player.wx < ex + 14 &&
            player.y + player.h > ey - 18 && player.y < ey + 18) {
          if (inBossFight) {
            // Suppressed during boss fight: ONLY boss crush (direct land on top) kills the player. Vertical enemy contact does nothing (no death, no playDeath).
          } else {
            gameState = 'over';
            playDeath('hazard');
            spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
          }
          break;
        }
      }

      // === LAVA PTERO COLLISION (flying reptile birds - AABB hit kills player unless shield/invuln; reuse logic)
      for (let i = pteros.length - 1; i >= 0; i--) {
        const p = pteros[i];
        const pLeft = p.wx;
        const pRight = p.wx + 28;
        const pTop = p.y - 6;
        const pBottom = p.y + 14;
        const playerLeft = player.wx;
        const playerRight = player.wx + player.w;
        const playerTop = player.y;
        const playerBottom = player.y + player.h;
        if (playerRight > pLeft && playerLeft < pRight && playerBottom > pTop && playerTop < pBottom) {
          const now = frame;
          if (inBossFight) {
            // During boss fight (inBossFight): ptero hit is non-lethal. Only the boss landing directly on top crushes/kills player. No death, no shield pop.
          } else if (now < player.invulnUntil) {
            // protected
          } else if (player.hasShield) {
            player.hasShield = false;
            playShieldPop();
            player.invulnUntil = now + 300;
            for (let k = 0; k < 18; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1.6 + Math.random() * 3.0;
              particles.push({
                x: player.wx + 13, y: player.y + 13,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.6,
                life: 26 + Math.random() * 16, c: '#ff6622', size: 1.8
              });
            }
          } else {
            gameState = 'over';
            playDeath('ptero');
            spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
          }
          pteros.splice(i, 1);
          break;
        }
      }

      // Lava fireball collision (deadly erupting fireballs from lava pits)
      for (let i = poisonDarts.length - 1; i >= 0; i--) {
        const dart = poisonDarts[i];
        if (player.wx + player.w > dart.wx - 4 && player.wx < dart.wx + 4 &&
            player.y + player.h > dart.y - 3 && player.y < dart.y + 9) {
          const now = frame;
          if (inBossFight) {
            // During boss fight: lava fireballs (poisonDarts) non-lethal. Splice/remove only; no death, NO shield pop. (Only boss direct crush kills.)
            poisonDarts.splice(i, 1);
          } else if (now < player.invulnUntil) {
            // Fully protected during 5-second post-shield grace period
            poisonDarts.splice(i, 1);
          } else if (player.hasShield) {
            player.hasShield = false;
            playShieldPop();
            player.invulnUntil = now + 300; // 5 seconds invulnerability after shield pops
            for (let k = 0; k < 22; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1.8 + Math.random() * 3.2;
              particles.push({
                x: player.wx + 13, y: player.y + 13,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.7,
                life: 28 + Math.random() * 18, c: '#66ddff', size: 2.0
              });
            }
            poisonDarts.splice(i, 1);
          } else {
            gameState = 'over';
            playDeath('lava');
            spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
            poisonDarts.splice(i, 1);
            break;
          }
        }
      }

      // === INVISIBLE BARRIER AT LEVEL END (prevents running past the ladder) ===
      if (levelExit) {
        const maxWX = levelExit.wx + 14;
        if (player.wx > maxWX) {
          player.wx = maxWX;
          player.vx = 0;
        }
      }

      // === VISIBLE LADDER CLIMB (executes only when triggered; ends level at portal) ===
      if (player.isClimbing && gameState === 'playing') {
        player.climbProgress = (player.climbProgress || 0) + 0.0198;
        if ((frame % 7) === 0) playLadderStep();
        const t = Math.min(1, player.climbProgress);

        if (levelExit) {
          if (player.climbStartY === undefined) player.climbStartY = player.y;
          if (player.climbTargetY === undefined) player.climbTargetY = levelExit.baseY - 305; // tall portal (60%+ of level height)

          player.y = player.climbStartY + (player.climbTargetY - player.climbStartY) * t;
          player.wx = levelExit.wx - 4; // stick to ladder center for nice visual climb
        }

        player.vx = 0;
        player.vy = 0;

        // Keep camera smoothly following the player as they climb
        const ctarget = player.wx - 275;
        scrollX += (ctarget - scrollX) * 0.12;  // snappier follow (reduced perceived lag after theme draw cost)

        if (t >= 1) {
          player.isClimbing = false;
          gameState = 'complete';
          playPortal();
          updateLevel3LinkVisibility();  // explicit on transition (perf: no longer in every gameLoop frame)
          updateNextLevelLinkVisibility();

          // Final portal touch burst (only ends when player reaches top)
          const ex = player.wx + 13;
          const ey = player.y + 8;
          for (let i = 0; i < 24; i++) {
            const ang = Math.random() * Math.PI * 2;
            const sp = 0.85 + Math.random() * 2.35;
            particles.push({
              x: ex,
              y: ey,
              vx: Math.cos(ang) * sp,
              vy: Math.sin(ang) * sp - 0.95,
              life: 30 + Math.random() * 24,
              c: '#66ddff',
              size: 2.1
            });
          }
        }
        return; // skip normal gameplay (spawns, collisions, etc.) during climb sequence
      }

      // vertical physics
      let gravity = 0.47;
      if (overWaterGap) {
        gravity = 0.22; // slightly slower fall through toxic vat than through air
      }
      player.vy += gravity;
      player.y += player.vy;

      // === Robust landing resolution (fixes invisible platform floating bug) ===
      // Every frame we explicitly test "is the player currently standing on ground or any platform?"
      let landed = false;
      let targetY = player.y;

      let platDeltaX = 0;

      // Ground support - do not land if over a lava pit (must fall down the pit)
      if (!overWaterGap && player.y + player.h >= GROUND_Y - 0.5) {
        targetY = GROUND_Y - player.h;
        landed = true;
      }

      // Platform support - find the highest (lowest y) surface we are on top of
      // (swaying platforms use animated x position for both physics and visuals)
      for (let p of platforms) {
        const sway = (p.swayAmp || 0) * Math.sin((frame * 0.021) + (p.swayPhase || 0));
        const platSurface = p.y - player.h;
        const platLeft = p.wx + sway;
        const platRight = p.wx + sway + p.width;
        const pLeft = player.wx;
        const pRight = player.wx + player.w;

        // Proper x overlap + feet near or on the platform top
        if (pRight > platLeft && pLeft < platRight) {
          const feet = player.y + player.h;
          if (feet >= p.y - 2 && player.y <= p.y + 5) {
            if (platSurface < targetY) { // higher platform wins
              targetY = platSurface;
              landed = true;
              const amp = (p.swayAmp || 0);
              const phase = (p.swayPhase || 0);
              const omega = 0.021;
              const currSway = amp * Math.sin((frame * omega) + phase);
              const prevSway = amp * Math.sin(((frame - 1) * omega) + phase);
              platDeltaX = currSway - prevSway;
            }
          }
        }
      }

      if (landed) {
        player.y = targetY;
        player.vy = 0;
        player.wx += platDeltaX;
        if (Math.abs(platDeltaX) > 0.0001) {
          player.vx *= 0.8;
        }
      }

      // === OVAL TRAMPOLINE BOOST (gives super jump just before tall walls) ===
      for (let t of trampolines) {
        const tLeft = t.wx;
        const tRight = t.wx + t.width;
        const tTop = GROUND_Y - 6;

        if (player.wx + player.w > tLeft && player.wx < tRight) {
          const feet = player.y + player.h;
          // Only boost when landing on or crossing the trampoline from above
          if (feet >= tTop - 2 && player.vy >= 0) {
            player.vy = -19.5;   // Much stronger upward boost than normal jump
            landed = true;
            player.y = tTop - player.h - 1;
            playTrampoline();
            // Fun bounce particles
            for (let i = 0; i < 7; i++) {
              particles.push({
                x: player.wx + 8 + (Math.random() - 0.5) * 18,
                y: tTop,
                vx: (Math.random() - 0.5) * 2.8,
                vy: -1.8 - Math.random() * 1.4,
                life: 18 + Math.random() * 12,
                c: '#66ffdd',
                size: 2.2
              });
            }
          }
        }
      }

      // Land sound after full landing resolution (ground + platforms + trampoline)
      if (landed && wasAirborne) {
        playLand();
      }
      wasAirborne = !landed;

      // jump (only when on ground or a platform)
      if ((keys[' '] || keys['Spacebar']) && landed && player.vy >= -0.1) {
        player.vy = -11.8;
        jumpCount++;
        spawnDust(player.wx + 8, player.y + player.h + 1, 7, true);
        playJump();
        wasAirborne = true;
        keys[' '] = false; // one-shot
      }

      // Slow fall and eventual death when falling into lava pits (not solid)
      // Player must fall down the pit; falls slightly slower than sky
      // NOTE: during inBossFight, player can visually fall/sink (slower grav + no land) but NO death from lava/drowning. drowningStart forced 0 to suppress timer. Only boss crush kills.
      if (overWaterGap && player.y + player.h > GROUND_Y - 2) {
        // already handled slower gravity in vertical physics
        player.vx *= 0.6;

        if (!player.drowningStart) {
          player.drowningStart = frame;
        }

        // Die only after falling into the lava for a while (sinking / burning)
        if (frame - player.drowningStart > 65) {
          if (inBossFight) {
            player.drowningStart = 0; // prevent timer death during boss fight; visual sink/push ok but no gameState over
          } else {
            gameState = 'over';
            playDeath('lava');
            spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
          }
        }
      }

      // camera follow (smooth, with forward lead)
      const target = player.wx - 275;
      scrollX += (target - scrollX) * 0.12;  // snappier follow (reduced perceived lag)

      // === SPAWN: triangular ground hazards (spaced out more for longer level) ===
      if (player.wx > lastSpawnWX - 140) {
        const gap = 570 + Math.random() * 390;
        const nextWX = lastSpawnWX + gap;
        const oh = 20 + Math.random() * 29;
        const triW = 28; // accurate to collision/draw (centered -14/+14)
        const triLeft = nextWX - triW / 2;
        const triRight = nextWX + triW / 2;
        // Strict pre-push check using unified helper: against ALL waterGaps, obstacles, lowWalls, trampolines.
        // Enforces edge-to-edge >=60px separation (player ~26 + margin). Prevents "on top" (significant x-overlap considering widths)
        // or "directly beside" (edge dist < minSep). Also covers same-type (tri vs tri) + bidirectional.
        // (Replaces prior weak +/-10 overlap; now robust + also vs other triangles/lowWalls for full consistency.)
        let safe = !wouldBeTooCloseToHazards(triLeft, triRight, 60) && !spikeOverlapsAnyTrampoline(nextWX, 0);
        if (safe) {
          obstacles.push({ wx: nextWX, h: oh });
          lastSpawnWX = nextWX;
        } else {
          // advance anyway to not get stuck
          lastSpawnWX = nextWX;
        }
      }

      // === SPAWN: floating platforms (optional safe landings) - much more frequent now ===
      if (player.wx > lastPlatWX - 260) {
        if (Math.random() < 0.78) {
          const platWX = lastPlatWX + 38 + Math.random() * 95;
          const platY = GROUND_Y - (58 + Math.random() * 105);
          // Varied lengths: mostly short/medium, occasional long ones
          let platW = 38 + Math.random() * 48;
          if (Math.random() < 0.22) platW = 95 + Math.random() * 85; // longer platforms sometimes

          // Prevent new platforms from spawning on top of or touching the ending ladder
          let canSpawn = true;
          if (levelExit) {
            const ladderCenter = levelExit.wx;
            const platCenter = platWX + platW / 2;
            if (Math.abs(platCenter - ladderCenter) < 100 && platY > GROUND_Y - 420) {
              canSpawn = false;
            }
          }

          // New rule: Trampolines must never have a platform directly above them
          if (canSpawn) {
            for (let t of trampolines) {
              const tCenter = t.wx + (t.width || 40) / 2;
              const pCenter = platWX + platW / 2;
              if (Math.abs(pCenter - tCenter) < 42) {
                canSpawn = false;
                break;
              }
            }
          }

          // Also avoid spawning platforms on acid vats
          if (canSpawn) {
            for (let g of waterGaps) {
              const pCenter = platWX + platW / 2;
              const gCenter = g.wx + g.width / 2;
              if (Math.abs(pCenter - gCenter) < (platW / 2 + g.width / 2 + 5)) {
                canSpawn = false;
                break;
              }
            }
          }

          if (canSpawn) {
            // Some platforms sway slowly side-to-side (rock platforms over lava)
            const swayAmp = Math.random() < 0.38 ? (22 + Math.random() * 52) : 0;
            const swayPhase = Math.random() * Math.PI * 2;
            platforms.push({ wx: platWX, y: platY, width: platW, height: 8, swayAmp, swayPhase });
          }
        }
        lastPlatWX = lastPlatWX + 145 + Math.random() * 70;
      }

      // === SPAWN: low walls / barriers (occasional - player must jump over) + trampolines ===
      if (player.wx > lastWallWX - 420) {
        if (Math.random() < 0.48) {
          const wallWX = lastWallWX + 55 + Math.random() * 95;
          const wallW = 16 + Math.random() * 8;
          const wallLeft = wallWX;
          const wallRight = wallWX + wallW;
          // Strengthened with unified helper (60px edge sep vs lava/tris/obstacles + bidirectional)
          let wallCanSpawn = !wouldBeTooCloseToHazards(wallLeft, wallRight, 60);
          if (wallCanSpawn) {
            // Walls are now 5x taller to be a real challenge
            const wallH = 85 + Math.random() * 60;
            lowWalls.push({ wx: wallWX, height: wallH, width: wallW });

            // Spawn oval trampoline just before the wall to give a big boost
            // (tramp intentionally close to its wall; helper ensures tramp not too close to other hazards)
            const tWX = wallWX - 72 - Math.random() * 18;
            const tW = 36 + Math.random() * 8;
            // Keep tramp beside its wall (skip 60px wall check). Never sit on spikes or pits.
            let trampCanSpawn = !trampolineOverlapsAnySpike(tWX, tW);
            if (trampCanSpawn) {
              for (let g of waterGaps) {
                if (tWX + tW > g.wx && tWX < g.wx + g.width) {
                  trampCanSpawn = false;
                  break;
                }
              }
            }
            if (trampCanSpawn) {
              trampolines.push({
                wx: tWX,
                width: tW
              });
            }
          }
        }
        // Always advance the spawn timer every time we enter the "consider spawning" block (original behavior)
        lastWallWX = lastWallWX + 320 + Math.random() * 140;
      }

      // === SPAWN: lava pits (full glowing lava pools - deadly if fallen into) ===
      if (!levelExit && player.wx > 600 && Math.random() < 0.012) {
        const gapW = 60 + Math.random() * 52.5; // ~25% larger, still jumpable
        const gapWX = player.wx + 320 + Math.random() * 180;

        const gapLeft = gapWX;
        const gapRight = gapWX + gapW;
        // Unified/strengthened pre-push separation (replaces scattered tooClose blocks): Use robust helper
        // for checks vs ALL existing waterGaps + obstacles + lowWalls + tramps at 60px min edge-to-edge.
        // This covers triangles vs lava/acid (both directions), same-type, on-top (overlap) or directly beside.
        // Then ADDITIONAL stricter gap-vs-gap at original 78px (to preserve exact difficulty curve / spacing).
        let tooClose = wouldBeTooCloseToHazards(gapLeft, gapRight, 60);
        if (!tooClose) {
          // Ensure minimum distance between gaps (edge to edge) is at least 3x player width = 78px (original behavior preserved exactly)
          for (let g of waterGaps) {
            const existingRight = g.wx + g.width;
            const newLeft = gapWX;
            const distBetween = newLeft - existingRight;
            if (distBetween < 78 && distBetween > - (gapW + 10)) { // allow some ordering
              tooClose = true;
              break;
            }
            // Check the other way too
            const distOther = g.wx - (gapWX + gapW);
            if (distOther < 78 && distOther > - (g.width + 10)) {
              tooClose = true;
              break;
            }
          }
        }

        if (!tooClose) {
          waterGaps.push({ wx: gapWX, width: gapW });

          // Spawn a heat/smoke plume above the lava pit (volcanic ash)
          poisonClouds.push({
            wx: gapWX + gapW / 2,
            y: 55 + Math.random() * 35, // high in sky
            width: 38 + Math.random() * 12,
            lastDart: frame,
            gapWX: gapWX,
            gapWidth: gapW
          });
        }
      }

      // === SPAWN: rocky outcrops / lava vents in midground (for parallax) ===
      if (player.wx > 400 && Math.random() < 0.009) {
        const treeWX = player.wx + 350 + Math.random() * 300;
        alienTrees.push({
          wx: treeWX,
          y: GROUND_Y - 35 - Math.random() * 25,
          scale: 0.7 + Math.random() * 0.6,
          parallax: 0.07 + Math.random() * 0.03
        });
      }

      // === SPAWN: special chasing red monster (slightly increased frequency) ===
      if (frame - lastSpecialFrame > 1380 && Math.random() < 0.039) {
        const spawnWX = Math.max(player.wx + 360, scrollX + W + 40) + Math.random() * 160;
        // Ensure specials do not spawn on acid vats or on trampolines
        let safe = true;
        for (let g of waterGaps) {
          if (spawnWX + 30 > g.wx && spawnWX < g.wx + g.width) {
            safe = false;
            break;
          }
        }
        if (safe) {
          for (let t of trampolines) {
            if (spawnWX + 30 > t.wx && spawnWX < t.wx + (t.width || 40)) {
              safe = false;
              break;
            }
          }
        }
        if (safe) {
          specials.push({
            wx: spawnWX,
            y: GROUND_Y - 64,
            w: 30,
            h: 64,
            nextShot: frame + 70 + Math.random() * 70   // first shot after a short delay
          });
          if (!firstSpecial) {
            firstSpecial = { wx: spawnWX, w: 30, h: 64 };
          }
          lastSpecialFrame = frame;
        }
      }

      // === SPAWN: vertical moving aliens (less frequent, up/down patrollers with long tails) ===
      if (!levelExit && frame - (window.lastVertEnemySpawn || 0) > 2100 && Math.random() < 0.028) {
        const vwx = player.wx + 420 + Math.random() * 160;
        const baseY = GROUND_Y - 55;
        // Ensure vertical enemies do not spawn on acid vats or on trampolines
        let safe = true;
        for (let g of waterGaps) {
          if (vwx + 14 > g.wx && vwx - 14 < g.wx + g.width) {
            safe = false;
            break;
          }
        }
        if (safe) {
          for (let t of trampolines) {
            if (vwx + 14 > t.wx && vwx - 14 < t.wx + (t.width || 40)) {
              safe = false;
              break;
            }
          }
        }
        if (safe) {
          verticalEnemies.push({
            wx: vwx,
            y: baseY,
            baseY: baseY,
            amplitude: 38 + Math.random() * 18,
            speed: 0.045 + Math.random() * 0.025,
            phase: Math.random() * Math.PI * 2
          });
        }
        window.lastVertEnemySpawn = frame;
      }

      // === SPAWN: lava pterodactyl reptile birds (gliding high across top, occasional downward fire spit)
      // Spawn ~4-6 per level, not too frequent. Use lastPteroSpawn. Spawn from right (mostly) or left.
      // Gliding: slow vx negative, y around 50-100 with sin oscillation for natural glide/bob.
      if (player.wx > 520 && frame - lastPteroSpawn > 610 && Math.random() < 0.055) {
        const fromRight = Math.random() < 0.78;
        const pwx = fromRight ? (scrollX + W + 60 + Math.random() * 40) : (scrollX - 100 - Math.random() * 40);
        const pvx = fromRight ? (-1.05 - Math.random() * 0.65) : (1.05 + Math.random() * 0.65);
        const py = 52 + Math.random() * 48;
        pteros.push({
          wx: pwx,
          y: py,
          vx: pvx,
          phase: Math.random() * Math.PI * 2,
          nextSpit: frame + 110 + Math.random() * 90
        });
        lastPteroSpawn = frame;
      }

      // move specials toward player with lag (slow, jumpable)
      // They change direction instead of walking over acid vats
      for (let s of specials) {
        const desired = player.wx - 6;
        const diff = desired - s.wx;
        if (Math.abs(diff) > 0.8) {
          let move = Math.sign(diff) * 1.28;
          let tentative = s.wx + move;
          let onGap = false;
          for (let g of waterGaps) {
            if (tentative + s.w > g.wx && tentative < g.wx + g.width) {
              onGap = true;
              break;
            }
          }
          if (onGap) {
            // merely change direction
            s.wx -= move * 2;
          } else {
            s.wx = tentative;
          }
        }
        // keep them from going below ground visually
        if (s.y < GROUND_Y - s.h) s.y = GROUND_Y - s.h;
      }

      // === MONSTER GUNFIRE: fireballs from fiery spheres ===
      // Monsters now fire directly toward the player's position at the moment of shooting (non-homing after fired)
      for (let s of specials) {
        if (typeof s.nextShot !== 'number') s.nextShot = frame + 60;

        if (frame >= s.nextShot) {
          const onScreen = (s.wx - scrollX > -60 && s.wx - scrollX < W + 60);
          if (onScreen) {
            // Aim at player, but restricted: only shoot in front of them and diagonally upwards (never straight up or backwards)
            const targetX = player.wx + player.w * 0.5;
            const targetY = player.y + player.h * 0.5;

            let dx = targetX - (s.wx + 8);
            let dy = targetY - (s.y + s.h * 0.38);  // aim from mid-upper body (taller enemies)

            const face = Math.sign(player.wx - (s.wx + 8)) || 1;

            // Force forward only (never shoot behind)
            if (Math.sign(dx) !== face && Math.abs(dx) > 4) {
              dx = face * Math.max(28, Math.abs(dx));
            }

            // Prevent direct upwards: require a decent forward horizontal component when shooting up
            if (dy < -4 && Math.abs(dx) < Math.abs(dy) * 0.62) {
              dx = face * Math.abs(dy) * 0.62;
            }

            const dist = Math.sqrt(dx * dx + dy * dy) || 1;

            const speed = 2.35 + Math.random() * 0.55; // fairly slow projectiles

            projectiles.push({
              wx: s.wx + 8,
              y: s.y + s.h * 0.38,  // fire from mid-upper body (taller enemies)
              vx: (dx / dist) * speed,
              vy: (dy / dist) * speed,
              life: 105 + Math.random() * 18
            });
            playLaser();
          }
          // Randomised fairly slow interval between shots (roughly 1.6s – 3.2s)
          s.nextShot = frame + 95 + Math.random() * 95;
        }
      }

      // Ambient volcanic ash haze (atmospheric, slow rising)
      if (frame % 26 === 0 && Math.random() < 0.75) {
        const smokeBaseX = scrollX + 140 + Math.random() * (W * 0.75);
        const smokeY = GROUND_Y - 25 - Math.random() * 155;
        spawnNeonSmoke(smokeBaseX, smokeY, 1 + Math.random() * 2.2);
      }

      // prune old objects
      obstacles = obstacles.filter(o => o.wx > scrollX - 90);
      platforms = platforms.filter(p => p.wx > scrollX - 130);
      specials = specials.filter(s => s.wx > scrollX - 140);
      lowWalls = lowWalls.filter(w => w.wx > scrollX - 110);
      trampolines = trampolines.filter(t => t.wx > scrollX - 140);
      endFireballs = endFireballs.filter(f => f.wx > scrollX - 80);
      neonOrbs = neonOrbs.filter(o => o.wx > scrollX - 90);
      if (icePowerUp && icePowerUp.wx < scrollX - 90) icePowerUp = null;
      waterGaps = waterGaps.filter(g => g.wx > scrollX - 150);
      alienTrees = alienTrees.filter(t => t.wx > scrollX - 200);
      verticalEnemies = verticalEnemies.filter(e => e.wx > scrollX - 120);
      poisonClouds = poisonClouds.filter(c => c.wx > scrollX - 100);
      poisonDarts = poisonDarts.filter(d => d.y < GROUND_Y + 80); // lava fireballs can fly up then fall; prune far outliers
      pteros = pteros.filter(p => p.wx > scrollX - 160 && p.wx < scrollX + W + 160); // offscreen prune left or far right

      // Move boss fireballs (they have slight gravity feel)
      for (let i = endFireballs.length - 1; i >= 0; i--) {
        const fb = endFireballs[i];
        fb.wx += fb.vx;
        fb.y += fb.vy;
        fb.vy += 0.035;   // gentle arc downward
        if (fb.y > GROUND_Y - 10) endFireballs.splice(i, 1);
      }

      // Move vertical enemies (up and down in place)
      for (let e of verticalEnemies) {
        e.y = e.baseY + Math.sin(frame * e.speed + e.phase) * e.amplitude;
      }

      // Move & animate lava pteros (glide + y bob oscillation), occasional downward spit fireballs (reuse projectiles)
      for (let i = pteros.length - 1; i >= 0; i--) {
        const p = pteros[i];
        p.wx += p.vx;
        // y glide bob
        const bob = Math.sin(frame * 0.032 + p.phase) * 7;
        p.y = 52 + ((p.phase * 17) % 48) + bob;
        // occasional spit (downward fireballs, reuse projectiles array + style)
        if (frame >= p.nextSpit) {
          const onScreen = (p.wx - scrollX > -40 && p.wx - scrollX < W + 40);
          if (onScreen) {
            projectiles.push({
              wx: p.wx + 12,
              y: p.y + 8,
              vx: (Math.random() - 0.5) * 0.4,
              vy: 2.2 + Math.random() * 0.9,
              life: 95 + Math.random() * 25
            });
            playPteroSpit();
            // spit embers
            for (let k = 0; k < 5; k++) {
              particles.push({
                x: p.wx + 12,
                y: p.y + 8,
                vx: (Math.random() - 0.5) * 1.2,
                vy: 0.8 + Math.random() * 0.6,
                life: 12 + Math.random() * 8,
                c: (Math.random() < 0.6 ? '#ff6622' : '#ffaa33'),
                size: 1.4 + Math.random()
              });
            }
          }
          p.nextSpit = frame + 110 + Math.random() * 90;
        }
        // offscreen prune inside loop
        if (p.wx < scrollX - 160 || p.wx > scrollX + W + 160) {
          pteros.splice(i, 1);
        }
      }

      // Lava fireball pop-up logic - from time to time a fireball erupts upward from the lava then falls back in (deadly hazard)
      const popInterval = 240 + Math.random() * 120; // irregular, ~4-6s
      for (let cloud of poisonClouds) {
        if (frame - cloud.lastDart > popInterval) {
          // Pop a fireball upward from near the lava surface (use gap info if present)
          const baseY = GROUND_Y - 6;
          poisonDarts.push({
            wx: cloud.wx + (Math.random() - 0.5) * (cloud.width * 0.5),
            y: baseY,
            vy: - (3.8 + Math.random() * 2.8), // strong upward pop
            vx: (Math.random() - 0.5) * 1.6     // slight sideways drift
          });
          cloud.lastDart = frame;
        }
      }

      // Move lava fireballs (pop up then gravity pulls them back into the lava)
      for (let i = poisonDarts.length - 1; i >= 0; i--) {
        const dart = poisonDarts[i];
        dart.vy += 0.105; // gravity so they arc up and fall back
        dart.wx += (dart.vx || 0) * 0.96;
        dart.y += dart.vy;
        // remove once they sink back into lava surface or fly too far
        if (dart.y > GROUND_Y - 2 || dart.life !== undefined && --dart.life <= 0) {
          poisonDarts.splice(i, 1);
        }
      }

      // Move and collect neon orbs
      for (let i = neonOrbs.length - 1; i >= 0; i--) {
        const orb = neonOrbs[i];
        orb.wx += orb.vx;
        // Gentle floating motion
        orb.y += Math.sin(frame * 0.045 + orb.phase) * 0.35;

        // Collection
        const dx = Math.abs(player.wx + 13 - orb.wx);
        const dy = Math.abs(player.y + 13 - orb.y);
        if (dx < 22 && dy < 22) {
          const value = orb.value || 1;
          neonScore += value;
          playCollect(value === 5);

          // Collect particles - different color for green orbs
          const particleColor = (value === 5) ? '#33ff88' : '#3355aa';
          if (value === 5 && secondGreenTutorialActive) {
            secondGreenTutorialActive = false;
          }
          for (let k = 0; k < (value === 5 ? 12 : 8); k++) {
            particles.push({
              x: orb.wx,
              y: orb.y,
              vx: (Math.random() - 0.5) * 2.4,
              vy: (Math.random() - 0.5) * 2.2 - 0.6,
              life: 20 + Math.random() * 12,
              c: particleColor,
              size: 1.8
            });
          }
          neonOrbs.splice(i, 1);
          continue;
        }

        // Prune far behind
        if (orb.wx < scrollX - 60) {
          neonOrbs.splice(i, 1);
        }
      }

      // Move & recycle drifting volcanic ash plumes (slow sky layer)
      for (let ship of flyingShips) {
        ship.wx += ship.vx;
        // Recycle far off left → bring new one from far right
        if (ship.wx < scrollX - 420) {
          ship.wx = scrollX + W + 180 + Math.random() * 620;
          ship.y = 42 + Math.random() * 172;
          ship.vx = -0.55 - Math.random() * 0.95;
          ship.scale = 0.55 + Math.random() * 0.9;
        }
      }

      // Move projectiles (now small fireballs with fading smoke trail)
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        pr.wx += pr.vx;
        pr.y += pr.vy;
        pr.life--;
        // Emit smoke trail particles (fading dark embers/smoke)
        if (Math.random() < 0.65) {
          particles.push({
            x: pr.wx - pr.vx * 0.4,
            y: pr.y - pr.vy * 0.4,
            vx: (Math.random() - 0.5) * 0.6 - pr.vx * 0.08,
            vy: (Math.random() - 0.5) * 0.5 - 0.3,
            life: 16 + Math.random() * 11,
            c: (Math.random() < 0.5) ? '#553322' : '#442211',
            size: 1.4 + Math.random()
          });
        }
        if (pr.life <= 0) projectiles.splice(i, 1);
      }

      // particles (with special slow drift for neon smoke)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.c === '#66ddff') {
          // Neon blue atmospheric smoke rises slower and fades gently
          p.vy += 0.012;
          p.vx *= 0.995;
        } else {
          p.vy += 0.22;
          p.vx *= 0.985;
        }
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // collisions with triangles
      for (let o of obstacles) {
        if (checkCollision(player, o)) {
          const now = frame;
          if (now < player.invulnUntil) {
            // Fully protected during 5-second post-shield grace period
          } else if (player.hasShield) {
            // Shield absorbs exactly one hit, then pops and grants 5 seconds invulnerability
            player.hasShield = false;
            playShieldPop();
            player.invulnUntil = now + 300; // 5 seconds at ~60fps
            // Shield pop effect (neon blue)
            for (let k = 0; k < 22; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1.8 + Math.random() * 3.2;
              particles.push({
                x: player.wx + 13, y: player.y + 13,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.7,
                life: 28 + Math.random() * 18, c: '#66ddff', size: 2.0
              });
            }
          } else {
            if (inBossFight) {
              // During boss fight: ground triangles (obstacles) non-lethal contact. Only boss crush kills.
            } else {
              gameState = 'over';
              playDeath('hazard');
              spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
              // small floor hit dust
              spawnDust(player.wx + player.w / 2, GROUND_Y, 5, false);
              if (baseScore + score > best) {
                best = baseScore + score;
                saveBest();
              }
            }
            break;
          }
        }
      }

      // collisions with fiery spheres (AABB + stomp-from-above check)
      // Mario-style stomp kill if jumping on top (from above while falling)
      for (let i = specials.length - 1; i >= 0; i--) {
        const s = specials[i];
        const sLeft = s.wx + 2;
        const sRight = s.wx + s.w - 2;
        const sTop = s.y;
        const sBottom = s.y + s.h;
        const pLeft = player.wx;
        const pRight = player.wx + player.w;
        const pTop = player.y;
        const pBottom = player.y + player.h;
        if (pRight > sLeft && pLeft < sRight && pBottom > sTop && pTop < sBottom) {
          // Stomp kill: player falling and feet in the top zone of the tall enemy
          if (player.vy > 0 && pBottom < sTop + 22) {
            // Successful Mario jump on top!
            player.vy = -11.5;  // satisfying upward bounce
            spawnExplosion(s.wx + s.w / 2, s.y + 8);
            // Charred ash death particles + some lava sparks
            for (let k = 0; k < 14; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1.3 + Math.random() * 2.9;
              particles.push({
                x: s.wx + s.w / 2,
                y: s.y + 12,
                vx: Math.cos(ang) * sp,
                vy: Math.sin(ang) * sp - 1.1,
                life: 20 + Math.random() * 16,
                c: (Math.random() < 0.65) ? '#8899aa' : '#66ddff',
                size: 1.5 + Math.random() * 0.9
              });
            }
            neonScore += 5;  // small reward for skillful play
            specials.splice(i, 1);
            continue;
          }

          // Normal side/bottom hit (damage)
          if (pBottom > sTop + 14) {  // taller enemies: more body overlap required to "hit" from above
            const now = frame;
            if (now < player.invulnUntil) {
              // Fully protected during 5-second post-shield grace period
            } else if (player.hasShield) {
              player.hasShield = false;
              playShieldPop();
              player.invulnUntil = now + 300; // 5 seconds invulnerability after shield pops
              for (let k = 0; k < 22; k++) {
                const ang = Math.random() * Math.PI * 2;
                const sp = 1.8 + Math.random() * 3.2;
                particles.push({
                  x: player.wx + 13, y: player.y + 13,
                  vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.7,
                  life: 28 + Math.random() * 18, c: '#66ddff', size: 2.0
                });
              }
            } else {
              if (inBossFight) {
                // During boss fight: specials (fiery spheres) side/bottom hit non-lethal. Only boss crush kills. (Stomp-on-specials kept above.)
              } else {
                gameState = 'over';
                playDeath('hazard');
                spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
                spawnDust(player.wx + player.w / 2, GROUND_Y, 4, false);
                if (score > best) {
                  best = score;
                  saveBest();
                }
              }
              break;
            }
          }
        }
      }

      // === END BOSS COLLISIONS (repurposed large red polygonal): stomp 3x to defeat, else crush death ===
      // Stomp check (Mario-style) BEFORE general death collision with boss. Must be before or instead of crush.
      // CRITICAL NEW RULE (while inBossFight): stomp path (exactly 3 stomps -> bossDefeated, victory particles, endBoss=null, ladder spawn+cleanup) 100% unchanged and only win path.
      // The crush death path below is now the SOLE way player dies in boss fight (direct land on top). Refined isCrush slightly for "lands directly on top"; side non-crush overlaps are now survivable (no death).
      if (endBoss && !bossDefeated && gameState === 'playing') {
        const bLeft = endBoss.wx - 8;
        const bRight = endBoss.wx + 55;
        const bTop = endBoss.y - 85;   // approx drawn top (body/spikes)
        const bBottom = endBoss.y + 5; // feet area
        const pLeft = player.wx;
        const pRight = player.wx + player.w;
        const pTop = player.y;
        const pBottom = player.y + player.h;

        if (pRight > bLeft && pLeft < bRight && pBottom > bTop && pTop < bBottom) {
          const stompMargin = 9; // within ~5-10px of boss top
          const xOverlap = Math.min(pRight, bRight) - Math.max(pLeft, bLeft);
          // Successful stomp: player falling + bottom near/above boss top + decent x overlap
          if (player.vy > 0 && pBottom <= bTop + stompMargin && xOverlap > 12) {
            // Stomp!
            player.vy = -14;  // strong bounce -12 to -16
            endBoss.stomps = (endBoss.stomps || 0) + 1;
            playBossStomp();
            spawnExplosion(endBoss.wx + 25, endBoss.y - 10);
            // Red hit / bounce-off particles
            for (let k = 0; k < 12; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1.2 + Math.random() * 2.6;
              particles.push({
                x: endBoss.wx + 20,
                y: endBoss.y - 5,
                vx: (Math.random() - 0.5) * sp,
                vy: (Math.random() - 0.5) * sp - 1.0,
                life: 18 + Math.random() * 14,
                c: (Math.random() < 0.5 ? '#ff6644' : '#ee4422'),
                size: 1.4 + Math.random()
              });
            }

            if (endBoss.stomps < 3) {
              // Bounce player to safe distance left, brief invuln flash, boss knocked back
              player.wx = endBoss.wx - 62;
              player.vx = -4.2;
              player.invulnUntil = frame + 18; // short post-stomp protection
              endBoss.vx = -3.5;
              endBoss.vy = Math.min(endBoss.vy, -2.5); // extra pop
              // small safe distance push complete
            } else {
              // 3rd stomp: DEFEAT the boss
              bossDefeated = true;
              spawnExplosion(endBoss.wx + 28, endBoss.y - 5);
              spawnExplosion(endBoss.wx + 12, endBoss.y + 12);
              // Big victory particles (red + cyan triumph burst)
              for (let i = 0; i < 28; i++) {
                const ang = Math.random() * Math.PI * 2;
                const sp = 1.6 + Math.random() * 3.4;
                particles.push({
                  x: endBoss.wx + 25 + (Math.random() - 0.5) * 18,
                  y: endBoss.y - 8 + (Math.random() - 0.5) * 12,
                  vx: Math.cos(ang) * sp,
                  vy: Math.sin(ang) * sp - 0.9,
                  life: 26 + Math.random() * 18,
                  c: (Math.random() < 0.45 ? '#ffaa66' : '#66ddff'),
                  size: 1.9 + Math.random() * 0.9
                });
              }
              endBoss = null;  // remove the active boss entity

              // THEN spawn the levelExit (ladder + portal) now that boss is defeated
              // (use offset from current player position / prior trigger area)
              levelExit = {
                wx: player.wx + 95 + Math.random() * 35,
                baseY: GROUND_Y
              };

              // Cleanup platforms + ALL other objects near new ladder (prevent spawns touching ladder; same as main path)
              const ladderCenter = levelExit.wx;
              const safeMargin = 100;
              platforms = platforms.filter(p => {
                const platCenter = p.wx + p.width / 2;
                const xDist = Math.abs(platCenter - ladderCenter);
                if (xDist < safeMargin && p.y > GROUND_Y - 420) {
                  return false;
                }
                return true;
              });
              obstacles = obstacles.filter(o => Math.abs(o.wx - ladderCenter) >= safeMargin);
              specials = specials.filter(s => Math.abs(s.wx - ladderCenter) >= safeMargin || (s.y && s.y <= GROUND_Y - 420));
              waterGaps = waterGaps.filter(g => Math.abs(g.wx - ladderCenter) >= safeMargin);
              verticalEnemies = verticalEnemies.filter(e => !(Math.abs(e.wx - ladderCenter) < safeMargin && e.y > GROUND_Y - 420));
              pteros = pteros.filter(p => Math.abs(p.wx - ladderCenter) >= safeMargin);
              neonOrbs = neonOrbs.filter(o => !(Math.abs(o.wx - ladderCenter) < safeMargin && o.y > GROUND_Y - 420));
              lowWalls = lowWalls.filter(w => Math.abs(w.wx - ladderCenter) >= safeMargin);
              trampolines = trampolines.filter(t => Math.abs(t.wx - ladderCenter) >= safeMargin);
              poisonClouds = poisonClouds.filter(c => !(Math.abs(c.wx - ladderCenter) < safeMargin && c.y > GROUND_Y - 420));
              poisonDarts = poisonDarts.filter(d => !(Math.abs(d.wx - ladderCenter) < safeMargin && d.y > GROUND_Y - 420));
              if (powerUp && Math.abs(powerUp.wx - ladderCenter) < safeMargin && powerUp.y > GROUND_Y - 420) {
                powerUp = null;
              }
              if (icePowerUp && Math.abs(icePowerUp.wx - ladderCenter) < safeMargin && icePowerUp.y > GROUND_Y - 420) {
                icePowerUp = null;
              }
            }
            // stomp handled; do not fall through to crush
          } else {
            // Crush / land-on / side overlap death (boss lands on player or side hit)
            // spec: AABB or specifically if boss.y + h/2 > player.y + h/2 or vy positive during overlap
            // REFINED for "lands directly on top": only this path (when isCrush) can set gameState='over' in boss fight. Side taps (!isCrush but overlap) now allow survive.
            const now = frame;
            const bossMidY = endBoss.y - 40; // approx
            const playerMidY = player.y + player.h * 0.5;
            const isCrush = ((endBoss.vy > 0) || (endBoss.y + 5 > player.y + player.h * 0.35)) && ((endBoss.y + 5 > player.y + player.h * 0.5) || (endBoss.vy > 1 && pBottom > bTop + 10));
            if (isCrush) {
              if (now < player.invulnUntil) {
                // protected
              } else if (player.hasShield) {
                player.hasShield = false;
                playShieldPop();
                player.invulnUntil = now + 300;
                for (let k = 0; k < 20; k++) {
                  const ang = Math.random() * Math.PI * 2;
                  const sp = 1.7 + Math.random() * 3.1;
                  particles.push({
                    x: player.wx + 13, y: player.y + 13,
                    vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.7,
                    life: 28 + Math.random() * 18, c: '#66ddff', size: 2.0
                  });
                }
              } else {
                gameState = 'over';
                playDeath('hazard');
                spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
              }
            }
            // else: non-crush side/partial overlap during boss fight — player survives (per new rule)
          }
        }
      }

      // collisions with monster projectiles (fireballs)
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        const prLeft = pr.wx;
        const prRight = pr.wx + 6;  // small fireball
        const prTop = pr.y - 3;
        const prBottom = pr.y + 5;

        const pLeft = player.wx;
        const pRight = player.wx + player.w;
        const pTop = player.y;
        const pBottom = player.y + player.h;

        if (pRight > prLeft && pLeft < prRight && pBottom > prTop && pTop < prBottom) {
          const now = frame;
          if (inBossFight) {
            // During boss fight (inBossFight): monster projectiles non-lethal (deflect/splice only). Only boss direct land-on-top crush kills.
            // small visual deflect
            for (let k = 0; k < 3; k++) {
              particles.push({ x: pr.wx, y: pr.y, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, life: 8, c: '#ffaa66', size: 1.2 });
            }
            projectiles.splice(i, 1);
          } else if (now < player.invulnUntil) {
            // Fully protected during 5-second post-shield grace period
            projectiles.splice(i, 1);
          } else if (player.hasShield) {
            player.hasShield = false;
            playShieldPop();
            player.invulnUntil = now + 300; // 5 seconds invulnerability after shield pops
            for (let k = 0; k < 22; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1.8 + Math.random() * 3.2;
              particles.push({
                x: player.wx + 13, y: player.y + 13,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.7,
                life: 28 + Math.random() * 18, c: '#66ddff', size: 2.0
              });
            }
            projectiles.splice(i, 1);
          } else {
            gameState = 'over';
            playDeath('projectile');
            updateLevel3LinkVisibility();
            spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
            // Remove the projectile that hit
            projectiles.splice(i, 1);
            if (baseScore + score > best) {
              best = baseScore + score;
              saveBest();
            }
            break;
          }
        }
      }

      // Collisions with boss fireballs (must avoid while climbing the ladder to escape)
      for (let i = endFireballs.length - 1; i >= 0; i--) {
        const fb = endFireballs[i];
        const fbLeft = fb.wx;
        const fbRight = fb.wx + 9;
        const fbTop = fb.y - 2;
        const fbBottom = fb.y + 6;

        const pLeft = player.wx;
        const pRight = player.wx + player.w;
        const pTop = player.y;
        const pBottom = player.y + player.h;

        if (pRight > fbLeft && pLeft < fbRight && pBottom > fbTop && pTop < fbBottom) {
          const now = frame;
          if (inBossFight) {
            // During boss fight: boss fireballs (endFireballs) non-lethal. Splice + small deflect particles only. Only the boss landing directly on top can crush/kill.
            for (let k = 0; k < 4; k++) {
              particles.push({ x: fb.wx, y: fb.y, vx: (Math.random()-0.5)*1.8, vy: (Math.random()-0.5)*1.8 - 0.5, life: 10, c: '#ff6644', size: 1.4 });
            }
            endFireballs.splice(i, 1);
          } else if (now < player.invulnUntil) {
            // Fully protected during 5-second post-shield grace period
            endFireballs.splice(i, 1);
          } else if (player.hasShield) {
            player.hasShield = false;
            playShieldPop();
            player.invulnUntil = now + 300; // 5 seconds invulnerability after shield pops
            for (let k = 0; k < 22; k++) {
              const ang = Math.random() * Math.PI * 2;
              const sp = 1.8 + Math.random() * 3.2;
              particles.push({
                x: player.wx + 13, y: player.y + 13,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.7,
                life: 28 + Math.random() * 18, c: '#66ddff', size: 2.0
              });
            }
            endFireballs.splice(i, 1);
          } else {
            gameState = 'over';
            playDeath('projectile');
            spawnExplosion(player.wx + player.w / 2, player.y + player.h / 2);
            endFireballs.splice(i, 1);
            if (baseScore + score > best) {
              best = baseScore + score;
              saveBest();
            }
            break;
          }
        }
      }

      // distance score
      const dist = Math.floor((player.wx - 80) / 5.8);
      if (dist > score) score = dist;

      // Collect halfway power-up (energy shield)
      if (powerUp) {
        const dx = Math.abs(player.wx + 13 - powerUp.wx);
        const dy = Math.abs(player.y + 13 - powerUp.y);
        if (dx < 26 && dy < 26) {
          player.hasShield = true;
          playPowerup('shield');
          player.invulnUntil = 0; // Fresh shield replaces any grace period

          // Nice cyan pickup burst
          for (let i = 0; i < 14; i++) {
            const ang = Math.random() * Math.PI * 2;
            const sp = 1.1 + Math.random() * 1.9;
            particles.push({
              x: powerUp.wx,
              y: powerUp.y,
              vx: Math.cos(ang) * sp,
              vy: Math.sin(ang) * sp - 0.7,
              life: 26 + Math.random() * 18,
              c: '#66ddff',
              size: 1.9
            });
          }
          powerUp = null;
        }
      }

      // Collect ice blaster (single use floating ice cube)
      if (icePowerUp) {
        const dx = Math.abs(player.wx + 13 - icePowerUp.wx);
        const dy = Math.abs(player.y + 13 - icePowerUp.y);
        if (dx < 28 && dy < 28) {
          hasIceBlast = true;
          playPowerup('ice');
          // Ice/cyan pickup burst
          for (let i = 0; i < 16; i++) {
            const ang = Math.random() * Math.PI * 2;
            const sp = 1.1 + Math.random() * 1.9;
            particles.push({
              x: icePowerUp.wx,
              y: icePowerUp.y,
              vx: Math.cos(ang) * sp,
              vy: Math.sin(ang) * sp - 0.7,
              life: 26 + Math.random() * 18,
              c: (Math.random() < 0.5 ? '#ccffff' : '#99ddff'),
              size: 1.9
            });
          }
          icePowerUp = null;
        }
      }

      // Friendly NPC update (bounce and approach detection)
      if (friendlyNPC) {
        friendlyNPC.bouncePhase = frame * 0.15;
        const dx = Math.abs((player.wx + player.w * 0.5) - friendlyNPC.wx);
        const dy = Math.abs((player.y + player.h * 0.5) - (friendlyNPC.y - 17));
        if (dx < 80 && dy < 60) {
          friendlyNPC.approached = true;
        }
      }

      // === BOSS FIREBALLS (large polygonal monster beyond the invisible barrier spits these)
      // Speed reduced 15%, boss is positioned further back
      if (levelExit && gameState === 'playing') {
        const bossWX = levelExit.wx + 225;
        // Fairly slow fireballs that are dangerous while the player is climbing the ladder
        if (frame % 74 === 0 && Math.random() < 0.78) {
          endFireballs.push({
            wx: bossWX + 8,
            y: GROUND_Y - 88 + Math.random() * 22,
            vx: -3.02 - Math.random() * 0.55,   // 15% slower
            vy: 0.55 + Math.random() * 0.85
          });
        }
      }

      // === NEON ORBS (floating collectibles - dark blue neon) ===
      if (gameState === 'playing' && frame - lastOrbSpawn > 195) {
        if (Math.random() < 0.58) {
          const orbWX = player.wx + 280 + Math.random() * 220;
          const orbY = GROUND_Y - 65 - Math.random() * 195; // floating in air
          neonOrbs.push({
            wx: orbWX,
            y: orbY,
            vx: -0.45 - Math.random() * 0.35,
            phase: Math.random() * Math.PI * 2,
            value: 1
          });
        }
        lastOrbSpawn = frame;
      }

      // === GREEN NEON ORBS (faster, higher value collectibles - worth 5 Neon) ===
      // Spawn less frequently than blue orbs
      if (gameState === 'playing' && frame - lastGreenOrbSpawn > 280) {
        if (Math.random() < 0.45) {
          const orbWX = player.wx + 260 + Math.random() * 240;
          const orbY = GROUND_Y - 55 - Math.random() * 210;
          neonOrbs.push({
            wx: orbWX,
            y: orbY,
            vx: -1.15 - Math.random() * 0.55,   // noticeably faster
            phase: Math.random() * Math.PI * 2,
            value: 5
          });

          greenOrbCount++;
          if (greenOrbCount === 2 && !secondGreenTutorialActive) {
            secondGreenTutorialActive = true;
          }
        }
        lastGreenOrbSpawn = frame;
      }

      // === LEVEL EXIT: ladder + portal appears much later (15% longer level) ===
      // But FIRST the red ending monster jumps into foreground as active boss (bounce + 3 stomps to defeat)
      if (!levelExit && player.wx > 6127) {
        if (!endBoss && !bossDefeated) {
          // Jump the red polygonal monster into foreground (ALWAYS from extreme right of the screen)
          endBoss = {
            wx: scrollX + W + 80,  // extreme right, offscreen right of current view
            y: GROUND_Y - 18,
            vy: -10,  // initial jump-in arc from right
            vx: -2.8,  // initial leftward velocity so boss always enters from extreme right
            stomps: 0,
            w: 62,
            h: 72,
            lastBounce: frame - 200  // allow initial bounce-in
          };
        }
        // Only spawn the actual ladder+portal *after* boss defeated
        if (bossDefeated) {
          levelExit = {
            wx: player.wx + 110 + Math.random() * 70,
            baseY: GROUND_Y
          };

          // Ensure no floating platforms or ANY other objects are touching or overlapping the ending ladder (prevent spawns touching ladder)
          const ladderCenter = levelExit.wx;
          const safeMargin = 100; // generous padding so nothing visually or physically overlaps the ladder or top platform; covers triangles/obstacles, enemies/specials/verticals/pteros, waterGaps, neonOrbs, powerUps, lowWalls, trampolines, poison*, bg elems, flyingShips, alienTrees
          platforms = platforms.filter(p => {
            const platCenter = p.wx + p.width / 2;
            const xDist = Math.abs(platCenter - ladderCenter);
            // Remove any platform that is horizontally close AND vertically in the ladder's tall range
            if (xDist < safeMargin && p.y > GROUND_Y - 420) {
              return false;
            }
            return true;
          });
          // Extended filters for all other spawn types to prevent any overlap with ladder (use x dist + y tall check for high objects; ground objs by x only)
          obstacles = obstacles.filter(o => Math.abs(o.wx - ladderCenter) >= safeMargin);
          specials = specials.filter(s => Math.abs(s.wx - ladderCenter) >= safeMargin || (s.y && s.y <= GROUND_Y - 420));
          waterGaps = waterGaps.filter(g => Math.abs(g.wx - ladderCenter) >= safeMargin);
          verticalEnemies = verticalEnemies.filter(e => !(Math.abs(e.wx - ladderCenter) < safeMargin && e.y > GROUND_Y - 420));
          pteros = pteros.filter(p => Math.abs(p.wx - ladderCenter) >= safeMargin);
          neonOrbs = neonOrbs.filter(o => !(Math.abs(o.wx - ladderCenter) < safeMargin && o.y > GROUND_Y - 420));
          lowWalls = lowWalls.filter(w => Math.abs(w.wx - ladderCenter) >= safeMargin);
          trampolines = trampolines.filter(t => Math.abs(t.wx - ladderCenter) >= safeMargin);
          poisonClouds = poisonClouds.filter(c => !(Math.abs(c.wx - ladderCenter) < safeMargin && c.y > GROUND_Y - 420));
          poisonDarts = poisonDarts.filter(d => !(Math.abs(d.wx - ladderCenter) < safeMargin && d.y > GROUND_Y - 420));
          if (powerUp && Math.abs(powerUp.wx - ladderCenter) < safeMargin && powerUp.y > GROUND_Y - 420) {
            powerUp = null;
          }
          if (icePowerUp && Math.abs(icePowerUp.wx - ladderCenter) < safeMargin && icePowerUp.y > GROUND_Y - 420) {
            icePowerUp = null;
          }
        }
      }

      // Climb the exit ladder with UP key (starts visible climb - level ends only at portal)
      if (levelExit && gameState === 'playing' && !player.isClimbing) {
        const ex = levelExit.wx;
        const distX = Math.abs(player.wx + player.w * 0.5 - ex);
        const nearBase = distX < 32 && (player.y + player.h) >= GROUND_Y - 18;

        if (nearBase && (keys['ArrowUp'] || keys['w'] || keys['W'])) {
          // Begin visible climb animation
          player.isClimbing = true;
          player.climbProgress = 0;
          player.climbStartY = player.y;
          playLadderGrab();
          player.climbTargetY = levelExit.baseY - 305; // tall portal (60%+ of level height)
          keys['ArrowUp'] = false;
          keys['w'] = false;
          keys['W'] = false;
        }
      }

      // Ice blaster power-up: exactly 3 spawns (start>200, mid~3000, pre-boss~5650)
      const iceTargets = [200, 3000, 5650];
      if (iceSpawnIndex < iceTargets.length && !icePowerUp && !hasIceBlast && player.wx > iceTargets[iceSpawnIndex]) {
        const rand = Math.random();
        icePowerUp = {
          wx: player.wx + 200 + rand * 100,
          y: GROUND_Y - 80 - rand * 100
        };
        iceSpawnIndex++;
      }

      // Friendly NPC (pink octagon, middle of the now 20% longer level ~3672)
      if (!friendlyNPC && player.wx > 3672 && player.wx < 4100) {
        const rand = Math.random();
        friendlyNPC = {
          wx: player.wx + 180 + rand * 50,
          y: GROUND_Y - 50,
          bouncePhase: 0,
          approached: false
        };
      }

      // Shield power-up: 3 evenly spaced spawns across the (longer) level
      const endDist = 6127;
      const shieldTargets = [endDist * 0.22, endDist * 0.48, endDist * 0.74];
      if (shieldSpawnIndex < shieldTargets.length && !powerUp && !player.hasShield && player.wx > shieldTargets[shieldSpawnIndex]) {
        // Random height, never higher than 50% level height (y never too close to top)
        const minY = GROUND_Y - 260;
        const maxY = GROUND_Y - 80;
        powerUp = {
          wx: player.wx + 155 + Math.random() * 70,
          y: minY + Math.random() * (maxY - minY)
        };
        shieldSpawnIndex++;
      }
    }

    function draw() {
      // FPS counting (early in draw, before heavy work)
      fpsFrameCount++;
      const _now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
      if (_now - lastFpsTime >= 500) { fps = Math.round(fpsFrameCount * 1000 / (_now - lastFpsTime)); fpsFrameCount = 0; lastFpsTime = _now; }

      ctx.fillStyle = '#2c313a';
      ctx.fillRect(0, 0, W, H);
      if (window.NeonDashSprites) NeonDashSprites.drawSky(ctx, W, H, GROUND_Y, scrollX, frame);

      if (player.wx < 680 && gameState === 'playing') {
        const signX = 260 - scrollX * 0.08;
        const signY = 92;
        if (window.NeonDashSprites) NeonDashSprites.drawWorldSign(ctx, signX - 140, signY - 44, 280, 118);
        ctx.fillStyle = '#e8fbff';
        ctx.font = '700 22px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillText('NEON DASH', signX, signY + 2);
      }

      // Lava heat haze / dark smoke plumes above lava pits (slow parallax) - volcanic ash
      for (let cloud of poisonClouds) {
        const csx = cloud.wx - scrollX * 0.04; // very slow parallax, high in sky
        if (csx < -50 || csx > W + 50) continue;

        const cy = cloud.y;

        // Dark volcanic smoke body (charcoal + ember tint)
        ctx.fillStyle = 'rgba(55, 48, 42, 0.42)';
        ctx.beginPath();
        ctx.ellipse(csx, cy, cloud.width / 2, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Hotter inner lava glow haze (orange-red)
        ctx.fillStyle = 'rgba(175, 70, 30, 0.26)';
        ctx.beginPath();
        ctx.ellipse(csx - 2, cy - 5, cloud.width / 2.1, 6, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // === DISTANT BACKGROUND SCENERY: ROCKY VOLCANOES + LAVA RIVERS (parallax) ===
      // Drawn far back with strong parallax; animated lava flows & pools
      // Perf: alpha hoisted once (batch), reduced paths/quads/ellipses/strata/smoke, lines for rivers, lavaPulse reuse
      ctx.globalAlpha = 0.82;
      for (let b of backgroundElements) {
        const sx = b.wx - scrollX * b.parallax;
        if (sx < -90 || sx > W + 90) continue;

        const s = b.scale || 1;
        const baseY = b.y;
        const phase = (b.phase || 0) + frame * 0.031;
        const lavaPulse = Math.sin(phase * 1.3); // reuse sin for rivers/pool instead of repeated calls

        if (b.type === 'volcano') {
          // Rocky volcano: simplified (fewer beginPath/polys vs original multi-slope; still reads as cone + crater + flows)
          ctx.fillStyle = '#2a2521';
          ctx.beginPath();
          ctx.moveTo(sx - 26 * s, baseY + 52 * s);
          ctx.lineTo(sx, baseY - 44 * s);
          ctx.lineTo(sx + 32 * s, baseY + 54 * s);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#3a312b';
          ctx.beginPath();
          ctx.moveTo(sx - 18 * s, baseY + 50 * s);
          ctx.lineTo(sx, baseY - 40 * s);
          ctx.lineTo(sx + 22 * s, baseY + 52 * s);
          ctx.closePath();
          ctx.fill();
          // Reduced strata
          ctx.fillStyle = 'rgba(24, 21, 18, 0.6)';
          ctx.fillRect(sx - 20 * s, baseY + 10 * s, 40 * s, 2 * s);
          ctx.fillRect(sx - 16 * s, baseY + 28 * s, 32 * s, 2 * s);

          // Crater
          ctx.fillStyle = '#1f1a17';
          ctx.beginPath();
          ctx.ellipse(sx, baseY - 42 * s, 9 * s, 4.5 * s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(210, 85, 28, ${0.45 + 0.3 * lavaPulse})`;
          ctx.beginPath();
          ctx.ellipse(sx, baseY - 43 * s, 5.5 * s, 2.8 * s, 0, 0, Math.PI * 2);
          ctx.fill();

          // Lava rivers (cheaper line segments instead of quads; animated)
          ctx.strokeStyle = `rgba(245, 115, 35, ${0.55 + 0.3 * lavaPulse})`;
          ctx.lineWidth = 1.6 * s;
          ctx.beginPath();
          ctx.moveTo(sx - 3 * s, baseY - 38 * s);
          ctx.lineTo(sx - 18 * s, baseY - 6 * s);
          ctx.lineTo(sx - 27 * s, baseY + 46 * s);
          ctx.stroke();
          ctx.strokeStyle = `rgba(255, 140, 45, ${0.48 + 0.25 * Math.sin(phase * 1.65 + 1.8)})`;
          ctx.beginPath();
          ctx.moveTo(sx + 5 * s, baseY - 37 * s);
          ctx.lineTo(sx + 20 * s, baseY + 2 * s);
          ctx.lineTo(sx + 33 * s, baseY + 50 * s);
          ctx.stroke();
          ctx.lineWidth = 1;

          // Base pool
          ctx.fillStyle = 'rgba(175, 55, 18, 0.65)';
          ctx.beginPath();
          ctx.ellipse(sx + 4 * s, baseY + 55 * s, 15 * s, 4 * s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(240, 110, 30, ${0.4 + 0.25 * lavaPulse})`;
          ctx.beginPath();
          ctx.ellipse(sx + 4 * s, baseY + 54 * s, 9 * s, 2.2 * s, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (b.type === 'crag') {
          // Jagged midground rock crag / lava vent outcrop (lightly reduced)
          ctx.fillStyle = '#2c2723';
          ctx.fillRect(sx - 6 * s, baseY, 13 * s, 38 * s);
          ctx.fillStyle = '#342d27';
          ctx.beginPath();
          ctx.moveTo(sx - 8 * s, baseY + 6);
          ctx.lineTo(sx - 1 * s, baseY - 22 * s);
          ctx.lineTo(sx + 11 * s, baseY + 4 * s);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#251f1b';
          ctx.fillRect(sx - 10 * s, baseY + 15 * s, 5 * s, 3 * s);

          const ventOn = Math.sin(phase * 1.4) > -0.1;
          ctx.fillStyle = ventOn ? 'rgba(235, 95, 30, 0.65)' : 'rgba(235, 95, 30, 0.12)';
          ctx.fillRect(sx - 2 * s, baseY + 6 * s, 4.5 * s, 2 * s);
          ctx.fillRect(sx + 1 * s, baseY + 19 * s, 2.5 * s, 1.8 * s);

          ctx.fillStyle = 'rgba(160, 48, 15, 0.55)';
          ctx.beginPath();
          ctx.ellipse(sx + 2 * s, baseY + 40 * s, 8 * s, 2.5 * s, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;

      // === DRIFTING VOLCANIC ASH / SMOKE CLOUDS (repurposed background traffic layer) ===
      ctx.globalAlpha = 0.32;
      for (let ship of flyingShips) {
        const sx = ship.wx - scrollX * ship.parallax;
        if (sx < -110 || sx > W + 130) continue;

        const s = ship.scale;
        const sy = ship.y;

        // Puffy dark ash cloud body (multi layered ellipses)
        ctx.fillStyle = 'rgba(48, 45, 42, 0.75)';
        ctx.beginPath(); ctx.ellipse(sx + 8*s, sy + 2*s, 22*s, 7*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(sx + 22*s, sy - 1*s, 18*s, 9*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(sx - 2*s, sy + 3*s, 14*s, 6*s, 0, 0, Math.PI*2); ctx.fill();

        // Ember / lava glow core inside some plumes
        if ((Math.floor(ship.wx) % 3) !== 0) {
          ctx.fillStyle = 'rgba(210, 95, 35, 0.28)';
          ctx.beginPath(); ctx.ellipse(sx + 14*s, sy + 1*s, 6*s, 3*s, 0, 0, Math.PI*2); ctx.fill();
        }

        // Faint trailing ash wisps
        ctx.fillStyle = 'rgba(60, 57, 53, 0.25)';
        ctx.fillRect(sx - 18*s, sy + 1*s, 14*s, 3*s);
      }
      ctx.globalAlpha = 1;

      // === LAVA PTERODACTYL REPTILE BIRDS (gliding high in sky, lava themed, spit down fire)
      for (let p of pteros) {
        const sx = p.wx - scrollX;
        if (sx < -80 || sx > W + 80) continue;
        const sy = p.y;
        const flap = Math.sin(frame * 0.18 + p.phase) * 0.75;
        if (window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'ptero', sx, sy, 28, 20)) {
          continue;
        }
        // Outer lava/orange aura glow
        ctx.fillStyle = 'rgba(255, 110, 35, 0.18)';
        ctx.beginPath();
        ctx.ellipse(sx + 14, sy + 1, 22, 9 + flap * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        // Main body (dark red-black, lava cracks)
        ctx.fillStyle = '#2a1210';
        ctx.beginPath();
        ctx.ellipse(sx + 14, sy + 1, 16, 7 + flap * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#180a08';
        ctx.beginPath();
        ctx.ellipse(sx + 14, sy + 1, 10, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        // Head + sharp beak
        ctx.fillStyle = '#1a0a08';
        ctx.beginPath();
        ctx.ellipse(sx + 26, sy, 5, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff6622';
        ctx.beginPath();
        ctx.moveTo(sx + 29, sy);
        ctx.lineTo(sx + 38, sy - 1.5);
        ctx.lineTo(sx + 38, sy + 1.5);
        ctx.closePath();
        ctx.fill();
        // Eye
        ctx.fillStyle = '#ffaa33';
        ctx.beginPath();
        ctx.arc(sx + 27, sy - 0.8, 1.2, 0, Math.PI * 2);
        ctx.fill();
        // Long tail (waving)
        ctx.strokeStyle = '#120a08';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(sx + 2, sy + 1);
        ctx.quadraticCurveTo(sx - 12, sy + 4 + Math.sin(frame * 0.11 + p.phase) * 3, sx - 28, sy + 2 + Math.sin(frame * 0.09 + p.phase * 1.3) * 5);
        ctx.stroke();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = '#3a1a10';
        ctx.beginPath();
        ctx.moveTo(sx + 2, sy + 1);
        ctx.quadraticCurveTo(sx - 10, sy + 3, sx - 24, sy + 1);
        ctx.stroke();
        // Wings (flapping, lava vein glow)
        ctx.fillStyle = '#2a1210';
        ctx.beginPath();
        ctx.moveTo(sx + 8, sy);
        ctx.quadraticCurveTo(sx - 2, sy - 18 - flap * 2, sx + 4, sy - 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(sx + 20, sy);
        ctx.quadraticCurveTo(sx + 30, sy - 16 + flap * 1.5, sx + 24, sy - 1);
        ctx.fill();
        // Lava veins on wings (pulsing orange)
        ctx.strokeStyle = `rgba(255, 100, 30, ${0.5 + 0.4 * Math.sin(frame * 0.2 + p.phase)})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(sx + 5, sy - 1);
        ctx.lineTo(sx - 1, sy - 10);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(sx + 18, sy);
        ctx.lineTo(sx + 28, sy - 9);
        ctx.stroke();
        ctx.lineWidth = 1;
      }

      // === ROCKY LAVA GROUND / FLOOR (charred stone + molten seams) ===
      const floorTop = GROUND_Y - 2;

      // Precompute if any lava visible this frame (cheap loop; skips costly shadow/save when none)
