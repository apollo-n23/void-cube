      let hasVisibleLava = false;
      for (let gap of waterGaps) {
        const sx = gap.wx - scrollX;
        const gw = gap.width;
        if (sx + gw >= -20 && sx <= W + 20) { hasVisibleLava = true; break; }
      }

      // Subtle heat glow from lava pits / ground (conditional to avoid save/shadow thrash every frame)
      if (hasVisibleLava) {
        ctx.save();
        ctx.shadowColor = '#5a2a18';
        ctx.shadowBlur = 22;
        ctx.fillStyle = 'rgba(75, 38, 22, 0.18)';
        ctx.fillRect(0, floorTop - 7, W, 38);
        ctx.shadowBlur = 10;
        ctx.fillStyle = 'rgba(90, 45, 25, 0.12)';
        ctx.fillRect(0, floorTop - 1, W, 16);
        ctx.restore();
      }

      // Base charred rocky floor (dark slate / basalt)
      ctx.fillStyle = '#2f2a26';
      ctx.fillRect(0, floorTop, W, H - floorTop);
      if (window.NeonDashSprites) NeonDashSprites.drawGround(ctx, W, GROUND_Y, H, scrollX);

      // Rough top edge / lip
      ctx.fillStyle = '#3a3430';
      ctx.fillRect(0, floorTop, W, 3.2);

      // Cracked stone texture / seams (parallax scroll; reduced iters)
      ctx.fillStyle = 'rgba(22, 19, 17, 0.55)';
      const mOffset = (scrollX * 1.25) % 62;
      for (let i = -1; i < 11; i++) {
        const mx = i * 62 - mOffset + 12;
        ctx.fillRect(mx, floorTop + 6, 18, 1.6);
      }
      // Secondary cracks
      ctx.fillStyle = 'rgba(40, 36, 33, 0.35)';
      const mOffset2 = (scrollX * 0.55) % 104;
      for (let i = -1; i < 7; i++) {
        const mx = i * 104 - mOffset2 + 28;
        ctx.fillRect(mx, floorTop + 13, 32, 1.2);
      }
      // Occasional glowing lava seams in floor cracks (subtle)
      ctx.fillStyle = 'rgba(200, 75, 25, 0.22)';
      const seamOffset = (scrollX * 0.85) % 240;
      for (let i = -1; i < 2; i++) {
        const sx = i * 240 - seamOffset + 55;
        ctx.fillRect(sx, floorTop + 5, 7, 1.5);
      }

      // === LOW WALLS / BARRIERS (must jump over - solid but non-lethal) ===
      for (let wall of lowWalls) {
        const sx = wall.wx - scrollX;
        if (sx < -30 || sx > W + 30) continue;

        const wh = wall.height;
        const ww = wall.width;

        // Base stone-like block (dark volcanic rock)
        ctx.fillStyle = '#25211d';
        ctx.fillRect(sx, GROUND_Y - wh, ww, wh);

        // Top edge (slightly lighter, looks like a lip)
        ctx.fillStyle = '#322c27';
        ctx.fillRect(sx, GROUND_Y - wh, ww, 4);

        // Subtle top highlight line
        ctx.fillStyle = '#413831';
        ctx.fillRect(sx, GROUND_Y - wh, ww, 1.5);

        // Small vertical "support" lines for texture
        ctx.fillStyle = 'rgba(30, 26, 23, 0.6)';
        ctx.fillRect(sx + 3, GROUND_Y - wh + 3, 1.5, wh - 5);
        ctx.fillRect(sx + ww - 5, GROUND_Y - wh + 3, 1.5, wh - 5);
      }

      // === LAVA PITS (full glowing lava pools - deadly if fallen into) ===
      for (let gap of waterGaps) {
        const sx = gap.wx - scrollX;
        const gw = gap.width;
        if (sx + gw < -20 || sx > W + 20) continue;

        const pitDepth = 135; // deep lava pool visually

        ctx.fillStyle = '#2c211b';
        ctx.fillRect(sx - 1, floorTop - 1, gw + 2, 7);
        if (window.NeonDashSprites && NeonDashSprites.drawFluid(ctx, sx + 1, floorTop + 5, gw - 2, pitDepth, frame)) {
          continue;
        }
        ctx.fillStyle = '#6b1f12';
        ctx.fillRect(sx + 1, floorTop + 5, gw - 2, pitDepth);

        // Mid lava layer (rich red-orange)
        ctx.fillStyle = '#9c2a15';
        ctx.fillRect(sx + 2, floorTop + 8, gw - 4, pitDepth - 12);

        // Side wall lava glow (grouped early to batch)
        ctx.fillStyle = 'rgba(210, 70, 20, 0.35)';
        ctx.fillRect(sx + 1, floorTop + 18, 2, pitDepth - 10);
        ctx.fillRect(sx + gw - 3, floorTop + 18, 2, pitDepth - 10);

        // Upper brighter lava + surface (grouped)
        ctx.fillStyle = 'rgba(175, 45, 18, 0.95)';
        ctx.fillRect(sx + 1, floorTop + 5, gw - 2, 28);
        ctx.fillStyle = 'rgba(235, 85, 25, 0.85)';
        ctx.fillRect(sx + 1, floorTop + 6, gw - 2, 11);

        // Animated vertical flow streaks (reduced 3+2 -> 2+1)
        const flowT = (frame * 0.04) % (gw + 40);
        ctx.fillStyle = 'rgba(220, 70, 22, 0.28)';
        for (let f = 0; f < 2; f++) {
          const fx = sx + 4 + ((f * 17 + flowT * 0.6) % (gw - 8));
          ctx.fillRect(fx, floorTop + 9, 2.5, pitDepth - 18);
        }
        ctx.fillStyle = 'rgba(255, 120, 35, 0.18)';
        for (let f = 0; f < 1; f++) {
          const fx = sx + 8 + ((f * 23 + flowT * 0.9) % (gw - 10));
          ctx.fillRect(fx, floorTop + 12, 1.8, pitDepth - 25);
        }

        // Animated bubbling / churning (lower density: /20 + max 7 instead of /13+5; fewer arcs)
        const bubblePhase = (frame * 0.055) % (Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 145, 35, 0.8)';
        const numBubs = Math.max(3, Math.floor(gw / 20));
        for (let b = 0; b < numBubs && b < 7; b++) {
          const bx = sx + ((b * 17 + 4) % (gw - 6));
          const by = floorTop + 7 + ((Math.sin(bubblePhase + b * 1.7) + 1) * 5.5) + (b % 4) * 0.8;
          const br = 1.6 + Math.sin(bubblePhase * 1.15 + b) * 0.9;
          ctx.beginPath();
          ctx.arc(bx, by, Math.max(1, br), 0, Math.PI * 2);
          ctx.fill();
        }

        // Floating darker crust patches (reduced 3->2)
        ctx.fillStyle = 'rgba(55, 22, 12, 0.55)';
        const crustPhase = (frame * 0.018) % 30;
        for (let c = 0; c < 2; c++) {
          const cx = sx + 3 + ((c * 19 + crustPhase * 1.1) % (gw - 12));
          ctx.fillRect(cx, floorTop + 14 + (c % 2) * 3, 5 + (c % 2), 2.5);
        }

        // Side wall lava glow (deeper)
        ctx.fillStyle = 'rgba(245, 105, 30, 0.22)';
        ctx.fillRect(sx + 1, floorTop + 25, 1.5, pitDepth - 20);
        ctx.fillRect(sx + gw - 2.5, floorTop + 25, 1.5, pitDepth - 20);
      }

      // Erupting lava fireballs (pop up from lava then fall back in)
      for (let dart of poisonDarts) {
        const dsx = dart.wx - scrollX;
        const dsy = dart.y;
        if (dsx < -14 || dsx > W + 14) continue;
        if (window.NeonDashSprites && NeonDashSprites.drawShot(ctx, 'fire', dsx, dsy, frame, 20, 20, dart.vx, dart.vy)) continue;

        const r = 4.5 + Math.sin(frame * 0.18 + dsx) * 0.8; // pulsing radius

        // Outer fire glow
        ctx.fillStyle = 'rgba(255, 100, 20, 0.4)';
        ctx.beginPath();
        ctx.arc(dsx, dsy, r + 3, 0, Math.PI * 2);
        ctx.fill();

        // Main fireball (red-orange)
        ctx.fillStyle = '#ff5522';
        ctx.beginPath();
        ctx.arc(dsx, dsy, r, 0, Math.PI * 2);
        ctx.fill();

        // Hot yellow core
        ctx.fillStyle = '#ffdd66';
        ctx.beginPath();
        ctx.arc(dsx - 0.8, dsy - 0.6, r * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }

      // === ROCKY OUTCROPS & LAVA VENTS (midground pillars with flowing lava) ===
      // + burned trees mixed in for lava/volcano background (charred trunks, jagged branches, ember glows)
      for (let tree of alienTrees) {
        const sx = tree.wx - scrollX * tree.parallax;
        if (sx < -60 || sx > W + 60) continue;

        const s = tree.scale;
        const ty = tree.y;

        // Burned tree variant (roughly 1/3 of formations, pseudo-random per tree for variety)
        const isBurned = ((tree.wx * 31) | 0) % 3 === 0;
        if (isBurned) {
          // charred trunk (dark, fits lava world)
          ctx.fillStyle = '#1a140f';
          ctx.fillRect(sx - 2 * s, ty, 5 * s, 36 * s);

          // jagged burnt branches (no leaves, dark lines)
          ctx.strokeStyle = '#120d0a';
          ctx.lineWidth = 1.3 * s;
          ctx.beginPath();
          ctx.moveTo(sx + 0.5 * s, ty + 6 * s); ctx.lineTo(sx + 10 * s, ty + 1 * s);
          ctx.moveTo(sx - 0.5 * s, ty + 14 * s); ctx.lineTo(sx - 8 * s, ty + 7 * s);
          ctx.moveTo(sx + 1 * s, ty + 22 * s); ctx.lineTo(sx + 11 * s, ty + 17 * s);
          ctx.moveTo(sx, ty + 28 * s); ctx.lineTo(sx - 6 * s, ty + 24 * s);
          ctx.stroke();

          // glowing embers on branch tips (pulsing orange - lava/volcano theme)
          const eA = 0.35 + 0.45 * Math.sin(frame * 0.12 + tree.wx);
          ctx.fillStyle = `rgba(255, 110, 25, ${eA})`;
          ctx.fillRect(sx + 9 * s, ty, 2 * s, 1.5 * s);
          ctx.fillRect(sx - 7.5 * s, ty + 6 * s, 1.5 * s, 1 * s);
          ctx.fillRect(sx + 10 * s, ty + 16 * s, 1.8 * s, 1.2 * s);

          // wider charred base + faint rising ash
          ctx.fillStyle = '#0f0b08';
          ctx.fillRect(sx - 3.5 * s, ty + 32 * s, 8 * s, 6 * s);
          ctx.strokeStyle = 'rgba(55, 50, 45, 0.25)';
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          ctx.moveTo(sx - 0.5 * s, ty + 4 * s);
          ctx.lineTo(sx + 0.5 * s, ty - 3 * s);
          ctx.stroke();

          continue; // done, skip the rock pillar draw
        }

        // Main vertical rock pillar / jagged column (basalt)
        ctx.fillStyle = '#2f2925';
        ctx.fillRect(sx, ty, 5 * s, 38 * s);
        // Ledges / strata
        ctx.fillStyle = '#25201c';
        ctx.fillRect(sx - 4 * s, ty + 1 * s, 12 * s, 2.8 * s);
        ctx.fillRect(sx - 4 * s, ty + 24 * s, 12 * s, 2.8 * s);

        // Side rock spur
        ctx.fillStyle = '#26211d';
        ctx.fillRect(sx + 8 * s, ty + 3 * s, 4 * s, 30 * s);

        // Small outcrop / lava vent housing
        ctx.fillStyle = '#382f28';
        ctx.fillRect(sx - 7 * s, ty + 9 * s, 8 * s, 9 * s);
        // Vent / crack lines 
        ctx.fillStyle = '#201a16';
        ctx.fillRect(sx - 5.5 * s, ty + 11 * s, 6 * s, 1.2 * s);
        ctx.fillRect(sx - 5.5 * s, ty + 15 * s, 6 * s, 1.2 * s);

        // Lava glow from vent / crack (pulsing stronger)
        const ledPhase = (frame + Math.floor(Math.abs(tree.wx) % 53)) % 47;
        const lavaGlow = (ledPhase > 10 && ledPhase < 32) ? 0.75 : 0.18;
        ctx.fillStyle = `rgba(255, 105, 35, ${lavaGlow})`;
        ctx.fillRect(sx - 4 * s, ty + 12 * s, 2.2 * s, 2 * s);
        ctx.fillStyle = `rgba(255, 135, 50, ${lavaGlow * 0.7})`;
        ctx.fillRect(sx - 3.2 * s, ty + 17 * s, 1.4 * s, 1.3 * s);

        // Flowing lava streak down the rock face
        ctx.strokeStyle = `rgba(240, 100, 28, ${0.6 + 0.35 * Math.sin(frame * 0.09 + tree.wx)})`;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(sx + 2 * s, ty + 8 * s);
        ctx.lineTo(sx + 1.5 * s, ty + 20 * s);
        ctx.lineTo(sx + 3 * s, ty + 32 * s);
        ctx.stroke();
        ctx.strokeStyle = `rgba(255, 155, 55, ${0.35 + 0.25 * Math.sin(frame * 0.13 + tree.wx * 0.7)})`;
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(sx + 0.5 * s, ty + 10 * s);
        ctx.quadraticCurveTo(sx + 4 * s, ty + 18 * s, sx + 1 * s, ty + 29 * s);
        ctx.stroke();
        ctx.lineWidth = 1;

        // Lava pooling at base of rock
        ctx.fillStyle = 'rgba(155, 42, 14, 0.7)';
        ctx.beginPath();
        ctx.ellipse(sx + 2 * s, ty + 39 * s, 7 * s, 2.2 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(235, 95, 25, ${0.45 + 0.3 * Math.sin(frame * 0.1)})`;
        ctx.beginPath();
        ctx.ellipse(sx + 2 * s, ty + 38 * s, 4 * s, 1.1 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        // Very subtle rising volcanic gas wisps (grey, not neon)
        const steamT = frame * 0.021 + ((tree.wx * 5) % 21);
        ctx.strokeStyle = `rgba(85, 80, 75, ${0.09 + 0.06 * Math.sin(steamT)})`;
        ctx.lineWidth = 1.0;
        const steamX = sx - 1.5 * s;
        ctx.beginPath();
        ctx.moveTo(steamX, ty + 8 * s);
        ctx.lineTo(steamX + Math.sin(steamT * 0.65) * 1.4 * s, ty + 2 * s);
        ctx.stroke();
      }

      // === VERTICAL PATROLLING ALIENS (long tail, up/down movement) ===
      for (let e of verticalEnemies) {
        const sx = e.wx - scrollX;
        const sy = e.y;
        if (sx < -40 || sx > W + 40) continue;

        // Body (purple alien)
        ctx.fillStyle = '#5a2a7a';
        ctx.beginPath();
        ctx.ellipse(sx, sy, 13, 11, 0, 0, Math.PI * 2);
        ctx.fill();

        // Head
        ctx.fillStyle = '#7a3a9a';
        ctx.beginPath();
        ctx.arc(sx + 5, sy - 6, 7, 0, Math.PI * 2);
        ctx.fill();

        // Eyes (warning lights)
        ctx.fillStyle = '#88ddee';
        ctx.fillRect(sx + 7, sy - 8, 2, 2);
        ctx.fillRect(sx + 11, sy - 7, 2, 2);

        // Long tail (waving)
        ctx.strokeStyle = '#4a1a5a';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(sx - 8, sy + 4);
        const tailWave = Math.sin(frame * 0.09 + e.phase) * 6;
        ctx.quadraticCurveTo(sx - 22, sy + 12 + tailWave * 0.5, sx - 32, sy + 18 + tailWave);
        ctx.stroke();

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#6a3a7a';
        ctx.beginPath();
        ctx.moveTo(sx - 8, sy + 4);
        ctx.quadraticCurveTo(sx - 20, sy + 10 + tailWave * 0.3, sx - 30, sy + 16 + tailWave * 0.8);
        ctx.stroke();
      }

      // === OVAL TRAMPOLINES (scorched rock bounce pads before tall walls) ===
      for (let t of trampolines) {
        const sx = t.wx - scrollX;
        if (sx < -50 || sx > W + 50) continue;

        const tw = t.width;
        const ty = GROUND_Y - 3;

        // Soft heat glow under the rock pad
        ctx.fillStyle = 'rgba(210, 85, 30, 0.22)';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty + 4, tw / 2 + 8, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Main oval rock bounce pad (charred with lava rim)
        ctx.fillStyle = '#3a3129';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty, tw / 2, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        // Lava edge highlight
        ctx.fillStyle = 'rgba(220, 90, 25, 0.6)';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty - 1, tw / 2 - 1, 2.2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Inner highlight
        ctx.fillStyle = '#aaffee';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2 - 2, ty - 1, tw / 2 - 4, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Subtle edge ring
        ctx.strokeStyle = '#119977';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty, tw / 2, 5, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // === FLOATING PLATFORMS (dark rock with lava glow edges) ===
      for (let p of platforms) {
        const sway = (p.swayAmp || 0) * Math.sin((frame * 0.021) + (p.swayPhase || 0));
        const sx = p.wx - scrollX + sway;
        if (sx < -90 || sx > W + 90) continue;
        const py = p.y;

        // soft shadow (moves slightly with sway)
        ctx.fillStyle = 'rgba(0,0,0,0.32)';
        ctx.fillRect(sx + 3, py + p.height + 3, p.width - 6, 5);

        if (window.NeonDashSprites && NeonDashSprites.drawPlatform(ctx, sx, py, p.width, p.height)) {
          continue;
        }

        // main platform body (charred rock)
        ctx.fillStyle = '#2a2420';
        ctx.fillRect(sx, py, p.width, p.height);

        // lava glow top edge
        ctx.fillStyle = '#cc5522';
        ctx.fillRect(sx, py, p.width, 2);

        // inner hot highlight
        ctx.fillStyle = '#ff8844';
        ctx.fillRect(sx + 3, py + 2, p.width - 6, 1);

        // underside rock detail
        ctx.fillStyle = '#1f1814';
        ctx.fillRect(sx + 2, py + p.height - 3, p.width - 4, 2);

        // corner ember lights (lava orange)
        ctx.fillStyle = '#ffaa55';
        ctx.fillRect(sx + 5, py + 2.5, 2, 1);
        ctx.fillRect(sx + p.width - 8, py + 2.5, 2, 1);
      }

      // === FRIENDLY NPC (pink octagon with blue eyes, middle of level, bounces and speech bubble on approach) ===
      if (friendlyNPC) {
        const bob = Math.sin(friendlyNPC.bouncePhase || 0) * 5;
        const npcX = friendlyNPC.wx - scrollX;
        const npcBaseY = friendlyNPC.y;
        const drawY = npcBaseY - bob;
        const size = 44;
        const r = size / 2;

        if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'npc', npcX - r, drawY - r, size, size))) {
        ctx.fillStyle = '#ff88dd';
        ctx.strokeStyle = '#cc5599';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const ang = (i * Math.PI * 2 / 8) - Math.PI / 8;
          const x = npcX + Math.cos(ang) * r;
          const y = drawY + Math.sin(ang) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#4488ff';
        ctx.beginPath();
        ctx.arc(npcX - 5, drawY - 3, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(npcX + 5, drawY - 3, 3.5, 0, Math.PI * 2);
        ctx.fill();
        }

        // Speech bubble if approached
        // Disappears when NPC off screen (npcX check)
        if (friendlyNPC.approached && npcX > -50 && npcX < W + 50) {
          const boxW = 210;
          const boxH = 38;
          const boxX = Math.max(20, Math.min(W - boxW - 20, npcX - boxW / 2));
          const boxY = Math.max(12, drawY - 55);

          if (!(window.NeonDashSprites && NeonDashSprites.drawSpeechBubble(ctx, boxX, boxY, boxW, boxH, npcX, drawY - 2, ['Hey, are you here to solve the mystery?', 'Watch out for the boss!']))) {
            ctx.fillStyle = 'rgba(52, 8, 38, 0.94)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#ff79d0';
            ctx.strokeRect(boxX, boxY, boxW, boxH);
            ctx.fillStyle = '#ffe6f5';
            ctx.font = '11px Segoe UI, Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Hey, are you here to solve the mystery?', boxX + boxW / 2, boxY + 14);
            ctx.fillText('Watch out for the boss!', boxX + boxW / 2, boxY + 28);
          }
        }
      }

      // draw obstacles (triangles) - lava themed living hazards that wiggle L/R as if alive
      for (let o of obstacles) {
        const sx = o.wx - scrollX;
        if (sx < -30 || sx > W + 30) continue;

        const th = o.h;
        const tw = 27;
        const wiggle = Math.sin(frame * 0.065 + (o.wx || 0) * 0.015) * 1.6; // left to right wiggle - "alive"
        const drawX = sx + wiggle;

        // shadow under triangle
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.moveTo(drawX - tw/2 - 1, GROUND_Y + 3);
        ctx.lineTo(drawX + tw/2 + 1, GROUND_Y + 3);
        ctx.lineTo(drawX, GROUND_Y - th * 0.35);
        ctx.closePath();
        ctx.fill();

        if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'hazard', drawX - tw / 2, GROUND_Y - th, tw, th))) {
          // main triangle (hazard) - lava themed charred rock
          ctx.fillStyle = '#2c211b';
          ctx.beginPath();
          ctx.moveTo(drawX, GROUND_Y - th);
          ctx.lineTo(drawX - tw / 2, GROUND_Y + 0.5);
          ctx.lineTo(drawX + tw / 2, GROUND_Y + 0.5);
          ctx.closePath();
          ctx.fill();

          // pulsing lava glow top lip / edge (themed)
          const lavaAlpha = 0.55 + 0.35 * Math.sin(frame * 0.1 + (o.wx || 0));
          ctx.fillStyle = `rgba(255, 100, 30, ${lavaAlpha})`;
          ctx.beginPath();
          ctx.moveTo(drawX, GROUND_Y - th);
          ctx.lineTo(drawX - tw / 2 + 1, GROUND_Y - 1);
          ctx.lineTo(drawX + tw / 2 - 1, GROUND_Y - 1);
          ctx.closePath();
          ctx.fill();

          // lava cracks / small vents on the face (animated glow)
          ctx.fillStyle = 'rgba(220, 65, 20, 0.65)';
          const crackY = GROUND_Y - th * 0.55 + Math.sin(frame * 0.07 + o.wx) * 2;
          ctx.fillRect(drawX - 4, crackY, 8, 1.5);
          ctx.fillRect(drawX - 2, GROUND_Y - th * 0.3, 4, 1);

          // top edge (cracked rock)
          ctx.strokeStyle = '#4a3a30';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(drawX, GROUND_Y - th);
          ctx.lineTo(drawX - tw / 2 + 2, GROUND_Y - 0.5);
          ctx.stroke();

          // small accent / ember line
          ctx.fillStyle = '#3a2a22';

        ctx.fillRect(px + 6, py + 5, 2, 2);
      }

      // === VISIBLE ENERGY SHIELD (mario-style power-up - absorbs 1 hit, then grants 5s invulnerability) ===
      if (player.hasShield) {
        const cx = px + player.w / 2;
        const cy = py + player.h / 2 + 1;
        if (!(window.NeonDashSprites && NeonDashSprites.drawShield(ctx, cx, cy, player.w, player.h, frame))) {
          const pulse = Math.sin(frame * 0.21) * 1.8;
          ctx.save();
          ctx.strokeStyle = '#66ddff';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.ellipse(cx, cy, player.w / 2 + 10 + pulse * 0.4, player.h / 2 + 13 + pulse * 0.5, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      // Subtle invulnerability afterglow (5 seconds after shield pops - no bubble, just faint protection indicator)
      if (!player.hasShield && frame < player.invulnUntil) {
        const cx = px + player.w / 2;
        const cy = py + player.h / 2 + 1;
        const remaining = (player.invulnUntil - frame) / 300;
        const pulse = Math.sin(frame * 0.18) * (1.5 + remaining * 2);

        ctx.save();
        ctx.strokeStyle = 'rgba(140, 200, 255, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 3;
        ctx.beginPath();
        ctx.ellipse(cx, cy, player.w / 2 + 6 + pulse, player.h / 2 + 8 + pulse, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // particles
      for (let p of particles) {
        const baseAlpha = (p.c === '#66ddff') ? 0.22 : 0.15;
        const alpha = Math.max(baseAlpha, p.life / (p.c === '#66ddff' ? 85 : 42));
        ctx.fillStyle = p.c || '#88ccdd';
        ctx.globalAlpha = alpha;

        const psize = p.size || 1.8;
        ctx.fillRect(p.x - scrollX, p.y, psize, psize);
      }
      ctx.globalAlpha = 1;

      // === ICE BLAST INDICATOR (glowing white snowflake that follows player when collected; single use) ===
      if (hasIceBlast) {
        const px = player.wx - scrollX;
        const py = player.y;
        const indX = px + player.w + 14 + Math.sin(frame * 0.13) * 3.5;
        const indY = py - 8 + Math.sin(frame * 0.09) * 2.5;
        const ipulse = 0.75 + Math.sin(frame * 0.18) * 0.35;
        const isize = 7 + ipulse * 1.5;

        ctx.save();
        ctx.globalAlpha = 0.85 + ipulse * 0.15;
        ctx.shadowColor = '#88bbff';
        ctx.shadowBlur = 10 + ipulse * 4;
        ctx.strokeStyle = '#ffffff';
        ctx.fillStyle = '#ccffff';
        ctx.lineWidth = 1.2;

        // 6-pointed snowflake / crystal using lines (pulsing)
        ctx.beginPath();
        for (let a = 0; a < 6; a++) {
          const ang = (a * Math.PI / 3) + frame * 0.01;
          const bx = indX + Math.cos(ang) * (isize * 0.3);
          const by = indY + Math.sin(ang) * (isize * 0.3);
          ctx.moveTo(bx, by);
          ctx.lineTo(indX + Math.cos(ang) * isize, indY + Math.sin(ang) * isize);
          // small branch arms
          const ba = ang + 0.7;
          ctx.moveTo(indX + Math.cos(ang) * (isize * 0.55), indY + Math.sin(ang) * (isize * 0.55));
          ctx.lineTo(indX + Math.cos(ba) * (isize * 0.35), indY + Math.sin(ba) * (isize * 0.35));
          const bb = ang - 0.7;
          ctx.moveTo(indX + Math.cos(ang) * (isize * 0.55), indY + Math.sin(ang) * (isize * 0.55));
          ctx.lineTo(indX + Math.cos(bb) * (isize * 0.35), indY + Math.sin(bb) * (isize * 0.35));
        }
        ctx.stroke();

        // center dot
        ctx.beginPath();
        ctx.arc(indX, indY, 1.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // Simple FPS counter (bottom right, only while playing) - helps verify the perf fixes from the two agents
      if (gameState === 'playing') {
        ctx.fillStyle = 'rgba(136, 153, 170, 0.7)';
        ctx.font = '9px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(Math.round(fps) + ' fps', W - 8, H - 8);
        ctx.textAlign = 'left';
      }

      // === UI OVERLAYS ===
      if (gameState === 'playing') {
        // (Water/acid vat tutorial removed for L3 - players remember from Level 2)

        // Second green Neon tutorial (only for the second green orb)
        if (secondGreenTutorialActive) {
          // Find the most recent green orb on screen for pointing
          let targetOrb = null;
          for (let o of neonOrbs) {
            if (o.value === 5) {
              const osx = o.wx - scrollX;
              if (osx > 50 && osx < W - 50) {
                targetOrb = o;
                break;
              }
            }
          }

          if (targetOrb) {
            const gox = targetOrb.wx - scrollX;
            const goy = targetOrb.y;

            const boxX = W / 2 - 145;
            const boxY = 38;
            const boxW = 290;
            const boxH = 36;

            ctx.fillStyle = 'rgba(15, 40, 25, 0.88)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#55cc88';
            ctx.lineWidth = 1.8;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            ctx.fillStyle = '#99ffbb';
            ctx.font = '13px Segoe UI, Arial';
            ctx.textAlign = 'center';
            ctx.fillText('The green Neon Tokes are worth Extra Points!', W / 2, boxY + 23);

            // Green pointing line
            ctx.strokeStyle = '#66dd99';
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.moveTo(W / 2, boxY + boxH);
            ctx.lineTo(gox, goy - 8);
            ctx.stroke();
          } else {
            // If no green orb visible, dismiss the tutorial
            secondGreenTutorialActive = false;
          }
        }

        // Ice blaster tutorial (only while the floating ice cube exists; dynamic pointer + exact text)
        // Only for first instance (iceSpawnIndex starts at 0, increments after each spawn; <=1 means first only)
        if (icePowerUp && iceSpawnIndex <= 1) {
          const icx = icePowerUp.wx - scrollX;
          const icy = icePowerUp.y;
          const isOnScreen = icx > -40 && icx < W + 40;
          if (isOnScreen) {
            const boxW = 210;
            const boxH = 38;
            const boxX = Math.max(20, Math.min(W - boxW - 20, icx - boxW / 2));
            const boxY = Math.max(12, icy - 52);

            ctx.fillStyle = 'rgba(18, 25, 38, 0.92)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#aaddff';
            ctx.lineWidth = 1.6;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            ctx.fillStyle = '#ccddff';
            ctx.font = '11px Segoe UI, Arial';
            ctx.textAlign = 'center';
            ctx.fillText('This is an ice blaster.', boxX + boxW / 2, boxY + 14);
            ctx.fillText('Press DOWN to detonate!', boxX + boxW / 2, boxY + 28);

            // Dynamic line from bottom of rect pointing to the ice powerup
            ctx.strokeStyle = '#88bbdd';
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.moveTo(boxX + boxW / 2, boxY + boxH);
            const cpX = boxX + boxW / 2 + (icx - (boxX + boxW / 2)) * 0.3;
            const cpY = boxY + boxH + 12;
            ctx.quadraticCurveTo(cpX, cpY, icx + 6, icy - 2);
            ctx.stroke();
          }
        }

        // Stomp tutorial for the first fiery sphere enemy
        if (firstSpecial && !firstSpecialTutorialShown) {
          const fsx = firstSpecial.wx - scrollX + (firstSpecial.w || 30) / 2;
          const fsy = GROUND_Y - (firstSpecial.h || 64) - 5; // near top of the enemy
          const playerHasPassed = player.wx > firstSpecial.wx + (firstSpecial.w || 30) + 100;
          const isOnScreen = fsx > -30 && fsx < W + 50;
          if (!playerHasPassed && isOnScreen) {
            const boxX = W / 2 - 155;
            const boxY = 38;
            const boxW = 310;
            const boxH = 36;

            ctx.fillStyle = 'rgba(25, 30, 42, 0.92)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#7788aa';
            ctx.lineWidth = 1.8;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            ctx.fillStyle = '#aabbdd';
            ctx.font = '12px Segoe UI, Arial';
            ctx.textAlign = 'center';
            ctx.fillText('You can now jump on these enemies to kill them', W / 2, boxY + 23);

            // Dynamic line pointing to the enemy
            ctx.strokeStyle = '#667799';
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.moveTo(W / 2, boxY + boxH);
            ctx.lineTo(fsx, fsy);
            ctx.stroke();
          } else if (playerHasPassed) {
            firstSpecialTutorialShown = true;
          }
        }

        // distance readout (top right)
        ctx.font = '700 13px Segoe UI, Arial';
        ctx.textAlign = 'right';
        ctx.fillStyle = '#77bbdd';
        ctx.fillText('DISTANCE', W - 18, 24);
        ctx.font = '700 22px Consolas, monospace';
        ctx.fillStyle = '#aaddff';
        ctx.fillText(String(baseScore + score).padStart(5, '0'), W - 18, 48);

        // small jump counter
        ctx.font = '11px Consolas, monospace';
        ctx.fillStyle = '#5588aa';
        ctx.fillText('JUMPS ' + jumpCount, W - 18, 66);

        // Neon Score (blue + green orbs collected)
        ctx.font = '700 13px Segoe UI, Arial';
        ctx.fillStyle = '#4466cc';
        ctx.fillText('NEON', W - 18, 84);
        ctx.font = '700 20px Consolas, monospace';
        ctx.fillStyle = '#6688ff';
        ctx.fillText(String(neonScore).padStart(3, '0'), W - 18, 104);

        // Level Progress bar (fills as player approaches the ending)
        const progress = Math.min(1, Math.max(0, player.wx / 6127));
        const barY = 8;
        const barW = 180;
        const barH = 5;

        // Background track
        ctx.fillStyle = 'rgba(30, 50, 90, 0.6)';
        ctx.fillRect(W / 2 - barW / 2, barY, barW, barH);

        // Neon fill
        ctx.fillStyle = '#66aaff';
        ctx.fillRect(W / 2 - barW / 2, barY, barW * progress, barH);

        // Subtle glow outline
        ctx.strokeStyle = 'rgba(120, 180, 255, 0.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(W / 2 - barW / 2 - 1, barY - 1, barW + 2, barH + 2);
      }

      if (gameState === 'start') {
        if (!(window.NeonDashSprites && NeonDashSprites.drawHudPlate(ctx, W, H))) {
          ctx.fillStyle = 'rgba(2, 7, 15, 0.48)';
          ctx.fillRect(W / 2 - 320, H / 2 - 150, 640, 300);
        }

        ctx.font = '700 36px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#88d4ff';
        ctx.fillText('NEON DASH', W / 2, H / 2 - 52);

        ctx.font = '13px Consolas, monospace';
        ctx.fillStyle = '#5a8fb8';
        ctx.fillText('VOLCANO HAZARD PROTOCOL', W / 2, H / 2 - 26);

        ctx.font = '13px Segoe UI, Arial';
        ctx.fillStyle = '#6699bb';
        ctx.fillText('ARROW KEYS OR A/D  —  MOVE', W / 2, H / 2 + 18);
        ctx.fillText('SPACE  —  JUMP TRIANGLES + MONSTERS', W / 2, H / 2 + 36);

        ctx.font = '12px Consolas, monospace';
        ctx.fillStyle = '#447799';
        ctx.fillText('PRESS SPACE OR CLICK TO START', W / 2, H / 2 + 72);
      }

      if (gameState === 'over') {
        if (!(window.NeonDashSprites && NeonDashSprites.drawHudPlate(ctx, W, H))) {
          ctx.fillStyle = 'rgba(3, 6, 12, 0.48)';
          ctx.fillRect(W / 2 - 320, H / 2 - 150, 640, 300);
        }

        ctx.font = '700 28px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#cc7766';
        ctx.fillText('COLLISION DETECTED', W / 2, H / 2 - 38);

        ctx.font = '15px Consolas, monospace';
        ctx.fillStyle = '#aaddff';
        ctx.fillText('DISTANCE TRAVELED: ' + String(baseScore + score).padStart(5, '0'), W / 2, H / 2 + 4);

        if (baseScore + score === best && baseScore + score > 0) {
          ctx.fillStyle = '#aaccdd';
          ctx.fillText('NEW PERSONAL BEST', W / 2, H / 2 + 24);
        } else if (best > 0) {
          ctx.fillStyle = '#6688aa';
          ctx.fillText('BEST: ' + String(best).padStart(5, '0'), W / 2, H / 2 + 24);
        }

        ctx.font = '12px Segoe UI, Arial';
        ctx.fillStyle = '#5588aa';
        ctx.fillText('PRESS R  OR  CLICK TO RESTART', W / 2, H / 2 + 58);
      }

      if (gameState === 'complete') {
        if (!(window.NeonDashSprites && NeonDashSprites.drawHudPlate(ctx, W, H))) {
          ctx.fillStyle = 'rgba(2, 6, 14, 0.48)';
          ctx.fillRect(W / 2 - 320, H / 2 - 150, 640, 300);
        }

        ctx.font = '700 32px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#66ddff';
        ctx.fillText('LEVEL COMPLETE', W / 2, H / 2 - 52);

        ctx.font = '15px Consolas, monospace';
        ctx.fillStyle = '#aaddff';
        ctx.fillText('DISTANCE TRAVELED: ' + String(baseScore + score).padStart(5, '0'), W / 2, H / 2 + 2);

        ctx.font = '13px Segoe UI, Arial';
        ctx.fillStyle = '#88bbdd';
        ctx.fillText('JUMPS: ' + jumpCount, W / 2, H / 2 + 24);

        ctx.font = '15px Consolas, monospace';
        ctx.fillStyle = '#88ffbb';
        ctx.fillText('NEON COLLECTED: ' + neonScore, W / 2, H / 2 + 48);

        if (baseScore + score === best) {
          ctx.fillStyle = '#aaccdd';
          ctx.fillText('NEW PERSONAL BEST!', W / 2, H / 2 + 72);
        }

        ctx.font = '12px Segoe UI, Arial';
        ctx.fillStyle = '#5588aa';
        ctx.fillText('PRESS R  OR  CLICK TO PLAY AGAIN', W / 2, H / 2 + 96);
      }
    }

    // Show/hide Level 4 replay link based on game state
    // NOTE: intentionally not called every frame anymore (DOM getElement+style in rAF was contributing to micro-lag/jank).
    function updateLevel3LinkVisibility() {
      const container = document.getElementById('level3-link-container');
      if (container) {
        container.style.display = (gameState === 'complete') ? 'block' : 'none';
      }
    }

    // Show/hide Next Level (L5) link based on game state
    function updateNextLevelLinkVisibility() {
      const container = document.getElementById('next-level-link-container');
      if (container) {
        container.style.display = (gameState === 'complete') ? 'block' : 'none';
      }
    }

    function gameLoop() {
      try {
        update();
        draw();
        // updateLevel3LinkVisibility() REMOVED from per-frame (was causing subtle DOM/reflow cost in rAF hot path).
        // Now called explicitly only on gameState transitions to 'complete'/'over'/'playing'.
      } catch (err) {
        console.error('[Neon Dash] gameLoop error:', err);
      } finally {
        requestAnimationFrame(gameLoop);
      }
    }

    function startPlaying() {
      getAudioCtx();
      if (gameState === 'start') {
        gameState = 'playing';
      } else if (gameState === 'over' || gameState === 'complete') {
        resetGame();
        gameState = 'playing';
      }
      updateLevel3LinkVisibility();
      updateNextLevelLinkVisibility();
    }

    // Save cumulative score when proceeding to Level 5 (so it carries over)
    function saveCumulativeForNextLevel() {
      try {
        const finalForThisLevel = baseScore + score;
        localStorage.setItem('neonDashCumulativeScore', String(finalForThisLevel));
        localStorage.setItem('neonDashCumulativeNeon', String(neonScore));
      } catch(e){}
    }

    function init() {
      loadBest();
      try {
        baseScore = parseInt(localStorage.getItem('neonDashCumulativeScore') || '0', 10) || 0;
        neonAtLevelStart = parseInt(localStorage.getItem('neonDashCumulativeNeon') || '0', 10) || 0;
      } catch(e) { baseScore = 0; neonAtLevelStart = 0; }
      resetGame();
      updateLevel3LinkVisibility();

      // keyboard
      window.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        getAudioCtx();

        if (e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          if (gameState !== 'playing') {
            startPlaying();
          }
        }
        if (e.key === 'ArrowDown') {
          e.preventDefault(); // for ice blast detonation
        }
        if (e.key === 'm' || e.key === 'M') {
          toggleMute();
        }
        if ((e.key === 'r' || e.key === 'R') && (gameState === 'over' || gameState === 'complete')) {
          resetGame();
          gameState = 'playing';
          updateLevel3LinkVisibility();
          updateNextLevelLinkVisibility();
        }
      });

      window.addEventListener('keyup', (e) => {
        keys[e.key] = false;
      });

      // mouse / touch start
      canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        startPlaying();
      });
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startPlaying();
      }, { passive: false });

      // prevent space from scrolling page
      window.addEventListener('keydown', (e) => {
        if (e.key === ' ' && document.activeElement === document.body) {
          e.preventDefault();
        }
      });

      // initial draw
      draw();

      // kick off loop
      gameLoop();

      // Attach handler to next-level link to persist cumulative score (like previous levels)
      const nextLinkEl = document.getElementById('next-level-link');
      if (nextLinkEl) {
        nextLinkEl.addEventListener('click', saveCumulativeForNextLevel);
      }

      // subtle console note
      console.log('%c[NEON DASH LEVEL 4] Arrow keys / A D to move, Space to jump. Avoid the lava pits and fiery spheres. (Lava hazards wiggle, burned trees in bg)', 'color:#553322');
    }

    // boot
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
