        // Brighter edge highlight
        ctx.strokeStyle = '#88ccee';
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // Inner detail (small cross / emblem)
        ctx.fillStyle = '#aaddff';
        ctx.fillRect(pux - 1.5, puy - 4, 3, 1.2);
        ctx.fillRect(pux - 1, puy - 6, 2, 5);

        ctx.restore();
        }
      }

      // === ICE POWERUP (snowflake icon, rapid white/blue glow — visual only) ===
      if (icePowerUp) {
        // Center on former 12×12 cube so hitbox stays aligned
        const icx = icePowerUp.wx - scrollX + 6;
        const icy = icePowerUp.y + 6;
        // Fast white ↔ blue oscillation (soft dreamy neon, not harsh)
        const t = frame * 0.48;
        const blend = 0.5 + 0.5 * Math.sin(t); // 0 = blue, 1 = white
        const r = Math.floor(140 + 115 * blend);
        const g = Math.floor(190 + 65 * blend);
        const b = 255;
        const glowColor = `rgb(${r},${g},${b})`;
        const pulse = 0.65 + 0.35 * Math.sin(t * 1.15);
        const size = 7.2;

        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Soft outer halo
        ctx.globalAlpha = 0.12 + 0.1 * pulse;
        ctx.fillStyle = glowColor;
        ctx.beginPath();
        ctx.arc(icx, icy, size + 5.5, 0, Math.PI * 2);
        ctx.fill();

        // Snowflake arms + glow
        ctx.globalAlpha = 0.78 + 0.22 * pulse;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 10 + pulse * 12;
        ctx.strokeStyle = glowColor;
        ctx.lineWidth = 1.35;
        ctx.beginPath();
        for (let a = 0; a < 6; a++) {
          const ang = a * Math.PI / 3;
          const cos = Math.cos(ang);
          const sin = Math.sin(ang);
          // main arm
          ctx.moveTo(icx, icy);
          ctx.lineTo(icx + cos * size, icy + sin * size);
          // mid branches
          const mx = icx + cos * size * 0.52;
          const my = icy + sin * size * 0.52;
          const br = size * 0.34;
          ctx.moveTo(mx, my);
          ctx.lineTo(mx + Math.cos(ang + 0.85) * br, my + Math.sin(ang + 0.85) * br);
          ctx.moveTo(mx, my);
          ctx.lineTo(mx + Math.cos(ang - 0.85) * br, my + Math.sin(ang - 0.85) * br);
          // tip V
          const tx = icx + cos * size * 0.78;
          const ty = icy + sin * size * 0.78;
          const tip = size * 0.22;
          ctx.moveTo(tx, ty);
          ctx.lineTo(tx + Math.cos(ang + 0.7) * tip, ty + Math.sin(ang + 0.7) * tip);
          ctx.moveTo(tx, ty);
          ctx.lineTo(tx + Math.cos(ang - 0.7) * tip, ty + Math.sin(ang - 0.7) * tip);
        }
        ctx.stroke();

        // Bright core (reads at small size)
        ctx.shadowBlur = 8 + pulse * 6;
        ctx.fillStyle = `rgba(255,255,255,${0.55 + 0.4 * blend})`;
        ctx.beginPath();
        ctx.arc(icx, icy, 1.7 + pulse * 0.35, 0, Math.PI * 2);
        ctx.fill();

        // Soft white rim pass for dreamy contrast on blue frames
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 0.35 + 0.45 * blend;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 0.85;
        ctx.beginPath();
        for (let a = 0; a < 6; a++) {
          const ang = a * Math.PI / 3;
          ctx.moveTo(icx, icy);
          ctx.lineTo(icx + Math.cos(ang) * size * 0.72, icy + Math.sin(ang) * size * 0.72);
        }
        ctx.stroke();

        ctx.restore();
      }

      // === AIR BUBBLES (draw before player; large pass-through oxygen pockets) ===
      for (let b of airBubbles) {
        const bx = b.wx - scrollX;
        const by = b.y;
        // cull off-screen
        if (bx + b.r < -20 || bx - b.r > W + 20 || by + b.r < -20 || by - b.r > H + 20) continue;

        const pulse = 0.92 + Math.sin(frame * 0.06 + b.bobPhase) * 0.06;
        const r = b.r * pulse;

        if (window.NeonDashSprites) {
          ctx.save();
          ctx.globalAlpha = 0.82;
          const drew = NeonDashSprites.drawSprite(ctx, 'bubble', bx - r, by - r, r * 2, r * 2);
          ctx.restore();
          if (drew) continue;
        }

        ctx.save();
        // Soft outer glow
        ctx.shadowColor = 'rgba(100, 220, 255, 0.55)';
        ctx.shadowBlur = 18;
        const grad = ctx.createRadialGradient(bx - r * 0.25, by - r * 0.3, r * 0.08, bx, by, r);
        grad.addColorStop(0, 'rgba(200, 245, 255, 0.22)');
        grad.addColorStop(0.45, 'rgba(80, 190, 230, 0.12)');
        grad.addColorStop(0.85, 'rgba(40, 140, 200, 0.08)');
        grad.addColorStop(1, 'rgba(30, 100, 160, 0.02)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bx, by, r, 0, Math.PI * 2);
        ctx.fill();

        // Rim
        ctx.shadowBlur = 8;
        ctx.strokeStyle = 'rgba(160, 230, 255, 0.55)';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(bx, by, r * 0.98, 0, Math.PI * 2);
        ctx.stroke();

        // Specular highlight (top-left)
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.beginPath();
        ctx.ellipse(bx - r * 0.28, by - r * 0.32, r * 0.18, r * 0.12, -0.4, 0, Math.PI * 2);
        ctx.fill();
        // Smaller secondary highlight
        ctx.fillStyle = 'rgba(220, 250, 255, 0.28)';
        ctx.beginPath();
        ctx.arc(bx + r * 0.22, by + r * 0.18, r * 0.07, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // draw player cube (underwater bob; neon boost glow; death: grey + float to surface)
      if (gameState === 'over' && !deathAnim) {
        deathAnim = { timer: 0, greyT: 0, y: player.y, wx: player.wx };
      }
      const deathActive = gameState === 'over' && deathAnim;
      const greyT = deathActive ? deathAnim.greyT : 0;
      const neonBoostDraw = !deathActive && frame < neonBoostUntil;
      const waterBob = (gameState === 'playing' && wasAirborne)
        ? Math.sin(frame * 0.14) * 1.35
        : (deathActive ? Math.sin(deathAnim.timer * 0.11) * 1.1 : 0);
      const px = (deathActive ? deathAnim.wx : player.wx) - scrollX;
      const py = (deathActive ? deathAnim.y : player.y) + waterBob;

      // soft drop shadow (fade/lift during death float)
      if (!deathActive || deathAnim.y > GROUND_Y - 80) {
        const shadowA = deathActive ? Math.max(0, 0.45 * (1 - greyT) * 0.5) : 0.45;
        ctx.fillStyle = 'rgba(0, 20, 40, ' + shadowA + ')';
        ctx.fillRect(px + 5, GROUND_Y - 1, player.w - 3, 5);
      }

      // Bright neon aura while gas boost is active (suppressed during death)
      if (neonBoostDraw) {
        const cx = px + player.w / 2;
        const cy = py + player.h / 2;
        const pulse = Math.sin(frame * 0.28) * 2.5;
        ctx.save();
        ctx.shadowColor = (Math.floor(frame / 6) % 2 === 0) ? '#66ffff' : '#ff66ee';
        ctx.shadowBlur = 22 + pulse;
        ctx.fillStyle = 'rgba(120, 255, 255, 0.35)';
        ctx.beginPath();
        ctx.ellipse(cx, cy, player.w / 2 + 10 + pulse * 0.4, player.h / 2 + 12 + pulse * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 14;
        ctx.strokeStyle = 'rgba(255, 100, 230, 0.65)';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, player.w / 2 + 7 + pulse * 0.3, player.h / 2 + 9 + pulse * 0.3, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // Color lerp: bright cyan (or boost cyan) → dark grey on death
      function lerpChan(a, b, t) { return Math.round(a + (b - a) * t); }
      // Boost base colors (from C) when neonBoostDraw; normal cyan otherwise
      const bodyR = lerpChan(neonBoostDraw ? 0x9a : 0x5f, 0x2a, greyT);
      const bodyG = lerpChan(neonBoostDraw ? 0xf0 : 0xd0, 0x2c, greyT);
      const bodyB = lerpChan(0xff, 0x30, greyT);
      const hiR = lerpChan(neonBoostDraw ? 0xe8 : 0xa8, 0x48, greyT);
      const hiG = lerpChan(0xe8, 0x4a, greyT);
      const hiB = lerpChan(0xff, 0x4e, greyT);
      const shR = lerpChan(neonBoostDraw ? 0x44 : 0x1a, 0x14, greyT);
      const shG = lerpChan(neonBoostDraw ? 0xb8 : 0x8f, 0x16, greyT);
      const shB = lerpChan(neonBoostDraw ? 0xd8 : 0xb8, 0x18, greyT);
      const outR = lerpChan(neonBoostDraw ? 0xff : 0x0c, 0x10, greyT);
      const outG = lerpChan(neonBoostDraw ? 0x66 : 0x3a, 0x12, greyT);
      const outB = lerpChan(neonBoostDraw ? 0xee : 0x4f, 0x14, greyT);

      ctx.save();
      if (deathActive) {
        // Slight dissolve as it nears the surface
        const nearSurface = deathAnim.y < 60 ? (60 - deathAnim.y) / 50 : 0;
        ctx.globalAlpha = Math.max(0.35, 1 - nearSurface * 0.45);
      }

      if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'player', px, py, player.w, player.h))) {
      // main cube body
      ctx.fillStyle = 'rgb(' + bodyR + ',' + bodyG + ',' + bodyB + ')';
      ctx.fillRect(px, py, player.w, player.h);

      // top face highlight (cube shading)
      ctx.fillStyle = 'rgb(' + hiR + ',' + hiG + ',' + hiB + ')';
      ctx.fillRect(px + 2, py + 2, player.w - 4, 5);

      // left face highlight
      ctx.fillRect(px + 2, py + 2, 4, player.h - 4);

      // bottom-right bevel (shadow)
      ctx.fillStyle = 'rgb(' + shR + ',' + shG + ',' + shB + ')';
      ctx.fillRect(px + player.w - 5, py + 5, 3, player.h - 6);
      ctx.fillRect(px + 5, py + player.h - 5, player.w - 8, 3);

      // crisp outline (hotter neon when boosted)
      ctx.strokeStyle = 'rgb(' + outR + ',' + outG + ',' + outB + ')';
      ctx.lineWidth = neonBoostDraw ? 2 : 1.5;
      ctx.strokeRect(px + 0.75, py + 0.75, player.w - 1.5, player.h - 1.5);

      // small "light" dot on cube (dims on death; brighter when boosted)
      ctx.fillStyle = 'rgba(255,255,255,' + ((neonBoostDraw ? 0.95 : 0.6) * (1 - greyT * 0.85)) + ')';
      ctx.fillRect(px + 6, py + 5, 2, 2);
      }
      ctx.restore();

      // === VISIBLE ENERGY SHIELD (mario-style power-up - absorbs 1 hit, then grants 5s invulnerability) ===
      if (player.hasShield && !deathActive) {
        const cx = px + player.w / 2;
        const cy = py + player.h / 2 + 1;
        if (!(window.NeonDashSprites && NeonDashSprites.drawShield(ctx, cx, cy, player.w, player.h, frame))) {
          const pulse = Math.sin(frame * 0.21) * 1.8;
          ctx.save();
          ctx.strokeStyle = '#66ddff';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.ellipse(cx, cy, player.w / 2 + 10 + pulse * 0.4, player.h / 2 + 13 + pulse * 0.5, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      // Subtle invulnerability afterglow (5 seconds after shield pops - no bubble, just faint protection indicator)
      if (!player.hasShield && frame < player.invulnUntil) {
        const cx = px + player.w / 2;
        const cy = py + player.h / 2 + 1;
        const remaining = (player.invulnUntil - frame) / 300;
        const pulse = Math.sin(frame * 0.18) * (1.5 + remaining * 2);

        ctx.save();
        ctx.strokeStyle = 'rgba(140, 200, 255, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 3;
        ctx.beginPath();
        ctx.ellipse(cx, cy, player.w / 2 + 6 + pulse, player.h / 2 + 8 + pulse, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // === OXYGEN METER (above player cube; visible while playing) ===
      if (gameState === 'playing') {
        const o2Ratio = Math.max(0, Math.min(1, oxygen / OXYGEN_MAX));
        const barW = 34;
        const barH = 5;
        const barX = px + player.w / 2 - barW / 2;
        const barY = py - 14;
        const pulseLow = o2Ratio < 0.28 ? (0.65 + 0.35 * Math.sin(frame * 0.28)) : 1;

        ctx.save();
        // Track
        ctx.fillStyle = 'rgba(8, 24, 40, 0.75)';
        ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);

        // Fill color: cyan → amber → red as oxygen drops
        let fillCol;
        if (o2Ratio > 0.5) fillCol = '#44ddff';
        else if (o2Ratio > 0.28) fillCol = '#ffcc55';
        else fillCol = '#ff5566';
        ctx.globalAlpha = pulseLow;
        ctx.fillStyle = fillCol;
        ctx.shadowColor = fillCol;
        ctx.shadowBlur = o2Ratio < 0.28 ? 8 : 4;
        ctx.fillRect(barX, barY, barW * o2Ratio, barH);

        // Outline
        ctx.globalAlpha = 0.85;
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(160, 220, 255, 0.7)';
        ctx.lineWidth = 1;
        ctx.strokeRect(barX - 1, barY - 1, barW + 2, barH + 2);

        // O2 label
        ctx.globalAlpha = 0.9;
        ctx.font = '700 8px Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = o2Ratio < 0.28 ? '#ff8899' : '#aaddff';
        ctx.fillText('O2', px + player.w / 2, barY - 3);
        ctx.restore();
      }

      // particles
      for (let p of particles) {
        const baseAlpha = (p.c === '#66ddff') ? 0.22 : 0.15;
        const alpha = Math.max(baseAlpha, p.life / (p.c === '#66ddff' ? 85 : 42));
        ctx.fillStyle = p.c || '#88ccdd';
        ctx.globalAlpha = alpha;

        const psize = p.size || 1.8;
        ctx.fillRect(p.x - scrollX, p.y, psize, psize);
      }
      ctx.globalAlpha = 1;

      // === ICE BLAST INDICATOR (glowing white snowflake that follows player when collected; single use) ===
      if (hasIceBlast && gameState === 'playing') {
        const px = player.wx - scrollX;
        const py = player.y;
        const indX = px + player.w + 14 + Math.sin(frame * 0.13) * 3.5;
        const indY = py - 8 + Math.sin(frame * 0.09) * 2.5;
        const ipulse = 0.75 + Math.sin(frame * 0.18) * 0.35;
        const isize = 7 + ipulse * 1.5;

        ctx.save();
        ctx.globalAlpha = 0.85 + ipulse * 0.15;
        ctx.shadowColor = '#88bbff';
        ctx.shadowBlur = 10 + ipulse * 4;
        ctx.strokeStyle = '#ffffff';
        ctx.fillStyle = '#ccffff';
        ctx.lineWidth = 1.2;

        // 6-pointed snowflake / crystal using lines (pulsing)
        ctx.beginPath();
        for (let a = 0; a < 6; a++) {
          const ang = (a * Math.PI / 3) + frame * 0.01;
          const bx = indX + Math.cos(ang) * (isize * 0.3);
          const by = indY + Math.sin(ang) * (isize * 0.3);
          ctx.moveTo(bx, by);
          ctx.lineTo(indX + Math.cos(ang) * isize, indY + Math.sin(ang) * isize);
          // small branch arms
          const ba = ang + 0.7;
          ctx.moveTo(indX + Math.cos(ang) * (isize * 0.55), indY + Math.sin(ang) * (isize * 0.55));
          ctx.lineTo(indX + Math.cos(ba) * (isize * 0.35), indY + Math.sin(ba) * (isize * 0.35));
          const bb = ang - 0.7;
          ctx.moveTo(indX + Math.cos(ang) * (isize * 0.55), indY + Math.sin(ang) * (isize * 0.55));
          ctx.lineTo(indX + Math.cos(bb) * (isize * 0.35), indY + Math.sin(bb) * (isize * 0.35));
        }
        ctx.stroke();

        // center dot
        ctx.beginPath();
        ctx.arc(indX, indY, 1.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // Simple FPS counter (bottom right, only while playing) - helps verify the perf fixes from the two agents
      if (gameState === 'playing') {
        ctx.fillStyle = 'rgba(136, 153, 170, 0.7)';
        ctx.font = '9px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(Math.round(fps) + ' fps', W - 8, H - 8);
        ctx.textAlign = 'left';
      }

      // === UI OVERLAYS ===
      if (gameState === 'playing') {
        // (Water/acid vat tutorial removed - players remember from Level 2)

        // (second green tutorial box removed - no tutorial instructions)

        // (ice blaster tutorial box removed - no tutorial instructions; ice powerups still spawn 3x)

        // (stomp tutorial box removed - no tutorial instructions)

        // distance readout (top right)
        ctx.font = '700 13px Segoe UI, Arial';
        ctx.textAlign = 'right';
        ctx.fillStyle = '#77bbdd';
        ctx.fillText('DISTANCE', W - 18, 24);
        ctx.font = '700 22px Consolas, monospace';
        ctx.fillStyle = '#aaddff';
        ctx.fillText(String(baseScore + score).padStart(5, '0'), W - 18, 48);

        // small jump counter
        ctx.font = '11px Consolas, monospace';
        ctx.fillStyle = '#5588aa';
        ctx.fillText('JUMPS ' + jumpCount, W - 18, 66);

        // Neon Score (blue + green orbs collected)
        ctx.font = '700 13px Segoe UI, Arial';
        ctx.fillStyle = '#4466cc';
        ctx.fillText('NEON', W - 18, 84);
        ctx.font = '700 20px Consolas, monospace';
        ctx.fillStyle = '#6688ff';
        ctx.fillText(String(neonScore).padStart(3, '0'), W - 18, 104);

        // Level Progress bar (fills as player approaches the ending)
        const progress = Math.min(1, Math.max(0, player.wx / 8088));
        const barY = 8;
        const barW = 180;
        const barH = 5;

        // Background track
        ctx.fillStyle = 'rgba(30, 50, 90, 0.6)';
        ctx.fillRect(W / 2 - barW / 2, barY, barW, barH);

        // Neon fill
        ctx.fillStyle = '#66aaff';
        ctx.fillRect(W / 2 - barW / 2, barY, barW * progress, barH);

        // Subtle glow outline
        ctx.strokeStyle = 'rgba(120, 180, 255, 0.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(W / 2 - barW / 2 - 1, barY - 1, barW + 2, barH + 2);
      }

      if (gameState === 'start') {
        if (!(window.NeonDashSprites && NeonDashSprites.drawHudPlate(ctx, W, H))) {
          ctx.fillStyle = 'rgba(2, 7, 15, 0.48)';
          ctx.fillRect(W / 2 - 320, H / 2 - 150, 640, 300);
        }

        ctx.font = '700 36px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#88d4ff';
        ctx.fillText('NEON DASH', W / 2, H / 2 - 52);

        ctx.font = '13px Consolas, monospace';
        ctx.fillStyle = '#5a8fb8';
        ctx.fillText('DEEP WATER HAZARD PROTOCOL', W / 2, H / 2 - 26);

        ctx.font = '13px Segoe UI, Arial';
        ctx.fillStyle = '#6699bb';
        ctx.fillText('ARROW KEYS OR A/D  —  MOVE', W / 2, H / 2 + 18);
        ctx.fillText('SPACE  —  JUMP TRIANGLES + MONSTERS', W / 2, H / 2 + 36);
        ctx.fillText('SWIM THROUGH AIR BUBBLES  —  REFILL O2', W / 2, H / 2 + 54);

        ctx.font = '12px Consolas, monospace';
        ctx.fillStyle = '#447799';
        ctx.fillText('PRESS SPACE OR CLICK TO START', W / 2, H / 2 + 88);
      }

      if (gameState === 'over') {
        // UI fades in after float begins so death sequence is visible first
        const dTimer = deathAnim ? deathAnim.timer : 60;
        const uiAlpha = Math.min(1, Math.max(0, (dTimer - 28) / 36));
        ctx.save();
        ctx.globalAlpha = uiAlpha;
        if (!(window.NeonDashSprites && NeonDashSprites.drawHudPlate(ctx, W, H))) {
          ctx.fillStyle = 'rgba(3, 6, 12, 0.48)';
          ctx.fillRect(W / 2 - 320, H / 2 - 150, 640, 300);
        }

        ctx.font = '700 28px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#cc7766';
        ctx.fillText('COLLISION DETECTED', W / 2, H / 2 - 38);

        ctx.font = '15px Consolas, monospace';
        ctx.fillStyle = '#aaddff';
        ctx.fillText('DISTANCE TRAVELED: ' + String(baseScore + score).padStart(5, '0'), W / 2, H / 2 + 4);

        if (baseScore + score === best && baseScore + score > 0) {
          ctx.fillStyle = '#aaccdd';
          ctx.fillText('NEW PERSONAL BEST', W / 2, H / 2 + 24);
        } else if (best > 0) {
          ctx.fillStyle = '#6688aa';
          ctx.fillText('BEST: ' + String(best).padStart(5, '0'), W / 2, H / 2 + 24);
        }

        ctx.font = '12px Segoe UI, Arial';
        ctx.fillStyle = '#5588aa';
        ctx.fillText('PRESS R  OR  CLICK TO RESTART', W / 2, H / 2 + 58);
        ctx.restore();
      }

      if (gameState === 'complete') {
        if (!(window.NeonDashSprites && NeonDashSprites.drawHudPlate(ctx, W, H))) {
          ctx.fillStyle = 'rgba(2, 6, 14, 0.48)';
          ctx.fillRect(W / 2 - 320, H / 2 - 150, 640, 300);
        }

        ctx.font = '700 32px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#66ddff';
        ctx.fillText('LEVEL COMPLETE', W / 2, H / 2 - 52);

        ctx.font = '15px Consolas, monospace';
        ctx.fillStyle = '#aaddff';
        ctx.fillText('DISTANCE TRAVELED: ' + String(baseScore + score).padStart(5, '0'), W / 2, H / 2 + 2);

        ctx.font = '13px Segoe UI, Arial';
        ctx.fillStyle = '#88bbdd';
        ctx.fillText('JUMPS: ' + jumpCount, W / 2, H / 2 + 24);

        ctx.font = '15px Consolas, monospace';
        ctx.fillStyle = '#88ffbb';
        ctx.fillText('NEON COLLECTED: ' + neonScore, W / 2, H / 2 + 48);

        if (baseScore + score === best) {
          ctx.fillStyle = '#aaccdd';
          ctx.fillText('NEW PERSONAL BEST!', W / 2, H / 2 + 72);
        }

        ctx.font = '12px Segoe UI, Arial';
        ctx.fillStyle = '#5588aa';
        ctx.fillText('PRESS R  OR  CLICK TO PLAY AGAIN', W / 2, H / 2 + 96);
      }

      // Neon shop cutscene overlay (door entry)
      if (gameState === 'shop') {
        drawShop();
      }
    }

    function drawShop() {
      // Black cut first, then interior counter scene
      if (shopPhase === 'fade') {
        const a = Math.min(1, shopTimer / 12);
        ctx.fillStyle = 'rgba(0, 0, 0, ' + a + ')';
        ctx.fillRect(0, 0, W, H);
        if (shopTimer > 14) {
          ctx.fillStyle = 'rgba(100, 200, 255, 0.35)';
          ctx.font = '12px Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.fillText('ENTERING HYDRO CONTROL…', W / 2, H / 2);
        }
        return;
      }

      // Interior background (deep aqua plant)
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#041018');
      grad.addColorStop(0.55, '#0a1e30');
      grad.addColorStop(1, '#061420');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Ceiling pipes
      ctx.strokeStyle = '#1a4a66';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(0, 48);
      ctx.lineTo(W, 48);
      ctx.stroke();
      ctx.strokeStyle = '#33aacc';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 8; i++) {
        const px = 60 + i * 120;
        ctx.beginPath();
        ctx.moveTo(px, 48);
        ctx.lineTo(px, 78);
        ctx.stroke();
        ctx.fillStyle = 'rgba(80, 200, 255, 0.25)';
        ctx.beginPath();
        ctx.arc(px, 86 + Math.sin(frame * 0.1 + i) * 4, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      // Floor
      ctx.fillStyle = '#0c2234';
      ctx.fillRect(0, H - 120, W, 120);
      ctx.strokeStyle = 'rgba(60, 140, 180, 0.35)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 12; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 90, H - 120);
        ctx.lineTo(i * 90 - 40, H);
        ctx.stroke();
      }

      // Shop counter
      const counterX = 520;
      const counterY = H - 200;
      const counterW = 360;
      const counterH = 90;
      ctx.fillStyle = '#0e2a40';
      ctx.fillRect(counterX, counterY, counterW, counterH);
      ctx.fillStyle = '#163a55';
      ctx.fillRect(counterX, counterY, counterW, 14);
      ctx.strokeStyle = '#44ccee';
      ctx.lineWidth = 2;
      ctx.strokeRect(counterX, counterY, counterW, counterH);
      // Counter neon edge
      ctx.shadowColor = '#33aacc';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = 'rgba(100, 220, 255, 0.7)';
      ctx.strokeRect(counterX + 2, counterY + 2, counterW - 4, 10);
      ctx.shadowBlur = 0;

      // Sign above counter
      ctx.fillStyle = 'rgba(8, 30, 48, 0.95)';
      ctx.fillRect(counterX + 40, counterY - 52, counterW - 80, 36);
      ctx.strokeStyle = '#66ddff';
      ctx.lineWidth = 1.6;
      ctx.strokeRect(counterX + 40, counterY - 52, counterW - 80, 36);
      ctx.font = '700 16px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#88eeff';
      ctx.fillText('NEON DEPOT', counterX + counterW / 2, counterY - 28);

      // Larger player cube approaching / at counter
      const cubeSize = 48;
      const cubeY = H - 120 - cubeSize - 4;
      const bob = Math.sin(frame * 0.12) * 2;
      const cx = shopCubeX;
      const cy = cubeY + bob;
      ctx.fillStyle = '#1a88cc';
      ctx.fillRect(cx, cy, cubeSize, cubeSize);
      ctx.fillStyle = '#55ccff';
      ctx.fillRect(cx + 3, cy + 3, cubeSize - 8, 8);
      ctx.fillRect(cx + 3, cy + 3, 7, cubeSize - 8);
      ctx.fillStyle = '#0a4060';
      ctx.fillRect(cx + cubeSize - 9, cy + 9, 5, cubeSize - 12);
      ctx.fillRect(cx + 9, cy + cubeSize - 9, cubeSize - 14, 5);
      ctx.strokeStyle = '#88eeff';
      ctx.lineWidth = 2;
      ctx.strokeRect(cx + 1, cy + 1, cubeSize - 2, cubeSize - 2);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(cx + 10, cy + 10, 4, 4);
      // Soft ground shadow
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(cx + cubeSize / 2, H - 118, 22, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Item displays on counter (Shield + Ice Blast)
      const itemY = counterY + 28;
      const shieldBox = { x: counterX + 36, y: itemY - 8, w: 140, h: 62 };
      const iceBox = { x: counterX + 190, y: itemY - 8, w: 140, h: 62 };
      shopUiHit.shield = shieldBox;
      shopUiHit.ice = iceBox;

      function drawItemCard(box, title, cost, owned, accent) {
        ctx.fillStyle = owned ? 'rgba(20, 50, 40, 0.9)' : 'rgba(10, 28, 44, 0.95)';
        ctx.fillRect(box.x, box.y, box.w, box.h);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 1.8;
        ctx.strokeRect(box.x, box.y, box.w, box.h);
        ctx.font = '700 12px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = accent;
        ctx.fillText(title, box.x + box.w / 2, box.y + 18);
        ctx.font = '11px Consolas, monospace';
        ctx.fillStyle = '#aaddff';
        ctx.fillText(owned ? 'OWNED' : (cost + ' NEON'), box.x + box.w / 2, box.y + 36);
        ctx.font = '10px Segoe UI, Arial';
        ctx.fillStyle = owned ? '#66ffaa' : '#88bbdd';
        ctx.fillText(owned ? 'CARRYOVER READY' : 'CLICK / KEY TO BUY', box.x + box.w / 2, box.y + 52);
      }
      drawItemCard(shieldBox, 'SHIELD', SHOP_SHIELD_COST, ownedCarryShield, '#66ddff');
      drawItemCard(iceBox, 'ICE BLAST', SHOP_ICE_COST, ownedCarryIce, '#aaddff');
      // Mini icons
      ctx.fillStyle = '#66ddff';
      ctx.beginPath();
      ctx.moveTo(shieldBox.x + 16, shieldBox.y + 30);
      ctx.lineTo(shieldBox.x + 28, shieldBox.y + 18);
      ctx.lineTo(shieldBox.x + 40, shieldBox.y + 30);
      ctx.lineTo(shieldBox.x + 28, shieldBox.y + 48);
      ctx.closePath();
      ctx.globalAlpha = 0.35;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ccffff';
      ctx.globalAlpha = 0.4;
      ctx.fillRect(iceBox.x + 14, iceBox.y + 22, 14, 14);
      ctx.globalAlpha = 1;

      // Neon balance HUD
      ctx.fillStyle = 'rgba(6, 20, 36, 0.92)';
      ctx.fillRect(24, 24, 220, 56);
      ctx.strokeStyle = '#44ccee';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(24, 24, 220, 56);
      ctx.font = '11px Consolas, monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#6699bb';
      ctx.fillText('NEON BALANCE', 38, 46);
      ctx.font = '700 22px Consolas, monospace';
      ctx.fillStyle = '#88ffbb';
      ctx.fillText(String(neonScore).padStart(3, '0'), 38, 70);

      // Leave button
      const leaveBox = { x: W / 2 - 90, y: H - 58, w: 180, h: 36 };
      shopUiHit.leave = leaveBox;
      ctx.fillStyle = 'rgba(20, 50, 70, 0.95)';
      ctx.fillRect(leaveBox.x, leaveBox.y, leaveBox.w, leaveBox.h);
      ctx.strokeStyle = '#66ddff';
      ctx.lineWidth = 1.8;
      ctx.strokeRect(leaveBox.x, leaveBox.y, leaveBox.w, leaveBox.h);
      ctx.font = '700 13px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#aaddff';
      ctx.fillText('LEAVE SHOP', leaveBox.x + leaveBox.w / 2, leaveBox.y + 23);

      // Controls help (browse only)
      if (shopPhase === 'browse') {
        ctx.font = '11px Consolas, monospace';
        ctx.fillStyle = '#447799';
        ctx.fillText('[1] SHIELD   [2] ICE BLAST   [E / ESC / ENTER] LEAVE', W / 2, H - 72);
      } else if (shopPhase === 'approach') {
        ctx.font = '12px Segoe UI, Arial';
        ctx.fillStyle = '#6699bb';
        ctx.fillText('Approaching the counter…', W / 2, H - 72);
      }

      // Feedback message
      if (shopMsgTimer > 0 && shopMessage) {
        ctx.fillStyle = 'rgba(8, 24, 40, 0.9)';
        ctx.fillRect(W / 2 - 210, 100, 420, 32);
        ctx.strokeStyle = '#66ddff';
        ctx.strokeRect(W / 2 - 210, 100, 420, 32);
        ctx.font = '12px Consolas, monospace';
        ctx.fillStyle = '#cceeff';
        ctx.fillText(shopMessage, W / 2, 120);
      }
    }

    // Show/hide Level 6 replay link based on game state
    // NOTE: intentionally not called every frame anymore (DOM getElement+style in rAF was contributing to micro-lag/jank).
    function updateLevel3LinkVisibility() {
      const container = document.getElementById('level3-link-container');
      if (container) {
        container.style.display = (gameState === 'complete') ? 'block' : 'none';
      }
    }

    function gameLoop() {
      try {
        update();
        draw();
        // updateLevel3LinkVisibility() REMOVED from per-frame (was causing subtle DOM/reflow cost in rAF hot path).
        // Now called explicitly only on gameState transitions to 'complete'/'over'/'playing'.
      } catch (err) {
        console.error('[Neon Dash] gameLoop error:', err);
      } finally {
        requestAnimationFrame(gameLoop);
      }
    }

    function startPlaying() {
      getAudioCtx();
      if (gameState === 'start') {
        gameState = 'playing';
      } else if (gameState === 'over' || gameState === 'complete') {
        resetGame();
        gameState = 'playing';
      }
      updateLevel3LinkVisibility();
    }

    function handleShopPointer(clientX, clientY) {
      if (gameState !== 'shop' || shopPhase !== 'browse') return false;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mx = (clientX - rect.left) * scaleX;
      const my = (clientY - rect.top) * scaleY;
      function inside(b) {
        return b && mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;
      }
      if (inside(shopUiHit.shield)) { buyShopItem('shield'); return true; }
      if (inside(shopUiHit.ice)) { buyShopItem('ice'); return true; }
      if (inside(shopUiHit.leave)) { leaveShop(); return true; }
      return false;
    }

    function init() {
      loadBest();
      loadCarryover();
      try {
        baseScore = parseInt(localStorage.getItem('neonDashCumulativeScore') || '0', 10) || 0;
        neonAtLevelStart = parseInt(localStorage.getItem('neonDashCumulativeNeon') || '0', 10) || 0;
      } catch(e) { baseScore = 0; neonAtLevelStart = 0; }
      resetGame();
      updateLevel3LinkVisibility();

      // keyboard
      window.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        getAudioCtx();

        // Shop controls
        if (gameState === 'shop') {
          if (shopPhase === 'browse') {
            if (e.key === '1') { e.preventDefault(); buyShopItem('shield'); }
            if (e.key === '2') { e.preventDefault(); buyShopItem('ice'); }
            if (e.key === 'Escape' || e.key === 'e' || e.key === 'E' || e.key === 'Enter') {
              e.preventDefault();
              leaveShop();
            }
          }
          // Block start/restart keys during shop
          if (e.key === ' ' || e.key === 'Spacebar') e.preventDefault();
          return;
        }

        if (e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          if (gameState === 'start' || gameState === 'over' || gameState === 'complete') {
            startPlaying();
          }
        }
        if (e.key === 'ArrowDown') {
          e.preventDefault(); // for ice blast detonation
        }
        if (e.key === 'm' || e.key === 'M') {
          toggleMute();
        }
        if ((e.key === 'r' || e.key === 'R') && (gameState === 'over' || gameState === 'complete')) {
          resetGame();
          gameState = 'playing';
          updateLevel3LinkVisibility();
        }
      });

      window.addEventListener('keyup', (e) => {
        keys[e.key] = false;
      });

      // mouse / touch start
      canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        if (handleShopPointer(e.clientX, e.clientY)) return;
        if (gameState === 'shop') return;
        startPlaying();
      });
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.changedTouches && e.changedTouches[0];
        if (t && handleShopPointer(t.clientX, t.clientY)) return;
        if (gameState === 'shop') return;
        startPlaying();
      }, { passive: false });

      // prevent space from scrolling page
      window.addEventListener('keydown', (e) => {
        if (e.key === ' ' && document.activeElement === document.body) {
          e.preventDefault();
        }
      });

      // initial draw
      draw();

      // kick off loop
      gameLoop();

      // subtle console note
      console.log('%c[NEON DASH LEVEL 6] Arrow keys / A D to move, Space to jump. Avoid the water pits and aqua hazards. (Watery underwater theme)', 'color:#33aacc');
    }

    // boot
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
