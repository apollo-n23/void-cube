      if (_now - lastFpsTime >= 500) { fps = Math.round(fpsFrameCount * 1000 / (_now - lastFpsTime)); fpsFrameCount = 0; lastFpsTime = _now; }

      ctx.fillStyle = '#030a14';
      ctx.fillRect(0, 0, W, H);
      if (window.NeonDashSprites) NeonDashSprites.drawSky(ctx, W, H, GROUND_Y, scrollX, frame);

      if (player.wx < 680 && gameState === 'playing') {
        const signX = 260 - scrollX * 0.08;
        const signY = 92;
        if (window.NeonDashSprites) NeonDashSprites.drawWorldSign(ctx, signX - 140, signY - 44, 280, 118);
        ctx.fillStyle = '#e8fbff';
        ctx.font = '700 22px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillText('NEON DASH', signX, signY + 2);
      }

      // Soft god-ray shafts from above (caustic-like light, NO sun disc / rings / core)
      const rayOriginX = 420 - ((scrollX * 0.012) % 180);
      for (let r = 0; r < 7; r++) {
        const baseX = rayOriginX + r * 95 + Math.sin(frame * 0.008 + r * 0.9) * 18;
        const sway = Math.sin(frame * 0.011 + r * 1.3) * 12;
        let alpha = 0.04 + Math.sin(frame * 0.018 + r * 0.7) * 0.035;
        alpha = Math.max(0.02, Math.min(0.09, alpha));
        ctx.fillStyle = `rgba(60, 140, 200, ${alpha})`;
        ctx.beginPath();
        ctx.moveTo(baseX - 6, 0);
        ctx.lineTo(baseX + 10, 0);
        ctx.lineTo(baseX + 38 + sway, 320);
        ctx.lineTo(baseX - 28 + sway * 0.6, 320);
        ctx.closePath();
        ctx.fill();
      }
      // Secondary thinner shafts
      for (let r = 0; r < 5; r++) {
        const baseX = rayOriginX + 40 + r * 130 + Math.sin(frame * 0.014 + r) * 22;
        const alpha = 0.025 + Math.sin(frame * 0.022 + r * 1.1) * 0.02;
        ctx.strokeStyle = `rgba(100, 190, 230, ${Math.max(0.015, alpha)})`;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(baseX, 0);
        ctx.lineTo(baseX + Math.sin(frame * 0.01 + r) * 20, 280);
        ctx.stroke();
      }
      ctx.lineWidth = 1;

      // Soft caustic shimmer patches (rippling light on deep water — no disc)
      for (let i = 0; i < 6; i++) {
        const cx = ((i * 157 + frame * 0.35 + scrollX * 0.02) % (W + 120)) - 40;
        const cy = 40 + (i * 37) % 160 + Math.sin(frame * 0.02 + i) * 8;
        const pulse = 0.04 + Math.sin(frame * 0.03 + i * 1.4) * 0.035;
        ctx.fillStyle = `rgba(80, 170, 220, ${Math.max(0.02, pulse)})`;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 28 + i * 3, 6 + (i % 3), frame * 0.004 + i, 0, Math.PI * 2);
        ctx.fill();
      }

      // Very subtle drifting bubble/silt specks high in water
      ctx.fillStyle = 'rgba(100, 180, 220, 0.16)';
      for (let i = 0; i < 5; i++) {
        const ax = ((i * 131 + frame * 0.18) % (W + 100)) - 50;
        const ay = 22 + ((i * 17) % 48) + Math.sin(frame * 0.022 + i) * 3.2;
        ctx.fillRect(ax, ay, 1.6, 0.9);
      }

      // Silt haze / bubble plumes (repurposed poisonClouds array for watery theme)
      for (let cloud of poisonClouds) {
        const csx = cloud.wx - scrollX * 0.04; // very slow parallax, high in water column
        if (csx < -50 || csx > W + 50) continue;

        const cy = cloud.y;

        // Soft deep-blue silt body
        ctx.fillStyle = 'rgba(14, 40, 70, 0.48)';
        ctx.beginPath();
        ctx.ellipse(csx, cy, cloud.width / 2, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Dimmer aqua inner glow
        ctx.fillStyle = 'rgba(40, 110, 150, 0.18)';
        ctx.beginPath();
        ctx.ellipse(csx - 2, cy - 5, cloud.width / 2.1, 6, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // === DISTANT BACKGROUND SCENERY: LARGE DARK SEAWEED (parallax) ===
      // Tall black-green kelp / seaweed; animated frond sway; scaled up for deep-ocean look
      ctx.globalAlpha = 0.88;
      for (let b of backgroundElements) {
        const sx = b.wx - scrollX * b.parallax;
        if (sx < -140 || sx > W + 140) continue;

        const s = b.scale || 1;
        const baseY = b.y;
        const phase = (b.phase || 0) + frame * 0.031;
        const floralPulse = Math.sin(phase * 1.3);

        if (b.type === 'largeBloom') {
          // Large dark seaweed: tall black-green stem, wide swaying fronds
          const stemH = 78 * s;
          const stemX = sx - 2.6 * s;
          ctx.fillStyle = '#061410';
          ctx.fillRect(stemX, baseY - stemH, 5.2 * s, stemH);
          // Slight stem highlight edge
          ctx.fillStyle = '#0c2820';
          ctx.fillRect(stemX + 1.2 * s, baseY - stemH, 1.4 * s, stemH);
          const sway = Math.sin(phase) * 5.5 * s;
          const p = 1.0 + floralPulse * 0.1;
          // Broad dark seaweed leaves (alternating sides)
          ctx.fillStyle = '#0a2418';
          ctx.beginPath();
          ctx.moveTo(stemX + 2*s, baseY - 22*s);
          ctx.lineTo(stemX - 22*s + sway*0.45, baseY - 30*s);
          ctx.lineTo(stemX + 2*s, baseY - 40*s);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#0d2e1c';
          ctx.beginPath();
          ctx.moveTo(stemX + 3*s, baseY - 42*s);
          ctx.lineTo(stemX + 24*s + sway*0.55, baseY - 36*s);
          ctx.lineTo(stemX + 3*s, baseY - 54*s);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#081c14';
          ctx.beginPath();
          ctx.moveTo(stemX + 2*s, baseY - 56*s);
          ctx.lineTo(stemX - 20*s + sway*0.65, baseY - 62*s);
          ctx.lineTo(stemX + 2*s, baseY - 70*s);
          ctx.closePath(); ctx.fill();
          // Extra upper frond
          ctx.fillStyle = '#0a2618';
          ctx.beginPath();
          ctx.moveTo(stemX + 2.5*s, baseY - 68*s);
          ctx.lineTo(stemX + 18*s + sway*0.7, baseY - 74*s);
          ctx.lineTo(stemX + 2.5*s, baseY - 80*s);
          ctx.closePath(); ctx.fill();
          // Dark kelp head (muted olive, no bright cyan glow)
          const hx = sx + sway * 0.75;
          const hy = baseY - 82 * s;
          ctx.fillStyle = 'rgba(20, 50, 35, 0.55)';
          ctx.beginPath(); ctx.ellipse(hx, hy, 18 * s * p, 11 * s * p, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#0d3018';
          ctx.beginPath(); ctx.ellipse(hx - 5*s, hy - 1*s, 11*s*p, 7*s*p, 0, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(hx + 6*s, hy + 2*s, 10*s*p, 6*s*p, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#0a2414';
          ctx.beginPath(); ctx.ellipse(hx + 2*s, hy - 6*s, 9*s*p, 5.5*s*p, 0, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(hx - 6*s, hy + 4*s, 8.5*s*p, 6.5*s*p, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#061810';
          ctx.beginPath(); ctx.ellipse(hx, hy + 1*s, 8*s*p, 4.5*s*p, 0, 0, Math.PI * 2); ctx.fill();
          // Very subtle deep-teal core (not bright surface bloom)
          ctx.fillStyle = `rgba(30, 70, 55, ${0.45 + 0.15 * floralPulse})`;
          ctx.beginPath(); ctx.ellipse(hx, hy, 5.5 * s * p, 3.8 * s * p, 0, 0, Math.PI * 2); ctx.fill();
        } else if (b.type === 'midStalk') {
          // Midground dark seaweed stalks — larger leaves, black-green
          const stemH = 52 * s;
          ctx.fillStyle = '#061410';
          ctx.fillRect(sx - 1.8 * s, baseY - stemH, 3.6 * s, stemH);
          ctx.fillStyle = '#0a2218';
          ctx.fillRect(sx - 0.6 * s, baseY - stemH, 1.2 * s, stemH);
          const sway = Math.sin(phase * 0.95) * 3.4 * s;
          const p = 1.0 + floralPulse * 0.12;
          // Side leaves (larger)
          ctx.fillStyle = '#0a2418';
          ctx.beginPath();
          ctx.moveTo(sx, baseY - 16*s);
          ctx.lineTo(sx - 14*s + sway*0.5, baseY - 20*s);
          ctx.lineTo(sx, baseY - 28*s);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#0d2e1c';
          ctx.beginPath();
          ctx.moveTo(sx + 0.8*s, baseY - 32*s);
          ctx.lineTo(sx + 16*s + sway*0.6, baseY - 30*s);
          ctx.lineTo(sx + 0.8*s, baseY - 42*s);
          ctx.closePath(); ctx.fill();
          // Dark frond clusters (no bright cyan)
          ctx.fillStyle = 'rgba(18, 48, 32, 0.7)';
          ctx.beginPath(); ctx.ellipse(sx + 4*s + sway*0.4, baseY - 52*s, 8*s*p, 5*s*p, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#0a2818';
          ctx.beginPath(); ctx.ellipse(sx + 4*s + sway*0.4, baseY - 52*s, 4.5*s*p, 3*s*p, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#04100c';
          ctx.beginPath(); ctx.ellipse(sx + 4*s + sway*0.4, baseY - 52*s, 2.2*s, 1.5*s, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = 'rgba(14, 40, 28, 0.65)';
          ctx.beginPath(); ctx.ellipse(sx - 7*s + sway*0.6, baseY - 40*s, 6.5*s*p, 4*s*p, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#0a2214';
          ctx.beginPath(); ctx.ellipse(sx - 7*s + sway*0.6, baseY - 40*s, 3.5*s, 2.2*s, 0, 0, Math.PI*2); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;

      // === DRIFTING SILT / BUBBLE CLOUDS (repurposed background traffic layer) ===
      ctx.globalAlpha = 0.32;
      for (let ship of flyingShips) {
        const sx = ship.wx - scrollX * ship.parallax;
        if (sx < -110 || sx > W + 130) continue;

        const s = ship.scale;
        const sy = ship.y;

        // Puffy deep-blue silt cloud body (multi layered ellipses)
        ctx.fillStyle = 'rgba(14, 40, 70, 0.8)';
        ctx.beginPath(); ctx.ellipse(sx + 8*s, sy + 2*s, 22*s, 7*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(sx + 22*s, sy - 1*s, 18*s, 9*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(sx - 2*s, sy + 3*s, 14*s, 6*s, 0, 0, Math.PI*2); ctx.fill();

        // Dim aqua core inside some plumes
        if ((Math.floor(ship.wx) % 3) !== 0) {
          ctx.fillStyle = 'rgba(60, 140, 180, 0.22)';
          ctx.beginPath(); ctx.ellipse(sx + 14*s, sy + 1*s, 6*s, 3*s, 0, 0, Math.PI*2); ctx.fill();
        }

        // Faint trailing silt wisps
        ctx.fillStyle = 'rgba(20, 60, 100, 0.28)';
        ctx.fillRect(sx - 18*s, sy + 1*s, 14*s, 3*s);
      }
      ctx.globalAlpha = 1;

      // === DECORATIVE FISH CLUSTERS (background only — behind platforms/player/enemies) ===
      // Blue/silver silhouettes; various sizes; slow swim; no gameplay interaction
      for (let cluster of fishClusters) {
        const csx = cluster.wx - scrollX * cluster.parallax;
        if (csx < -160 || csx > W + 160) continue;
        const dir = cluster.vx >= 0 ? 1 : -1;
        const schoolBob = Math.sin(frame * 0.02 + cluster.phase) * 2.5;

        for (let m of cluster.members) {
          const fs = m.scale;
          const fx = csx + m.ox + Math.sin(frame * 0.028 + m.phase) * 3.5 * m.speedMul;
          const fy = cluster.y + m.oy + schoolBob + Math.sin(frame * 0.035 + m.phase * 1.3) * 2.2;
          if (fx < -30 || fx > W + 30) continue;

          const bodyW = 9 * fs;
          const bodyH = 3.6 * fs;
          const tailW = 4.5 * fs;
          const tailFlap = Math.sin(frame * 0.14 + m.phase) * 1.6 * fs;

          ctx.save();
          ctx.translate(fx, fy);
          ctx.scale(dir, 1);

          // Soft blue body silhouette
          ctx.fillStyle = 'rgba(70, 130, 175, 0.55)';
          ctx.beginPath();
          ctx.ellipse(0, 0, bodyW, bodyH, 0, 0, Math.PI * 2);
          ctx.fill();
          // Silver belly highlight
          ctx.fillStyle = 'rgba(170, 200, 220, 0.28)';
          ctx.beginPath();
          ctx.ellipse(0.5 * fs, 0.6 * fs, bodyW * 0.55, bodyH * 0.45, 0, 0, Math.PI * 2);
          ctx.fill();
          // Tail fin (flapping)
          ctx.fillStyle = 'rgba(50, 100, 145, 0.5)';
          ctx.beginPath();
          ctx.moveTo(-bodyW * 0.85, 0);
          ctx.lineTo(-bodyW - tailW, -bodyH * 0.9 + tailFlap);
          ctx.lineTo(-bodyW - tailW * 0.4, 0);
          ctx.lineTo(-bodyW - tailW, bodyH * 0.9 - tailFlap);
          ctx.closePath();
          ctx.fill();
          // Tiny dorsal
          ctx.fillStyle = 'rgba(90, 150, 190, 0.35)';
          ctx.beginPath();
          ctx.moveTo(-1 * fs, -bodyH * 0.7);
          ctx.lineTo(2 * fs, -bodyH * 1.5);
          ctx.lineTo(4 * fs, -bodyH * 0.5);
          ctx.closePath();
          ctx.fill();
          // Eye speck
          ctx.fillStyle = 'rgba(200, 230, 245, 0.45)';
          ctx.beginPath();
          ctx.arc(bodyW * 0.45, -0.4 * fs, 0.7 * fs, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }

      // === AQUA SUBMERSIBLE DRONES (gliding high in water column, ptero array reused)
      for (let p of pteros) {
        const sx = p.wx - scrollX;
        if (sx < -80 || sx > W + 80) continue;
        const sy = p.y;
        const flap = Math.sin(frame * 0.18 + p.phase) * 0.75;
        // Outer aqua energy aura glow
        ctx.fillStyle = 'rgba(51, 170, 204, 0.18)';
        ctx.beginPath();
        ctx.ellipse(sx + 14, sy + 1, 22, 9 + flap * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        // Main drone body (boxy sub, deep blue tech)
        ctx.fillStyle = '#0d2840';
        ctx.fillRect(sx + 2, sy - 3, 24, 8);
        ctx.fillStyle = '#1a4a6e';
        ctx.beginPath();
        ctx.ellipse(sx + 14, sy + 1, 13, 6 + flap * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();
        // Metallic panel highlights
        ctx.fillStyle = '#66ddff';
        ctx.fillRect(sx + 6, sy - 1, 5, 2);
        ctx.fillRect(sx + 17, sy + 1, 4, 1.5);
        // Fin / wing panels (geometric, animated with flap)
        ctx.fillStyle = '#2277aa';
        ctx.beginPath();
        ctx.moveTo(sx + 5, sy + 1);
        ctx.lineTo(sx - 4, sy - 12 - flap * 2.5);
        ctx.lineTo(sx + 1, sy - 1);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(sx + 23, sy + 1);
        ctx.lineTo(sx + 32, sy - 11 + flap * 2);
        ctx.lineTo(sx + 26, sy);
        ctx.closePath();
        ctx.fill();
        // Rotor blades (thin lines for tech)
        ctx.strokeStyle = '#88eeff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(sx - 2, sy - 8 - flap);
        ctx.lineTo(sx + 4, sy - 14 - flap * 3);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(sx + 26, sy - 7 + flap * 0.8);
        ctx.lineTo(sx + 33, sy - 13 + flap * 2.5);
        ctx.stroke();
        ctx.lineWidth = 1;
        // Cyan tech accents / lights
        ctx.fillStyle = '#88eeff';
        ctx.beginPath();
        ctx.arc(sx + 8, sy + 0.5, 1.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(sx + 20, sy + 1.5, 1.1, 0, Math.PI * 2);
        ctx.fill();
        // Head/sensor dome (forward)
        ctx.fillStyle = '#003355';
        ctx.beginPath();
        ctx.ellipse(sx + 27, sy + 1, 4, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        // Eye
        ctx.fillStyle = '#66ddff';
        ctx.beginPath();
        ctx.arc(sx + 27, sy - 0.8, 1.2, 0, Math.PI * 2);
        ctx.fill();
        // Long tail (waving)
        ctx.strokeStyle = '#0a1628';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(sx + 2, sy + 1);
        ctx.quadraticCurveTo(sx - 12, sy + 4 + Math.sin(frame * 0.11 + p.phase) * 3, sx - 28, sy + 2 + Math.sin(frame * 0.09 + p.phase * 1.3) * 5);
        ctx.stroke();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = '#1a4a6e';
        ctx.beginPath();
        ctx.moveTo(sx + 2, sy + 1);
        ctx.quadraticCurveTo(sx - 10, sy + 3, sx - 24, sy + 1);
        ctx.stroke();
        // Wings (flapping, aqua energy vein glow)
        ctx.fillStyle = '#0d2840';
        ctx.beginPath();
        ctx.moveTo(sx + 8, sy);
        ctx.quadraticCurveTo(sx - 2, sy - 18 - flap * 2, sx + 4, sy - 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(sx + 20, sy);
        ctx.quadraticCurveTo(sx + 30, sy - 16 + flap * 1.5, sx + 24, sy - 1);
        ctx.fill();
        // Aqua veins on wings (pulsing cyan)
        ctx.strokeStyle = `rgba(102, 221, 255, ${0.5 + 0.4 * Math.sin(frame * 0.2 + p.phase)})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(sx + 5, sy - 1);
        ctx.lineTo(sx - 1, sy - 10);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(sx + 18, sy);
        ctx.lineTo(sx + 28, sy - 9);
        ctx.stroke();
        ctx.lineWidth = 1;
      }

      // === DEEP OCEAN SEABED / FLOOR (dark underwater stone + muted seams) ===
      const floorTop = GROUND_Y - 2;

      // Precompute if any water pit visible this frame (cheap loop; skips costly shadow/save when none)
      let hasVisibleLava = false;
      for (let gap of waterGaps) {
        const sx = gap.wx - scrollX;
        const gw = gap.width;
        if (sx + gw >= -20 && sx <= W + 20) { hasVisibleLava = true; break; }
      }

      // Soft deep-water glow near pits (conditional to avoid save/shadow thrash every frame)
      if (hasVisibleLava) {
        ctx.save();
        ctx.shadowColor = '#061428';
        ctx.shadowBlur = 22;
        ctx.fillStyle = 'rgba(20, 60, 100, 0.16)';
        ctx.fillRect(0, floorTop - 7, W, 38);
        ctx.shadowBlur = 10;
        ctx.fillStyle = 'rgba(30, 90, 130, 0.1)';
        ctx.fillRect(0, floorTop - 1, W, 16);
        ctx.restore();
      }

      // Near-seabed murk band above floor (deep ocean horizon feel)
      ctx.fillStyle = 'rgba(4, 14, 28, 0.4)';
      ctx.fillRect(0, floorTop - 28, W, 28);

      // Base deep navy stone seabed floor
      ctx.fillStyle = '#060f1c';
      ctx.fillRect(0, floorTop, W, H - floorTop);
      if (window.NeonDashSprites) NeonDashSprites.drawGround(ctx, W, GROUND_Y, H, scrollX);

      // Rough top edge / lip (darker underwater rock)
      ctx.fillStyle = '#0e2438';
      ctx.fillRect(0, floorTop, W, 3.2);

      // Cracked stone texture / seams (parallax scroll; reduced iters)
      ctx.fillStyle = 'rgba(4, 12, 22, 0.65)';
      const mOffset = (scrollX * 1.25) % 62;
      for (let i = -1; i < 11; i++) {
        const mx = i * 62 - mOffset + 12;
        ctx.fillRect(mx, floorTop + 6, 18, 1.6);
      }
      // Secondary cracks
      ctx.fillStyle = 'rgba(16, 40, 65, 0.4)';
      const mOffset2 = (scrollX * 0.55) % 104;
      for (let i = -1; i < 7; i++) {
        const mx = i * 104 - mOffset2 + 28;
        ctx.fillRect(mx, floorTop + 13, 32, 1.2);
      }
      // Occasional muted aqua seams in floor cracks
      ctx.fillStyle = 'rgba(50, 120, 160, 0.14)';
      const seamOffset = (scrollX * 0.85) % 240;
      for (let i = -1; i < 2; i++) {
        const sx = i * 240 - seamOffset + 55;
        ctx.fillRect(sx, floorTop + 5, 7, 1.5);
      }

      // === LOW WALLS / BARRIERS (must jump over - solid but non-lethal) ===
      for (let wall of lowWalls) {
        const sx = wall.wx - scrollX;
        if (sx < -30 || sx > W + 30) continue;

        const wh = wall.height;
        const ww = wall.width;

        // Base stone-like block (deep blue seabed rock)
        ctx.fillStyle = '#0a1a2c';
        ctx.fillRect(sx, GROUND_Y - wh, ww, wh);

        // Top edge (slightly lighter, looks like a lip)
        ctx.fillStyle = '#1a3a55';
        ctx.fillRect(sx, GROUND_Y - wh, ww, 4);

        // Subtle top highlight line
        ctx.fillStyle = '#2a5580';
        ctx.fillRect(sx, GROUND_Y - wh, ww, 1.5);

        // Small vertical "support" lines for texture
        ctx.fillStyle = 'rgba(10, 30, 50, 0.6)';
        ctx.fillRect(sx + 3, GROUND_Y - wh + 3, 1.5, wh - 5);
        ctx.fillRect(sx + ww - 5, GROUND_Y - wh + 3, 1.5, wh - 5);
      }

      // === BLUE WATER PITS (deadly if fallen into; keep deadly behavior, blue water look) ===
      for (let gap of waterGaps) {
        const sx = gap.wx - scrollX;
        const gw = gap.width;
        if (sx + gw < -20 || sx > W + 20) continue;

        const pitDepth = 135; // deep water pool visually

        ctx.fillStyle = '#0a1e32';
        ctx.fillRect(sx - 1, floorTop - 1, gw + 2, 7);
        if (window.NeonDashSprites && NeonDashSprites.drawFluid(ctx, sx + 1, floorTop + 5, gw - 2, pitDepth, frame)) {
          continue;
        }
        // Cracked rim texture
        ctx.fillStyle = '#061420';
        ctx.fillRect(sx + 3, floorTop, 2, 4);
        ctx.fillRect(sx + gw - 7, floorTop + 1, 3, 3);

        // Subtle aqua glow on upper pit walls
        ctx.fillStyle = 'rgba(34, 119, 170, 0.45)';
        ctx.fillRect(sx, floorTop + 5, 3, 22);
        ctx.fillRect(sx + gw - 3, floorTop + 5, 3, 22);

        // === FULL DEPTH BLUE WATER (animated flow + bubbles) ===
        // Deep base water
        ctx.fillStyle = '#003355';
        ctx.fillRect(sx + 1, floorTop + 5, gw - 2, pitDepth);

        // Mid water layer
        ctx.fillStyle = '#004466';
        ctx.fillRect(sx + 2, floorTop + 8, gw - 4, pitDepth - 12);

        // Side wall water glow
        ctx.fillStyle = 'rgba(34, 119, 170, 0.32)';
        ctx.fillRect(sx + 1, floorTop + 18, 2, pitDepth - 10);
        ctx.fillRect(sx + gw - 3, floorTop + 18, 2, pitDepth - 10);

        // Upper brighter water surface
        ctx.fillStyle = 'rgba(26, 90, 140, 0.92)';
        ctx.fillRect(sx + 1, floorTop + 5, gw - 2, 28);
        ctx.fillStyle = 'rgba(51, 170, 204, 0.72)';
        ctx.fillRect(sx + 1, floorTop + 6, gw - 2, 11);

        // Animated vertical flow streaks
        const flowT = (frame * 0.035) % (gw + 50);
        const flowPhase = gap.wx * 0.013; // seeded by position for variation
        ctx.fillStyle = 'rgba(102, 221, 255, 0.26)';
        for (let f = 0; f < 3; f++) {
          const phaseOff = (f * 1.3 + flowPhase);
          const dripOff = Math.sin(frame * 0.022 + phaseOff) * 4.5;
          const fx = sx + 5 + ((f * 19 + flowT * 0.55) % (gw - 10));
          const fy = floorTop + 10 + dripOff * 0.6;
          ctx.fillRect(fx, fy, 2.2, pitDepth - 20 - (f % 2));
        }
        ctx.fillStyle = 'rgba(136, 238, 255, 0.15)';
        for (let f = 0; f < 2; f++) {
          const phaseOff = (f * 2.1 + flowPhase + 1.7);
          const dripOff = Math.sin(frame * 0.018 + phaseOff) * 6.2;
          const fx = sx + 9 + ((f * 27 + flowT * 0.8) % (gw - 14));
          const fy = floorTop + 13 + dripOff * 0.5;
          ctx.fillRect(fx, fy, 1.6, pitDepth - 28);
        }

        // Animated water bubbles / blobs
        const dripBase = frame * 0.014 + flowPhase;
        ctx.fillStyle = 'rgba(102, 221, 255, 0.75)';
        for (let d = 0; d < 5; d++) {
          const dPhase = dripBase + d * 0.9 + (d % 3) * 1.6;
          const vy = Math.sin(dPhase) * 7.5 + Math.sin(dPhase * 1.6) * 3.2;
          const dx = sx + 3 + ((d * 13 + (gap.wx % 17)) % (gw - 8));
          const dy = floorTop + 9 + vy + (d % 2) * 1.5;
          const dw = 2.8 + Math.sin(dPhase * 0.7) * 0.7;
          const dh = 3.5 + Math.cos(dPhase) * 1.8;
          ctx.beginPath();
          ctx.ellipse(dx, dy, dw, Math.max(1.5, dh), 0, 0, Math.PI * 2);
          ctx.fill();
        }
        // Extra bottom-hanging bubbles
        ctx.fillStyle = 'rgba(136, 238, 255, 0.55)';
        for (let d = 0; d < 3; d++) {
          const dPhase = dripBase * 0.8 + d * 1.4;
          const vy = Math.sin(dPhase + 0.8) * 5.0 + 2;
          const dx = sx + 4 + ((d * 22 + 7) % (gw - 10));
          const dy = floorTop + pitDepth - 18 + vy;
          ctx.beginPath();
          ctx.ellipse(dx, dy, 2.1 + Math.sin(dPhase) * 0.5, 4.5 + Math.cos(dPhase * 1.1) * 1.5, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Surface bubbles (pulsing)
        const bubblePhase = (frame * 0.065) % (Math.PI * 2);
        ctx.fillStyle = 'rgba(136, 238, 255, 0.8)';
        const numBubs = Math.max(4, Math.floor(gw / 22));
        for (let b = 0; b < numBubs && b < 8; b++) {
          const seed = (gap.wx * 0.77 + b * 19.3) % 83;
          const bx = sx + 2 + ((b * 21 + seed) % (gw - 6));
          const by = floorTop + 8 + ((Math.sin(bubblePhase + b * 1.9) + 1) * 4.5) + (b % 3) * 0.6;
          const pulse = 0.65 + 0.45 * Math.sin(bubblePhase * 1.15 + b);
          const br = (1.5 + Math.sin(bubblePhase + b * 0.7) * 0.7) * pulse;
          ctx.globalAlpha = 0.55 + 0.35 * Math.sin(bubblePhase * 0.9 + b * 1.3 + seed);
          ctx.beginPath();
          ctx.arc(bx, by, Math.max(1, br), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // Flowing highlights / subtle pulsing surface sheen
        ctx.fillStyle = 'rgba(170, 240, 255, 0.35)';
        const sheenT = frame * 0.026 + gap.wx * 0.009;
        for (let f = 0; f < 2; f++) {
          const fx = sx + 6 + (((f * 31 + sheenT * 0.7) % (gw - 12)));
          const fy = floorTop + 7 + Math.sin(sheenT * 0.8 + f) * 2.5;
          ctx.fillRect(fx, fy, 3.5, 2.2);
        }
      }

      // Water puddles (splats from blue ink/water orbs; short lived ~5s, bubble, deadly to touch)
      for (let pud of slimePuddles) {
        const sx = pud.wx - scrollX;
        if (sx < -40 || sx > W + 40) continue;
        const alpha = Math.max(0.05, pud.life / 300);
        const pw = (pud.size || 18) * 1.1;
        ctx.globalAlpha = alpha;
        // main splat puddle (blue water on floor)
        ctx.fillStyle = '#1a4a6e';
        ctx.beginPath();
        ctx.ellipse(sx, GROUND_Y - 1, pw, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        // lighter edge
        ctx.fillStyle = 'rgba(51, 170, 204, 0.6)';
        ctx.beginPath();
        ctx.ellipse(sx, GROUND_Y - 1, pw * 0.7, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        // small bubbles in puddle (fading)
        ctx.fillStyle = '#66ddff';
        for (let b = 0; b < 4; b++) {
          const bp = frame * 0.07 + b * 1.3 + (pud.wx * 0.1);
          const bx = sx - pw * 0.4 + (b % 3) * (pw * 0.35);
          const by = GROUND_Y - 2 + Math.sin(bp) * 1.5;
          ctx.beginPath();
          ctx.arc(bx, by, 1.2 + Math.sin(bp * 1.5) * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;
      }

      // Erupting blue water/ink orbs (from water pits; twice size, bubbling)
      for (let dart of poisonDarts) {
        const dsx = dart.wx - scrollX;
        const dsy = dart.y;
        if (dsx < -14 || dsx > W + 14) continue;
        if (window.NeonDashSprites && NeonDashSprites.drawShot(ctx, 'water', dsx, dsy, frame, 22, 22, dart.vx, dart.vy)) continue;

        const r = 9 + Math.sin(frame * 0.18 + dsx) * 1.2; // twice size, pulsing

        // Outer aqua glow
        ctx.fillStyle = 'rgba(51, 170, 204, 0.35)';
        ctx.beginPath();
        ctx.arc(dsx, dsy, r + 5, 0, Math.PI * 2);
        ctx.fill();

        // Main water-orb body (deep blue-aqua)
        ctx.fillStyle = '#2277aa';
        ctx.beginPath();
        ctx.arc(dsx, dsy, r, 0, Math.PI * 2);
        ctx.fill();

        // Bubbling highlights inside (lighter aqua bubbles, animated)
        ctx.fillStyle = '#66ddff';
        for (let b = 0; b < 3; b++) {
          const bp = frame * 0.12 + b * 2.3 + dsx;
          const bx = dsx + Math.sin(bp) * (r * 0.4);
          const by = dsy + Math.cos(bp * 0.8) * (r * 0.3) - 1;
          ctx.beginPath();
          ctx.arc(bx, by, 1.8 + Math.sin(bp * 1.5) * 0.6, 0, Math.PI * 2);
          ctx.fill();
        }

        // Hot core (brighter)
        ctx.fillStyle = '#88eeff';
        ctx.beginPath();
        ctx.arc(dsx - 1, dsy - 1, r * 0.35, 0, Math.PI * 2);
        ctx.fill();
      }

      // === ROCKY OUTCROPS & CORAL VENTS (midground pillars with glowing aqua) ===
      // + kelp-tree variants mixed in for underwater background
      for (let tree of alienTrees) {
        const sx = tree.wx - scrollX * tree.parallax;
        if (sx < -60 || sx > W + 60) continue;

        const s = tree.scale;
        const ty = tree.y;

        // Kelp/stump variant (roughly 1/3 of formations) — larger darker seaweed
        const isBurned = ((tree.wx * 31) | 0) % 3 === 0;
        if (isBurned) {
          // tall dark kelp trunk
          const ks = s * 1.45;
          ctx.fillStyle = '#040e14';
          ctx.fillRect(sx - 3 * ks, ty - 8 * ks, 7 * ks, 48 * ks);

          // jagged dark kelp fronds (larger reach)
          ctx.strokeStyle = '#0a1c18';
          ctx.lineWidth = 2.2 * ks;
          ctx.beginPath();
          ctx.moveTo(sx + 0.5 * ks, ty + 2 * ks); ctx.lineTo(sx + 16 * ks, ty - 6 * ks);
          ctx.moveTo(sx - 0.5 * ks, ty + 12 * ks); ctx.lineTo(sx - 14 * ks, ty + 2 * ks);
          ctx.moveTo(sx + 1 * ks, ty + 22 * ks); ctx.lineTo(sx + 18 * ks, ty + 14 * ks);
          ctx.moveTo(sx, ty + 32 * ks); ctx.lineTo(sx - 12 * ks, ty + 26 * ks);
          ctx.stroke();

          // muted deep-teal tips (not bright surface cyan)
          const eA = 0.2 + 0.25 * Math.sin(frame * 0.12 + tree.wx);
          ctx.fillStyle = `rgba(40, 90, 80, ${eA})`;
          ctx.fillRect(sx + 14 * ks, ty - 7 * ks, 2.5 * ks, 1.8 * ks);
          ctx.fillRect(sx - 13 * ks, ty + 1 * ks, 2 * ks, 1.4 * ks);
          ctx.fillRect(sx + 16 * ks, ty + 13 * ks, 2.2 * ks, 1.5 * ks);

          // wider base + faint rising bubbles
          ctx.fillStyle = '#030a10';
          ctx.fillRect(sx - 5 * ks, ty + 38 * ks, 12 * ks, 8 * ks);
          ctx.strokeStyle = 'rgba(40, 100, 130, 0.2)';
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          ctx.moveTo(sx - 0.5 * ks, ty + 0 * ks);
          ctx.lineTo(sx + 0.5 * ks, ty - 8 * ks);
          ctx.stroke();

          continue; // done, skip the rock pillar draw
        }

        // Main vertical rock pillar / jagged column (deep blue stone)
        ctx.fillStyle = '#1a3048';
        ctx.fillRect(sx, ty, 5 * s, 38 * s);
        // Ledges / strata
        ctx.fillStyle = '#0d2840';
        ctx.fillRect(sx - 4 * s, ty + 1 * s, 12 * s, 2.8 * s);
        ctx.fillRect(sx - 4 * s, ty + 24 * s, 12 * s, 2.8 * s);

        // Side rock spur
        ctx.fillStyle = '#152838';
        ctx.fillRect(sx + 8 * s, ty + 3 * s, 4 * s, 30 * s);

        // Small outcrop / aqua vent housing
        ctx.fillStyle = '#1a4a6e';
        ctx.fillRect(sx - 7 * s, ty + 9 * s, 8 * s, 9 * s);
        // Vent / crack lines 
        ctx.fillStyle = '#0a1a28';
        ctx.fillRect(sx - 5.5 * s, ty + 11 * s, 6 * s, 1.2 * s);
        ctx.fillRect(sx - 5.5 * s, ty + 15 * s, 6 * s, 1.2 * s);

        // Aqua glow from vent / crack (pulsing)
        const ledPhase = (frame + Math.floor(Math.abs(tree.wx) % 53)) % 47;
        const lavaGlow = (ledPhase > 10 && ledPhase < 32) ? 0.75 : 0.18;
        ctx.fillStyle = `rgba(51, 170, 204, ${lavaGlow})`;
        ctx.fillRect(sx - 4 * s, ty + 12 * s, 2.2 * s, 2 * s);
        ctx.fillStyle = `rgba(102, 221, 255, ${lavaGlow * 0.7})`;
        ctx.fillRect(sx - 3.2 * s, ty + 17 * s, 1.4 * s, 1.3 * s);

        // Flowing water streak down the rock face
        ctx.strokeStyle = `rgba(51, 170, 204, ${0.6 + 0.35 * Math.sin(frame * 0.09 + tree.wx)})`;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(sx + 2 * s, ty + 8 * s);
        ctx.lineTo(sx + 1.5 * s, ty + 20 * s);
        ctx.lineTo(sx + 3 * s, ty + 32 * s);
        ctx.stroke();
        ctx.strokeStyle = `rgba(136, 238, 255, ${0.35 + 0.25 * Math.sin(frame * 0.13 + tree.wx * 0.7)})`;
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(sx + 0.5 * s, ty + 10 * s);
        ctx.quadraticCurveTo(sx + 4 * s, ty + 18 * s, sx + 1 * s, ty + 29 * s);
        ctx.stroke();
        ctx.lineWidth = 1;

        // Water pooling at base of rock
        ctx.fillStyle = 'rgba(26, 90, 140, 0.7)';
        ctx.beginPath();
        ctx.ellipse(sx + 2 * s, ty + 39 * s, 7 * s, 2.2 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(102, 221, 255, ${0.45 + 0.3 * Math.sin(frame * 0.1)})`;
        ctx.beginPath();
        ctx.ellipse(sx + 2 * s, ty + 38 * s, 4 * s, 1.1 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        // Very subtle rising bubble wisps
        const steamT = frame * 0.021 + ((tree.wx * 5) % 21);
        ctx.strokeStyle = `rgba(102, 200, 230, ${0.09 + 0.06 * Math.sin(steamT)})`;
        ctx.lineWidth = 1.0;
        const steamX = sx - 1.5 * s;
        ctx.beginPath();
        ctx.moveTo(steamX, ty + 8 * s);
        ctx.lineTo(steamX + Math.sin(steamT * 0.65) * 1.4 * s, ty + 2 * s);
        ctx.stroke();
      }

      // === VERTICAL PATROLLING AQUA ALIENS (long tail, up/down movement) ===
      for (let e of verticalEnemies) {
        const sx = e.wx - scrollX;
        const sy = e.y;
        if (sx < -40 || sx > W + 40) continue;

        // Body (aqua alien)
        ctx.fillStyle = '#1a4a6e';
        ctx.beginPath();
        ctx.ellipse(sx, sy, 13, 11, 0, 0, Math.PI * 2);
        ctx.fill();

        // Head
        ctx.fillStyle = '#2277aa';
        ctx.beginPath();
        ctx.arc(sx + 5, sy - 6, 7, 0, Math.PI * 2);
        ctx.fill();

        // Eyes (warning lights)
        ctx.fillStyle = '#88eeff';
        ctx.fillRect(sx + 7, sy - 8, 2, 2);
        ctx.fillRect(sx + 11, sy - 7, 2, 2);

        // Long tail (waving)
        ctx.strokeStyle = '#0d2840';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(sx - 8, sy + 4);
        const tailWave = Math.sin(frame * 0.09 + e.phase) * 6;
        ctx.quadraticCurveTo(sx - 22, sy + 12 + tailWave * 0.5, sx - 32, sy + 18 + tailWave);
        ctx.stroke();

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#33aacc';
        ctx.beginPath();
        ctx.moveTo(sx - 8, sy + 4);
        ctx.quadraticCurveTo(sx - 20, sy + 10 + tailWave * 0.3, sx - 30, sy + 16 + tailWave * 0.8);
        ctx.stroke();
      }

      // === OVAL TRAMPOLINES (ice-blue bounce pads before tall walls) ===
      for (let t of trampolines) {
        const sx = t.wx - scrollX;
        if (sx < -50 || sx > W + 50) continue;

        const tw = t.width;
        const ty = GROUND_Y - 3;

        // Soft aqua glow under the pad
        ctx.fillStyle = 'rgba(51, 170, 204, 0.22)';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty + 4, tw / 2 + 8, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Main oval rock bounce pad (deep blue with aqua rim)
        ctx.fillStyle = '#1a3a55';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty, tw / 2, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        // Aqua edge highlight
        ctx.fillStyle = 'rgba(102, 221, 255, 0.6)';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty - 1, tw / 2 - 1, 2.2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Inner highlight
        ctx.fillStyle = '#aaffee';
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2 - 2, ty - 1, tw / 2 - 4, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Subtle edge ring
        ctx.strokeStyle = '#33aacc';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(sx + tw / 2, ty, tw / 2, 5, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // === BLUE-GREEN SEAWEED / AQUA FROND CEILING HAZARDS (L6 watery theme) ===
      // Stem teal/dark; frond tips aqua/cyan. Snake curve via wiggle sin offset on segments.
      // From ceiling (small y) down as thick segmented vine; head frond (circle + 5 petals); subtle vein/glow + slight anim.
      for (let f of ceilingFlowers) {
        const sx = f.wx - scrollX;
        if (sx < -60 || sx > W + 60) continue; // offscreen cull
        const baseY = f.baseY;
        const curLen = f.length;
        if (curLen < 1) continue;

        const segments = 7;
        const points = [];
        for (let i = 0; i <= segments; i++) {
          const t = i / segments;
          const ly = baseY + t * curLen;
          // snake wiggle: amp grows with length down the vine, phase + t for curve
          const amp = Math.min(t * curLen * 0.085, 22);
          const woff = Math.sin(frame * 0.029 + f.wigglePhase + t * 2.1) * amp;
          points.push({ x: sx + woff, y: ly });
        }

        // Thick dark seaweed vine (black-green, larger)
        ctx.strokeStyle = '#061410';
        ctx.lineWidth = 13.5;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();

        // Dark olive inner stem highlight
        ctx.strokeStyle = '#0d2a1c';
        ctx.lineWidth = 6.5;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();

        // Subtle deep-teal vein (muted danger, not bright surface cyan)
        ctx.strokeStyle = 'rgba(40, 90, 70, 0.45)';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(points[0].x + 1, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x + 1, points[i].y);
        }
        ctx.stroke();

        // Larger dark frond head at tip
        const tip = points[points.length - 1];
        const headPhase = frame * 0.04 + f.wigglePhase;
        const petalPulse = 0.9 + 0.15 * Math.sin(headPhase * 1.6);
        const headRot = Math.sin(headPhase) * 0.25;

        // Outer soft dark aura
        ctx.fillStyle = 'rgba(20, 50, 35, 0.28)';
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 18, 0, Math.PI * 2);
        ctx.fill();

        // Fronds (5 main + offsets; dark black-green seaweed)
        ctx.fillStyle = '#0a2418';
        for (let p = 0; p < 5; p++) {
          const pa = (p * (Math.PI * 2 / 5)) + headRot + (p % 2 ? 0.15 : -0.1);
          const px = tip.x + Math.cos(pa) * (10.5 * petalPulse);
          const py = tip.y + Math.sin(pa) * (7.5 * petalPulse);
          ctx.beginPath();
          ctx.ellipse(px, py, 7.5 * petalPulse, 4.4 * petalPulse, pa + 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#0d301c';
        for (let p = 0; p < 5; p++) {
          const pa = (p * (Math.PI * 2 / 5)) + headRot + 0.6 + (p % 2 ? 0.1 : -0.15);
          const px = tip.x + Math.cos(pa) * (7 * petalPulse);
          const py = tip.y + Math.sin(pa) * (5.5 * petalPulse);
          ctx.beginPath();
          ctx.ellipse(px, py, 5.2 * petalPulse, 3.0 * petalPulse, pa, 0, Math.PI * 2);
          ctx.fill();
        }

        // Center bulb (dark olive with faint teal)
        ctx.fillStyle = '#061810';
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 5.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(40, 90, 70, 0.55)';
        ctx.beginPath();
        ctx.arc(tip.x - 1, tip.y - 1, 2.2, 0, Math.PI * 2);
        ctx.fill();

        // Ceiling attach nub (thicker dark stem from top)
        ctx.fillStyle = '#061410';
        ctx.fillRect(sx - 3.5, 0, 7, baseY + 2);
        ctx.fillStyle = '#0a2218';
        ctx.fillRect(sx - 1.5, 0, 3, baseY + 1);
      }

      // === FLOATING PLATFORMS (ice-blue / coral-reef aqua with bubble texture; thicker, L/R sway + up/down float) ===
      for (let p of platforms) {
        const sway = (p.swayAmp || 0) * Math.sin((frame * 0.021) + (p.swayPhase || 0));
        const floatY = (p.floatAmp || 0) * Math.sin((frame * 0.018) + (p.floatPhase || 0));
        const sx = p.wx - scrollX + sway;
        if (sx < -90 || sx > W + 90) continue;
        const py = p.y + floatY;

        // soft shadow (moves slightly with sway + floatY)
        ctx.fillStyle = 'rgba(0,0,0,0.32)';
        ctx.fillRect(sx + 3, py + p.height + 3, p.width - 6, 5);

        if (window.NeonDashSprites && NeonDashSprites.drawPlatform(ctx, sx, py, p.width, p.height)) {
          continue;
        }

        // main platform body (ice-blue / aqua; variation based on moving L/R sway)
        ctx.fillStyle = ((p.swayAmp || 0) > 0.04 ? '#33aacc' : '#2277aa');
        ctx.fillRect(sx, py, p.width, p.height);

        // lighter aqua top highlight (ice sheen)
        ctx.fillStyle = 'rgba(136, 238, 255, 0.65)';
        ctx.fillRect(sx, py, p.width, 2);

        // subtle inner top highlight
        ctx.fillStyle = 'rgba(170, 240, 255, 0.4)';
        ctx.fillRect(sx + 3, py + 2, p.width - 6, 1);

        // underside detail (deeper blue)
        ctx.fillStyle = '#0d2840';
        ctx.fillRect(sx + 2, py + p.height - 3, p.width - 4, 2);

        // Bubble texture: several small semi-transparent ellipses/circles scattered on surface
        // (random but seeded by wx/phase for stable positions per platform; pulsing size/alpha with sin(frame))
        ctx.fillStyle = '#88eeff';
        const numBubbles = 5;
        for (let i = 0; i < numBubbles; i++) {
          // seeded pseudo-random pos using wx + phase + i (stable, no rand in draw)
          const seed = (p.wx * 0.83 + (p.swayPhase || 0) * 0.4 + i * 31.7) % 97;
          const bx = sx + 4 + (seed % (p.width - 9));
          const by = py + 2.5 + ((i * 2.8 + (seed % 7)) % (p.height - 4));
          const pulse = 0.75 + 0.35 * Math.sin(frame * 0.065 + i * 1.1 + (p.floatPhase || 0) * 0.6);
          const brx = (1.7 + (i % 2) * 0.6) * pulse;
          const bry = (1.2 + (i % 3) * 0.4) * pulse;
          ctx.globalAlpha = 0.28 + 0.22 * Math.sin(frame * 0.09 + i * 0.8 + seed);
          ctx.beginPath();
          ctx.ellipse(bx, by, brx, bry, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // subtle bubble rim highlights (brighter aqua accents)
        ctx.fillStyle = 'rgba(170, 240, 255, 0.5)';
        for (let i = 0; i < 2; i++) {
          const seed2 = (p.wx * 1.1 + i * 47) % 61;
          const bx2 = sx + 6 + (seed2 % (p.width - 12));
          const by2 = py + 3 + ((i * 3.5 + (seed2 % 5)) % (p.height - 6));
          const br2 = 1.1 + Math.sin(frame * 0.08 + i) * 0.3;
          ctx.beginPath();
          ctx.ellipse(bx2, by2, br2, br2 * 0.7, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // === FRIENDLY NPC (single mid-level aqua/teal octagon; approach bubble) ===
      if (friendlyNPC) {
        const bob = Math.sin(friendlyNPC.bouncePhase || 0) * 5;
        const npcX = friendlyNPC.wx - scrollX;
        const npcBaseY = friendlyNPC.y;
        const drawY = npcBaseY - bob;
        const size = 44;
        const r = size / 2;
        const isOnScreen = npcX >= -50 && npcX <= W + 50;

        if (isOnScreen) {
          if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'npc', npcX - r, drawY - r, size, size))) {
          ctx.fillStyle = '#33aacc';
          ctx.strokeStyle = '#1a6a88';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let i = 0; i < 8; i++) {
            const ang = (i * Math.PI * 2 / 8) - Math.PI / 8;
            const x = npcX + Math.cos(ang) * r;
            const y = drawY + Math.sin(ang) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#88eeff';
          ctx.beginPath();
          ctx.arc(npcX - 5, drawY - 3, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(npcX + 5, drawY - 3, 3.5, 0, Math.PI * 2);
          ctx.fill();
          }

          // Speech bubble if approached (disappears when NPC off screen)
          if (friendlyNPC.approached) {
            const boxW = 268;
            const boxH = 34;
            const boxX = Math.max(20, Math.min(W - boxW - 20, npcX - boxW / 2));
            const boxY = Math.max(12, drawY - 52);

            if (!(window.NeonDashSprites && NeonDashSprites.drawSpeechBubble(ctx, boxX, boxY, boxW, boxH, npcX, drawY - 2, ['The neon is leaking! we have to stop it!']))) {
              ctx.fillStyle = 'rgba(52, 8, 38, 0.94)';
              ctx.fillRect(boxX, boxY, boxW, boxH);
              ctx.strokeStyle = '#ff79d0';
              ctx.strokeRect(boxX, boxY, boxW, boxH);
              ctx.fillStyle = '#ffe6f5';
              ctx.font = '11px Segoe UI, Arial';
              ctx.textAlign = 'center';
              ctx.fillText('The neon is leaking! we have to stop it!', boxX + boxW / 2, boxY + 21);
            }
          }
        }
      }

      // === NEON GAS PIPES (metallic stubs + thin upward cyan/magenta neon plumes) ===
      for (let p of neonPipes) {
        const sx = p.wx - scrollX;
        if (sx < -40 || sx > W + 40) continue;
        const pipeH = p.pipeH;
        const streamH = p.streamH;
        const pipeTop = GROUND_Y - pipeH;
        const phase = (p.phase || 0) + frame * 0.12;
        const pipeW = 12;

        // Metallic pipe body (cylinder-ish rect with rim)
        ctx.fillStyle = '#6a7585';
        ctx.fillRect(sx - pipeW / 2, pipeTop, pipeW, pipeH);
        // Darker left bevel
        ctx.fillStyle = '#3d4654';
        ctx.fillRect(sx - pipeW / 2, pipeTop, 3, pipeH);
        // Lighter right highlight
        ctx.fillStyle = '#a8b4c4';
        ctx.fillRect(sx + pipeW / 2 - 3, pipeTop, 2.5, pipeH);
        // Top rim flange
        ctx.fillStyle = '#8a96a8';
        ctx.fillRect(sx - pipeW / 2 - 2, pipeTop - 3, pipeW + 4, 4);
        ctx.strokeStyle = '#2a3038';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx - pipeW / 2 - 2, pipeTop - 3, pipeW + 4, 4);
        // Inner dark hole
        ctx.fillStyle = '#1a1e28';
        ctx.fillRect(sx - 3, pipeTop - 2, 6, 3);

        // Upward neon gas stream (thin elongated plume + particles)
        ctx.save();
        for (let i = 0; i < 10; i++) {
          const t = i / 10;
          const y = pipeTop - 2 - t * streamH;
          const wobble = Math.sin(phase + i * 0.7) * (1.2 + t * 2.5);
          const w = 2.2 + t * 3.5;
          const alpha = 0.55 * (1 - t * 0.75);
          const isMag = (i + Math.floor(frame * 0.08)) % 3 === 0;
          ctx.fillStyle = isMag
            ? `rgba(255, 80, 220, ${alpha})`
            : `rgba(80, 240, 255, ${alpha})`;
          ctx.beginPath();
          ctx.ellipse(sx + wobble, y, w * 0.55, 5 + t * 3, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        // Core thin bright stream
        const grad = ctx.createLinearGradient(sx, pipeTop, sx, pipeTop - streamH);
        grad.addColorStop(0, 'rgba(180, 255, 255, 0.75)');
        grad.addColorStop(0.45, 'rgba(120, 220, 255, 0.45)');
        grad.addColorStop(0.75, 'rgba(255, 90, 230, 0.28)');
        grad.addColorStop(1, 'rgba(255, 120, 240, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(sx - 2.2, pipeTop - streamH, 4.4, streamH);
        // Soft outer glow
        ctx.globalAlpha = 0.22 + 0.08 * Math.sin(phase);
        ctx.fillStyle = '#66eeff';
        ctx.shadowColor = '#44ddff';
        ctx.shadowBlur = 12;
        ctx.fillRect(sx - 5, pipeTop - streamH * 0.85, 10, streamH * 0.7);
        ctx.restore();
      }

      // draw obstacles — spiky coral reef formations (hitbox unchanged: ~tw 27, height o.h)
      for (let o of obstacles) {
        const currWX = getTriangleCurrentWX(o);
        const sx = currWX - scrollX;
        if (sx < -30 || sx > W + 30) continue;

        const th = o.h;
        const tw = 27;
        const wiggle = Math.sin(frame * 0.065 + (o.wx || 0) * 0.015) * 1.6; // alive sway
        const drawX = sx + wiggle;
        const pulse = 0.55 + 0.45 * Math.sin(frame * 0.08 + (o.wx || 0) * 0.02);
        const polypBob = Math.sin(frame * 0.11 + (o.wx || 0) * 0.03);

        // soft ground shadow (wider base of coral cluster)
        ctx.fillStyle = 'rgba(0,0,0,0.38)';
        ctx.beginPath();
        ctx.ellipse(drawX, GROUND_Y + 2.5, tw * 0.62, 3.2, 0, 0, Math.PI * 2);
        ctx.fill();

        if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'hazard', drawX - tw / 2, GROUND_Y - th, tw, th))) {
        // base mound (reef rock) — teal-dark
        ctx.fillStyle = '#0a2a38';
        ctx.beginPath();
        ctx.moveTo(drawX - tw * 0.55, GROUND_Y + 0.5);
        ctx.quadraticCurveTo(drawX - tw * 0.2, GROUND_Y - th * 0.18, drawX, GROUND_Y - th * 0.12);
        ctx.quadraticCurveTo(drawX + tw * 0.2, GROUND_Y - th * 0.18, drawX + tw * 0.55, GROUND_Y + 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#123848';
        ctx.beginPath();
        ctx.ellipse(drawX, GROUND_Y - 1, tw * 0.48, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // main central spike (keeps triangular silhouette / same height)
        const tipY = GROUND_Y - th;
        ctx.fillStyle = '#0d3a52';
        ctx.beginPath();
        ctx.moveTo(drawX, tipY);
        ctx.lineTo(drawX - tw * 0.28, GROUND_Y - th * 0.08);
        ctx.lineTo(drawX - tw * 0.12, GROUND_Y + 0.5);
        ctx.lineTo(drawX + tw * 0.12, GROUND_Y + 0.5);
        ctx.lineTo(drawX + tw * 0.28, GROUND_Y - th * 0.08);
        ctx.closePath();
        ctx.fill();

        // mid-tone ridge on main spike
        ctx.fillStyle = '#1a5a78';
        ctx.beginPath();
        ctx.moveTo(drawX, tipY + 2);
        ctx.lineTo(drawX - tw * 0.14, GROUND_Y - th * 0.15);
        ctx.lineTo(drawX + tw * 0.14, GROUND_Y - th * 0.15);
        ctx.closePath();
        ctx.fill();

        // glowing aqua tip
        ctx.fillStyle = `rgba(80, 210, 240, ${0.45 + 0.35 * pulse})`;
        ctx.beginPath();
        ctx.moveTo(drawX, tipY);
        ctx.lineTo(drawX - 4.5, tipY + th * 0.22);
        ctx.lineTo(drawX + 4.5, tipY + th * 0.22);
        ctx.closePath();
        ctx.fill();

        // left branch spike (teal coral arm, angled out)
        const lBranchH = th * (0.55 + 0.08 * Math.sin((o.wx || 0)));
        ctx.fillStyle = '#156070';
        ctx.beginPath();
        ctx.moveTo(drawX - tw * 0.08, GROUND_Y - th * 0.35);
        ctx.lineTo(drawX - tw * 0.52, GROUND_Y - lBranchH);
        ctx.lineTo(drawX - tw * 0.22, GROUND_Y - th * 0.12);
        ctx.lineTo(drawX - tw * 0.05, GROUND_Y - th * 0.22);
        ctx.closePath();
        ctx.fill();
        // left tip glow (pink-coral accent)
        ctx.fillStyle = `rgba(255, 120, 170, ${0.35 + 0.25 * pulse})`;
        ctx.beginPath();
        ctx.moveTo(drawX - tw * 0.52, GROUND_Y - lBranchH);
        ctx.lineTo(drawX - tw * 0.42, GROUND_Y - lBranchH + 5);
        ctx.lineTo(drawX - tw * 0.38, GROUND_Y - lBranchH + 3);
        ctx.closePath();
        ctx.fill();

        // right branch spike (slightly shorter, blue-teal)
        const rBranchH = th * (0.48 + 0.06 * Math.cos((o.wx || 0) * 0.7));
        ctx.fillStyle = '#0e4a68';
        ctx.beginPath();
        ctx.moveTo(drawX + tw * 0.08, GROUND_Y - th * 0.32);
        ctx.lineTo(drawX + tw * 0.50, GROUND_Y - rBranchH);
        ctx.lineTo(drawX + tw * 0.20, GROUND_Y - th * 0.10);
        ctx.lineTo(drawX + tw * 0.05, GROUND_Y - th * 0.20);
        ctx.closePath();
        ctx.fill();
        // right tip glow (aqua)
        ctx.fillStyle = `rgba(90, 220, 230, ${0.4 + 0.3 * pulse})`;
        ctx.beginPath();
        ctx.moveTo(drawX + tw * 0.50, GROUND_Y - rBranchH);
        ctx.lineTo(drawX + tw * 0.40, GROUND_Y - rBranchH + 4.5);
        ctx.lineTo(drawX + tw * 0.36, GROUND_Y - rBranchH + 2.5);
        ctx.closePath();
        ctx.fill();

        // secondary small center-left spike for denser reef silhouette
        ctx.fillStyle = '#184858';
        ctx.beginPath();
        ctx.moveTo(drawX - tw * 0.18, GROUND_Y - th * 0.62);
        ctx.lineTo(drawX - tw * 0.32, GROUND_Y - th * 0.28);
        ctx.lineTo(drawX - tw * 0.06, GROUND_Y - th * 0.28);
        ctx.closePath();
        ctx.fill();

        // secondary small center-right spike
        ctx.fillStyle = '#1a5068';
        ctx.beginPath();
        ctx.moveTo(drawX + tw * 0.16, GROUND_Y - th * 0.58);
        ctx.lineTo(drawX + tw * 0.06, GROUND_Y - th * 0.26);
        ctx.lineTo(drawX + tw * 0.30, GROUND_Y - th * 0.26);
        ctx.closePath();
        ctx.fill();

        // polyp clusters (small glowing dots along body) — pink / teal / aqua
        const polyps = [
          { dx: -3.5, dy: th * 0.42, c: '255,140,180', s: 1.6 },
          { dx: 2.8, dy: th * 0.55, c: '80,210,230', s: 1.4 },
          { dx: -1.2, dy: th * 0.28, c: '120,230,200', s: 1.3 },
          { dx: 4.5, dy: th * 0.38, c: '255,150,160', s: 1.2 },
          { dx: -5.5, dy: th * 0.18, c: '70,190,220', s: 1.5 },
          { dx: 1.0, dy: th * 0.72, c: '200,120,200', s: 1.1 },
          { dx: -tw * 0.35, dy: lBranchH * 0.55, c: '255,130,160', s: 1.3 },
          { dx: tw * 0.32, dy: rBranchH * 0.5, c: '90,220,210', s: 1.2 }
        ];
        for (let pi = 0; pi < polyps.length; pi++) {
          const pl = polyps[pi];
          const py = GROUND_Y - pl.dy + polypBob * (0.4 + (pi % 3) * 0.15);
          const a = 0.45 + 0.35 * Math.sin(frame * 0.1 + pi * 1.1 + (o.wx || 0));
          ctx.fillStyle = `rgba(${pl.c}, ${a})`;
          ctx.beginPath();
          ctx.arc(drawX + pl.dx, py, pl.s, 0, Math.PI * 2);
          ctx.fill();
        }

        // thin aqua rim highlight on main spike
        ctx.strokeStyle = `rgba(102,221,255,${0.25 + 0.2 * pulse})`;
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(drawX, tipY + 1);
        ctx.lineTo(drawX - tw * 0.22, GROUND_Y - th * 0.1);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(drawX, tipY + 1);
        ctx.lineTo(drawX + tw * 0.22, GROUND_Y - th * 0.1);
        ctx.stroke();

        // soft outer glow (deep-water coral luminescence)
        ctx.save();
        ctx.globalAlpha = 0.12 + 0.08 * pulse;
        ctx.fillStyle = '#44ccdd';
        ctx.beginPath();
        ctx.moveTo(drawX, tipY - 2);
        ctx.lineTo(drawX - tw * 0.45, GROUND_Y);
        ctx.lineTo(drawX + tw * 0.45, GROUND_Y);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        }
      }

      // === AQUA BIO-SHOOTERS (fins + tentacles - slow, squashable from above, shoot ink/water orbs) ===
      // Hitbox remains s.wx / s.y / s.w / s.h — visual only rewrite
      for (let s of specials) {
        const sx = s.wx - scrollX;
        const sy = s.y;
        if (sx < -60 || sx > W + 60) continue;

        const cx = sx + s.w / 2;
        const cy = sy + s.h / 2 + 2;
        const radius = s.h / 2 - 2;
        const pulse = 0.7 + Math.sin(frame * 0.12 + s.wx) * 0.35;
        const swim = Math.sin(frame * 0.08 + s.wx * 0.02) * 2.2;
        const tentWiggle = Math.sin(frame * 0.11 + s.wx * 0.015);

        // soft shadow
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath();
        ctx.ellipse(cx + 2, GROUND_Y + 2, radius * 0.9, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        if (window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'enemy', sx, sy, s.w, s.h)) {
          continue;
        }

        // Soft outer aqua glow
        ctx.fillStyle = `rgba(51, 170, 204, ${0.18 * pulse})`;
        ctx.beginPath();
        ctx.ellipse(cx, cy, radius + 9 + Math.sin(frame * 0.09) * 2.5, radius * 1.15 + 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Secondary inner glow
        ctx.fillStyle = `rgba(102, 221, 255, ${0.2 * pulse})`;
        ctx.beginPath();
        ctx.ellipse(cx, cy - 1, radius + 3 + Math.sin(frame * 0.11) * 1.5, radius * 1.05, 0, 0, Math.PI * 2);
        ctx.fill();

        // Side fins (left / right triangular fins — aqua-biological)
        ctx.fillStyle = '#1a5a88';
        ctx.beginPath();
        ctx.moveTo(cx - radius * 0.55, cy);
        ctx.lineTo(cx - radius * 1.35 - swim * 0.3, cy - 6 + tentWiggle * 2);
        ctx.lineTo(cx - radius * 0.4, cy + 8);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx + radius * 0.55, cy);
        ctx.lineTo(cx + radius * 1.35 + swim * 0.3, cy - 5 - tentWiggle * 2);
        ctx.lineTo(cx + radius * 0.4, cy + 8);
        ctx.closePath();
        ctx.fill();
        // Fin highlights
        ctx.fillStyle = '#33aacc';
        ctx.beginPath();
        ctx.moveTo(cx - radius * 0.5, cy + 1);
        ctx.lineTo(cx - radius * 1.1, cy - 2 + tentWiggle);
        ctx.lineTo(cx - radius * 0.42, cy + 5);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx + radius * 0.5, cy + 1);
        ctx.lineTo(cx + radius * 1.1, cy - 1 - tentWiggle);
        ctx.lineTo(cx + radius * 0.42, cy + 5);
        ctx.closePath();
        ctx.fill();

        // Main body — deep blue oval (respects tall hitbox via radius from s.h)
        ctx.fillStyle = '#0d2840';
        ctx.beginPath();
        ctx.ellipse(cx, cy + swim * 0.15, radius * 0.92, radius * 1.12, 0, 0, Math.PI * 2);
        ctx.fill();

        // Mid body lobe (teal)
        ctx.fillStyle = '#1a4a6e';
        ctx.beginPath();
        ctx.ellipse(cx - 2, cy - 2 + swim * 0.2, radius * 0.72, radius * 0.95, 0, 0, Math.PI * 2);
        ctx.fill();

        // Belly / lower body (lighter aqua)
        ctx.fillStyle = '#2277aa';
        ctx.beginPath();
        ctx.ellipse(cx + 1, cy + 4 + swim * 0.25, radius * 0.58, radius * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Dorsal fin on top
        ctx.fillStyle = '#0a3a5a';
        ctx.beginPath();
        ctx.moveTo(cx - 4, cy - radius * 0.85);
        ctx.lineTo(cx, cy - radius * 1.35 - Math.abs(swim) * 0.4);
        ctx.lineTo(cx + 5, cy - radius * 0.8);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#33aacc';
        ctx.beginPath();
        ctx.moveTo(cx - 1, cy - radius * 0.9);
        ctx.lineTo(cx + 0.5, cy - radius * 1.2);
        ctx.lineTo(cx + 2, cy - radius * 0.88);
        ctx.closePath();
        ctx.fill();

        // Tentacles at base (3 wavy strokes, canvas geometry)
        for (let t = 0; t < 3; t++) {
          const baseX = cx - 7 + t * 7;
          const tw = tentWiggle * (t === 1 ? -1.2 : 1) * (2 + t * 0.4);
          ctx.strokeStyle = t === 1 ? '#1a6a88' : '#0d4060';
          ctx.lineWidth = 3.2 - t * 0.3;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(baseX, cy + radius * 0.75);
          ctx.quadraticCurveTo(
            baseX + tw * 3, cy + radius * 0.95 + 6 + Math.sin(frame * 0.1 + t) * 2,
            baseX + tw * 5, cy + radius * 1.15 + 10 + Math.abs(swim)
          );
          ctx.stroke();
          // tip sucker / bulb
          ctx.fillStyle = '#33aacc';
          ctx.beginPath();
          ctx.arc(baseX + tw * 5, cy + radius * 1.15 + 10 + Math.abs(swim), 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.lineWidth = 1;

        // Bright glowing core (aqua, pulsing)
        ctx.fillStyle = '#33aacc';
        ctx.beginPath();
        ctx.ellipse(cx - 1, cy - 3 + swim * 0.1, radius * 0.38, radius * 0.42, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eye (single bio eye)
        ctx.fillStyle = '#88eeff';
        ctx.beginPath();
        ctx.arc(cx + 3, cy - 6, radius * 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0a1628';
        ctx.beginPath();
        ctx.arc(cx + 3.5, cy - 6, radius * 0.1, 0, Math.PI * 2);
        ctx.fill();

        // Rising bubbles near body
        ctx.fillStyle = 'rgba(136, 238, 255, 0.65)';
        for (let e = 0; e < 3; e++) {
          const ePhase = frame * 0.065 + e * 1.7 + s.wx * 0.01;
          const ex = cx + Math.sin(ePhase) * (radius * 0.7 + 2);
          const ey = cy - 6 - ((ePhase * 1.8) % (radius * 1.1));
          ctx.beginPath();
          ctx.arc(ex, ey, 1.1 + (e % 2) * 0.6, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // === MONSTER INK / WATER ORBS (blue-aqua from bio-shooters; twice size)
      for (let pr of projectiles) {
        const sx = pr.wx - scrollX;
        const sy = pr.y;
        if (sx < -30 || sx > W + 30) continue;
        if (window.NeonDashSprites && NeonDashSprites.drawShot(ctx, 'water', sx, sy, frame, 24, 24, pr.vx, pr.vy)) continue;

        const r = 8 + Math.sin(frame * 0.22 + sx) * 0.8; // twice size

        // Outer aqua glow
        ctx.fillStyle = 'rgba(51, 170, 204, 0.3)';
        ctx.beginPath();
        ctx.arc(sx, sy, r + 4, 0, Math.PI * 2);
        ctx.fill();

        // Main water/ink orb body
        ctx.fillStyle = '#2277aa';
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();

        // Bubbles inside (pulsing lighter)
        ctx.fillStyle = '#66ddff';
        for (let b = 0; b < 3; b++) {
          const bp = frame * 0.15 + b * 2.1 + sx;
          const bx = sx + Math.sin(bp) * r * 0.35;
          const by = sy + Math.cos(bp * 0.7) * r * 0.25;
          ctx.beginPath();
          ctx.arc(bx, by, 1.5 + Math.sin(bp) * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Core
        ctx.fillStyle = '#88eeff';
        ctx.beginPath();
        ctx.arc(sx - 0.5, sy - 0.5, r * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }

      // === LEVEL EXIT LADDER + PORTAL (appears after ~1000 distance) ===
      if (levelExit) {
        const lx = levelExit.wx - scrollX;
        const baseY = levelExit.baseY;

        // Tall ladder structure (at least 60% of level height when end spawns)
        ctx.strokeStyle = '#334c66';
        ctx.lineWidth = 3;
        // Left rail
        ctx.beginPath();
        ctx.moveTo(lx - 9, baseY);
        ctx.lineTo(lx - 9, baseY - 320);
        ctx.stroke();
        // Right rail
        ctx.beginPath();
        ctx.moveTo(lx + 9, baseY);
        ctx.lineTo(lx + 9, baseY - 320);
        ctx.stroke();

        // Rungs (more rungs for taller ladder)
        ctx.strokeStyle = '#2a4157';
        ctx.lineWidth = 2;
        for (let r = 0; r < 19; r++) {
          const ry = baseY - 12 - r * 16;
          ctx.beginPath();
          ctx.moveTo(lx - 8, ry);
          ctx.lineTo(lx + 8, ry);
          ctx.stroke();
        }

        // Top platform / arch (higher)
        ctx.fillStyle = '#1f3347';
        ctx.fillRect(lx - 16, baseY - 323, 32, 7);

        // Glowing pink-purple portal / rift at the top - BADASS enhanced: larger concentric swirling glowing segments, lightning bolts (harmless, frame-timed)
        const portalY = baseY - 305;
        if (!(window.NeonDashSprites && NeonDashSprites.drawPortal(ctx, lx, portalY, frame))) {
        const px = lx;
        const py = portalY;
        const baseRx = 50;
        const baseRy = 72;
        const pulse = Math.sin(frame * 0.27) * 2 + 3;
        // Outer pulsing fill glow (larger) — pink-ish purple
        ctx.save();
        ctx.shadowColor = '#cc66ee';
        ctx.shadowBlur = 28;
        ctx.fillStyle = '#aa66cc';
        ctx.beginPath();
        ctx.ellipse(px, py, baseRx + pulse, baseRy + pulse * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // Inner core rift (brighter pink-lilac, larger)
        ctx.fillStyle = '#ff88cc';
        ctx.beginPath();
        ctx.ellipse(px, py - 1, baseRx * 0.55, baseRy * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffeef8';
        ctx.beginPath();
        ctx.ellipse(px, py - 2, baseRx * 0.28, baseRy * 0.38, 0, 0, Math.PI * 2);
        ctx.fill();
        // Concentric swirling glowing segments (5 layers, different speeds/dirs, dashed for rift effect)
        for (let i = 0; i < 5; i++) {
          const rot = (frame * (0.013 + i * 0.0075) * ((i % 2) ? 1 : -1)) % (Math.PI * 2);
          const rx = baseRx + i * 3.5 + Math.sin(frame * 0.11 + i) * 1.2;
          const ry = baseRy + i * 2.8 + Math.cos(frame * 0.09 + i) * 0.9;
          const alpha = 0.28 + 0.12 * (1 - i / 5) + Math.sin(frame * 0.2 + i) * 0.08;
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(rot);
          ctx.strokeStyle = `rgba(204, 102, 238, ${alpha})`;
          ctx.lineWidth = 1.8 + (4 - i) * 0.4;
          ctx.beginPath();
          ctx.ellipse(0, i * 1.2, rx, ry, 0, 0, Math.PI * 2);
          ctx.stroke();
          // Animated dashed swirl segments on odd layers
          if (i % 2 === 1) {
            ctx.setLineDash([3, 5]);
            ctx.lineDashOffset = -frame * (1.2 + i * 0.6) * ((i % 4 < 2) ? 1 : -1);
            ctx.strokeStyle = `rgba(255, 136, 204, ${alpha * 0.7})`;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.ellipse(0, i * 1.2, rx * 0.98, ry * 0.98, 0, 0, Math.PI * 1.1);
            ctx.stroke();
            ctx.setLineDash([]);
          }
          ctx.restore();
        }
        // Subtle rim
        ctx.strokeStyle = '#dd99ff';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.ellipse(px, py, baseRx + 1, baseRy + 1, 0, 0, Math.PI * 2);
        ctx.stroke();
        // Harmless lightning bolts (occasional, jagged, 3-pass glow; timed ~every 47 frames, duration ~8; biased upward/outward)
        const boltCycle = 47;
        const boltDur = 8;
        const phase = frame % boltCycle;
        if (phase < boltDur) {
          const numBolts = 1 + ((frame / 23) | 0) % 3;
          for (let b = 0; b < numBolts; b++) {
            const spread = (b - (numBolts - 1) / 2) * 0.55;
            const ang = -1.65 + spread;
            const tPhase = frame * 0.9 + b * 2.3;
            ctx.strokeStyle = 'rgba(238, 160, 255, 0.45)';
            ctx.lineWidth = 3.8;
            ctx.beginPath();
            let cx = px + Math.cos(ang) * 8;
            let cy = py - 4;
            ctx.moveTo(cx, cy);
            for (let k = 1; k <= 5; k++) {
              const j = Math.sin(tPhase + k * 1.7) * (7 + b);
              const len = 42 + k * 2;
              cx += Math.cos(ang) * len + j * Math.cos(ang + 1.57) * 0.6;
              cy += Math.sin(ang) * len + j * Math.sin(ang + 1.57) * 0.6;
              ctx.lineTo(cx, cy);
            }
            ctx.stroke();
            ctx.strokeStyle = '#ff88cc';
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.strokeStyle = '#ffeef8';
            ctx.lineWidth = 0.9;
            ctx.stroke();
          }
        }
        }

        // Glowing "Hydro Control Zone" building — 3× original width (126px), watery blue theme
        const bx = lx + HYDRO_BUILD_OFF;
        const by = baseY;
        const bw = HYDRO_BUILD_W;
        const bh = HYDRO_BUILD_H;
        const bPulse = Math.sin(frame * 0.22) * 1.8 + 1.2;
        const usedBuildSprite = window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'build', bx - 12, by - bh - 16, bw + 24, bh + 18);
        if (usedBuildSprite) {
          ctx.fillStyle = '#88eeff';
          ctx.font = 'bold 11px Segoe UI, Arial';
          ctx.textAlign = 'center';
          ctx.fillText('Hydro Control Zone', bx + bw * 0.5, by - bh - 20);
        }
        if (!usedBuildSprite) {
        // Wide aura glow (aqua)
        ctx.fillStyle = 'rgba(51, 170, 204, 0.18)';
        ctx.fillRect(bx - 12, by - bh - 22, bw + 24, bh + 18);
        ctx.fillStyle = 'rgba(102, 221, 255, 0.22)';
        ctx.fillRect(bx - 6, by - bh - 12, bw + 12, bh + 6);
        // Building body (dark blue metallic)
        ctx.fillStyle = '#081624';
        ctx.fillRect(bx, by - bh, bw, bh);
        // Panel grid lines
        ctx.strokeStyle = 'rgba(40, 90, 120, 0.55)';
        ctx.lineWidth = 1;
        for (let px = 1; px < 4; px++) {
          const gx = bx + (bw * px) / 4;
          ctx.beginPath();
          ctx.moveTo(gx, by - bh + 8);
          ctx.lineTo(gx, by - 4);
          ctx.stroke();
        }
        for (let py = 1; py < 5; py++) {
          const gy = by - bh + (bh * py) / 5;
          ctx.beginPath();
          ctx.moveTo(bx + 4, gy);
          ctx.lineTo(bx + bw - 4, gy);
          ctx.stroke();
        }
        // Cyan trim / outline
        ctx.strokeStyle = '#33aacc';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(bx, by - bh, bw, bh);
        // Roofline ledge + antenna
        ctx.fillStyle = '#0e2438';
        ctx.fillRect(bx - 4, by - bh - 8, bw + 8, 10);
        ctx.strokeStyle = '#44ccee';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(bx - 4, by - bh - 8, bw + 8, 10);
        ctx.strokeStyle = '#66ddff';
        ctx.beginPath();
        ctx.moveTo(bx + bw * 0.5, by - bh - 8);
        ctx.lineTo(bx + bw * 0.5, by - bh - 28 - bPulse);
        ctx.stroke();
        ctx.fillStyle = '#88eeff';
        ctx.beginPath();
        ctx.arc(bx + bw * 0.5, by - bh - 28 - bPulse, 3 + bPulse * 0.15, 0, Math.PI * 2);
        ctx.fill();
        // Vertical pipes on left facade
        ctx.fillStyle = '#1a3a55';
        ctx.fillRect(bx + 6, by - bh + 12, 7, bh - 20);
        ctx.fillRect(bx + 16, by - bh + 28, 5, bh - 36);
        ctx.strokeStyle = '#33aacc';
        ctx.lineWidth = 1;
        ctx.strokeRect(bx + 6, by - bh + 12, 7, bh - 20);
        // Pipe joints / valves
        for (let j = 0; j < 4; j++) {
          ctx.fillStyle = '#44bbdd';
          ctx.fillRect(bx + 4, by - bh + 30 + j * 32, 11, 5);
        }
        // Glowing windows (multi-column)
        for (let col = 0; col < 4; col++) {
          for (let row = 0; row < 3; row++) {
            const wx = bx + 30 + col * 22;
            const wy = by - bh + 18 + row * 28;
            // skip area over door
            if (row === 2 && col >= 1 && col <= 2) continue;
            const glow = 0.45 + 0.25 * Math.sin(frame * 0.12 + col + row);
            ctx.fillStyle = `rgba(100, 220, 255, ${glow})`;
            ctx.fillRect(wx, wy, 14, 11);
            ctx.strokeStyle = 'rgba(160, 240, 255, 0.5)';
            ctx.lineWidth = 1;
            ctx.strokeRect(wx, wy, 14, 11);
          }
        }
        // Vents (upper right)
        ctx.fillStyle = '#0a2030';
        for (let v = 0; v < 3; v++) {
          const vx = bx + bw - 28;
          const vy = by - bh + 16 + v * 14;
          ctx.fillRect(vx, vy, 18, 8);
          ctx.strokeStyle = '#2a6a88';
          ctx.strokeRect(vx, vy, 18, 8);
          ctx.strokeStyle = 'rgba(80, 180, 220, 0.55)';
          for (let s = 0; s < 3; s++) {
            ctx.beginPath();
            ctx.moveTo(vx + 3, vy + 2 + s * 2);
            ctx.lineTo(vx + 15, vy + 2 + s * 2);
            ctx.stroke();
          }
        }
        // Side lights (blinking aqua)
        const lightOn = (Math.sin(frame * 0.18) > -0.2);
        ctx.fillStyle = lightOn ? '#66eeff' : '#1a4455';
        ctx.beginPath();
        ctx.arc(bx + 4, by - bh + 40, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(bx + bw - 4, by - bh + 40, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = (Math.sin(frame * 0.15 + 1) > 0) ? '#44ffcc' : '#1a5544';
        ctx.beginPath();
        ctx.arc(bx + 4, by - 50, 3, 0, Math.PI * 2);
        ctx.fill();
        // Open door with warm-cyan interior light (clear walk-in entrance)
        const doorX = bx + HYDRO_DOOR_OFF;
        const doorW = HYDRO_DOOR_W;
        const doorH = HYDRO_DOOR_H;
        // Door frame
        ctx.fillStyle = '#0c2a3e';
        ctx.fillRect(doorX - 3, by - doorH - 3, doorW + 6, doorH + 3);
        ctx.strokeStyle = '#55ccee';
        ctx.lineWidth = 2;
        ctx.strokeRect(doorX - 3, by - doorH - 3, doorW + 6, doorH + 3);
        // Dark opening
        ctx.fillStyle = '#030810';
        ctx.fillRect(doorX, by - doorH, doorW, doorH);
        // Inner light spill
        const doorGlow = 0.55 + 0.2 * Math.sin(frame * 0.2);
        ctx.fillStyle = `rgba(100, 200, 255, ${doorGlow})`;
        ctx.fillRect(doorX + 4, by - doorH + 4, doorW - 8, doorH - 8);
        ctx.fillStyle = `rgba(180, 240, 255, ${doorGlow * 0.7})`;
        ctx.fillRect(doorX + 9, by - doorH + 10, doorW - 18, doorH - 18);
        // Door sill
        ctx.fillStyle = '#1a4a66';
        ctx.fillRect(doorX - 4, by - 4, doorW + 8, 4);
        // Signage board
        ctx.fillStyle = 'rgba(8, 28, 48, 0.92)';
        ctx.fillRect(bx + bw * 0.5 - 62, by - bh - 22, 124, 16);
        ctx.strokeStyle = '#66ddff';
        ctx.lineWidth = 1.4;
        ctx.strokeRect(bx + bw * 0.5 - 62, by - bh - 22, 124, 16);
        ctx.fillStyle = '#88eeff';
        ctx.font = 'bold 11px Segoe UI, Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Hydro Control Zone', bx + bw * 0.5, by - bh - 10);
        ctx.fillStyle = 'rgba(102, 221, 255, 0.45)';
        ctx.fillText('Hydro Control Zone', bx + bw * 0.5, by - bh - 10);
        // Small "NEON DEPOT" plaque above door
        ctx.fillStyle = 'rgba(10, 40, 60, 0.9)';
        ctx.fillRect(doorX - 6, by - doorH - 16, doorW + 12, 11);
        ctx.fillStyle = '#66ffcc';
        ctx.font = 'bold 8px Consolas, monospace';
        ctx.fillText('NEON DEPOT', doorX + doorW * 0.5, by - doorH - 8);
        }

        // Ice-blue floating pyramid NPC beside entrance (non-blocking)
        if (endPyramid) {
          const bob = Math.sin(endPyramid.phase || 0) * 5;
          const npcX = endPyramid.wx - scrollX;
          const drawY = endPyramid.y - bob;
          if (!(window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, 'pyramid', npcX - 26, drawY - 30, 52, 52))) {
          ctx.fillStyle = '#66ddff';
          ctx.strokeStyle = '#33aacc';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(npcX - 20, drawY + 14);
          ctx.lineTo(npcX + 20, drawY + 14);
          ctx.lineTo(npcX, drawY - 26);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(npcX - 7, drawY - 6, 6, 4.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(npcX + 7, drawY - 6, 6, 4.5, 0, 0, Math.PI * 2);
          ctx.fill();
          }
          // Speech bubble (approach mechanic — invite into plant)
          const onScreen = npcX > -50 && npcX < W + 50;
          if (endPyramid.approached && onScreen) {
            const boxW = 300;
            const boxH = 48;
            const boxX = Math.max(12, Math.min(W - boxW - 12, npcX - boxW / 2));
            const boxY = Math.max(12, drawY - 78);
            ctx.fillStyle = 'rgba(10, 30, 50, 0.92)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#66ddff';
            ctx.lineWidth = 1.6;
            ctx.strokeRect(boxX, boxY, boxW, boxH);
            ctx.fillStyle = '#aaddff';
            ctx.font = '11px Segoe UI, Arial';
            ctx.textAlign = 'center';
            ctx.fillText("I'm so glad to see you!", boxX + boxW / 2, boxY + 16);
            ctx.fillText('Please go into the plant to spend your neon!', boxX + boxW / 2, boxY + 34);
            ctx.strokeStyle = '#66bbdd';
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.moveTo(boxX + boxW / 2, boxY + boxH);
            ctx.lineTo(npcX, drawY - 5);
            ctx.stroke();
          }
        }
      }

      // === END WATER ORBS (near-exit hazard; blue-aqua, twice size; repurposed visuals)
      for (let fb of endFireballs) {
        const sx = fb.wx - scrollX;
        const sy = fb.y;
        if (sx < -20 || sx > W + 40) continue;
        if (window.NeonDashSprites && NeonDashSprites.drawShot(ctx, 'water', sx + 4, sy + 2, frame, 24, 24, fb.vx, fb.vy)) continue;

        const r = 9; // twice size base

        // Outer aqua glow
        ctx.fillStyle = 'rgba(51, 170, 204, 0.3)';
        ctx.beginPath();
        ctx.arc(sx + 4, sy + 1.5, r + 4, 0, Math.PI * 2);
        ctx.fill();

        // Main water orb
        ctx.fillStyle = '#2277aa';
        ctx.beginPath();
        ctx.arc(sx + 4, sy + 2, r, 0, Math.PI * 2);
        ctx.fill();

        // Bubbles
        ctx.fillStyle = '#66ddff';
        for (let b = 0; b < 2; b++) {
          const bp = frame * 0.1 + b * 3 + sx;
          const bx = sx + 4 + Math.sin(bp) * 3;
          const by = sy + 1 + Math.cos(bp) * 2;
          ctx.beginPath();
          ctx.arc(bx, by, 1.8 + Math.sin(bp) * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }

        // Core
        ctx.fillStyle = '#88eeff';
        ctx.beginPath();
        ctx.arc(sx + 5, sy + 1, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // === NEON ORBS (dark blue + green glowing collectibles) ===
      for (let orb of neonOrbs) {
        const sx = orb.wx - scrollX;
        const sy = orb.y;
        if (sx < -25 || sx > W + 25) continue;

        const isGreen = (orb.value === 5);
        const pulse = Math.sin(frame * 0.12 + orb.phase) * (isGreen ? 1.5 : 1.2);
        const orbR = isGreen ? 12 : 11;
        if (window.NeonDashSprites && NeonDashSprites.drawSprite(ctx, isGreen ? 'orbGreen' : 'orb', sx + 3 - orbR, sy - orbR, orbR * 2, orbR * 2)) { continue; }

        if (isGreen) {
          // Green glowing tall neon bar (faster, worth 5; thin vertical rect + inner glow + top highlight; pulse on height)
          const barW = 3.2;
          const baseH = 15;
          const barH = baseH + pulse * 0.7;
          const bx = sx + 1.5;
          const by = sy - barH / 2;
          // Soft outer glow (wider low-alpha rect for neon effect)
          ctx.fillStyle = 'rgba(60, 220, 120, 0.30)';
          ctx.fillRect(bx - 2.5, by - 1, barW + 5, barH + 2);
          // Main tall vertical bar
          ctx.fillStyle = '#33dd88';
          ctx.fillRect(bx, by, barW, barH);
          // Inner bright core highlight (thinner vertical)
          ctx.fillStyle = '#aaffcc';
          ctx.fillRect(bx + 0.6, by + 1, barW * 0.35, barH - 3);
          // Small top cap highlight for glow
          ctx.fillStyle = 'rgba(220, 255, 235, 0.95)';
          ctx.fillRect(bx, by - 1.2, barW, 2.8);
        } else {
          // Standard dark blue tall neon bar (worth 1; thin vertical rect + inner glow + top highlight; pulse on height)
          const barW = 3.0;
          const baseH = 14;
          const barH = baseH + pulse * 0.55;
          const bx = sx + 1.5;
          const by = sy - barH / 2;
          // Soft outer glow (wider low-alpha rect for neon effect)
          ctx.fillStyle = 'rgba(40, 70, 160, 0.28)';
          ctx.fillRect(bx - 2.2, by - 1, barW + 4.4, barH + 2);
          // Main tall vertical bar
          ctx.fillStyle = '#2244aa';
          ctx.fillRect(bx, by, barW, barH);
          // Inner bright core highlight (thinner vertical)
          ctx.fillStyle = '#5588ff';
          ctx.fillRect(bx + 0.5, by + 1, barW * 0.35, barH - 3);
          // Small top cap highlight for glow
          ctx.fillStyle = 'rgba(180, 210, 255, 0.95)';
          ctx.fillRect(bx, by - 1.2, barW, 2.6);
        }
      }

      // === SHIELD POWERUP (diamond core + glowing bubble shield) ===
      if (powerUp) {
        const pux = powerUp.wx - scrollX;
        const puy = powerUp.y;
        if (window.NeonDashSprites && NeonDashSprites.drawPickup(ctx, pux, puy, 38, frame)) {
        } else {
        const pulse = Math.sin(frame * 0.18) * 2.2;

        ctx.save();

        // Soft cyan bubble shield around diamond (reads as "shield" at game scale)
        const bubbleR = 14 + pulse * 0.35;
        ctx.shadowColor = '#44ccff';
        ctx.shadowBlur = 12 + pulse * 0.8;
        const bubbleGrad = ctx.createRadialGradient(pux - 2, puy - 3, 1, pux, puy, bubbleR);
        bubbleGrad.addColorStop(0, 'rgba(120, 230, 255, 0.28)');
        bubbleGrad.addColorStop(0.55, 'rgba(60, 180, 255, 0.12)');
        bubbleGrad.addColorStop(1, 'rgba(40, 150, 255, 0.03)');
        ctx.fillStyle = bubbleGrad;
        ctx.beginPath();
        ctx.arc(pux, puy, bubbleR, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(130, 230, 255, 0.8)';
        ctx.lineWidth = 1.7;
        ctx.beginPath();
        ctx.arc(pux, puy, bubbleR, 0, Math.PI * 2);
        ctx.stroke();
        // Glass highlight arc
        ctx.strokeStyle = 'rgba(210, 250, 255, 0.55)';
        ctx.lineWidth = 1.15;
        ctx.shadowBlur = 3;
        ctx.beginPath();
        ctx.arc(pux - 1.5, puy - 2, bubbleR * 0.7, -Math.PI * 0.9, -Math.PI * 0.2);
        ctx.stroke();

        // Diamond core (glowing cyan/chrome shield emblem)
        ctx.shadowColor = '#66bbdd';
        ctx.shadowBlur = 14 + pulse * 0.7;
        const s = 9 + pulse * 0.25;

        ctx.fillStyle = '#5599bb';
        ctx.beginPath();
        ctx.moveTo(pux, puy - s * 1.1);           // top center
        ctx.lineTo(pux + s * 0.85, puy - s * 0.35);
        ctx.lineTo(pux + s * 0.75, puy + s * 0.65);
        ctx.lineTo(pux, puy + s * 1.15);          // bottom point
        ctx.lineTo(pux - s * 0.75, puy + s * 0.65);
        ctx.lineTo(pux - s * 0.85, puy - s * 0.35);
        ctx.closePath();
        ctx.fill();
